<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 交互原型 v2</title>
<style>
  :root{
    --paper:#faf8f4; --paper-2:#f3f0e9; --rail:#f1eee7; --surface:#fffdfa;
    --ink:#191816; --ink-2:#3b3833; --muted:#736d63; --faint:#9a9388;
    --line:#e4dfd5; --line-strong:#d6d0c4;
    --signal:#c2410c; --signal-soft:#fbeee6; --signal-line:#f0d6c8;
    --ok:#3f6b4f; --ok-soft:#eaf2ec; --info:#2f5d62; --info-soft:#e9f0f0;
    --block:#a33a2a; --block-soft:#f8eae6;
    --dock:#161513; --dock-2:#211f1b; --dock-line:#2e2b26; --dock-text:#ece7dd; --dock-muted:#9b9489; --accent:#e8a87c;
    --radius:10px;
    --sans:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  svg{display:block}
  .app{display:grid;grid-template-columns:232px minmax(0,1fr) 384px;height:100vh;min-height:0;overflow:hidden}

  /* ---------- rail ---------- */
  .rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 14px 14px;display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
  .brand{display:flex;gap:10px;align-items:center;padding:0 6px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.04em;flex:none}
  .brand-name{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .brand-sub{font-size:8.5px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;margin-top:2px;white-space:nowrap}
  .scope-note{display:flex;align-items:center;gap:7px;padding:0 8px;font-size:11.5px;color:var(--muted)}
  .scope-note b{font-weight:600;color:var(--ink-2)}
  .scope-note small{margin-left:auto;font-size:10px;color:var(--faint)}
  .ptag{display:inline-flex;align-items:center;font-size:8.5px;line-height:1.4;letter-spacing:.06em;font-weight:650;padding:0 4px;border-radius:3px;background:var(--paper-2);border:1px solid var(--line);color:var(--muted);vertical-align:1px;white-space:nowrap}
  .ptag.nca{color:var(--info);border-color:#cddddd;background:var(--info-soft)}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px;width:100%;text-align:left;transition:background .12s}
  .nav-item svg{color:var(--muted);flex:none}
  .nav-item:hover{background:rgba(25,24,22,.045)}
  .nav-item.active{background:#fff;box-shadow:0 1px 0 rgba(25,24,22,.04);font-weight:600;color:var(--ink)}
  .nav-item.active svg{color:var(--ink)}
  .nav-count{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--signal);color:#fff;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
  .nav-count.quiet{background:var(--line-strong);color:var(--ink-2)}
  .rail-spacer{flex:1}
  .agent-note{display:flex;gap:9px;align-items:flex-start;margin:0 4px 2px;padding:10px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.45)}
  .agent-note b{display:block;font-size:11.5px;font-weight:600}
  .agent-note small{display:block;font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:2px}
  .presence{width:6px;height:6px;border-radius:50%;background:#79a987;box-shadow:0 0 0 3px rgba(121,169,135,.14);flex:none;margin-top:5px}
  .user{display:flex;align-items:center;gap:9px;padding:9px 8px 0;border-top:1px solid var(--line);margin-top:2px}
  .avatar{width:24px;height:24px;border-radius:50%;background:#dfd6c4;color:#4d463b;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
  .user b{display:block;font-size:11.5px;font-weight:600}
  .user small{display:block;font-size:10px;color:var(--faint)}

  /* ---------- center ---------- */
  .center{overflow-y:auto;background:var(--paper);min-width:0;min-height:0;scroll-behavior:smooth}
  .center-top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 38px;background:rgba(250,248,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(228,223,213,.6)}
  .crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb b{color:var(--ink);font-weight:600}
  .crumb span{color:var(--faint)}
  .center-tools{display:flex;align-items:center;gap:7px;flex:none}
  .searchbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--faint);font-size:11.5px;background:rgba(255,255,255,.5)}
  .searchbtn:hover{border-color:var(--line-strong);color:var(--muted)}
  kbd{font-family:var(--sans);font-size:9.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--faint);background:#fff}
  .view{padding:0 38px 90px;max-width:860px;margin:0 auto}

  /* ---------- shared ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
  .btn-sm{padding:4px 8px;font-size:11.5px}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:#000}
  .btn-signal{background:var(--signal);color:#fff}
  .btn-signal:hover{background:#a8370a}
  .btn-outline{border-color:var(--line-strong);background:#fff;color:var(--ink-2)}
  .btn-outline:hover{border-color:#c4bbab}
  .btn-ghost{color:var(--muted)}
  .btn-ghost:hover{background:rgba(25,24,22,.05);color:var(--ink)}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
  .dot.signal{background:var(--signal)}
  .dot.run{background:#3d7180}
  .dot.ok{background:var(--ok)}
  .dot.block{background:var(--block)}
  .dot.idle{background:#b6afa2}
  .kicker{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
  .page-head{padding:30px 0 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:flex-end}
  .page-head h1{font-size:36px;line-height:1.08;margin:9px 0 7px;font-weight:650;letter-spacing:-.035em}
  .page-head p{margin:0;color:var(--muted);font-size:13.5px}
  .head-stat{text-align:right;font-size:11.5px;color:var(--faint);line-height:1.7}
  .head-stat b{display:block;font-size:22px;color:var(--ink);font-weight:600;line-height:1.2}

  /* ---------- today ---------- */
  .today-head{padding:34px 0 24px}
  .today-head h1{font-size:40px;line-height:1.05;margin:11px 0 9px;font-weight:650;letter-spacing:-.04em}
  .today-head p{margin:0;color:var(--muted);font-size:14px;max-width:520px}
  .section{margin-top:30px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:3px}
  .section-head h2{font-size:12px;font-weight:650;letter-spacing:.01em;margin:0}
  .section-head .hint{font-size:11px;color:var(--faint)}
  .decision{border-top:1px solid var(--line);position:relative;transition:background .15s}
  .decision:last-child{border-bottom:1px solid var(--line)}
  .decision.open{background:var(--surface)}
  .decision.needs.open{box-shadow:inset 2px 0 0 var(--signal)}
  .decision-row{display:flex;gap:14px;align-items:flex-start;padding:14px 10px 14px 14px;width:100%;text-align:left;position:relative}
  .decision-row.clickable{cursor:pointer}
  .decision-row.clickable:hover{background:rgba(194,65,12,.022)}
  .decision.needs .decision-row:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;background:var(--signal);border-radius:2px;opacity:.75}
  .decision.block .decision-row:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;background:var(--block);border-radius:2px;opacity:.8}
  .decision-main{min-width:0;flex:1}
  .type{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.045em;color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .type .sep{color:var(--line-strong)}
  .decision-title{font-size:16.5px;font-weight:600;margin:4px 0 3px;letter-spacing:-.012em;line-height:1.35}
  .decision-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .decision-actions{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:8px;flex:none}
  .decision-body{padding:0 16px 17px 26px;animation:rise .18s ease}
  .draft{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin:2px 0 12px}
  .draft-label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .draft p{margin:0 0 10px;font-size:13px;line-height:1.65;color:var(--ink-2)}
  .checklist{display:flex;flex-direction:column;gap:6px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .tick{width:14px;height:14px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;font-size:9px;color:transparent;flex:none;margin-top:1px;background:#fff}
  .tick.done{background:var(--ok-soft);border-color:#bcd2c3;color:var(--ok)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
  .split-item{border:1px dashed var(--line-strong);border-radius:7px;padding:7px 9px;font-size:11.5px;color:var(--ink-2);background:rgba(250,248,244,.6)}
  .split-item span{display:block;font-size:9px;letter-spacing:.06em;color:var(--faint);margin-bottom:2px}
  .body-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .body-hint{font-size:10.5px;color:var(--faint);margin-left:2px}
  .clear-state{display:flex;gap:12px;align-items:flex-start;padding:18px 16px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.55);margin-top:4px}
  .clear-state b{font-size:13.5px;font-weight:600}
  .clear-state p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .run-row{display:flex;align-items:center;gap:11px;padding:12px 10px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .12s}
  .run-row:hover{background:rgba(25,24,22,.025)}
  .run-row:last-of-type{border-bottom:1px solid var(--line)}
  .run-main{min-width:0;flex:1;display:flex;flex-direction:column}
  .run-title{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run-note{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .run-time{font-size:10.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .run-arrow{color:var(--line-strong);font-size:13px}
  .run-row:hover .run-arrow{color:var(--muted)}
  .done-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);width:100%;text-align:left}
  .done-row:hover{background:rgba(25,24,22,.02)}
  .done-row .done-title{color:var(--ink-2);font-weight:500;white-space:nowrap}
  .done-row .done-note{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .done-row .done-time{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .reply-box{padding:0 16px 16px 26px}
  .reply-box textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:12.5px;background:#fff;outline:none;color:var(--ink)}
  .reply-box textarea:focus{border-color:#b8ae9e;box-shadow:0 0 0 3px rgba(194,65,12,.06)}
  .reply-actions{display:flex;gap:7px;margin-top:8px}

  /* ---------- work list ---------- */
  .work-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
  .work-tools .btn{margin-left:auto}
  .work-tools .hint{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .filters{display:flex;gap:2px;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:2px}
  .filter{padding:4px 9px;border-radius:5px;font-size:11.5px;color:var(--muted)}
  .filter.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(25,24,22,.06);font-weight:550}
  .work-group{margin-top:24px}
  .work-group-head{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:1px solid var(--line-strong)}
  .work-group-head b{font-size:12px;font-weight:650}
  .work-group-head small{font-size:10.5px;color:var(--faint)}
  .work-group-head .spacer{flex:1}
  .work-row{display:flex;align-items:center;gap:11px;width:100%;padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;transition:background .12s}
  .work-row:hover{background:rgba(25,24,22,.025)}
  .work-type{font-size:9.5px;letter-spacing:.04em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 4px;width:34px;text-align:center;flex:none}
  .work-type.task{color:#7b7468;background:rgba(243,240,233,.7)}
  .work-main{min-width:0;flex:1;display:flex;flex-direction:column}
  .work-title{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .work-meta{font-size:10.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .work-state{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
  .work-arrow{color:var(--line-strong);font-size:12px;flex:none}
  .work-row:hover .work-arrow{color:var(--muted)}

  /* ---------- doc ---------- */
  .doc{padding:8px 0 60px;max-width:772px}
  .doc-back{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);padding:7px 0;margin-left:-2px}
  .doc-back:hover{color:var(--ink)}
  .doc-eyebrow{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-top:8px}
  .doc-eyebrow span{color:var(--line-strong)}
  .doc h1{font-size:34px;line-height:1.16;letter-spacing:-.035em;margin:9px 0 17px;font-weight:650;max-width:720px}
  .status-strip{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:15px}
  .status-strip b{font-size:12px;font-weight:600;white-space:nowrap}
  .status-note{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .progress{height:2px;background:var(--line);border-radius:2px;flex:1;min-width:40px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ink);border-radius:2px}
  .strip-actions{display:flex;gap:6px;flex:none}
  .doc-meta{display:flex;flex-wrap:wrap;gap:7px 20px;font-size:11px;color:var(--faint);padding-bottom:4px}
  .doc-meta b{color:var(--ink-2);font-weight:550}
  .doc-section{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
  .doc-section h2{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:7px}
  .section-count{font-size:9.5px;background:var(--paper-2);border-radius:999px;padding:1px 5px;color:var(--muted);letter-spacing:0}
  .lead{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0;max-width:680px}
  .plan{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
  .plan li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .plan-num{width:17px;height:17px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:9px;color:var(--faint);flex:none;margin-top:1px;background:#fff}
  .plan li.done .plan-num{background:var(--ok-soft);border-color:#bcd2c3;color:var(--ok)}
  .plan li.active .plan-num{background:var(--ink);border-color:var(--ink);color:#fff}
  .plan li.active .plan-text{font-weight:550}
  .plan-note{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;font-weight:400}
  .task-list{display:flex;flex-direction:column}
  .task-row{display:flex;align-items:center;gap:9px;padding:9px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .task-row:hover{background:rgba(25,24,22,.02)}
  .task-id{font-size:9.5px;color:var(--faint);width:56px;flex:none;letter-spacing:.02em}
  .task-title{font-size:12.5px;font-weight:500;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-state{font-size:10.5px;color:var(--muted);flex:none}
  .evidence{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ev-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .ev-thumb{height:88px;background:#f4f0e8;position:relative;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .ev-thumb svg{width:100%;height:100%}
  .ev-thumb.table{padding:12px}
  .ev-mock-table{width:100%;border-collapse:collapse;font-size:6.5px;color:#8b8376}
  .ev-mock-table td{border:1px solid #ddd5c7;padding:2px 3px;white-space:nowrap}
  .ev-mock-table tr:first-child td{background:#ebe5d9;font-weight:600}
  .ev-label{position:absolute;top:8px;left:9px;font-size:8.5px;letter-spacing:.06em;color:#9b9385;text-transform:uppercase}
  .ev-body{padding:7px 9px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ev-body b{font-size:11px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-body small{font-size:9.5px;color:var(--faint);white-space:nowrap}
  .timeline{list-style:none;padding:0;margin:0;position:relative}
  .timeline:before{content:"";position:absolute;left:47px;top:6px;bottom:8px;width:1px;background:var(--line)}
  .timeline li{display:flex;gap:12px;padding:0 0 15px;position:relative;font-size:12px;line-height:1.5}
  .tl-time{width:36px;text-align:right;color:var(--faint);font-size:10px;flex:none;padding-top:1px;font-variant-numeric:tabular-nums}
  .tl-dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex:none;margin:5px 0 0 5px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--paper)}
  .tl-dot.signal{background:var(--signal)}
  .tl-dot.ok{background:var(--ok)}
  .tl-dot.run{background:#3d7180}
  .tl-body{min-width:0}
  .tl-body b{font-weight:600;font-size:12px;color:var(--ink)}
  .tl-body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
  .accept-bar{display:flex;align-items:center;gap:9px;padding:13px 14px;border:1px solid var(--signal-line);background:var(--signal-soft);border-radius:9px;margin-top:16px}
  .accept-bar p{margin:0;font-size:12.5px;color:#7a3a1f;flex:1}
  .doc-footnote{font-size:10.5px;color:var(--faint);margin-top:22px}

  /* ---------- inbox ---------- */
  .inbox{margin-top:6px}
  .inbox-item{border-bottom:1px solid var(--line)}
  .inbox-row{display:flex;align-items:center;gap:11px;padding:13px 8px;width:100%;text-align:left}
  .inbox-row:hover{background:rgba(25,24,22,.025)}
  .source-badge{font-size:9px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:2px 5px;width:38px;text-align:center;flex:none;background:#fff}
  .inbox-main{min-width:0;flex:1;display:flex;flex-direction:column}
  .inbox-title{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inbox-preview{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .inbox-time{font-size:10px;color:var(--faint);white-space:nowrap}
  .inbox-state{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .inbox-state.done{color:var(--ok);border-color:#c9dacd;background:var(--ok-soft)}
  .inbox-body{padding:0 12px 17px 57px;animation:rise .18s ease}
  blockquote{margin:0 0 10px;padding:10px 13px;border-left:2px solid var(--line-strong);background:rgba(255,255,255,.6);font-size:12.5px;line-height:1.65;color:var(--ink-2)}
  .triage{border:1px solid var(--signal-line);background:var(--signal-soft);border-radius:9px;padding:12px 13px}
  .triage-head{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#9a4a27;margin-bottom:6px}
  .triage p{margin:0 0 10px;font-size:12px;line-height:1.6;color:#6f3c24}
  .triage-actions{display:flex;gap:6px;flex-wrap:wrap}
  .triage .btn-primary{background:#8f3513}
  .triage .btn-primary:hover{background:#742a0e}
  .triage .btn-outline{background:rgba(255,255,255,.7);border-color:#e3c6b7;color:#7a3a1f}

  /* ---------- knowledge ---------- */
  .knowledge-block{margin-top:26px}
  .knowledge-block h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 9px;font-weight:600;display:flex;gap:7px;align-items:center}
  .memory-card{border:1px solid var(--signal-line);background:var(--surface);border-radius:9px;padding:14px 15px}
  .memory-statement{font-size:15px;line-height:1.55;font-weight:550;letter-spacing:-.01em}
  .memory-meta{font-size:10.5px;color:var(--faint);margin-top:6px}
  .memory-actions{display:flex;gap:6px;margin-top:11px}
  .memory-list{display:flex;flex-direction:column}
  .memory-row{padding:11px 6px;border-bottom:1px solid var(--line)}
  .memory-row b{font-size:12.5px;font-weight:500;color:var(--ink-2);display:block;line-height:1.5}
  .memory-row small{font-size:10.5px;color:var(--faint);display:block;margin-top:2px}
  .ref-health{display:flex;align-items:flex-start;gap:11px;margin-top:24px;padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.5)}
  .ref-health b{font-size:12px;font-weight:600;display:block}
  .ref-health p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}
  .ref-health .btn{margin-left:auto;flex:none}

  /* ---------- settings ---------- */
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .settings-card{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.6);padding:15px 16px}
  .settings-card h2{font-size:13px;margin:0;font-weight:600}
  .settings-card .sub{font-size:10.5px;color:var(--faint);margin:3px 0 13px}
  .setting-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:11.5px}
  .setting-row span{color:var(--muted)}
  .setting-row b{font-weight:500;color:var(--ink-2);text-align:right;overflow-wrap:anywhere}
  .project-setting{padding-top:11px;margin-top:11px;border-top:1px solid var(--line-strong)}
  .project-setting:first-of-type{padding-top:0;margin-top:0;border-top:0}
  .ps-head{display:flex;align-items:center;gap:7px;padding-bottom:3px}
  .ps-head b{font-size:12px;font-weight:600}
  .ps-head small{margin-left:auto;font-size:9.5px;color:var(--faint)}
  .settings-note{font-size:10.5px;color:var(--faint);margin-top:18px;line-height:1.6}

  /* ---------- dock ---------- */
  .dock{background:var(--dock);color:var(--dock-text);display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid #0d0c0b}
  .dock-head{padding:15px 17px 12px;border-bottom:1px solid var(--dock-line);flex:none}
  .dock-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.01em}
  .dock-mode{font-size:9.5px;font-weight:400;color:var(--dock-muted);border:1px solid var(--dock-line);border-radius:4px;padding:1px 4px;margin-left:2px}
  .dock-sub{font-size:10.5px;color:var(--dock-muted);margin-top:4px}
  .context-chip{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 7px;border:1px solid #38332c;border-radius:6px;background:#211f1b;color:#cfc8bc;font-size:10px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .context-chip span{color:#6f685d}
  .chat{flex:1;overflow-y:auto;padding:16px 17px 6px;scrollbar-width:thin;scrollbar-color:#3a352e transparent;mask-image:linear-gradient(to bottom,transparent 0,#000 18px)}
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:#3a352e;border-radius:3px}
  .msg{margin-bottom:17px;animation:rise .18s ease}
  .msg-head{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--dock-muted);margin-bottom:5px;letter-spacing:.02em}
  .msg-avatar{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;font-size:8.5px;font-weight:700;background:#3a352e;color:#fff;flex:none}
  .msg.agent .msg-avatar{background:var(--accent);color:#231c15}
  .msg-body{font-size:12.5px;line-height:1.65;color:#d8d2c6;padding-left:24px}
  .msg.user .msg-body{color:#fff}
  .msg-time{margin-left:auto;color:#6f685d;font-size:9px}
  .proposal{background:var(--dock-2);border:1px solid #38332c;border-radius:9px;padding:11px 12px;margin-left:24px;margin-top:2px}
  .proposal-head{display:flex;align-items:center;gap:7px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dock-muted)}
  .proposal-id{margin-left:auto;color:#6f685d;letter-spacing:.02em}
  .proposal h4{font-size:12.5px;line-height:1.45;margin:7px 0 4px;font-weight:600;color:#f1ece3}
  .proposal p{margin:0 0 8px;font-size:10.5px;line-height:1.55;color:var(--dock-muted)}
  .diff{display:flex;flex-direction:column;gap:3px;margin:7px 0 10px}
  .diff-line{font-size:10.5px;line-height:1.5;color:#a9c9ad;background:rgba(73,112,80,.12);border-radius:4px;padding:3px 6px;font-variant-numeric:tabular-nums}
  .diff-line span{color:#7f9f84;margin-right:3px}
  .proposal-actions{display:flex;gap:6px;align-items:center}
  .p-btn{font-size:10.5px;font-weight:550;border-radius:5px;padding:4px 8px}
  .p-btn.primary{background:var(--accent);color:#231c15}
  .p-btn.primary:hover{background:#f0b58e}
  .p-btn.ghost{color:var(--dock-muted)}
  .p-btn.ghost:hover{color:var(--dock-text);background:rgba(255,255,255,.05)}
  .applied-tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:#9ec9a5;margin-left:auto}
  .proposal.applied{border-color:#2f3b31;background:rgba(63,107,79,.08)}
  .quick{display:flex;gap:5px;flex-wrap:wrap;padding:0 17px 9px;flex:none}
  .quick button{font-size:10px;color:var(--dock-muted);border:1px solid var(--dock-line);border-radius:999px;padding:3px 8px;background:transparent;transition:.12s}
  .quick button:hover{color:var(--dock-text);border-color:#4a443b}
  .composer{border-top:1px solid var(--dock-line);padding:10px 13px 12px;background:#141311;flex:none}
  .composer textarea{width:100%;resize:none;background:#201e1a;border:1px solid #35312b;border-radius:8px;color:var(--dock-text);padding:9px 10px;font-size:12px;line-height:1.5;min-height:38px;max-height:110px;outline:none;transition:border-color .12s}
  .composer textarea::placeholder{color:#736c61}
  .composer textarea:focus{border-color:#5a5145}
  .composer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
  .composer-hint{font-size:9px;color:#6f685d}
  .send{background:var(--accent);color:#231c15;border-radius:6px;padding:4px 10px;font-size:10.5px;font-weight:650}
  .send:hover{background:#f0b58e}

  /* ---------- toast / palette ---------- */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:#1b1916;color:#f1ece3;padding:9px 14px;border-radius:7px;font-size:11.5px;box-shadow:0 10px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.18s;z-index:70;max-width:70vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .palette{position:fixed;inset:0;background:rgba(20,18,16,.34);backdrop-filter:blur(2px);z-index:60;display:grid;place-items:start center;padding-top:17vh}
  .palette[hidden]{display:none}
  .palette-box{width:min(540px,90vw);background:#fff;border:1px solid var(--line-strong);border-radius:11px;box-shadow:0 24px 70px rgba(0,0,0,.26);overflow:hidden}
  .palette-input{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .palette-input input{flex:1;border:0;outline:none;font-size:14px;background:transparent;color:var(--ink)}
  .palette-input input::placeholder{color:var(--faint)}
  .palette-list{padding:5px;max-height:300px;overflow-y:auto}
  .palette-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border-radius:6px;font-size:12.5px;color:var(--ink-2)}
  .palette-item:hover,.palette-item.active{background:var(--paper-2);color:var(--ink)}
  .palette-item small{margin-left:auto;font-size:9.5px;color:var(--faint)}
  .palette-foot{padding:7px 12px;border-top:1px solid var(--line);font-size:9.5px;color:var(--faint);display:flex;gap:12px}
  .palette-foot kbd{font-size:8.5px}

  @keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (max-width:1240px){
    .app{grid-template-columns:214px minmax(0,1fr) 344px}
    .view{padding-left:28px;padding-right:28px}
    .center-top{padding-left:28px;padding-right:28px}
  }
  @media (max-width:1080px){
    .app{grid-template-columns:190px minmax(0,1fr) 310px}
    .view{padding-left:22px;padding-right:22px}
    .center-top{padding-left:22px;padding-right:22px}
    .decision-row{flex-wrap:wrap}
    .decision-actions{padding-left:0}
    .status-strip{flex-wrap:wrap}
    .status-note{white-space:normal}
    .progress{min-width:80px}
    .doc h1{font-size:30px}
    .today-head h1{font-size:36px}
    .page-head h1{font-size:32px}
  }
  @media (max-width:940px){
    .app{grid-template-columns:190px minmax(0,1fr)}
    .dock{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="center" id="center">
    <header class="center-top">
      <div class="crumb" id="crumb"></div>
      <div class="center-tools">
        <button class="searchbtn" data-act="palette">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          搜索或命令 <kbd>⌘K</kbd>
        </button>
        <button class="btn btn-outline btn-sm" data-act="new">＋ 新委托</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
  <aside class="dock" id="dock">
    <header class="dock-head">
      <div class="dock-title"><span class="presence"></span>Agent <span class="dock-mode">主 Session</span></div>
      <div class="dock-sub">在线 · 正在看 DEMO-104 的执行</div>
      <div class="context-chip" id="contextChip">DEMO · 账单系统 <span>/</span> R-126</div>
    </header>
    <div class="chat" id="chat"></div>
    <div class="quick">
      <button data-quick="让它继续">让它继续</button>
      <button data-quick="叫停 DEMO-104">叫停 DEMO-104</button>
      <button data-quick="总结今天">总结今天</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="告诉 Agent 要做什么，或问一句…"></textarea>
      <div class="composer-foot">
        <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
        <button class="send" type="submit">发送</button>
      </div>
    </form>
  </aside>
</div>
<div class="toast" id="toast"></div>
<div class="palette" id="palette" hidden>
  <div class="palette-box">
    <div class="palette-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#9a9388"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="paletteInput" placeholder="搜索工作、项目，或输入命令…" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span><kbd>↑↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span></div>
  </div>
</div>
<script>
(() => {
  'use strict';

  const ICONS = {
    today: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    work: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    inbox: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/></svg>',
    book: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h8M8 11h6"/></svg>',
    settings: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    chevron: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
    spark: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6.3 6.3 2.8 2.8M14.9 14.9l2.8 2.8M6.3 17.7l2.8-2.8M14.9 9.1l2.8-2.8"/></svg>'
  };

  const state = {
    view: 'today',
    doc: null,
    filter: 'all',
    expanded: 'R-126',
    inboxOpen: 'IN-1',
    replyOpen: false,
    projectFilter: 'all',
    inboxProject: 'all',
    r126: 'pending',
    demo9: 'pending',
    nca9: 'pending',
    m12: 'pending',
    block8: 'blocked',
    inbox: { 'IN-1': 'open', 'IN-2': 'open', 'IN-3': 'open', 'IN-4': 'open', 'IN-5': 'open' },
    messages: [
      { role: 'agent', time: '09:42', text: '早上好。今天 4 件需要你：R-126 的需求草案、DEMO-9 的验收、NCA-9 的需求草案、M-12 的记忆复核。两个项目都在跑，DEMO-104 预计 10:40 提交评审。' },
      { role: 'user', time: '09:48', text: 'DEMO-8 的字段口径先按客户维度，内部口径等财务确认。' },
      { role: 'agent', time: '09:48', text: '记下了。我把这条写进 DEMO-8 的上下文，财务确认前不再问。' },
      { role: 'agent', time: '09:49', text: 'R-126 的草案在下面。批准后我直接拆成两个任务，第二个是慢查询告警。' },
      { role: 'agent', time: '09:49', proposal: 'r126' }
    ],
    paletteOpen: false,
    paletteQuery: '',
    paletteIndex: 0,
    toastTimer: null
  };

  const esc = (value) => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const decisionCount = () => (state.r126 === 'pending' ? 1 : 0) + (state.demo9 === 'pending' ? 1 : 0) + (state.nca9 === 'pending' ? 1 : 0) + (state.m12 === 'pending' ? 1 : 0);
  const inboxOpenCount = () => Object.values(state.inbox).filter(v => v === 'open').length;
  const runningCount = () => 3 + (state.r126 === 'applied' ? 1 : 0) + (state.nca9 === 'applied' ? 1 : 0) + (state.block8 === 'answered' ? 1 : 0);

  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function renderRail() {
    const decisions = decisionCount();
    const inbox = inboxOpenCount();
    const memories = state.m12 === 'pending' ? 1 : 0;
    document.getElementById('rail').innerHTML = `
      <div class="brand">
        <div class="brand-mark">雄</div>
        <div><div class="brand-name">雄大工作台</div><div class="brand-sub">Xiongda Workbench</div></div>
      </div>
      <div class="scope-note"><span class="dot run"></span><b>全部项目</b><small>2 个项目</small></div>
      <nav class="nav">
        <button class="nav-item ${state.view === 'today' ? 'active' : ''}" data-act="nav" data-view="today">${ICONS.today}<span>今天</span>${decisions ? `<span class="nav-count">${decisions}</span>` : ''}</button>
        <button class="nav-item ${state.view === 'work' ? 'active' : ''}" data-act="nav" data-view="work">${ICONS.work}<span>工作</span></button>
        <button class="nav-item ${state.view === 'inbox' ? 'active' : ''}" data-act="nav" data-view="inbox">${ICONS.inbox}<span>收件</span>${inbox ? `<span class="nav-count">${inbox}</span>` : ''}</button>
        <button class="nav-item ${state.view === 'knowledge' ? 'active' : ''}" data-act="nav" data-view="knowledge">${ICONS.book}<span>知识</span>${memories ? `<span class="nav-count quiet">${memories}</span>` : ''}</button>
      </nav>
      <div class="rail-spacer"></div>
      <div class="agent-note">
        <span class="presence"></span>
        <div><b>Agent 在线</b><small>正在看 ${runningCount()} 件工作<br>DEMO-104 · NCA-12</small></div>
      </div>
      <button class="nav-item ${state.view === 'settings' ? 'active' : ''}" data-act="nav" data-view="settings">${ICONS.settings}<span>设置</span></button>
      <div class="user"><span class="avatar">陈</span><div><b>陈</b><small>负责人 · 单人工位</small></div></div>
    `;
  }

  function renderTop() {
    const labels = { today: '今天', work: '工作', inbox: '收件', knowledge: '知识', settings: '设置' };
    const current = labels[state.view];
    const doc = state.view === 'work' && state.doc ? DOCS[state.doc] : undefined;
    const crumb = document.getElementById('crumb');
    crumb.innerHTML = state.view === 'work' && state.doc
      ? `${esc(doc?.project || '项目')} <span>/</span> 工作 <span>/</span> <b>${esc(state.doc)}</b>`
      : `全部项目 <span>/</span> <b>${esc(current)}</b>`;
    const chip = document.getElementById('contextChip');

      let reply;
      if (/拆/.test(value) && state.r126 === 'pending') {
        reply = '可以。我把 R-126 拆成两个任务：一个加覆盖索引，一个加慢查询告警。你看右边这条提案，批准就建。';
        state.messages.push({ role: 'agent', time: now(), text: reply });
        state.messages.push({ role: 'agent', time: now(), proposal: 'r126' });
      } else if (/总结/.test(value)) {
        const pending = [];
        if (state.r126 === 'pending') pending.push('R-126 待确认');
        if (state.demo9 === 'pending') pending.push('DEMO-9 待验收');
        if (state.nca9 === 'pending') pending.push('NCA-9 待确认');
        if (state.m12 === 'pending') pending.push('M-12 待复核');
        const done = [];
        if (state.r126 === 'applied') done.push('R-126 已拆成 DEMO-107/108');
        if (state.nca9 === 'applied') done.push('NCA-9 已拆成 NCA-13/14');
        if (state.demo9 === 'accepted') done.push('DEMO-9 已验收');
        if (state.m12 === 'confirmed') done.push('M-12 已确认');
        reply = `今天：${decisionCount()} 件需你决定，${runningCount()} 件在跑。`
          + (pending.length ? `待你处理：${pending.join('、')}。` : '需要你的事已清空。')
          + (done.length ? `刚处理完：${done.join('、')}。` : '')
          + 'DEMO-104 预计 10:40 提交评审，NCA-12 还在补空值行。';
        state.messages.push({ role: 'agent', time: now(), text: reply });
      } else if (/叫停/.test(value)) {
        reply = '已请求停止 DEMO-104。执行器会在当前步骤结束后停下，已写入的产不会回滚。';
        state.messages.push({ role: 'agent', time: now(), text: reply });
      } else if (/R-126|草案/.test(value)) {
        reply = state.r126 === 'pending'
          ? 'R-126 的草案在今天第一条，也可以直接在上面那条提案里批准。核心是先加索引，再加告警。'
          : 'R-126 已经处理过了，DEMO-107 在跑。';
        state.messages.push({ role: 'agent', time: now(), text: reply });
      } else if (/R-124|DEMO-104/.test(value)) {
        reply = 'DEMO-104 接口聚合完成，P95 2.1 秒，正在补审计日志。剩下的不影响你，预计 10:40 提交评审。';
        state.messages.push({ role: 'agent', time: now(), text: reply });
      } else {
        reply = '收到。我把它记到当前上下文里。要我直接开始，还是先给你一个草案？';
        state.messages.push({ role: 'agent', time: now(), text: reply });
      }
      renderChat();
    }, 650);
    const input = document.getElementById('input');
    input.value = '';
    input.style.height = 'auto';
  }

  function now() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function commit() {
    renderRail();
    renderTop();
    renderView();
    renderChat();
  }

  function scrollCenterTop() {
    const center = document.getElementById('center');
    if (center) center.scrollTop = 0;
  }

  /* ---------------- palette ---------------- */
  const PALETTE = [
    { label: '新建委托', hint: '告诉 Agent 要做什么', act: 'new' },
    { label: '打开今天', hint: '注意力队列', act: 'nav', view: 'today' },
    { label: '打开工作', hint: '需求与任务', act: 'nav', view: 'work' },
    { label: '打开收件', hint: '原始消息', act: 'nav', view: 'inbox' },
    { label: '问 Agent', hint: '聚焦对话', act: 'ask-agent' },
    { label: '查看 R-126', hint: '需求草案', act: 'open-doc', id: 'R-126' }
  ];

  function renderPalette() {
    const palette = document.getElementById('palette');
    palette.hidden = !state.paletteOpen;
    if (!state.paletteOpen) return;
    const input = document.getElementById('paletteInput');
    if (document.activeElement !== input) setTimeout(() => input.focus(), 0);
    const q = state.paletteQuery.trim().toLowerCase();
    const items = PALETTE.filter(item => !q || item.label.toLowerCase().includes(q) || item.hint.toLowerCase().includes(q));
    document.getElementById('paletteList').innerHTML = items.map((item, index) =>
      `<button class="palette-item ${index === state.paletteIndex ? 'active' : ''}" data-act="palette-item" data-index="${index}">
        <span>${esc(item.label)}</span><small>${esc(item.hint)}</small>
      </button>`).join('') || '<div style="padding:18px 12px;font-size:12px;color:#9a9388">没有匹配的命令</div>';
    return items;
  }

  function closePalette() {
    state.paletteOpen = false;
    state.paletteQuery = '';
    state.paletteIndex = 0;
    renderPalette();
  }

  function runPaletteItem(item) {
    closePalette();
    if (item.act === 'nav') {
      state.view = item.view;
      state.doc = null;
      commit();
      scrollCenterTop();
    } else if (item.act === 'new') {
      state.view = 'today';
      state.doc = null;
      commit();
      scrollCenterTop();
      askAgent('新建需求：');
    } else if (item.act === 'ask-agent') {
      askAgent();
    } else if (item.act === 'open-doc') {
      state.view = 'work';
      state.doc = item.id;
      commit();
      scrollCenterTop();
    }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', (event) => {
    const el = event.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case 'nav':
        state.view = el.dataset.view;
        state.doc = null;
        commit();
        scrollCenterTop();
        break;
      case 'project-filter':
        state.projectFilter = el.dataset.project;
        renderView();
        break;
      case 'inbox-project':
        state.inboxProject = el.dataset.project;
        renderView();
        break;
      case 'expand': {
        const id = el.dataset.id;
        state.expanded = state.expanded === id ? null : id;
        renderView();
        break;
      }
      case 'apply-r126': applyR126(); break;
      case 'return-r126': returnR126(); break;
      case 'apply-nca9': applyNca9(); break;
      case 'return-nca9': returnNca9(); break;
      case 'edit-nca9':
        askAgent('NCA-9 的第二个任务改一下：');
        toast('把修改说给 Agent 听，它会更新提案');
        break;
      case 'edit-r126':
        askAgent('R-126 的第二个任务改一下：');
        toast('把修改说给 Agent 听，它会更新提案');
        break;
      case 'accept-demo9': acceptDemo9(); break;
      case 'return-demo9': returnDemo9(); break;
      case 'confirm-m12': confirmM12(); break;
      case 'return-m12': returnM12(); break;
      case 'toggle-reply':
        state.replyOpen = !state.replyOpen;
        renderView();
        break;
      case 'send-block': sendBlock(); break;
      case 'open-doc':
        state.view = 'work';
        state.doc = el.dataset.id;
        state.expanded = null;
        commit();
        scrollCenterTop();
        break;
      case 'back-work':
        state.doc = null;
        commit();
        scrollCenterTop();
        break;
      case 'filter':
        state.filter = el.dataset.filter;
        renderView();
        break;
      case 'inbox-toggle':
        state.inboxOpen = state.inboxOpen === el.dataset.id ? null : el.dataset.id;
        renderView();
        break;
      case 'inbox-action':
        inboxAction(el.dataset.id, el.dataset.kind);
        break;
      case 'ask-agent':
        askAgent();
        break;
      case 'stop-task':
        toast('已请求停止（原型只展示状态，不真正停）');
        break;
      case 'go-block':
        state.view = 'today';
        state.doc = null;
        state.replyOpen = true;
        commit();
        scrollCenterTop();
        break;
      case 'check-refs':
        toast('3 条引用，1 条已变化：src/export/customer.ts');
        break;
      case 'palette':
        state.paletteOpen = true;
        state.paletteIndex = 0;
        renderPalette();
        break;
      case 'palette-item': {
        const items = PALETTE.filter(item => !state.paletteQuery.trim() || item.label.toLowerCase().includes(state.paletteQuery.trim().toLowerCase()) || item.hint.toLowerCase().includes(state.paletteQuery.trim().toLowerCase()));
        const item = items[Number(el.dataset.index)];
        if (item) runPaletteItem(item);
        break;
      }
      case 'new':
        state.view = 'today';
        state.doc = null;
        commit();
        scrollCenterTop();
        askAgent('新建需求：');
        break;
    }
  });

  document.getElementById('palette').addEventListener('click', (event) => {
    if (event.target.id === 'palette') closePalette();
  });

  document.getElementById('paletteInput').addEventListener('input', (event) => {
    state.paletteQuery = event.target.value;
    state.paletteIndex = 0;
    renderPalette();
  });

  document.getElementById('paletteInput').addEventListener('keydown', (event) => {
    const items = PALETTE.filter(item => !state.paletteQuery.trim() || item.label.toLowerCase().includes(state.paletteQuery.trim().toLowerCase()) || item.hint.toLowerCase().includes(state.paletteQuery.trim().toLowerCase()));
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      state.paletteIndex = Math.min(state.paletteIndex + 1, Math.max(items.length - 1, 0));
      renderPalette();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      state.paletteIndex = Math.max(state.paletteIndex - 1, 0);
      renderPalette();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      const item = items[state.paletteIndex];
      if (item) runPaletteItem(item);
    } else if (event.key === 'Escape') {
      closePalette();
    }
  });

  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      state.paletteOpen = true;
      state.paletteIndex = 0;
      renderPalette();
    } else if (event.key === 'Escape' && state.paletteOpen) {
      closePalette();
    }
  });

  document.getElementById('composer').addEventListener('submit', (event) => {
    event.preventDefault();
    sendMessage(document.getElementById('input').value);
  });

  document.getElementById('input').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage(event.target.value);
    }
  });

  document.getElementById('input').addEventListener('input', (event) => {
    const el = event.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  });

  document.querySelectorAll('[data-quick]').forEach(button => {
    button.addEventListener('click', () => {
      const text = button.dataset.quick;
      if (text === '让它继续') {
        state.messages.push({ role: 'user', time: now(), text: '继续。' });
        state.messages.push({ role: 'agent', time: now(), text: '好。DEMO-104 补完审计日志后我会直接提交评审；DEMO-8 等你回复口径。' });
        renderChat();
        toast('已让 Agent 继续');
      } else {
        sendMessage(text);
      }
    });
  });

  /* ---------------- boot ---------------- */
  commit();
  renderPalette();
  setTimeout(() => { document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight; }, 30);
})();
</script>
</body>
</html>
