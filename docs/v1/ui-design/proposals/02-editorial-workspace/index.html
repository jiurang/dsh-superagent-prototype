  const button = form.querySelector('[data-split-submit]');
  const count = parseSplitTitles(state.splitDraft.titles).length;
  if (button) {
    button.disabled = count === 0;
    button.textContent = `拆出 ${pad2(count)} 个任务`;
  }
}
function submitSplit(form) {
  const requirement = requirementById(form.dataset.id);
  if (!requirement) return;
  const titles = parseSplitTitles(form.querySelector('[name="titles"]')?.value);
  if (!titles.length) return;
  const type = form.querySelector('[name="type"]')?.value || '开发';
  const priority = form.querySelector('[name="priority"]')?.value || 'P2';
  const acceptance = form.querySelector('[name="acceptance"]')?.value.trim() || '';
  const base = Math.max(0, ...tasksOf(requirement.projectId).map(item => item.seqNo));
  const createdAt = '刚刚';
  const tasks = titles.map((title, index) => ({
    id: newId('task'), projectId: requirement.projectId, requirementId: requirement.id,
    seqNo: base + index + 1, title, type, status: '就绪', priority,
    acceptance: acceptance || requirement.acceptance || null,
    currentAttemptId: null, autoDispatch: false, updatedAt: createdAt,
    acceptedBy: null, acceptedAt: null, completedAt: null,
    description: `由需求 #${pad2(requirement.seqNo)} 拆解，默认进入「就绪」。`,
    attempts: [], artifacts: [], events: [{ eventType: 'task.created', actor: '我', createdAt }]
  }));
  DATA.tasks.unshift(...tasks);
  requirement.status = '已拆分';
  requirement.updatedAt = createdAt;
  requirement.latest = `拆出 ${tasks.length} 个任务`;
  requirement.activity = requirement.activity || [];
  requirement.activity.unshift({ at: createdAt, text: `拆出 ${tasks.length} 个任务，均进入「就绪」。` });
  state.splitId = null;
  state.splitDraft = null;
  state.reqFilter = '全部';
  refreshView();
  showToast(`已拆出 ${tasks.length} 个任务，可在任务页逐条派发。`);
}
function taskAction(id, kind) {
  const task = taskById(id);
  if (!task) return;
  const now = '刚刚';
  if (kind === 'dispatch' || kind === 'retry') {
    const attempt = {
      id: newId('a'), status: '运行中', stage: kind === 'retry' ? '重试' : '实现',
      workerSessionId: newId('sess'), createdAt: now, lastReportAt: now, tokenCost: '—',
      report: kind === 'retry' ? '已重新派发，等待执行器接手。' : '已派发，等待执行器首次报告。',
      attention: null
    };
    task.attempts.unshift(attempt);
    task.currentAttemptId = attempt.id;
    task.status = '进行中';
    task.updatedAt = now;
    task.events.unshift({ eventType: kind === 'retry' ? 'task.retried' : 'task.dispatched', actor: '我', createdAt: now });
    showToast(kind === 'retry' ? '任务已重试，新的尝试已开始。' : '任务已派发。');
  } else if (kind === 'cancel') {
    task.status = '取消';
    task.updatedAt = now;
    task.events.unshift({ eventType: 'task.cancelled', actor: '我', createdAt: now });
    showToast('任务已取消，历史记录保留。');
  } else if (kind === 'accept') {
    task.status = '完成';
    task.acceptedBy = '我';
    task.acceptedAt = now;
    task.completedAt = now;
    task.updatedAt = now;
    task.events.unshift({ eventType: 'task.accepted', actor: '我', createdAt: now });
    showToast('验收通过。任务已归档为完成。');
  } else {
    return;
  }
  refreshView();
}
function submitReview(form) {
  const task = taskById(form.dataset.id);
  if (!task) return;
  const values = new FormData(form);
  const decision = values.get('decision') === '退回' ? '退回' : '通过';
  const reviewer = String(values.get('reviewer') || '').trim();
  const comments = String(values.get('comments') || '').trim();
  const now = '刚刚';
  DATA.reviews.unshift({
    id: newId('rev'), taskId: task.id, decision, reviewer: reviewer || null,
    comments: comments || null, createdAt: now
  });
  task.status = decision === '通过' ? '待验收' : '进行中';
  task.updatedAt = now;
  task.events.unshift({ eventType: decision === '通过' ? 'review.passed' : 'review.returned', actor: reviewer || '我', createdAt: now });
  state.reviewOpen = false;
  refreshView();
  showToast(decision === '通过' ? '评审通过，任务进入待验收。' : '评审退回，任务回到进行中。');
}
function confirmDeleteTask(id) {
  const task = taskById(id);
  if (!task) return;
  DATA.tasks = DATA.tasks.filter(item => item.id !== id);
  closeModal();
  closeDrawer(false);
  refreshView();
  window.scrollTo(0, window.scrollY);
  showToast('任务已删除。运行记录、证据与审计按约定保留。');
}
function submitCreateRequirement(form) {
  const values = new FormData(form);
  const projectId = String(values.get('projectId') || state.projectId);
  const title = String(values.get('title') || '').replace(/\s+/g, ' ').trim();
  if (!title) {
    form.querySelector('[name="title"]')?.focus();
    return;
  }
  const priority = form.querySelector('input[name="priority"]:checked')?.value || 'P2';
  const sourceNote = String(values.get('sourceNote') || '').trim();
  const description = String(values.get('description') || '').trim();
  const acceptance = String(values.get('acceptance') || '').trim();
  const project = projectById(projectId);
  if (!project) return;
  const seqNo = Math.max(0, ...requirementsOf(projectId).map(item => item.seqNo)) + 1;
  const id = newId('req');
  const now = '刚刚';
  DATA.requirements.unshift({
    id, projectId, seqNo, title, status: '待确认', priority,
    description: description || '尚未补充需求说明。',
    sourceNote: sourceNote || '人工记录 · 暂无来源原话。',
    acceptance: acceptance || '待拆任务时补充验收口径。',
    latest: '由你创建，等待确认', updatedAt: now, createdAt: now,
    activity: [{ at: now, text: '由你创建，进入「待确认」。' }]
  });
  const inboxId = values.get('inboxId');
  if (inboxId) {
    const item = DATA.inbox.find(entry => entry.id === inboxId);
    if (item) {
      item.status = '已建需求';
      item.triagedAt = now;
    }
  }
  state.projectId = projectId;
  state.page = 'requirements';
  state.reqFilter = '全部';
  state.splitId = null;
  state.splitDraft = null;
  state.highlight = id;
  closeDrawer(false);
  renderPage();
  showToast(`需求「${title}」已保存为待确认。`);
}
function submitCreateProject(form) {
  const values = new FormData(form);
  const code = String(values.get('shortCode') || '').trim().toUpperCase().replace(/\s+/g, '_');
  const name = String(values.get('name') || '').trim();
  if (!code || !name) {
    form.querySelector('[name="shortCode"]')?.focus();
    return;
  }
  if (DATA.projects.some(item => item.shortCode.toUpperCase() === code)) {
    showToast('这个短代码已经存在，换一个再试。');
    return;
  }
  const id = newId('prj');
  const tagline = String(values.get('tagline') || '').trim() || '尚未写下项目简介。';
  const rootPath = String(values.get('rootPath') || '').trim() || '尚未设置根路径';
  DATA.projects.push({
    id, shortCode: code, name, tagline,
    description: '这个项目刚刚建立，还没有需求与任务。',
    status: '活跃', sensitivity: values.get('sensitivity') || '内部', rootPath,
    updatedAt: '刚刚',
    lede: '新项目刚刚建立。先写下第一条需求，让它拥有自己的语境与节奏。'
  });
  state.projectId = id;
  state.page = 'projects';
  closeDrawer(false);
  renderPage();
  showToast(`项目「${name}」已创建。`);
}
function submitCreateMemory(form) {
  const values = new FormData(form);
  const title = String(values.get('title') || '').trim();
  const content = String(values.get('content') || '').trim();
  if (!title || !content) return;
  const tags = String(values.get('tags') || '').split(/[,，;；\n]+/).map(item => item.trim()).filter(Boolean);
  DATA.memory.unshift({
    id: newId('mem'), projectId: state.projectId, type: values.get('type') || '领域',
    title, content, status: '草稿', sourceType: values.get('sourceType') || '人工',
    sourceRef: String(values.get('sourceRef') || '').trim() || null, tags,
    updatedAt: '刚刚'
  });
  state.memoryQuery = '';
  closeDrawer(false);
  renderPage();
  showToast('记忆已保存为草稿，等待复核。');
}
function submitCreateInbox(form) {
  const values = new FormData(form);
  const rawContext = String(values.get('rawContext') || '').trim();
  if (!rawContext) {
    form.querySelector('[name="rawContext"]')?.focus();
    return;
  }
  const projectId = String(values.get('projectId') || state.projectId);
  DATA.inbox.unshift({
    id: newId('inbox'), projectId,
    channel: values.get('channel') || '其他',
    contact: String(values.get('contact') || '').trim() || null,
    rawContext, status: '未处理', receivedAt: '刚刚'
  });
  const project = projectById(projectId);
  closeDrawer(false);
  if (projectId !== state.projectId && project) {
    state.projectId = projectId;
    state.page = 'inbox';
  }
  renderPage();
  showToast('来信已记录，等待转为需求。');
}
function triageInbox(id) {
  const item = DATA.inbox.find(entry => entry.id === id);
  if (!item) return;
  const first = String(item.rawContext || '').split(/[。！？\n]/)[0].trim();
  openDrawer({
    type: 'create-requirement',
    prefill: {
      projectId: item.projectId,
      title: first.slice(0, 70),
      sourceNote: `${item.channel} · ${item.contact || '未留联系人'}：“${item.rawContext}”`,
      description: item.rawContext,
      acceptance: '',
      inboxId: item.id
    }
  });
}
function ignoreInbox(id) {
  const item = DATA.inbox.find(entry => entry.id === id);
  if (!item) return;
  item.status = '已忽略';
  refreshView();
  showToast('来信已忽略，仍可在审计中查到。');
}
function settleMemory(id, decision) {
  const entry = DATA.memory.find(item => item.id === id);
  if (!entry) return;
  entry.status = decision === 'confirm' ? '已确认' : '已废弃';
  entry.updatedAt = '刚刚';
  refreshView();
  showToast(decision === 'confirm' ? '记忆已确认。' : '记忆已退回废弃。');
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', event => {
  const target = event.target;

  if (target.closest('[data-close-drawer]')) { closeDrawer(); return; }
  if (target.closest('[data-close-modal]')) { closeModal(); return; }
  const deleteConfirm = target.closest('[data-confirm-delete-task]');
  if (deleteConfirm) { confirmDeleteTask(deleteConfirm.dataset.confirmDeleteTask); return; }

  if (target.closest('[data-toggle-projects]')) { toggleProjectPopover(); return; }
  const projectOption = target.closest('[data-project-option]');
  if (projectOption) { switchProject(projectOption.dataset.projectOption); return; }
  if (!target.closest('#projectPopover') && !target.closest('.project-switch')) closeProjectPopover();
  if (!target.closest('.search-wrap')) closeSearch();

  const nav = target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }

  const action = target.closest('[data-action]');
  if (action) {
    const name = action.dataset.action;
    if (name === 'new-requirement') openDrawer({ type: 'create-requirement' });
    if (name === 'new-project') openDrawer({ type: 'create-project' });
    if (name === 'new-memory') openDrawer({ type: 'create-memory' });
    if (name === 'new-inbox') openDrawer({ type: 'create-inbox' });
    return;
  }

  const reqFilter = target.closest('[data-filter-req]');
  if (reqFilter) {
    state.reqFilter = reqFilter.dataset.filterReq;
    state.splitId = null;
    state.splitDraft = null;
    renderPage({ preserveScroll: true });
    return;
  }
  const taskFilter = target.closest('[data-filter-task]');
  if (taskFilter) {
    state.taskFilter = taskFilter.dataset.filterTask;
    renderPage({ preserveScroll: true });
    return;
  }
  const reviewFilter = target.closest('[data-filter-review]');
  if (reviewFilter) {
    state.reviewFilter = reviewFilter.dataset.filterReview;
    renderPage({ preserveScroll: true });
    return;
  }

  const openReq = target.closest('[data-open-req]');
  if (openReq) { openRequirement(openReq.dataset.openReq); return; }
  const openTaskButton = target.closest('[data-open-task]');
  if (openTaskButton) {
    openTask(openTaskButton.dataset.openTask, openTaskButton.dataset.openReview === '1');
    return;
  }

  const confirm = target.closest('[data-confirm-req]');
  if (confirm) { confirmRequirement(confirm.dataset.confirmReq); return; }
  const closeReq = target.closest('[data-close-requirement]');
  if (closeReq) { closeRequirement(closeReq.dataset.closeRequirement); return; }

  const splitToggle = target.closest('[data-split-toggle]');
  if (splitToggle) { toggleSplit(splitToggle.dataset.splitToggle); return; }
  const splitFromDrawerButton = target.closest('[data-split-from-drawer]');
  if (splitFromDrawerButton) { splitFromDrawer(splitFromDrawerButton.dataset.splitFromDrawer); return; }
  const splitCancel = target.closest('[data-split-cancel]');
  if (splitCancel) {
    state.splitId = null;
    state.splitDraft = null;
    renderPage({ preserveScroll: true });
    return;
  }

  const enterProject = target.closest('[data-enter-project]');
  if (enterProject) {
    const id = enterProject.dataset.enterProject;
    if (id !== state.projectId) state.projectId = id;
    closeProjectPopover();
    go('overview');
    showToast(`已进入「${activeProject().name}」。`);
    return;
  }

  const triage = target.closest('[data-triage-inbox]');
  if (triage) { triageInbox(triage.dataset.triageInbox); return; }
  const ignore = target.closest('[data-ignore-inbox]');
  if (ignore) { ignoreInbox(ignore.dataset.ignoreInbox); return; }

  const memoryConfirm = target.closest('[data-confirm-memory]');
  if (memoryConfirm) { settleMemory(memoryConfirm.dataset.confirmMemory, 'confirm'); return; }
  const memoryReject = target.closest('[data-reject-memory]');
  if (memoryReject) { settleMemory(memoryReject.dataset.rejectMemory, 'reject'); return; }

  const taskActionButton = target.closest('[data-task-action]');
  if (taskActionButton) { taskAction(taskActionButton.dataset.id, taskActionButton.dataset.taskAction); return; }
  const reviewToggle = target.closest('[data-review-toggle]');
  if (reviewToggle) {
    state.reviewOpen = !state.reviewOpen;
    renderDrawer();
    requestAnimationFrame(() => {
      document.querySelector('[data-review-form] [name="comments"]')?.focus({ preventScroll: false });
    });
    return;
  }
  const reviewCancel = target.closest('[data-cancel-review]');
  if (reviewCancel) { state.reviewOpen = false; renderDrawer(); return; }
  const deleteTask = target.closest('[data-delete-task]');
  if (deleteTask) { openDeleteModal(deleteTask.dataset.deleteTask); return; }
});

document.addEventListener('submit', event => {
  const form = event.target;
  if (form.matches('[data-create-req-form]')) {
    event.preventDefault();
    submitCreateRequirement(form);
    return;
  }
  if (form.matches('[data-split-form]')) {
    event.preventDefault();
    submitSplit(form);
    return;
  }
  if (form.matches('[data-create-project-form]')) {
    event.preventDefault();
    submitCreateProject(form);
    return;
  }
  if (form.matches('[data-create-memory-form]')) {
    event.preventDefault();
    submitCreateMemory(form);
    return;
  }
  if (form.matches('[data-create-inbox-form]')) {
    event.preventDefault();
    submitCreateInbox(form);
    return;
  }
  if (form.matches('[data-review-form]')) {
    event.preventDefault();
    submitReview(form);
  }
});

document.addEventListener('input', event => {
  if (event.target.id === 'globalSearch') {
    renderSearch(event.target.value);
    return;
  }
  if (event.target.id === 'memorySearch') {
    state.memoryQuery = event.target.value;
    filterMemoryCards();
    return;
  }
  if (event.target.closest('[data-split-form]')) {
    syncSplitDraft(event.target.closest('[data-split-form]'));
  }
});
document.addEventListener('change', event => {
  if (event.target.closest('[data-split-form]')) syncSplitDraft(event.target.closest('[data-split-form]'));
});

document.addEventListener('keydown', event => {
  const typing = event.target instanceof HTMLElement &&
    (['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName) || event.target.isContentEditable);
  if (event.key === 'Escape') {
    if (state.modal) { closeModal(); return; }
    if (state.drawer) { closeDrawer(); return; }
    if ($('#projectPopover') && !$('#projectPopover').hidden) { closeProjectPopover(); return; }
    closeSearch();
    return;
  }
  if ((event.key === '/' || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k')) && !typing) {
    event.preventDefault();
    $('#globalSearch').focus();
    return;
  }
  if (event.key === 'Enter' && event.target.id === 'globalSearch') {
    const first = $('#searchResults .search-result');
    if (first) {
      event.preventDefault();
      first.click();
    }
  }
});

/* ============================================================
   Boot
   ============================================================ */
renderChrome();
renderPage();





</script>
</body>
