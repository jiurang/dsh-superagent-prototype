        note: '验证环境与生产环境行为不一致，需要按失败证据重新排查。', model: 'claude-sonnet-4.5'
      },
      {
        n: 1, status: '结束', stage: '已交付', session: 'ses_' + task.id + '1', started: '昨天 16:30', report: '昨天 18:05',
        note: '首轮实现可运行，但被评审退回。', model: 'claude-opus-4.6'
      }
    ];
  }
  return [
    {
      n: 2, status: '结束', stage: '已交付', session: 'ses_' + task.id + '2', started: '今天 08:10', report: task.updated,
      note: '按评审意见补齐了边界情况与自检记录。', model: 'claude-sonnet-4.5'
    },

    }
  ];
}

function generatedEvidence(task) {
  if (task.status === '就绪') return [];
  const primaryType = task.type === '设计' ? '文档' : task.type === '排障' ? '证据' : '代码';
  const primary = task.type === '设计'
    ? { type: '文档', title: '设计说明与边界条件', meta: '文档 · 2.1 KB', preview: '目标、约束与验收场景逐项列出；覆盖空状态、失败重试与窄屏布局。' }
    : task.type === '排障'
      ? { type: '证据', title: '排查记录与关键日志', meta: '证据 · 2.4 KB', preview: '失败请求指纹、时间窗口与下游返回码已归档；结论与下一步动作可追溯。' }
      : { type: '代码', title: 'feat: ' + task.title, meta: 'commit 8be01d3 · 4 files', preview: '变更已通过单元测试与类型检查；新增路径包含空值与重试分支。' };
  return [
    primary,
    {
      type: '证据',
      title: '验收自查记录',
      meta: '证据 · ' + task.updated,
      preview: '验收标准逐项自查：核心路径通过；边界与失败路径已复现；键盘与窄屏检查完成。'
    },
    {
      type: '文档',
      title: '交付说明与回滚方案',

      preview: '变更范围、上线顺序与回滚步骤；受影响的项目与依赖已标注。'
    }
  ];
}

function detailFor(task) {
  const extra = TASK_EXTRA[task.id] || {};
  return {
    acceptance: extra.acceptance || task.acceptance || '未填写验收标准。',
    attempts: extra.attempts || generatedAttempts(task),
    evidence: extra.evidence || generatedEvidence(task)
  };
}

  return '<div class="review-list-mini">' + reviews.map(review =>

      '<div class="review-mini-head"><span class="tag ' + (review.decision === '通过' ? 'success' : 'danger') + '">' + review.decision + '</span>' +
        '<b>' + esc(person(review.reviewer).name) + '</b><span style="margin-left:auto">' + esc(review.time) + '</span></div>' +
      (review.comments ? '<p>' + esc(review.comments) + '</p>' : '') +

function linkedReqHTML(req) {
  if (!req) return '';
  const counts = taskCountText(req);
  return '<div class="panel-block">' +
    '<div class="block-title">所属需求</div>' +
    '<button type="button" class="split-context" style="width:100%;margin:0;text-align:left" data-action="open-req" data-id="' + req.id + '">' +
      '<small>#' + req.seq + ' · ' + req.status + '</small>' +
      '<b>' + esc(req.title) + '</b>' +
      '<span>' + counts.total + ' 个任务 · ' + counts.done + ' 个完成 · ' + esc(person(req.owner).name) + ' 负责</span>' +
    '</button>' +
  '</div>';
}

function taskFooterHTML(task, detail) {
  const reviews = reviewsOfTask(task.id);
  let hint = '';
  let actions = '';
  if (task.status === '就绪') {
    hint = '尚未派发。派发后执行器会创建第一次尝试。';
    actions = '<button type="button" class="btn primary sm" data-action="dispatch-task" data-id="' + task.id + '">' + icon('play', 11) + '派发</button>';
  } else if (task.status === '进行中') {
    hint = '执行中 · 最近报告 ' + (detail.attempts[0] ? detail.attempts[0].report : '—') + '。';
    actions = '<button type="button" class="btn outline sm" data-drawer-tab="evidence">查看证据</button>';
  } else if (task.status === '阻塞') {
    hint = '阻塞 ' + (task.blockedFor || '') + '。解除依赖后可重试。';
    actions = '<button type="button" class="btn outline sm" data-drawer-tab="evidence">查看证据</button>' +
      '<button type="button" class="btn primary sm" data-action="retry-task" data-id="' + task.id + '">' + icon('refresh', 11) + '重试</button>';
  } else if (task.status === '评审') {
    hint = '等待评审结论；通过后进入待验收。';
    actions = '<button type="button" class="btn outline sm" data-drawer-tab="evidence">查看证据</button>' +
      '<button type="button" class="btn primary sm" data-drawer-tab="review">去评审</button>';
  } else if (task.status === '待验收') {
    hint = '检查验收标准与证据后验收。';
    actions = '<button type="button" class="btn outline sm" data-drawer-tab="review">评审记录</button>' +
      '<button type="button" class="btn primary sm" data-action="accept-task" data-id="' + task.id + '">' + icon('check', 11) + '验收通过</button>';
  } else {
    hint = '已完成 · 产物、尝试与评审已归档。';
    actions = '<button type="button" class="btn outline sm" data-drawer-tab="evidence">查看产物</button>';
  }
  actions += '<button type="button" class="btn ghost sm" data-action="delete-task" data-id="' + task.id + '">' + icon('trash', 11) + '删除</button>';
  return '<div class="drawer-foot">' +
    '<div class="foot-hint">' + hint + '</div>' +
    '<div class="foot-actions">' + actions + '</div>' +
  '</div>';
}

function taskDrawerHTML(id) {
  const task = taskById(id);

  const req = reqOf(task);
  const p = project(task.project);
  const detail = detailFor(task);
  const reviews = reviewsOfTask(task.id);
  const tab = ['exec', 'evidence', 'review'].includes(state.drawer.tab) ? state.drawer.tab : 'exec';
  const current = detail.attempts[0];
  const statusCls = statusTone(task.status);
  const tabs = [
    ['exec', '执行', detail.attempts.length],
    ['evidence', '证据', detail.evidence.length],
    ['review', '评审', reviews.length]
  ];

  let content = '';
  if (tab === 'exec') {
    content = '<div class="drawer-content">' +
      '<div class="panel-block"><div class="block-title">验收标准</div>' +
        '<div class="acceptance-box">' + esc(detail.acceptance) + '</div></div>' +
      (current
        ? '<div class="panel-block"><div class="block-title">当前执行 <span class="n">' + ('#' + current.n) + '</span></div>' +
          '<div class="meta-grid">' +
            '<div class="meta-cell"><small>尝试</small><span>#' + current.n + ' · ' + current.status + '</span></div>' +
            '<div class="meta-cell"><small>阶段</small><span>' + esc(current.stage) + '</span></div>' +
            '<div class="meta-cell"><small>执行器 Session</small><span class="mono">' + esc(current.session) + '</span></div>' +
            '<div class="meta-cell"><small>最近报告</small><span>' + esc(current.report) + '</span></div>' +

        : '') +
      '<div class="panel-block"><div class="block-title">运行记录 <span class="n">' + detail.attempts.length + '</span></div>' +
        (detail.attempts.length ? attemptsHTML(detail.attempts)
          : '<div class="empty-state"><span class="es-icon">' + icon('play', 14) + '</span><b>尚未派发</b><p>派发后会生成第一次尝试；运行记录只出现在任务详情里，不进入卡片列表。</p></div>') +
      '</div>' +
      linkedReqHTML(req) +
    '</div>';
  } else if (tab === 'evidence') {
    content = '<div class="drawer-content">' +
      '<div class="panel-block"><div class="block-title">产物与证据 <span class="n">' + detail.evidence.length + '</span></div>' +
        '<p class="block-text" style="color:var(--muted);font-size:9px">证据挂在任务下，按尝试回溯；点击展开可查看摘要。</p>' +
        (detail.evidence.length ? evidenceHTML(detail.evidence)
          : '<div class="empty-state"><span class="es-icon">' + icon('shield', 14) + '</span><b>还没有产物</b><p>执行器完成一次尝试后，提交、日志和自查记录会出现在这里。</p></div>') +
      '</div>' +
    '</div>';
  } else {
    content = '<div class="drawer-content">' +
      '<div class="panel-block"><div class="block-title">评审记录 <span class="n">' + reviews.length + '</span></div>' +
        (reviews.length ? reviewsMiniHTML(reviews)
          : '<div class="empty-state"><span class="es-icon">' + icon('review', 14) + '</span><b>' + (task.status === '评审' ? '等待评审' : '还没有评审记录') + '</b><p>' +
            (task.status === '评审' ? '补充结论与意见后，任务会进入待验收或退回执行。' : '任务进入评审阶段后，评审记录会显示在这里。') + '</p></div>') +
      '</div>' +
      (task.status === '评审'
        ? '<form id="review-form" class="review-form">' +
          '<div class="field"><span class="field-label">评审结论</span><div class="radio-seg">' +
            '<label><input type="radio" name="decision" value="通过" checked><span>通过</span></label>' +
            '<label><input type="radio" name="decision" value="退回"><span>退回</span></label>' +

          '<div class="field"><span class="field-label">评审人</span><input class="input" name="reviewer" value="苏禾"></div>' +
          '<div class="field"><span class="field-label">评审意见 <em>可选</em></span><textarea class="textarea" name="comments" rows="3" placeholder="通过或退回的理由"></textarea></div>' +
          '<div class="composer-foot"><span class="hint">通过后任务进入「待验收」。</span>' +
            '<button type="submit" class="btn primary sm">提交评审</button></div>' +
        '</form>'
        : '<div class="panel-block"><div class="block-title">下一步</div><p class="block-text" style="color:var(--muted);font-size:9.5px">' +
          (task.status === '待验收' || task.status === '完成' ? '评审已通过，任务已进入验收 / 完成阶段。' : '任务尚未进入评审阶段。') + '</p></div>') +
    '</div>';
  }

  const body = '<div class="drawer-title-row">' +
      '<span class="tag ' + statusCls + '">' + task.status + '</span>' +
      '<span class="prio ' + PRIORITY_CLASS[task.priority] + '">' + task.priority + '</span>' +
      '<span class="type-chip">' + esc(task.type) + '</span>' +
      (task.auto ? '<span class="tag quiet">' + icon('bolt', 9) + '自动派发</span>' : '') +

      '<span>更新 ' + esc(task.updated) + '</span><span>·</span><span class="mono">' + taskRef(task) + '</span><span>·</span><span>' + esc(p.code) + '</span></div>' +
    (task.blocker
      ? '<div class="blocked-banner">' + icon('alert', 13) + '<div><b>阻塞中 · ' + esc(task.blockedFor || '') + '</b><br>' + esc(task.blocker) + '。解除依赖后可重新派发。</div></div>'
      : '') +
    drawerTabsHTML(tabs, tab) +
    content;

  return drawerShellHTML(body, {
    label: '任务详情：' + task.title,
    crumbs: drawerCrumbsHTML(task.project, req, task.title),
    footer: taskFooterHTML(task, detail)
  });
}

function reqFooterHTML(req) {
  const tasks = tasksOfReq(req.id);
  let hint = '';
  let actions = '';
  if (req.status === '待确认') {
    hint = '确认后才进入需求流；确认不会创建任务。';
    actions = '<button type="button" class="btn outline sm" data-action="close-req" data-id="' + req.id + '">关闭需求</button>' +
      '<button type="button" class="btn outline sm" data-action="split-req" data-id="' + req.id + '">' + icon('split', 11) + '拆任务</button>' +
      '<button type="button" class="btn primary sm" data-action="confirm-req" data-id="' + req.id + '">' + icon('check', 11) + '确认需求</button>';
  } else if (req.status === '已确认') {
    hint = '已确认 · 可以拆分为可执行任务。';
    actions = '<button type="button" class="btn outline sm" data-action="close-req" data-id="' + req.id + '">关闭需求</button>' +
      '<button type="button" class="btn primary sm" data-action="split-req" data-id="' + req.id + '">' + icon('split', 11) + '拆任务</button>';
  } else if (req.status === '已拆分') {
    hint = tasks.length + ' 个任务已拆出 · ' + tasks.filter(task => task.status === '完成').length + ' 个完成。';
    actions = '<button type="button" class="btn outline sm" data-action="close-req" data-id="' + req.id + '">关闭需求</button>' +

function reqActivityHTML(req) {
  const tasks = tasksOfReq(req.id);
  const events = [];
  events.push({ tone: '#a3752c', title: '<b>' + esc(person(req.owner).name) + '</b> 创建需求', time: req.created });
  events.push({ tone: '#8b8273', title: '来自 <b>' + esc(req.source) + '</b>', time: req.created });
  if (req.status !== '待确认') events.push({ tone: '#5a7751', title: '<b>' + esc(person(req.owner).name) + '</b> 确认需求', time: req.updated });
  if (tasks.length) events.push({ tone: '#3f6c85', title: '拆分为 <b>' + tasks.length + ' 个任务</b>', time: req.updated });
  tasks.slice(0, 4).forEach(task => {
    events.push({
      tone: STATUS[task.status] ? STATUS[task.status].color : '#8b8273',
      title: '<b>' + esc(person(task.owner).name) + '</b> 更新「' + esc(task.title) + '」 · ' + task.status,
      time: task.updated
    });
  });
  if (req.status === '已关闭') events.push({ tone: '#8b8273', title: '关闭需求 · 关联任务保留', time: req.updated });
  return '<div class="activity-timeline">' + events.map(event =>
    '<div class="timeline-item" style="--c:' + event.tone + '"><div class="timeline-title">' + event.title + '</div>' +
      '<div class="timeline-time">' + esc(event.time) + '</div></div>').join('') + '</div>';
}

function reqDrawerHTML(id) {

    content = '<div class="drawer-content">' +

        '<div class="seg-progress" style="height:5px">' +
          (requirementsTasks.length ? requirementsTasks.map(task => '<i class="' + (task.status === '完成' ? 'on' : '') + '"></i>').join('')
            : '<i></i><i></i><i></i>') +
        '</div>' +
        '<div class="req-progress-meta" style="margin-top:6px"><span>' + (counts.total ? '已拆分至任务画布' : '尚未拆分') + '</span>' +

      '</div>' +
      '<div class="panel-block"><div class="block-title">上下文</div><div class="meta-grid">' +

        '<div class="meta-cell"><small>负责人</small><span>' + avatar(req.owner) + esc(person(req.owner).name) + '</span></div>' +
        '<div class="meta-cell"><small>优先级</small><span><span class="prio ' + PRIORITY_CLASS[req.priority] + '">' + req.priority + '</span></span></div>' +
        '<div class="meta-cell"><small>更新</small><span>' + esc(req.updated) + '</span></div>' +
      '</div></div>' +
    '</div>';
  } else if (tab === 'tasks') {
    content = '<div class="drawer-content">' +
      '<div class="section-heading"><h2>关联任务</h2><button type="button" class="link-btn" data-action="split-req" data-id="' + req.id + '">' + icon('plus', 10) + '拆分新任务</button></div>' +
      '<div class="panel-block">' +
        (requirementsTasks.length
          ? '<div class="task-mini-list">' + requirementsTasks.map(task =>
            '<button type="button" class="task-mini" data-action="open-task" data-id="' + task.id + '">' +
              '<span class="tm-dot" style="--c:' + (STATUS[task.status] ? STATUS[task.status].color : '#8b8273') + '"></span>' +
              '<span class="tm-main"><span class="tm-title">' + esc(task.title) + '</span>' +
                '<span class="tm-meta">' + task.status + ' · ' + task.type + ' · ' + task.priority + ' · ' + esc(person(task.owner).name) + ' · ' + esc(task.updated) + '</span></span>' +
              icon('chevronRight', 11) +
            '</button>').join('') + '</div>'
          : '<div class="empty-state"><span class="es-icon">' + icon('split', 14) + '</span><b>还没有任务</b><p>需求确认后拆成任务，任务只出现在任务画布和这里。任务详情里才有尝试、证据与评审。</p>' +
            '<button type="button" class="btn outline sm" style="margin-top:5px" data-action="split-req" data-id="' + req.id + '">开始拆分</button></div>') +
      '</div>' +
      '<p class="split-note">任务尝试（Attempt）不会出现在需求卡片上，只保留在任务详情里。</p>' +
    '</div>';
  } else {
    content = '<div class="drawer-content"><div class="panel-block"><div class="block-title">动态</div>' + reqActivityHTML(req) + '</div></div>';
  }

  let body = '';
  if (split) {
    body = '<div class="drawer-title-row"><span class="tag info">拆分</span><span class="tag outline">需求 #' + req.seq + '</span></div>' +
      '<h2 class="drawer-title" id="drawer-title">' + esc(req.title) + '</h2>' +
      '<div class="drawer-sub"><span class="owner">' + avatar(req.owner) + esc(person(req.owner).name) + '</span><span>·</span><span>' + req.priority + '</span></div>' +
      '<div class="drawer-content">' + splitDrawerHTML(req) + '</div>';

        '<span class="prio ' + PRIORITY_CLASS[req.priority] + '">' + req.priority + '</span>' +
        '<span class="tag quiet">' + esc(displayProject(req.project)) + '</span>' +
      '</div>' +
      '<h2 class="drawer-title" id="drawer-title">' + esc(req.title) + '</h2>' +
      '<div class="drawer-sub"><span class="owner">' + avatar(req.owner) + esc(person(req.owner).name) + '</span>' +
        '<span>更新 ' + esc(req.updated) + '</span><span>·</span><span>' + esc(req.source) + '</span></div>' +
      tabHTML + content;
  }

  return drawerShellHTML(body, {
    label: split ? '拆分需求：' + req.title : '需求详情：' + req.title,
    crumbs: drawerCrumbsHTML(req.project, req, split ? '拆分任务' : req.title),
    headAction: '',
    footer: split ? splitFooterHTML() : reqFooterHTML(req)
  });
}

function drawerHTML() {
  if (!state.drawer) return '';
  if (state.drawer.kind === 'task') return taskDrawerHTML(state.drawer.id);
  if (state.drawer.kind === 'req') return reqDrawerHTML(state.drawer.id);
  return '';
}

/* ── Composer ──────────────────────────────────────────────────────────── */
function reqsForComposer(projectId) {
  return REQS.filter(req => req.project === projectId && req.status !== '已关闭' && req.status !== '已删除')
    .sort((a, b) => ['已确认', '已拆分', '待确认'].indexOf(a.status) - ['已确认', '已拆分', '待确认'].indexOf(b.status));
}

function composerFloatingHTML() {
  if (!state.composer) return '';
  const c = state.composer;
  const reqMode = c.mode === 'req';
  const projectId = c.projectId || (state.project === 'all' ? PROJECTS[0].id : state.project);
  const reqs = reqsForComposer(projectId);
  if (!reqs.some(req => req.id === c.reqId)) c.reqId = reqs[0] ? reqs[0].id : '';
  const triage = c.inboxId ? INBOX.find(item => item.id === c.inboxId) : null;
  const priorityHTML = ['P0', 'P1', 'P2', 'P3'].map(value =>
    '<button type="button" class="option ' + (c.priority === value ? 'active' : '') + '" data-composer-priority="' + value + '">' + value + '</button>').join('');
  const typeHTML = ['设计', '开发', '排障', '评审'].map(value =>
    '<button type="button" class="option ' + (c.type === value ? 'active' : '') + '" data-composer-type="' + value + '">' + value + '</button>').join('');
  const projectOptions = PROJECTS.map(p => '<option value="' + p.id + '"' + (p.id === projectId ? ' selected' : '') + '>' + esc(p.code + ' · ' + p.name) + '</option>').join('');
  const reqOptions = reqs.length
    ? reqs.map(req => '<option value="' + req.id + '"' + (req.id === c.reqId ? ' selected' : '') + '>#' + req.seq + ' · ' + esc(req.title) + '</option>').join('')
    : '<option value="">当前项目暂无可拆分需求</option>';
  return '<div class="composer" role="dialog" aria-label="新建">' +
    '<div class="composer-head">' +
      '<div class="composer-tabs" role="tablist">' +
        '<button type="button" role="tab" aria-selected="' + (!reqMode) + '" class="composer-tab ' + (!reqMode ? 'active' : '') + '" data-composer-mode="task">新任务</button>' +
        '<button type="button" role="tab" aria-selected="' + reqMode + '" class="composer-tab ' + (reqMode ? 'active' : '') + '" data-composer-mode="req">新需求</button>' +
      '</div>' +
      '<button type="button" class="icon-btn" data-action="close-composer" title="收起" aria-label="收起">' + icon('close', 13) + '</button>' +
    '</div>' +
    '<form id="composer-form" class="composer-body">' +
      (triage ? '<div class="composer-advanced">' + icon('inbox', 11) + '从收件箱「' + esc(triage.contact) + '」转入</div>' : '') +
      '<div class="field"><span class="field-label">' + (reqMode ? '需求标题' : '任务标题') + ' <em>一句话说清要做什么</em></span>' +
        '<input class="input" name="title" required autocomplete="off" value="' + esc(c.title || '') + '" placeholder="' + (reqMode ? '例如：账单导入时标记对账差异' : '例如：补齐差异规则的空状态') + '"></div>' +
      '<div class="field"><span class="field-label">项目</span>' +
        '<select class="select" name="project">' + projectOptions + '</select></div>' +
      (!reqMode ? '<div class="field"><span class="field-label">所属需求 <em>任务必须挂在需求下</em></span>' +
        '<select class="select" name="req">' + reqOptions + '</select></div>' : '') +
      '<div class="field-row">' +
        '<div class="field"><span class="field-label">优先级</span><div class="option-row">' + priorityHTML + '</div></div>' +
        (reqMode
          ? '<div class="field"><span class="field-label">初始状态</span><div class="option-row"><span class="option active">待确认</span></div></div>'
          : '<div class="field"><span class="field-label">类型</span><div class="option-row">' + typeHTML + '</div></div>') +
      '</div>' +
      '<div class="field"><span class="field-label">' + (reqMode ? '来源 / 背景 <em>可选</em>' : '验收标准 <em>可选</em>') + '</span>' +
        (reqMode
          ? '<textarea class="textarea" name="note" rows="2" placeholder="客户原话、背景或期望">' + esc(c.note || '') + '</textarea>'
          : '<input class="input" name="acceptance" value="' + esc(c.acceptance || '') + '" placeholder="例如：1200px 下可完成完整操作">') +
      '</div>' +
      '<div class="composer-foot"><span class="hint">' + (reqMode ? '进入「待确认」，确认后再拆分。' : '直接进入「就绪」，派发后才产生尝试。') + '</span>' +
        '<button type="submit" class="btn primary sm" id="composer-submit"' + (!reqMode && !reqs.length ? ' disabled' : '') + '>' + icon('plus', 11) + '创建' + (reqMode ? '需求' : '任务') + '</button></div>' +
    '</form>' +
  '</div>' +
  '<div class="composer-dock"><span class="dock-hint"><span class="kbd">C</span> 新建</span></div>';
}

function floatingHTML() {
  if (state.drawer || state.modal || state.search) return '';
  if (state.composer) return composerFloatingHTML();
  const reqMode = state.tab === 'requirements';
  return '<div class="composer-dock">' +
    '<span class="dock-hint"><span class="kbd">C</span> 快速新建 · 不离开画布</span>' +
    '<button type="button" class="fab" data-action="composer" data-mode="' + (reqMode ? 'req' : 'task') + '">' +
      '<span class="fab-ico">' + icon('plus', 13) + '</span>新建' + (reqMode ? '需求' : '任务') +

}

/* ── Modals ────────────────────────────────────────────────────────────── */

function switchRowHTML(label, hint, on) {

function modalHTML() {
  if (!state.modal) return '';

  let dialog = '';

    const task = taskById(modal.id);
    if (!task) return '';
    const req = reqOf(task);
    dialog = '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">' +
      '<div class="dialog-head"><span class="danger-ico">' + icon('trash', 15) + '</span>' +

        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="取消">' + icon('close', 15) + '</button></div>' +

      '<div class="dialog-note danger-note">' + icon('alert', 12) + '<span><b>' + taskRef(task) + '</b> · ' + esc(displayProject(task.project)) +
        (req ? ' · #' + req.seq : '') + ' · ' + esc(person(task.owner).name) + '<br>不会删除关联需求和其他任务。</span></div>' +
      '<div class="dialog-actions"><button type="button" class="btn outline" data-action="close-modal">取消</button>' +

    '</div>';
  } else if (modal.kind === 'close-req') {
    const req = reqById(modal.id);
    if (!req) return '';
    const counts = taskCountText(req);
    dialog = '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="close-req-title">' +
      '<div class="dialog-head"><span class="danger-ico" style="background:var(--ochre-soft);color:var(--ochre)">' + icon('flag', 15) + '</span>' +
        '<div style="flex:1"><div class="dialog-kicker">关闭需求</div><h2 id="close-req-title">关闭「' + esc(req.title) + '」？</h2></div>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="取消">' + icon('close', 15) + '</button></div>' +
      '<p class="dialog-desc">关闭后需求不再接受拆分，也不再占用「待确认 / 已确认」的注意力。</p>' +
      '<div class="dialog-note">' + icon('alert', 12) + '<span>' +
        (counts.total
          ? '已拆出的 <b>' + counts.total + ' 个任务</b>会继续执行；运行记录、证据与评审保留。'
          : '该需求尚未拆出任务；关闭后不再进入拆分流程，仍保留在「已关闭」列。') +
      '</span></div>' +
      '<div class="dialog-actions"><button type="button" class="btn outline" data-action="close-modal">取消</button>' +
        '<button type="button" class="btn primary" data-action="confirm-close-req" data-id="' + req.id + '">关闭需求</button></div>' +
    '</div>';
  } else if (modal.kind === 'settings') {
    dialog = settingsModalHTML(modal.scope || 'project');

/* ── Search ────────────────────────────────────────────────────────────── */
function paletteRowHTML(kind, item) {
  const req = kind === 'req' ? item : reqOf(item);
  const isReq = kind === 'req';
  const p = project(isReq ? item.project : item.project);
  const title = item.title;
  const meta = isReq
    ? '#' + item.seq + ' · ' + item.status + ' · ' + person(item.owner).name + ' · ' + p.code
    : taskRef(item) + ' · ' + item.status + ' · ' + item.type + ' · ' + person(item.owner).name + ' · ' + p.code;
  return '<button type="button" class="palette-row" ' + (isReq ? 'data-req="' + item.id + '"' : 'data-task="' + item.id + '"') + '>' +
    '<span class="palette-icon">' + icon(isReq ? 'layers' : 'columns', 12) + '</span>' +
    '<span class="palette-main"><span class="palette-title">' + esc(title) + '</span><span class="palette-meta">' + esc(meta) + '</span></span>' +
    '<span class="palette-side">' + (req ? '#' + req.seq : '') + '</span>' +
    icon('chevronRight', 11) +
  '</button>';
}

function searchResultsHTML(q) {
  const query = q.trim().toLowerCase();
  let reqs;
  let tasks;
  if (!query) {
    reqs = ['r64', 'r124', 'r128'].map(reqById).filter(Boolean);
    tasks = ['t208', 't207', 't202'].map(taskById).filter(Boolean);
    return '<div class="search-group-label">建议先看</div>' +
      reqs.map(item => paletteRowHTML('req', item)).join('') +
      tasks.map(item => paletteRowHTML('task', item)).join('');
  }
  reqs = REQS.filter(req => {
    const hay = [req.title, '#' + req.seq, String(req.seq), req.status, req.source].join(' ').toLowerCase();
    return hay.includes(query);
  }).slice(0, 5);
  tasks = TASKS.filter(task => {
    if (task.deleted) return false;
    const hay = [task.title, taskRef(task), task.status, task.type, person(task.owner).name].join(' ').toLowerCase();
    return hay.includes(query);
  }).slice(0, 6);
  if (!reqs.length && !tasks.length) {
    return '<div class="search-empty"><b>没有找到「' + esc(q) + '」</b><p>试试任务编号、需求序号或负责人名字。</p></div>';
  }
  return (reqs.length ? '<div class="search-group-label">需求</div>' + reqs.map(item => paletteRowHTML('req', item)).join('') : '') +
    (tasks.length ? '<div class="search-group-label">任务</div>' + tasks.map(item => paletteRowHTML('task', item)).join('') : '');
}

function searchHTML() {
  if (!state.search) return '';
  return '<div class="search-wrap"><div class="modal-scrim" data-action="close-search"></div>' +
    '<div class="search-panel" role="dialog" aria-modal="true" aria-label="全局搜索">' +
      '<div class="search-input-row">' + icon('search', 15) +
        '<input class="search-input" id="search-input" type="search" autocomplete="off" placeholder="搜索需求、任务、编号或负责人" aria-label="搜索">' +
        '<kbd>Esc</kbd>' +
      '</div>' +
      '<div class="search-results" id="search-results">' + searchResultsHTML('') + '</div>' +
      '<div class="search-foot"><span><span class="kbd">↵</span> 打开</span><span><span class="kbd">Esc</span> 关闭</span>' +
        '<span style="margin-left:auto">搜索范围：需求标题 / 任务标题 / 编号 / 负责人</span></div>' +
    '</div>' +
  '</div>';
}

/* ==========================================================================
   Render pipeline and interactions
   ========================================================================== */
function renderChrome() {
  $('#topbar').innerHTML = topbarHTML();
  $('#projectbar').innerHTML = projectbarHTML();
}

function renderView() {
  const board = $('.board');
  const left = board ? board.scrollLeft : 0;
  let html = '';
  switch (state.tab) {
    case 'overview': html = overviewHTML(); break;
    case 'projects': html = projectsHTML(); break;
    case 'requirements': html = boardPageHTML(); break;
    case 'tasks': html = boardPageHTML(); break;
    case 'inbox': html = inboxHTML(); break;
    case 'memory': html = memoryHTML(); break;
    case 'reviews': html = reviewsHTML(); break;
    default: html = overviewHTML();
  }
  $('#view').innerHTML = html;
  const nextBoard = $('.board');
  if (nextBoard) nextBoard.scrollLeft = left;
}

function renderOverlays() {
  $('#overlays').innerHTML = drawerHTML() + modalHTML();
  wireSplitPreview();
}

function renderSearchRoot() {
  $('#search-root').innerHTML = searchHTML();
}

function renderFloating() {
  $('#floating').innerHTML = floatingHTML();
}

function syncLock() {
  const locked = !!(state.drawer || state.modal || state.search);
  document.body.classList.toggle('is-locked', locked);
}

function renderAll(options = {}) {
  const y = window.scrollY;
  renderChrome();
  renderView();
  renderOverlays();
  renderSearchRoot();
  renderFloating();
  syncLock();
  if (options.resetScroll) window.scrollTo(0, 0);
  else window.scrollTo(0, y);
}

function updateOverlayOnly() {
  renderOverlays();
  renderFloating();
  syncLock();
}

function focusSoon(selector, delay = 30) {
  window.setTimeout(() => {
    const el = $(selector);
    if (el && typeof el.focus === 'function') el.focus({ preventScroll: true });
  }, delay);
}

function goTab(tab) {
  if (!TABS.some(item => item.id === tab)) return;
  state.tab = tab;
  state.filter = 'all';
  state.drawer = null;
  state.modal = null;
  state.composer = null;
  state.search = false;
  renderAll({ resetScroll: true });
}

function selectProject(projectId) {
  state.project = projectId;
  state.filter = 'all';
  state.drawer = null;
  state.modal = null;
  state.composer = null;
  state.search = false;
  state.lanes = projectId === 'all' ? true : false;
  renderAll();
}

function openTaskDrawer(id, tab = 'exec') {
  const task = taskById(id);
  if (!task || task.deleted) return;
  state.tab = 'tasks';
  state.filter = 'all';
  if (state.project !== 'all' && state.project !== task.project) state.project = task.project;
  state.drawer = { kind: 'task', id, tab };
  state.modal = null;
  state.composer = null;
  state.search = false;
  renderAll();
  focusSoon('.drawer', 20);
}

function openReqDrawer(id, tab = 'detail') {
  const req = reqById(id);
  if (!req) return;
  state.tab = 'requirements';
  state.filter = 'all';
  if (state.project !== 'all' && state.project !== req.project) state.project = req.project;
  state.drawer = { kind: 'req', id, tab, split: false };
  state.modal = null;
  state.composer = null;
  state.search = false;
  renderAll();
  focusSoon('.drawer', 20);
}

function closeDrawer() {
  state.drawer = null;
  updateOverlayOnly();
}

function closeModal() {
  state.modal = null;
  updateOverlayOnly();
}

function openSearch() {
  state.search = true;
  state.drawer = null;
  state.modal = null;
  state.composer = null;
  renderAll();
  focusSoon('#search-input', 20);
}

function closeSearch() {
  state.search = false;
  renderSearchRoot();
  renderFloating();
  syncLock();
}

function openComposer(mode, options = {}) {
  const projectId = options.projectId || (state.project === 'all' ? PROJECTS[0].id : state.project);
  const reqs = reqsForComposer(projectId);
  state.composer = {
    mode: mode === 'req' ? 'req' : 'task',
    projectId,
    reqId: options.reqId || (reqs[0] ? reqs[0].id : ''),
    priority: options.priority || 'P2',
    type: options.type || '开发',
    title: options.title || '',
    note: options.note || '',
    acceptance: options.acceptance || '',
    inboxId: options.inboxId || null
  };
  state.drawer = null;
  state.modal = null;
  state.search = false;
  renderAll();
  focusSoon('#composer-form input[name="title"]', 20);
}

function closeComposer() {
  state.composer = null;
  renderFloating();
  syncLock();
}

function openSettings(scope, projectId) {
  state.modal = {
    kind: 'settings',
    scope: scope === 'system' ? 'system' : 'project',
    projectId: projectId || (state.project === 'all' ? PROJECTS[0].id : state.project)
  };
  renderOverlays();
  renderFloating();
  syncLock();
  focusSoon('.dialog .btn.primary, .dialog .btn.outline', 30);
}

function openConfirm(kind, id) {
  state.modal = { kind, id };
  renderOverlays();
  renderFloating();
  syncLock();
  focusSoon('.dialog .btn.danger, .dialog .btn.primary', 30);
}

function deleteTaskNow(id) {
  const task = taskById(id);
  if (!task) return;
  task.deleted = true;
  state.modal = null;
  if (state.drawer && state.drawer.kind === 'task' && state.drawer.id === id) state.drawer = null;
  renderAll();
  showToast('已删除任务「' + task.title + '」', {
    icon: 'trash',
    action: '撤销',
    onAction: () => {
      task.deleted = false;
      renderAll();
      showToast('已恢复任务「' + task.title + '」');
    }
  });
}

function showRefreshToast() {
  showToast('看板已同步 · 09:52', { icon: 'refresh' });
}

function updateMemory(id, decision) {
  const item = MEMORY.find(entry => entry.id === id);
  if (!item) return;
  const before = item.status;
  item.status = decision === 'confirm' ? '已确认' : '已废弃';
  item.updated = '刚刚';
  renderView();
  showToast(decision === 'confirm' ? '记忆已确认，将进入执行器上下文' : '记忆已退回，不再参与召回', {
    icon: decision === 'confirm' ? 'check' : 'flag',
    action: '撤销',
    onAction: () => {
      item.status = before;
      renderView();
    }
  });
}

function submitComposer(form) {
  if (!state.composer) return;
  const data = new FormData(form);
  const title = String(data.get('title') || '').trim();
  if (!title) return;
  const projectId = String(data.get('project') || state.composer.projectId);
  const mode = state.composer.mode;

  if (mode === 'req') {
    const seq = nextReqSeq(projectId);
    const inbox = state.composer.inboxId ? INBOX.find(item => item.id === state.composer.inboxId) : null;
    const req = {
      id: 'r' + seq,
      project: projectId,
      seq,
      title,
      status: '待确认',
      priority: state.composer.priority,
      owner: 'lin',
      source: inbox ? '收件箱 · ' + inbox.channel + ' · ' + inbox.contact : '手动创建',
      note: String(data.get('note') || '').trim(),
      created: '刚刚',
      updated: '刚刚'
    };
    REQS.push(req);
    if (inbox) {
      const index = INBOX.indexOf(inbox);
      if (index >= 0) INBOX.splice(index, 1);
    }
    state.tab = 'requirements';
    state.project = projectId;
    state.filter = 'all';
    state.lanes = false;
    state.composer = null;
    state.newIds = [req.id];
    renderAll({ resetScroll: true });
    window.setTimeout(() => { state.newIds = state.newIds.filter(value => value !== req.id); }, 3200);
    showToast('已创建需求 #' + seq + ' · 已放入「待确认」', { icon: 'layers' });
    return;
  }

  const req = reqById(String(data.get('req') || state.composer.reqId));
  if (!req) {
    showToast('请先选择所属需求', { icon: 'alert' });
    return;
  }
  const acceptance = String(data.get('acceptance') || '').trim();
  const id = newTaskId();
  const task = {
    id,
    project: req.project,
    req: req.id,
    title,
    type: state.composer.type,
    status: '就绪',
    priority: state.composer.priority,
    owner: 'lin',
    updated: '刚刚',
    auto: false,
    acceptance: acceptance || null
  };
  TASKS.push(task);
  if (req.status !== '已关闭') req.status = '已拆分';
  req.updated = '刚刚';
  state.tab = 'tasks';
  state.project = req.project;
  state.filter = 'all';
  state.lanes = false;
  state.composer = null;
  state.newIds = [task.id];
  renderAll({ resetScroll: true });
  window.setTimeout(() => { state.newIds = state.newIds.filter(value => value !== task.id); }, 3200);
  showToast('已创建任务「' + task.title + '」 · 放入「就绪」', { icon: 'columns' });
}

function syncComposerFromForm() {
  const form = $('#composer-form');
  if (!form || !state.composer) return;
  const value = name => {
    const field = form.elements[name];
    return field ? field.value : '';
  };
  state.composer.title = value('title');
  state.composer.projectId = value('project') || state.composer.projectId;
  state.composer.reqId = value('req') || state.composer.reqId;
  state.composer.note = value('note');
  state.composer.acceptance = value('acceptance');
}

function updateSplitPreview() {
  const textarea = $('#split-titles');
  if (!textarea) return;
  const titles = textarea.value.split(/\r?\n/).map(value => value.trim()).filter(Boolean);
  const count = $('#split-preview-count');
  const chips = $('#split-preview-chips');
  const submit = $('#split-submit');
  const warn = $('#prose-warn');
  if (count) count.textContent = String(titles.length);
  if (chips) {
    chips.innerHTML = titles.length
      ? titles.slice(0, 8).map(title => '<span class="preview-chip">' + esc(title) + '</span>').join('') +
        (titles.length > 8 ? '<span class="preview-chip">… 另有 ' + (titles.length - 8) + ' 个</span>' : '')
      : '<span class="preview-empty">每一行会成为一个任务；留空时无法提交。</span>';
  }
  if (submit) {
    submit.disabled = titles.length === 0;
    submit.innerHTML = icon('split', 11) + '拆出 ' + (titles.length || '') + ' 个任务';
  }
  const prose = titles.length > 1 && titles.some(title =>
    /^(以及|并且|并|和|与|或|及)/.test(title) || /[。！？]$/.test(title));
  if (warn) warn.hidden = !prose;
}

function wireSplitPreview() {
  const textarea = $('#split-titles');
  if (!textarea) return;
  if (textarea.dataset.wired !== '1') {
    textarea.dataset.wired = '1';
    textarea.addEventListener('input', updateSplitPreview);
  }
  updateSplitPreview();
}

function submitSplit(form) {
  if (!state.drawer || state.drawer.kind !== 'req') return;
  const req = reqById(state.drawer.id);
  if (!req) return;
  const data = new FormData(form);
  const titles = String(data.get('titles') || '').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
  if (!titles.length) return;
  const type = String(data.get('type') || '开发');
  const priority = String(data.get('priority') || 'P2');
  const acceptance = String(data.get('acceptance') || '').trim();
  const ids = [];
  titles.forEach(title => {
    const id = newTaskId();
    ids.push(id);
    TASKS.push({
      id,
      project: req.project,
      req: req.id,
      title,
      type,
      status: '就绪',
      priority,
      owner: req.owner,
      updated: '刚刚',
      auto: false,
      acceptance: acceptance || null
    });
  });
  req.status = '已拆分';
  req.updated = '刚刚';
  state.drawer = { kind: 'req', id: req.id, tab: 'tasks', split: false };
  state.filter = 'all';
  state.newIds = ids;
  renderAll();
  window.setTimeout(() => { state.newIds = state.newIds.filter(value => !ids.includes(value)); }, 3200);
  showToast('已从需求 #' + req.seq + ' 拆出 ' + titles.length + ' 个任务 · 进入「就绪」', { icon: 'split' });
}

function submitReview(form) {
  if (!state.drawer || state.drawer.kind !== 'task') return;
  const task = taskById(state.drawer.id);
  if (!task) return;
  const data = new FormData(form);
  const decision = String(data.get('decision') || '通过');
  const reviewerName = String(data.get('reviewer') || '').trim();
  const reviewer = Object.keys(PEOPLE).find(id => PEOPLE[id].name === reviewerName) || 'su';
  const comments = String(data.get('comments') || '').trim();
  REVIEWS.push({
    id: 'rv' + Date.now(),
    taskId: task.id,
    reviewer,
    decision,
    comments,
    time: '刚刚'
  });
  task.status = decision === '通过' ? '待验收' : '进行中';
  task.updated = '刚刚';
  state.drawer.tab = 'review';
  renderAll();
  showToast(decision === '通过' ? '评审已通过 · 任务进入「待验收」' : '评审已退回 · 任务回到「进行中」', { icon: decision === '通过' ? 'checkCircle' : 'flag' });
}

function submitProjectSettings(form) {
  const data = new FormData(form);
  const modal = state.modal;
  const p = project(modal && modal.projectId ? modal.projectId : (state.project === 'all' ? 'demo' : state.project));
  const name = String(data.get('name') || '').trim();
  if (name) p.name = name;
  const root = String(data.get('root') || '').trim();
  if (root) p.root = root;
  state.modal = null;
  renderAll();
  showToast('项目设置已保存 · ' + p.code, { icon: 'settings' });
}

function submitManualInbox(form) {
  const data = new FormData(form);
  const context = String(data.get('context') || '').trim();
  if (!context) {
    const field = form.elements.context;
    if (field) field.focus();
    return;
  }
  const contact = String(data.get('contact') || '').trim();
  INBOX.unshift({
    id: 'i' + Date.now(),
    channel: String(data.get('channel') || '其他'),
    contact: contact || '未留联系人',
    snippet: context,
    project: state.project === 'all' ? null : state.project,
    time: '刚刚',
    title: context.split(/\r?\n/)[0].slice(0, 42)
  });
  renderAll();
  showToast('已记录收件 · 等待转需求', { icon: 'inbox' });
}

function ignoreInbox(id) {
  const index = INBOX.findIndex(item => item.id === id);
  if (index < 0) return;
  const [item] = INBOX.splice(index, 1);
  renderAll();
  showToast('已忽略「' + item.contact + '」的收件', {
    icon: 'close',
    action: '撤销',
    onAction: () => {
      INBOX.splice(index, 0, item);
      renderAll();
    }
  });
}

function handleAction(action, el) {
  switch (action) {
    case 'search':
      openSearch();
      return;
    case 'close-search':
      closeSearch();
      return;
    case 'system-settings':
      openSettings('system');
      return;
    case 'project-settings': {
      if (isAllProjects() && !el.dataset.project) {
        showToast('先选择一个项目，再打开项目设置', { icon: 'alert' });
        return;
      }
      openSettings('project', el.dataset.project);
      return;
    }
    case 'toggle-lanes':
      state.lanes = !state.lanes;
      renderAll();
      return;
    case 'refresh':
      showRefreshToast();
      return;
    case 'scroll-board': {
      const board = $('.board');
      if (board) board.scrollBy({ left: Number(el.dataset.dir || 1) * Math.max(280, board.clientWidth * 0.7), behavior: 'smooth' });
      return;
    }
    case 'clear-filter':
      state.filter = 'all';
      renderView();
      return;
    case 'composer':
      openComposer(el.dataset.mode || (state.tab === 'requirements' ? 'req' : 'task'));
      return;
    case 'close-composer':
      closeComposer();
      return;
    case 'close-drawer':
      closeDrawer();
      return;
    case 'close-modal':
      closeModal();
      return;
    case 'open-req':
      openReqDrawer(el.dataset.id);
      return;
    case 'open-task':
      openTaskDrawer(el.dataset.id);
      return;
    case 'drawer-project':
      state.project = el.dataset.project;
      state.lanes = false;
      state.filter = 'all';
      renderAll();
      return;
    case 'open-project':
      state.tab = 'tasks';
      state.project = el.dataset.project;
      state.lanes = false;
      state.filter = 'all';
      state.drawer = null;
      state.composer = null;
      state.modal = null;
      renderAll({ resetScroll: true });
      return;
    case 'delete-task':
      openConfirm('delete-task', el.dataset.id);
      return;
    case 'confirm-delete':
      deleteTaskNow(el.dataset.id);
      return;
    case 'dispatch-task': {
      const task = taskById(el.dataset.id);
      if (!task) return;
      task.status = '进行中';
      task.updated = '刚刚';
      if (state.drawer && state.drawer.kind === 'task') state.drawer.tab = 'exec';
      renderAll();
      showToast('已派发「' + task.title + '」 · 等待执行器接手', { icon: 'play' });
      return;
    }
    case 'retry-task': {
      const task = taskById(el.dataset.id);
      if (!task) return;
      const blocker = task.blocker;
      task.status = '进行中';
      task.updated = '刚刚';
      delete task.blocker;
      delete task.blockedFor;
      renderAll();
      showToast('已重新派发「' + task.title + '」' + (blocker ? ' · 阻塞依赖已标记解除' : ''), {
        icon: 'refresh',
        action: '撤销',
        onAction: () => {
          task.status = '阻塞';
          task.blocker = blocker;
          task.blockedFor = '刚刚';
          renderAll();
        }
      });
      return;
    }
    case 'accept-task': {
      const task = taskById(el.dataset.id);
      if (!task) return;
      task.status = '完成';
      task.updated = '刚刚';
      task.acceptedBy = 'lin';
      task.acceptedAt = '刚刚';
      renderAll();
      showToast('已验收「' + task.title + '」 · 任务完成', { icon: 'checkCircle' });
      return;
    }
    case 'confirm-req': {
      const req = reqById(el.dataset.id);
      if (!req || req.status !== '待确认') return;
      req.status = '已确认';
      req.updated = '刚刚';
      if (state.drawer && state.drawer.kind === 'req') state.drawer.tab = 'detail';
      renderAll();
      showToast('需求 #' + req.seq + ' 已确认 · 可以拆分任务', { icon: 'check' });
      return;
    }
    case 'split-req': {
      const req = reqById(el.dataset.id);
      if (!req || req.status === '已关闭') return;
      state.drawer = { kind: 'req', id: req.id, tab: 'detail', split: true };
      state.modal = null;
      renderAll();
      focusSoon('#split-titles', 30);
      return;
    }
    case 'cancel-split':
      if (state.drawer && state.drawer.kind === 'req') {
        state.drawer.split = false;
        state.drawer.tab = 'detail';
        updateOverlayOnly();
      }
      return;
    case 'close-req':
      openConfirm('close-req', el.dataset.id);
      return;
    case 'confirm-close-req': {
      const req = reqById(el.dataset.id);
      if (!req) return;
      const previous = req.status;
      req.status = '已关闭';
      req.updated = '刚刚';
      state.modal = null;
      if (state.drawer && state.drawer.kind === 'req') {
        state.drawer.split = false;
        state.drawer.tab = 'detail';
      }
      renderAll();
      showToast('需求 #' + req.seq + ' 已关闭 · 关联任务继续执行', {
        icon: 'flag',
        action: '撤销',
        onAction: () => {
          req.status = previous;
          renderAll();
        }
      });
      return;
    }
    case 'triage': {
      const item = INBOX.find(entry => entry.id === el.dataset.id);
      if (!item) return;
      openComposer('req', {
        projectId: item.project || (state.project === 'all' ? PROJECTS[0].id : state.project),
        title: item.title,
        note: item.snippet,
        inboxId: item.id
      });
      return;
    }
    case 'ignore-inbox':
      ignoreInbox(el.dataset.id);
      return;
    case 'memory-confirm':
      updateMemory(el.dataset.id, 'confirm');
      return;
    case 'memory-reject':
      updateMemory(el.dataset.id, 'reject');
      return;
    case 'check-refs':
      showToast('引用检查完成 · 3 条可解析，1 条需人工复核', { icon: 'shield' });
      return;
    case 'toggle-switch':
      el.classList.toggle('on');
      el.setAttribute('aria-pressed', el.classList.contains('on') ? 'true' : 'false');
      return;
    case 'mock-save':
      state.modal = null;
      renderAll();
      showToast('系统设置已保存（原型）', { icon: 'settings' });
      return;
    case 'new-project':
      showToast('项目创建流程不在本原型范围 · 可切换现有项目', { icon: 'alert' });
      return;
    default:
      return;
  }
}

/* ── Delegated events ──────────────────────────────────────────────────── */
document.addEventListener('click', event => {
  const actionEl = event.target.closest('[data-action]');
  if (actionEl) {
    handleAction(actionEl.dataset.action, actionEl);
    return;
  }

  const composerMode = event.target.closest('[data-composer-mode]');
  if (composerMode && state.composer) {
    syncComposerFromForm();
    state.composer.mode = composerMode.dataset.composerMode;
    const reqs = reqsForComposer(state.composer.projectId);
    state.composer.reqId = reqs.some(req => req.id === state.composer.reqId) ? state.composer.reqId : (reqs[0] ? reqs[0].id : '');
    renderFloating();
    return;
  }
  const composerPriority = event.target.closest('[data-composer-priority]');
  if (composerPriority && state.composer) {
    syncComposerFromForm();
    state.composer.priority = composerPriority.dataset.composerPriority;
    renderFloating();
    return;
  }
  const composerType = event.target.closest('[data-composer-type]');
  if (composerType && state.composer) {
    syncComposerFromForm();
    state.composer.type = composerType.dataset.composerType;
    renderFloating();
    return;
  }

  const tabEl = event.target.closest('[data-tab]');
  if (tabEl) {
    goTab(tabEl.dataset.tab);
    return;
  }

  const drawerTab = event.target.closest('[data-drawer-tab]');
  if (drawerTab && state.drawer) {
    const next = drawerTab.dataset.drawerTab;
    if (state.drawer.kind === 'task' && ['exec', 'evidence', 'review'].includes(next)) {
      state.drawer.tab = next;
    } else if (state.drawer.kind === 'req' && ['detail', 'tasks', 'activity'].includes(next)) {
      state.drawer.tab = next;
      state.drawer.split = false;
    }
    renderOverlays();
    const body = $('.drawer-body');
    if (body) body.scrollTop = 0;
    return;
  }

  const filterEl = event.target.closest('[data-filter]');
  if (filterEl) {
    state.filter = filterEl.dataset.filter;
    renderView();
    return;
  }
  const memoryFilter = event.target.closest('[data-memory-filter]');
  if (memoryFilter) {
    state.memoryFilter = memoryFilter.dataset.memoryFilter;
    renderView();
    return;
  }
  const reviewFilter = event.target.closest('[data-review-filter]');
  if (reviewFilter) {
    state.reviewFilter = reviewFilter.dataset.reviewFilter;
    renderView();
    return;
  }

  const taskEl = event.target.closest('[data-task]');
  if (taskEl) {
    openTaskDrawer(taskEl.dataset.task);
    return;
  }
  const reqEl = event.target.closest('[data-req]');
  if (reqEl) {
    openReqDrawer(reqEl.dataset.req);
    return;
  }
  const projectEl = event.target.closest('[data-project]');
  if (projectEl) {
    selectProject(projectEl.dataset.project);
    return;
  }
});

document.addEventListener('submit', event => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  if (form.id === 'composer-form') {
    event.preventDefault();
    submitComposer(form);
  } else if (form.id === 'manual-inbox-form') {
    event.preventDefault();
    submitManualInbox(form);
  } else if (form.id === 'review-form') {
    event.preventDefault();
    submitReview(form);
  } else if (form.id === 'split-form') {
    event.preventDefault();
    submitSplit(form);
  } else if (form.id === 'project-settings-form') {
    event.preventDefault();
    submitProjectSettings(form);
  }
});

document.addEventListener('input', event => {
  const target = event.target;
  if (!(target instanceof Element)) return;
  if (target.id === 'search-input') {
    const results = $('#search-results');
    if (results) results.innerHTML = searchResultsHTML(target.value);
    return;
  }
  if (state.composer && target.closest('#composer-form')) {
    const name = target.getAttribute('name');
    if (name === 'title' || name === 'note' || name === 'acceptance') state.composer[name] = target.value;
    return;
  }
  if (target.id === 'split-titles') updateSplitPreview();
});

document.addEventListener('change', event => {
  const target = event.target;
  if (!(target instanceof Element)) return;
  if (state.composer && target.closest('#composer-form')) {
    syncComposerFromForm();
    if (target.getAttribute('name') === 'project') {
      const reqs = reqsForComposer(state.composer.projectId);
      state.composer.reqId = reqs[0] ? reqs[0].id : '';
      renderFloating();
      focusSoon('#composer-form select[name="req"]', 20);
    }
  }
});

/* Clicking the canvas dismisses the floating composer; the dock and form remain interactive. */
document.addEventListener('pointerdown', event => {
  if (!state.composer) return;
  const target = event.target;
  if (!(target instanceof Element)) return;
  if (target.closest('.composer') || target.closest('.composer-dock') || target.closest('[data-action="composer"]')) return;
  closeComposer();
});

/* Drag & drop: visual movement updates the mock state; a real app must validate transitions server-side. */
document.addEventListener('dragstart', event => {
  const card = event.target.closest('[data-task], [data-req]');
  if (!card) return;
  const kind = card.dataset.task ? 'task' : 'req';
  const id = kind === 'task' ? card.dataset.task : card.dataset.req;
  const item = kind === 'task' ? taskById(id) : reqById(id);
  if (!item) return;
  state.dragging = { kind, id };
  card.classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', id);
});

document.addEventListener('dragover', event => {
  if (!state.dragging) return;
  const body = event.target.closest('.col-body');
  if (!body) return;
  const allowed = state.dragging.kind === 'task' ? TASK_STATUSES : REQ_STATUSES;
  if (!allowed.includes(body.dataset.dropStatus)) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  $$('.col-body.drag-over').forEach(el => el.classList.remove('drag-over'));
  $$('.column.drop-target').forEach(el => el.classList.remove('drop-target'));
  body.classList.add('drag-over');
  const column = body.closest('.column');
  if (column) column.classList.add('drop-target');
});

document.addEventListener('drop', event => {
  if (!state.dragging) return;
  const body = event.target.closest('.col-body');
  if (!body) return;
  event.preventDefault();
  const status = body.dataset.dropStatus;
  const { kind, id } = state.dragging;
  state.dragging = null;
  if (kind === 'task') {
    const task = taskById(id);
    if (!task || task.status === status) {
      renderAll();
      return;
    }
    const previous = task.status;
    task.status = status;
    task.updated = '刚刚';
    if (status === '阻塞') {
      task.blocker = task.blocker || '等待依赖确认';
      task.blockedFor = task.blockedFor || '刚刚';
    } else {
      delete task.blocker;
      delete task.blockedFor;
    }
    renderAll();
    showToast('任务已移至「' + status + '」', {
      icon: 'columns',
      action: '撤销',
      onAction: () => {
        task.status = previous;
        task.updated = '刚刚';
        renderAll();
      }
    });
  } else {
    const req = reqById(id);
    if (!req || req.status === status) {
      renderAll();
      return;
    }
    const previous = req.status;
    req.status = status;
    req.updated = '刚刚';
    renderAll();
    showToast('需求已移至「' + status + '」', {
      icon: 'layers',
      action: '撤销',
      onAction: () => {
        req.status = previous;
        req.updated = '刚刚';
        renderAll();
      }
    });
  }
});

document.addEventListener('dragend', () => {
  state.dragging = null;
  $$('.dragging').forEach(el => el.classList.remove('dragging'));
  $$('.drag-over').forEach(el => el.classList.remove('drag-over'));
  $$('.drop-target').forEach(el => el.classList.remove('drop-target'));
});

/* Keyboard behavior */
document.addEventListener('keydown', event => {
  const target = event.target;
  const typing = target instanceof HTMLElement &&
    (['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName) || target.isContentEditable);

  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    if (!state.search) openSearch();
    return;
  }

  if (event.key === 'Escape') {
    if (state.search) {
      closeSearch();
      return;
    }
    if (state.modal) {
      closeModal();
      return;
    }
    if (state.drawer) {
      closeDrawer();
      return;
    }
    if (state.composer) {
      closeComposer();
      return;
    }
  }

  if (event.target.id === 'search-input' && event.key === 'Enter') {
    event.preventDefault();
    const first = $('#search-results .palette-row');
    if (first) first.click();
    return;
  }

  if (!typing && !event.metaKey && !event.ctrlKey && !event.altKey && event.key.toLowerCase() === 'c') {
    if (!state.drawer && !state.modal && !state.search && !state.composer) {
      event.preventDefault();
      openComposer(state.tab === 'requirements' ? 'req' : 'task');
      return;
    }
  }

  if (!typing && (event.key === 'Enter' || event.key === ' ')) {
    const taskCard = target instanceof Element ? target.closest('[data-task]') : null;
    const reqCard = target instanceof Element ? target.closest('[data-req]') : null;
    if (taskCard && !target.closest('button, a')) {
      event.preventDefault();
      openTaskDrawer(taskCard.dataset.task);
      return;
    }
    if (reqCard && !target.closest('button, a')) {
      event.preventDefault();
      openReqDrawer(reqCard.dataset.req);
      return;
    }
  }
});

/* Boot */
renderAll();

</script>
</body>
</html>
