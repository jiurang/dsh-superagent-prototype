<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 任务画布</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329241c'/%3E%3Crect x='7' y='7' width='7' height='7' rx='2' fill='%23f6eee0'/%3E%3Crect x='18' y='7' width='7' height='7' rx='2' fill='%23a44d2c'/%3E%3Crect x='7' y='18' width='7' height='7' rx='2' fill='%23ceb28a'/%3E%3Crect x='18' y='18' width='7' height='7' rx='2' fill='%23746b5c'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   04 · Kanban / Canvas Workspace
   Warm neutral canvas · spatial task flow
   ========================================================================== */
:root {
  --canvas: #f2eee5;
  --canvas-deep: #eae4d8;
  --paper: #fdfbf6;
  --paper-2: #f7f2e9;
  --paper-3: #f1eadf;
  --ink: #29241c;
  --ink-2: #5d5547;
  --ink-3: #7e7565;
  --muted: #938977;
  --line: #e4dbcc;
  --line-strong: #d3c5b0;
  --line-faint: rgba(196, 181, 158, 0.42);
  --rust: #a44d2c;
  --rust-deep: #883b1f;
  --rust-soft: #f6e5dc;
  --ochre: #a3752c;
  --ochre-soft: #f6ead5;
  --slate: #3f6c85;
  --slate-soft: #e5eef2;
  --moss: #5a7751;
  --moss-soft: #e7eee1;
  --plum: #775a83;
  --plum-soft: #efe7f2;
  --brick: #a34434;
  --brick-soft: #f8e7e2;
  --gray-status: #7d7f6f;
  --gray-soft: #ebeae2;
  --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --shadow-card: 0 1px 1px rgba(66, 52, 31, 0.035), 0 6px 16px -15px rgba(66, 52, 31, 0.42);
  --shadow-card-hover: 0 2px 3px rgba(66, 52, 31, 0.05), 0 13px 26px -18px rgba(66, 52, 31, 0.5);
  --shadow-panel: 0 1px 2px rgba(55, 43, 26, 0.05), 0 14px 34px -26px rgba(55, 43, 26, 0.42);
  --shadow-float: 0 24px 70px -25px rgba(45, 35, 21, 0.5), 0 2px 8px rgba(45, 35, 21, 0.08);
}

* { box-sizing: border-box; }
html { min-width: 320px; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background-color: var(--canvas);
  background-image:
    radial-gradient(rgba(87, 71, 48, 0.055) 0.75px, transparent 0.8px),
    linear-gradient(180deg, rgba(255, 252, 245, 0.22), rgba(226, 217, 202, 0.1));
  background-size: 19px 19px, 100% 100%;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body.is-locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--rust);
  outline-offset: 2px;
}
input, select, textarea { outline: none; }
::selection { background: #ecd3c2; color: var(--ink); }
h1, h2, h3, p { margin: 0; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ── Top chrome ─────────────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 24px;
  height: 58px;
  padding: 0 24px;
  border-bottom: 1px solid rgba(147, 130, 103, 0.18);
  background: rgba(246, 242, 234, 0.9);
  backdrop-filter: blur(18px) saturate(1.12);
}
.brand { display: flex; align-items: center; gap: 9px; flex: none; min-width: 148px; }
.brand-mark {
  width: 27px; height: 27px; padding: 5px; border-radius: 8px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px;
  background: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.14);
}
.brand-mark i { display: block; border-radius: 1.5px; background: #f6eee0; }
.brand-mark i:nth-child(2) { background: var(--rust); }
.brand-mark i:nth-child(3) { background: #ceb28a; }
.brand-mark i:nth-child(4) { background: #746b5c; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 14.5px; font-weight: 600; line-height: 18px; letter-spacing: 0.015em; white-space: nowrap; }
.brand-sub {
  font-family: var(--mono);
  font-size: 9px; line-height: 12px; letter-spacing: 0.12em;
  color: var(--muted); white-space: nowrap;
}
.tabs { display: flex; align-self: stretch; gap: 1px; min-width: 0; }
.tab {
  position: relative;
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px;
  color: var(--ink-3);
  font-size: 13px;
  white-space: nowrap;
  transition: color 140ms ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"]::after {
  content: "";
  position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--rust);
}
.tab-badge {
  min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--rust-soft); color: var(--rust);
  font-size: 8.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.top-utils { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: none; }
.search-trigger {
  height: 30px; min-width: 144px;
  display: flex; align-items: center; gap: 7px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: rgba(253, 251, 246, 0.5);
  font-size: 11.5px;
  transition: border-color 140ms ease, background 140ms ease;
}
.search-trigger:hover { border-color: var(--line-strong); background: var(--paper); color: var(--ink-2); }
.search-trigger .label { color: var(--muted); }
.search-trigger kbd {
  margin-left: auto;
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.45);
  font-family: var(--mono); font-size: 8.5px; line-height: 12px;
  color: var(--muted);
}
.sys-btn {
  height: 30px; display: flex; align-items: center; gap: 5px;
  padding: 0 8px; border-radius: 7px; color: var(--ink-2); font-size: 11.5px;
}
.sys-btn:hover { background: rgba(109, 91, 65, 0.075); color: var(--ink); }
.top-divider { width: 1px; height: 17px; margin: 0 3px; background: var(--line); }
.avatar {
  flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: var(--p-bg, #efe7da);
  color: var(--p-tone, #6e6455);
  font-size: 8.5px; font-weight: 600; line-height: 1;
  letter-spacing: -0.02em;
  box-shadow: inset 0 0 0 1px rgba(90, 74, 51, 0.06);
}
.avatar.md { width: 22px; height: 22px; font-size: 10px; }
.avatar.lg { width: 28px; height: 28px; font-size: 11px; }
.avatar.xl { width: 32px; height: 32px; font-size: 12px; }
.profile { margin-left: 3px; border-radius: 50%; }

/* ── Project scope bar ─────────────────────────────────────────────────── */
.projectbar {
  position: sticky; top: 58px; z-index: 25;
  height: 48px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 24px;
  border-bottom: 1px solid rgba(147, 130, 103, 0.16);
  background: rgba(242, 238, 229, 0.86);
  backdrop-filter: blur(16px);
}
.scope-label {
  flex: none;
  font-size: 9px; line-height: 12px; letter-spacing: 0.16em;
  color: var(--muted); font-weight: 600;
}
.project-pills { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.project-pills::-webkit-scrollbar { display: none; }
.project-pill {
  height: 30px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px;
  border: 1px solid transparent; border-radius: 8px;
  color: var(--ink-3);
  font-size: 11.5px;
  white-space: nowrap;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
}
.project-pill:hover { background: rgba(255, 252, 246, 0.52); color: var(--ink); }
.project-pill.active {
  background: var(--paper);
  border-color: var(--line-strong);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(65, 51, 31, 0.07);
}
.project-pill .p-code { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.025em; }
.project-pill .p-name { color: var(--muted); font-size: 11px; }
.project-pill.active .p-name { color: var(--ink-2); }
.project-pill .p-count {
  min-width: 15px; padding: 0 4px; border-radius: 5px;
  background: var(--paper-3); color: var(--muted);
  font-family: var(--mono); font-size: 9px; line-height: 15px; text-align: center;
}
.project-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--rust)); flex: none; }
.scope-side { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.executor-status {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 10.5px; white-space: nowrap;
}
.executor-status b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--moss); box-shadow: 0 0 0 3px rgba(90, 119, 81, 0.12); }
.scope-divider { width: 1px; height: 14px; background: var(--line-strong); opacity: 0.8; }
.scope-link {
  display: flex; align-items: center; gap: 4px;
  color: var(--ink-3); font-size: 11px; padding: 4px 2px; border-radius: 5px;
}
.scope-link:hover { color: var(--ink); }
.scope-link:disabled { color: var(--muted); opacity: 0.5; cursor: not-allowed; }

/* ── Page frame ────────────────────────────────────────────────────────── */
.main { min-height: calc(100vh - 106px); }
.page { max-width: 1440px; margin: 0 auto; padding: 20px 24px 104px; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  margin-bottom: 14px;
}
.page-title-wrap { min-width: 0; }
.crumbs {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 10px; line-height: 15px;
  margin-bottom: 4px;
}
.crumbs .crumb-project { color: var(--ink-2); font-weight: 500; }
.crumbs svg { opacity: 0.65; }
.page-head h1 {
  font-size: 24px; line-height: 31px; font-weight: 600; letter-spacing: -0.025em;
  display: flex; align-items: center; gap: 10px;
}
.page-head .subtitle {
  margin-top: 3px;
  color: var(--muted); font-size: 12px; line-height: 18px;
}
.page-head .subtitle b { color: var(--ink-2); font-weight: 500; }
.head-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
.head-tools { display: flex; align-items: center; gap: 6px; }

/* Buttons */
.btn {
  height: 31px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 0 11px;
  border: 1px solid transparent; border-radius: 7px;
  color: var(--ink-2);
  font-size: 12px; font-weight: 500; line-height: 16px;
  white-space: nowrap;
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
}
.btn:hover { background: rgba(255, 252, 246, 0.7); color: var(--ink); }
.btn.primary {
  background: var(--rust); border-color: var(--rust); color: #fff9f2;
  box-shadow: 0 1px 1px rgba(94, 45, 23, 0.16), 0 5px 12px -8px rgba(94, 45, 23, 0.55);
}
.btn.primary:hover { background: var(--rust-deep); border-color: var(--rust-deep); color: #fff; }
.btn.outline { border-color: var(--line-strong); background: rgba(253, 251, 246, 0.5); }
.btn.outline:hover { background: var(--paper); border-color: #c6b7a0; }
.btn.ghost { color: var(--ink-3); }
.btn.ghost:hover { background: rgba(109, 91, 65, 0.075); color: var(--ink); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 11px; gap: 4px; border-radius: 6px; }
.btn[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: #fbf5ea;
}
.btn.danger { background: var(--brick); border-color: var(--brick); color: #fff9f5; }
.btn.danger:hover { background: #8e3528; border-color: #8e3528; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 7px;
  color: var(--ink-3);
  transition: background 120ms ease, color 120ms ease;
}
.icon-btn:hover { background: rgba(109, 91, 65, 0.08); color: var(--ink); }
.icon-btn.danger:hover { background: var(--brick-soft); color: var(--brick); }
.link-btn {
  display: inline-flex; align-items: center; gap: 3px;
  color: var(--ink-3); font-size: 10.5px;
}
.link-btn:hover { color: var(--rust); }

.segmented {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px;
  border: 1px solid rgba(191, 175, 151, 0.42);
  border-radius: 8px;
  background: rgba(230, 222, 209, 0.72);
}
.segmented button {
  height: 26px; padding: 0 10px; border-radius: 6px;
  color: var(--ink-3); font-size: 11px; line-height: 15px; white-space: nowrap;
}
.segmented button:hover { color: var(--ink); }
.segmented button.active {
  background: var(--paper); color: var(--ink); font-weight: 500;
  box-shadow: 0 1px 2px rgba(65, 51, 31, 0.09);
}
.segmented.tiny button { height: 22px; padding: 0 7px; font-size: 9.5px; }

/* ── Overview strip ────────────────────────────────────────────────────── */
.overview {
  position: relative;
  display: flex; align-items: stretch;
  min-height: 58px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  box-shadow: var(--shadow-panel);
  overflow: hidden;
}
.overview::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(var(--rust), #c1945d);
}
.ov-label {
  flex: none; min-width: 100px;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 0 14px 0 16px;
}
.ov-label small {
  font-size: 9px; line-height: 12px; letter-spacing: 0.13em;
  color: var(--muted); font-weight: 600;
}
.ov-label span { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.ov-stat {
  flex: none;
  min-width: 92px;
  display: flex; flex-direction: column; justify-content: center; gap: 0;
  padding: 0 14px;
  border-left: 1px solid var(--line-faint);
}
.ov-k { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); white-space: nowrap; }
.ov-k i { width: 5px; height: 5px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.ov-v {
  color: var(--ink); font-size: 20px; line-height: 24px; font-weight: 600;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.ov-v em { margin-left: 4px; font-size: 9px; font-weight: 400; font-style: normal; color: var(--muted); letter-spacing: 0; }
.ov-progress {
  margin-left: auto; flex: none; min-width: 166px;
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
  padding: 0 14px;
  border-left: 1px solid var(--line-faint);
}
.progress-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--muted); }
.progress-line b { color: var(--ink-2); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg-progress { display: flex; gap: 2px; height: 4px; }
.seg-progress i { flex: 1; min-width: 3px; border-radius: 2px; background: #e9e1d4; }
.seg-progress i.on { background: var(--moss); }
.seg-progress i.warm { background: var(--ochre); }
.ov-link {
  flex: none;
  display: flex; align-items: center; gap: 4px;
  padding: 0 14px;
  border-left: 1px solid var(--line-faint);
  color: var(--ink-2); font-size: 10.5px; white-space: nowrap;
}
.ov-link:hover { color: var(--rust); }

/* ── Board toolbar ─────────────────────────────────────────────────────── */
.board-toolbar { display: flex; align-items: center; gap: 10px; min-height: 30px; margin: 0 0 9px; }
.filter-chips { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.filter-chip {
  height: 25px; padding: 0 9px; border: 1px solid transparent; border-radius: 6px;
  color: var(--muted); font-size: 10.5px; line-height: 15px; white-space: nowrap;
}
.filter-chip:hover { color: var(--ink-2); background: rgba(255, 252, 246, 0.5); }
.filter-chip.active {
  background: var(--paper); border-color: var(--line); color: var(--ink);
  font-weight: 500; box-shadow: 0 1px 1px rgba(65, 51, 31, 0.05);
}
.toolbar-sep { width: 1px; height: 13px; background: var(--line); margin: 0 3px; }
.toolbar-note {
  display: flex; align-items: center; gap: 5px;
  margin-left: auto;
  color: var(--muted); font-size: 10px; white-space: nowrap;
}
.toolbar-note b { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.board-nav { display: flex; align-items: center; gap: 1px; padding-left: 4px; }
.board-nav .icon-btn { width: 24px; height: 24px; border-radius: 5px; }

/* ── Board ─────────────────────────────────────────────────────────────── */
.board-wrap { position: relative; margin: 0 -3px; }
.board-empty {
  flex: 1 0 100%;
  min-height: 390px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 7px;
  padding: 36px 24px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  background: rgba(253, 251, 246, 0.36);
  text-align: center;
}
.board-empty .be-ico {
  width: 44px; height: 44px; margin-bottom: 4px;
  display: grid; place-items: center;
  border-radius: 13px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: #a99880;
  box-shadow: var(--shadow-card);
}
.board-empty h2 { color: var(--ink-2); font-size: 14px; line-height: 20px; font-weight: 600; }
.board-empty p { max-width: 380px; margin: 0; color: var(--muted); font-size: 10.5px; line-height: 16px; }
.board-empty .be-actions { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
.board {
  display: flex; align-items: stretch; gap: 9px;
  min-height: 428px;
  padding: 2px 3px 9px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: #cfc1ab transparent;
}
.board::-webkit-scrollbar { height: 8px; }
.board::-webkit-scrollbar-track { background: transparent; }
.board::-webkit-scrollbar-thumb {
  background: #d3c6b2; border-radius: 8px;
  border: 2px solid transparent; background-clip: content-box;
}
.column {
  flex: 1 1 0;
  min-width: 180px;
  display: flex; flex-direction: column;
  position: relative;
  padding: 0 7px 7px;
  border: 1px solid var(--line-faint);
  border-radius: 11px;
  background: rgba(251, 248, 242, 0.42);
  transition: background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
}
.column::before {
  content: ""; position: absolute; top: 0; left: 8px; right: 8px; height: 2px;
  border-radius: 0 0 2px 2px;
  background: var(--status, var(--line-strong));
  opacity: 0.78;
}
.column.drop-target {
  border-color: var(--status);
  background: color-mix(in srgb, var(--soft) 58%, transparent);
  box-shadow: inset 0 0 0 1px var(--status);
}
.col-head { display: flex; align-items: center; gap: 5px; padding: 13px 4px 9px; min-height: 39px; }
.col-title { display: flex; align-items: center; gap: 5px; min-width: 0; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status); flex: none; }
.col-title h2 {
  font-size: 11.5px; line-height: 16px; font-weight: 600; letter-spacing: 0.025em;
  color: var(--ink-2); white-space: nowrap; margin: 0;
}
.col-count {
  min-width: 17px; padding: 0 4px; border-radius: 5px;
  background: rgba(235, 227, 214, 0.78);
  color: var(--muted); font-family: var(--mono); font-size: 9px; line-height: 16px;
  text-align: center; font-variant-numeric: tabular-nums;
}
.col-head .col-tools { margin-left: auto; display: flex; opacity: 0; transition: opacity 120ms ease; }
.column:hover .col-tools, .col-tools:focus-within { opacity: 1; }
.col-head .icon-btn { width: 20px; height: 20px; border-radius: 5px; }
.col-body {
  flex: 1;
  display: flex; flex-direction: column; gap: 7px;
  min-height: 80px;
  padding: 1px;
  border-radius: 8px;
  transition: background 120ms ease;
}
.col-body.drag-over {
  background: color-mix(in srgb, var(--soft) 44%, transparent);
  box-shadow: inset 0 0 0 1px var(--status);
}
.lane { display: flex; flex-direction: column; gap: 7px; padding-top: 8px; border-top: 1px solid var(--line-faint); }
.lane:first-child { padding-top: 0; border-top: 0; }
.lane-head {
  display: flex; align-items: center; gap: 4px;
  padding: 0 3px;
  color: var(--muted); font-size: 9.5px; line-height: 14px;
  min-width: 0;
}
.lane-head .lane-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink-3); font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.03em;
}
.lane-head .lane-count { margin-left: auto; font-family: var(--mono); font-size: 9px; }
.lane-empty {
  padding: 5px 6px;
  border: 1px dashed rgba(196, 181, 158, 0.55);
  border-radius: 6px;
  color: var(--muted); font-size: 9px; line-height: 13px;
}
.col-ghost {
  height: 27px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  margin-top: 1px;
  border: 1px dashed transparent; border-radius: 6px;
  color: var(--muted); font-size: 9.5px;
  opacity: 0;
  transition: opacity 120ms ease, border-color 120ms ease, background 120ms ease;
}
.column:hover .col-ghost, .col-ghost:focus-visible { opacity: 1; }
.col-ghost:hover { border-color: var(--line-strong); background: rgba(255, 252, 246, 0.45); color: var(--ink-2); }

/* Cards */
.card {
  position: relative;
  padding: 10px 11px 9px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  box-shadow: var(--shadow-card);
  cursor: grab;
  transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--prio-color, transparent);
}
.card[data-priority="P0"] { --prio-color: var(--brick); }
.card[data-priority="P1"] { --prio-color: rgba(163, 117, 44, 0.72); }
.card:hover { border-color: #d7c9b5; box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.36; transform: rotate(1.2deg) scale(0.99); }
.card.new-card { animation: cardIn 2.6s ease both; }
@keyframes cardIn {
  0% { box-shadow: 0 0 0 2px rgba(164, 77, 44, 0.4), var(--shadow-card); }
  100% { box-shadow: var(--shadow-card); }
}
.card-top { display: flex; align-items: center; gap: 4px; min-height: 17px; margin-bottom: 6px; }
.prio {
  display: inline-flex; align-items: center;
  padding: 0 5px; border-radius: 4px;
  font-family: var(--mono); font-size: 9px; line-height: 15px; font-weight: 700; letter-spacing: 0.035em;
}
.prio.p0 { background: var(--brick-soft); color: var(--brick); }
.prio.p1 { background: var(--ochre-soft); color: #8e6220; }
.prio.p2 { background: var(--slate-soft); color: var(--slate); }
.prio.p3 { background: var(--gray-soft); color: #6d7062; }
.type-chip {
  display: inline-flex; align-items: center;
  padding: 0 4px; border: 1px solid var(--line); border-radius: 4px;
  color: var(--ink-3); font-size: 9px; line-height: 14px;
}
.card-grip { margin-left: auto; color: #b8aa95; opacity: 0; transition: opacity 120ms ease; }
.card:hover .card-grip, .card:focus-visible .card-grip { opacity: 1; }
.auto-mark { display: inline-flex; color: #aa9a80; }
.card-title {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -0.005em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.card-req {
  display: flex; align-items: center; gap: 4px;
  min-width: 0; margin: 0 0 8px;
  color: var(--muted); font-size: 9.5px; line-height: 14px;
}
.card-req .seq {
  padding: 0 3px;
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--paper-2); color: var(--ink-3);
  font-family: var(--mono); font-size: 8.5px; line-height: 13px; flex: none;
}
.card-req .rq-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-foot { display: flex; align-items: center; gap: 4px; min-width: 0; color: var(--muted); font-size: 9.5px; line-height: 14px; }
.owner { display: flex; align-items: center; gap: 3px; color: var(--ink-3); min-width: 0; white-space: nowrap; }
.owner .avatar { width: 16px; height: 16px; font-size: 8px; }
.card-foot .time { margin-left: auto; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.block-reason {
  display: flex; align-items: center; gap: 4px;
  margin: 7px 0 0; padding: 4px 6px;
  border-radius: 5px;
  background: var(--brick-soft);
  color: #8b3a2c; font-size: 9px; line-height: 13px;
}
.block-reason .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.block-reason em { margin-left: auto; color: #a46f63; font-style: normal; white-space: nowrap; }
.project-flag {
  display: flex; align-items: center; gap: 4px;
  margin: 0 0 5px; color: var(--muted); font-size: 8.5px; line-height: 11px;
}
.project-flag i { width: 4px; height: 4px; border-radius: 50%; background: var(--c); flex: none; }
.project-flag b { font-family: var(--mono); font-weight: 600; font-size: 8px; letter-spacing: 0.03em; color: var(--ink-3); }

/* Requirement cards */
.req-card { padding-top: 11px; }
.req-card .card-top { margin-bottom: 7px; }
.req-seq { font-family: var(--mono); font-size: 9.5px; line-height: 15px; color: var(--muted); }
.req-title {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 13px; line-height: 18.5px; font-weight: 600; letter-spacing: -0.005em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.req-source {
  display: flex; align-items: center; gap: 4px;
  min-width: 0; margin: 0 0 9px;
  color: var(--muted); font-size: 9.5px; line-height: 13px;
}
.req-source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-dots { display: flex; gap: 2px; height: 4px; margin: 0 0 6px; }
.task-dots i { flex: 1; min-width: 3px; border-radius: 2px; background: #eae1d3; }
.task-dots i[data-s="完成"] { background: var(--moss); }
.task-dots i[data-s="进行中"] { background: var(--slate); }
.task-dots i[data-s="评审"] { background: var(--ochre); }
.task-dots i[data-s="待验收"] { background: var(--plum); }
.task-dots i[data-s="阻塞"] { background: var(--brick); }
.task-dots i[data-s="就绪"] { background: #b5b2a2; }
.req-progress-meta {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-bottom: 7px;
  color: var(--muted); font-size: 9.5px; line-height: 13px; white-space: nowrap;
}
.req-progress-meta b { color: var(--ink-3); font-weight: 500; }
.req-unsplit {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-bottom: 7px; padding: 5px 6px;
  border: 1px dashed var(--line-strong); border-radius: 5px;
  color: var(--muted); font-size: 9.5px; line-height: 13px;
}
.req-unsplit span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req-unsplit svg { color: #b2a48f; }
.req-card.is-closed { opacity: 0.76; }
.req-card.is-closed .req-title { color: var(--ink-2); }

/* Column empty states */
.col-empty {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 22px 8px;
  border: 1px dashed rgba(196, 181, 158, 0.66); border-radius: 8px;
  text-align: center;
}
.empty-ico {
  width: 28px; height: 28px; margin-bottom: 1px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: rgba(255, 252, 246, 0.62);
  color: #ab9d87;
}
.col-empty b { color: var(--ink-3); font-size: 10.5px; line-height: 15px; font-weight: 500; }
.col-empty p { margin: 0; color: var(--muted); font-size: 9.5px; line-height: 14px; max-width: 150px; }
.col-empty button {
  margin-top: 2px;
  color: var(--ink-3); font-size: 9.5px; line-height: 14px; text-decoration: underline; text-underline-offset: 3px;
}
.col-empty button:hover { color: var(--rust); }

/* ── Generic panels and pages ──────────────────────────────────────────── */
.panel {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  box-shadow: var(--shadow-panel);
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px 11px;
  border-bottom: 1px solid var(--line-faint);
}
.panel-head h2 { font-size: 12px; line-height: 17px; font-weight: 600; color: var(--ink-2); }
.panel-head .head-note { color: var(--muted); font-size: 9.5px; }
.panel-body { padding: 14px 15px; }
.section-kicker {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 9px; line-height: 13px; letter-spacing: 0.1em; font-weight: 600;
}
.text-muted { color: var(--muted); }
.click-row { transition: background 120ms ease; }
.click-row:hover { background: rgba(246, 240, 230, 0.6); }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 19px; padding: 0 6px; border-radius: 4px;
  font-size: 9.5px; line-height: 15px; white-space: nowrap;
}
.tag.neutral { background: var(--paper-3); color: var(--ink-3); }
.tag.outline { border: 1px solid var(--line); color: var(--ink-3); }
.tag.success { background: var(--moss-soft); color: var(--moss); }
.tag.info { background: var(--slate-soft); color: var(--slate); }
.tag.warning { background: var(--ochre-soft); color: var(--ochre); }
.tag.danger { background: var(--brick-soft); color: var(--brick); }
.tag.plum { background: var(--plum-soft); color: var(--plum); }
.tag.quiet { color: var(--muted); }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 4px;
  background: rgba(255, 255, 255, 0.36);
  font-family: var(--mono); font-size: 8px; color: var(--muted);
}

/* Overview page */
.overview-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(276px, 0.75fr); gap: 12px; align-items: start; }
.attention-list { display: flex; flex-direction: column; }
.attention-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 15px;
  border-bottom: 1px solid var(--line-faint);
}
.attention-row:last-child { border-bottom: 0; }
.att-icon {
  width: 28px; height: 28px; flex: none;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--soft, var(--paper-3));
  color: var(--tone, var(--ink-3));
}
.att-main { flex: 1; min-width: 0; }
.att-label { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; color: var(--tone, var(--muted)); font-size: 9.5px; line-height: 13px; font-weight: 600; }
.att-title { color: var(--ink); font-size: 12.5px; line-height: 18px; font-weight: 500; }
.att-meta { margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 14px; }
.att-side { display: flex; align-items: center; gap: 6px; align-self: center; flex: none; }
.insight-stack { display: flex; flex-direction: column; gap: 12px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-box { padding: 10px 11px; border: 1px solid var(--line-faint); border-radius: 8px; background: rgba(250, 246, 238, 0.55); }
.stat-box small { display: block; color: var(--muted); font-size: 9px; line-height: 13px; }
.stat-box b { display: block; margin-top: 2px; color: var(--ink); font-size: 18px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-box em { font-style: normal; color: var(--muted); font-size: 8.5px; margin-left: 3px; }
.sparkbars { display: flex; align-items: flex-end; gap: 4px; height: 54px; margin-top: 12px; }
.sparkbars i { flex: 1; min-width: 3px; border-radius: 2px 2px 0 0; background: #ded2bf; }
.sparkbars i.hot { background: var(--rust); opacity: 0.82; }
.spark-legend { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: 8.5px; }
.focus-row {
  display: flex; align-items: center; gap: 6px;
  width: 100%; padding: 6px 0; border-bottom: 1px solid var(--line-faint);
  color: var(--ink-2); font-size: 9.5px; line-height: 14px; text-align: left;
}
.focus-row:last-child { border-bottom: 0; }
.focus-row:hover .fr-title { color: var(--rust); }
.focus-row-dot { width: 5px; height: 5px; border-radius: 50%; flex: none; background: var(--c, var(--moss)); }
.focus-row .fr-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-row .fr-count { flex: none; color: var(--muted); font-family: var(--mono); font-size: 8.5px; }
.lower-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 12px; margin-top: 12px; }
.project-mini-list { display: flex; flex-direction: column; gap: 7px; }
.project-mini {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px;
  border: 1px solid var(--line-faint); border-radius: 8px;
  background: rgba(250, 246, 238, 0.42);
  text-align: left;
}
.project-mini:hover { border-color: var(--line-strong); background: rgba(255, 252, 246, 0.72); }
.project-mini .pm-main { flex: 1; min-width: 0; }
.project-mini .pm-code { display: block; font-family: var(--mono); font-size: 9px; line-height: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.03em; }
.project-mini .pm-name { display: block; margin-top: 1px; color: var(--ink); font-size: 11.5px; line-height: 16px; font-weight: 500; }
.project-mini .pm-meta { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; line-height: 13px; }
.project-mini .pm-stat { color: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.role-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 4px;
  background: var(--moss-soft); color: var(--moss);
  font-size: 9px; line-height: 14px; font-weight: 500;
}
.dt-count { color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 400; }
.activity-list { display: flex; flex-direction: column; }
.activity-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.activity-columns .activity-row:last-child { border-bottom: 0; }
.activity-row { display: flex; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line-faint); }
.activity-row:last-child { border-bottom: 0; }
.activity-dot { width: 6px; height: 6px; margin-top: 5px; border-radius: 50%; background: var(--c, var(--line-strong)); flex: none; }
.activity-main { flex: 1; min-width: 0; font-size: 10.5px; line-height: 15px; color: var(--ink-2); }
.activity-main b { font-weight: 500; color: var(--ink); }
.activity-time { margin-top: 2px; color: var(--muted); font-size: 9px; }

/* Projects page */
.project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.project-card {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 17px 17px 13px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--paper); box-shadow: var(--shadow-panel);
}
.project-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--pc, var(--rust)); opacity: 0.85; }
.pc-top { display: flex; align-items: flex-start; gap: 10px; }
.pc-glyph {
  width: 35px; height: 35px; flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  background: var(--pc-soft, var(--rust-soft));
  color: var(--pc, var(--rust));
  font-family: var(--mono); font-size: 11px; font-weight: 700;
}
.pc-title { flex: 1; min-width: 0; }
.pc-code { font-family: var(--mono); font-size: 9.5px; line-height: 13px; color: var(--muted); letter-spacing: 0.04em; }
.pc-name { margin-top: 1px; color: var(--ink); font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.015em; }
.pc-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pc-desc { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 16px; }
.pc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; padding: 10px 0; border-top: 1px solid var(--line-faint); border-bottom: 1px solid var(--line-faint); }
.pc-stat small { display: block; color: var(--muted); font-size: 9px; line-height: 12px; }
.pc-stat b { display: block; margin-top: 2px; color: var(--ink); font-size: 15px; line-height: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pc-stat b.danger { color: var(--brick); }
.pc-foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
.pc-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-family: var(--mono); font-size: 9px; }
.pc-avatars { display: flex; }
.pc-avatars .avatar + .avatar { margin-left: -4px; box-shadow: 0 0 0 1.5px var(--paper); }
.pc-actions { display: flex; gap: 5px; flex: none; }
.system-band {
  display: flex; align-items: center; gap: 11px;
  margin-top: 14px; padding: 12px 14px;
  border: 1px dashed var(--line-strong); border-radius: 10px;
  background: rgba(255, 252, 246, 0.3);
}
.system-band .sb-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: rgba(109, 91, 65, 0.08); color: var(--ink-3); }
.system-band .sb-main { flex: 1; min-width: 0; }
.system-band b { display: block; color: var(--ink-2); font-size: 11px; line-height: 16px; font-weight: 600; }
.system-band p { margin-top: 2px; color: var(--muted); font-size: 9.5px; line-height: 14px; }

/* Inbox / memory split views */
.split-view { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(292px, 0.75fr); gap: 12px; align-items: start; }
.inbox-list { display: flex; flex-direction: column; }
.inbox-row { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line-faint); }
.inbox-row:last-child { border-bottom: 0; }
.channel-icon {
  width: 27px; height: 27px; flex: none;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--paper-3); color: var(--ink-3);
}
.inbox-main { flex: 1; min-width: 0; }
.inbox-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink); font-size: 11.5px; line-height: 16px; }
.inbox-top b { font-weight: 500; }
.inbox-snippet { margin-top: 4px; color: var(--ink-2); font-size: 10.5px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.inbox-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 5px; color: var(--muted); font-size: 9px; }
.inbox-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.inbox-actions { display: flex; gap: 3px; }
.manual-form .field { margin-top: 10px; }
.manual-form .field:first-child { margin-top: 0; }
.form-hint { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 13px; }
.memory-list { display: flex; flex-direction: column; }
.memory-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--line-faint); }
.memory-row:last-child { border-bottom: 0; }
.memory-main { flex: 1; min-width: 0; }
.memory-title { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--ink); font-size: 11.5px; line-height: 16px; font-weight: 500; }
.memory-content { margin-top: 3px; color: var(--ink-2); font-size: 10.5px; line-height: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.memory-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 5px; color: var(--muted); font-size: 9px; }
.tag-list { display: flex; gap: 3px; flex-wrap: wrap; }
.memory-side { flex: none; display: flex; gap: 2px; }
.health-list { display: flex; flex-direction: column; gap: 8px; }
.health-row { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 9.5px; }
.health-row .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
.health-row .bar i { display: block; height: 100%; border-radius: 2px; background: var(--moss); }
.health-row b { width: 30px; text-align: right; color: var(--muted); font-weight: 500; font-size: 8.5px; font-variant-numeric: tabular-nums; }

/* Reviews page */
.review-summary { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 13px 16px; margin-bottom: 12px; }
.review-summary .rs-item { display: flex; align-items: baseline; gap: 5px; color: var(--muted); font-size: 9.5px; }
.review-summary .rs-item b { color: var(--ink); font-size: 17px; line-height: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
.review-list { display: flex; flex-direction: column; }
.review-row { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line-faint); }
.review-row:last-child { border-bottom: 0; }
.review-decision { flex: none; width: 56px; }
.review-main { flex: 1; min-width: 0; }
.review-task { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; line-height: 16px; color: var(--ink); }
.review-task button { color: var(--ink); font-size: 11.5px; font-weight: 500; text-align: left; }
.review-task button:hover { color: var(--rust); text-decoration: underline; text-underline-offset: 2px; }
.review-comment { margin-top: 4px; color: var(--ink-2); font-size: 10.5px; line-height: 15px; }
.review-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 9px; }
.review-side { flex: none; align-self: center; }

/* ── Drawer / inspector ────────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(40, 33, 23, 0.3);
  backdrop-filter: blur(1.5px) saturate(0.95);
  animation: fadeIn 160ms ease both;
}
.drawer {
  position: fixed; z-index: 41;
  top: 10px; right: 10px; bottom: 10px;
  width: min(438px, calc(100vw - 20px));
  display: flex; flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(186, 170, 145, 0.75);
  border-radius: 15px;
  background: var(--paper);
  box-shadow: -20px 22px 80px -28px rgba(42, 33, 20, 0.62), 0 2px 8px rgba(42, 33, 20, 0.08);
  animation: drawerIn 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes drawerIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.drawer-head {
  flex: none;
  min-height: 49px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 15px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(247, 242, 233, 0.9), rgba(253, 251, 246, 0.5));
}
.drawer-crumbs { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; }
.drawer-crumbs > span { color: var(--muted); font-size: 9px; }
.drawer-crumbs button { color: var(--ink-2); font-size: 9.5px; line-height: 14px; }
.drawer-crumbs button:hover { color: var(--rust); }
.drawer-crumbs .dc-req { font-family: var(--mono); font-size: 9px; }
.drawer-crumbs .dc-current { max-width: 142px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 9px; }
.drawer-tools { margin-left: auto; display: flex; align-items: center; gap: 1px; flex: none; }
.drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 18px 26px; scrollbar-width: thin; }
.drawer-body::-webkit-scrollbar { width: 6px; }
.drawer-body::-webkit-scrollbar-thumb { background: #d8ccba; border-radius: 6px; }
.drawer-foot {
  flex: none;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: rgba(248, 243, 234, 0.86);
}
.drawer-foot .foot-hint { flex: 1; min-width: 0; color: var(--muted); font-size: 9.5px; line-height: 13px; }
.drawer-foot .foot-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.drawer-title-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.drawer-title {
  margin: 9px 0 8px;
  color: var(--ink);
  font-size: 20px; line-height: 27px; font-weight: 600; letter-spacing: -0.022em;
  overflow-wrap: anywhere;
}
.drawer-sub { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--muted); font-size: 9.5px; line-height: 14px; }
.drawer-sub .owner { color: var(--ink-2); gap: 4px; }
.drawer-tabs {
  display: flex; align-items: center; gap: 16px;
  margin: 17px -18px 0;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
}
.drawer-tab {
  position: relative;
  height: 35px;
  display: flex; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11px; white-space: nowrap;
}
.drawer-tab:hover { color: var(--ink-2); }
.drawer-tab.active { color: var(--ink); font-weight: 500; }
.drawer-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px 2px 0 0; }
.drawer-tab .n {
  min-width: 15px; padding: 0 3px; border-radius: 4px;
  background: var(--paper-3); color: var(--muted);
  font-family: var(--mono); font-size: 8px; line-height: 14px; text-align: center;
}
.drawer-content { padding-top: 14px; display: flex; flex-direction: column; gap: 17px; }
.panel-block { display: flex; flex-direction: column; gap: 7px; }
.block-title {
  display: flex; align-items: center; gap: 6px;
  color: var(--ink-3); font-size: 9.5px; line-height: 13px; letter-spacing: 0.07em; font-weight: 600;
}
.block-title .n { color: var(--muted); font-family: var(--mono); font-weight: 400; font-size: 8.5px; letter-spacing: 0; }
.block-text { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.block-quote {
  margin: 0; padding: 9px 10px;
  border-left: 2px solid var(--line-strong);
  border-radius: 0 6px 6px 0;
  background: rgba(247, 242, 233, 0.6);
  color: var(--ink-2); font-size: 11px; line-height: 16.5px;
}
.acceptance-box { padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px; background: rgba(247, 242, 233, 0.56); color: var(--ink-2); font-size: 11.5px; line-height: 17px; }
.blocked-banner {
  display: flex; align-items: flex-start; gap: 7px;
  margin-top: 11px;
  padding: 9px 10px;
  border: 1px solid #e6c2b8; border-radius: 8px;
  background: #fbf0ec; color: #87392a;
  font-size: 10.5px; line-height: 15px;
}
.blocked-banner svg { margin-top: 1px; }
.blocked-banner b { font-weight: 600; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; }
.meta-cell { min-width: 0; }
.meta-cell small { display: block; color: var(--muted); font-size: 9px; line-height: 12px; letter-spacing: 0.04em; }
.meta-cell span { display: flex; align-items: center; gap: 4px; margin-top: 2px; color: var(--ink-2); font-size: 10.5px; line-height: 15px; overflow-wrap: anywhere; }
.meta-cell .mono { font-family: var(--mono); font-size: 9.5px; }
.attempt-list { display: flex; flex-direction: column; gap: 6px; }
.attempt { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
.attempt summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 9px 10px; }
.attempt summary::-webkit-details-marker { display: none; }
.attempt summary:hover { background: rgba(247, 242, 233, 0.48); }
.attempt[open] summary { border-bottom: 1px solid var(--line-faint); }
.attempt-index { font-family: var(--mono); font-size: 9px; color: var(--muted); flex: none; }
.attempt-badge { display: inline-flex; align-items: center; gap: 3px; padding: 0 5px; border-radius: 4px; font-size: 8.5px; line-height: 15px; font-weight: 500; }
.attempt-badge.running { background: var(--slate-soft); color: var(--slate); }
.attempt-badge.blocked { background: var(--ochre-soft); color: var(--ochre); }
.attempt-badge.failed { background: var(--brick-soft); color: var(--brick); }
.attempt-badge.ended { background: var(--moss-soft); color: var(--moss); }
.attempt-badge.cancelled { background: var(--paper-3); color: var(--muted); }
.attempt-stage { color: var(--ink-3); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attempt-time { margin-left: auto; color: var(--muted); font-size: 8.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.attempt-expand { color: var(--muted); transition: transform 120ms ease; }
.attempt[open] .attempt-expand { transform: rotate(180deg); }
.attempt-detail { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 5px 8px; padding: 9px 10px; font-size: 9.5px; line-height: 14px; }
.attempt-detail dt { color: var(--muted); }
.attempt-detail dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.attempt-note { color: var(--brick) !important; }
.session-pill { font-family: var(--mono); font-size: 8.5px; color: var(--ink-3); background: var(--paper-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.evidence-list { display: flex; flex-direction: column; gap: 6px; }
.evidence { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.evidence summary { list-style: none; display: flex; align-items: center; gap: 7px; padding: 9px; cursor: pointer; }
.evidence summary::-webkit-details-marker { display: none; }
.evidence summary:hover { background: rgba(247, 242, 233, 0.48); }
.evidence[open] summary { border-bottom: 1px solid var(--line-faint); }
.evidence-icon { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 5px; background: var(--paper-2); color: var(--ink-3); flex: none; }
.evidence-main { flex: 1; min-width: 0; }
.evidence-title { color: var(--ink-2); font-size: 10px; line-height: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evidence-meta { margin-top: 1px; color: var(--muted); font-size: 8.5px; line-height: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evidence-chevron { color: var(--muted); }
.evidence-preview {
  margin: 0; padding: 9px 10px;
  background: #f6f1e7;
  color: var(--ink-2); font-family: var(--mono); font-size: 9px; line-height: 14px;
  white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 180px; overflow: auto;
}
.review-list-mini { display: flex; flex-direction: column; gap: 6px; }
.review-mini { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.review-mini-head { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 8.5px; }
.review-mini-head b { color: var(--ink-2); font-weight: 500; font-size: 9.5px; }
.review-mini p { margin: 6px 0 0; color: var(--ink-2); font-size: 10.5px; line-height: 15px; }
.review-form { margin-top: 4px; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: rgba(247, 242, 233, 0.5); }
.review-form .field { margin-top: 9px; }
.review-form .field:first-child { margin-top: 0; }
.radio-seg { display: flex; gap: 3px; padding: 2px; border-radius: 6px; background: var(--canvas-deep); }
.radio-seg label { flex: 1; }
.radio-seg input { position: absolute; opacity: 0; pointer-events: none; }
.radio-seg span { display: flex; align-items: center; justify-content: center; height: 26px; border-radius: 5px; color: var(--muted); font-size: 9.5px; cursor: pointer; }
.radio-seg input:checked + span { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(65, 51, 31, 0.09); }
.radio-seg input:focus-visible + span { outline: 2px solid var(--rust); outline-offset: 1px; }
.task-mini-list { display: flex; flex-direction: column; }
.task-mini { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--line-faint); width: 100%; text-align: left; }
.task-mini:last-child { border-bottom: 0; }
.task-mini:hover { color: var(--rust); }
.task-mini .tm-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--c, var(--line-strong)); flex: none; }
.task-mini .tm-main { flex: 1; min-width: 0; }
.task-mini .tm-title { color: var(--ink-2); font-size: 10.5px; line-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-mini .tm-meta { margin-top: 1px; color: var(--muted); font-size: 8.5px; line-height: 12px; }
.task-mini .tm-arrow { color: #b8aa95; flex: none; }
.task-mini:hover .tm-title { color: var(--rust); }
.activity-timeline { display: flex; flex-direction: column; position: relative; margin-left: 2px; padding-left: 13px; border-left: 1px solid var(--line); }
.timeline-item { position: relative; padding: 0 0 12px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before { content: ""; position: absolute; left: -17px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--c, var(--line-strong)); box-shadow: 0 0 0 2px var(--paper); }
.timeline-title { color: var(--ink-2); font-size: 10.5px; line-height: 15px; }
.timeline-title b { color: var(--ink); font-weight: 500; }
.timeline-time { margin-top: 1px; color: var(--muted); font-size: 8.5px; }
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  padding: 23px 14px;
  border: 1px dashed var(--line-strong); border-radius: 8px;
  text-align: center;
}
.empty-state .es-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--paper-2); color: #ab9d87; margin-bottom: 2px; }
.empty-state b { color: var(--ink-3); font-size: 11px; line-height: 16px; font-weight: 500; }
.empty-state p { margin: 0; max-width: 255px; color: var(--muted); font-size: 10px; line-height: 15px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 0; }
.section-heading h2 { font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.split-context {
  display: flex; flex-direction: column; gap: 3px;
  margin-bottom: 14px; padding: 10px 11px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper-2);
}
.split-context small { color: var(--muted); font-size: 8.5px; line-height: 12px; letter-spacing: 0.05em; }
.split-context b { color: var(--ink); font-size: 12px; line-height: 17px; font-weight: 500; }
.split-context span { color: var(--muted); font-size: 9px; line-height: 13px; }
.split-note { color: var(--muted); font-size: 9.5px; line-height: 14px; margin-top: 5px; }
.split-form { display: flex; flex-direction: column; }
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; min-width: 0; }
.field:first-child { margin-top: 0; }
.field-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-3); font-size: 9px; line-height: 13px; }
.field-label em { font-style: normal; color: var(--muted); font-size: 8.5px; }
.input, .select, .textarea {
  width: 100%; min-width: 0;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: rgba(255, 253, 248, 0.62);
  color: var(--ink); font-size: 11px;
  transition: border-color 120ms ease, background 120ms ease;
}
.input, .select { height: 32px; padding: 0 9px; }
.select { padding-right: 22px; }
.textarea { min-height: 92px; padding: 8px 9px; line-height: 17px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: #aca08d; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--rust); background: var(--paper); outline: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.option-row { display: flex; flex-wrap: wrap; gap: 3px; }
.option {
  height: 25px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 5px;
  background: rgba(255, 253, 248, 0.4);
  color: var(--muted); font-size: 9.5px; line-height: 15px;
}
.option:hover { border-color: var(--line-strong); color: var(--ink-2); }
.option.active { border-color: var(--ink-2); background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 1px rgba(65, 51, 31, 0.05); }
.split-preview {
  margin-top: 10px; padding: 10px;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--paper-2);
}
.preview-head { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 9.5px; line-height: 13px; }
.preview-head b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.preview-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.preview-chip {
  max-width: 100%;
  padding: 2px 5px;
  border: 1px solid var(--line); border-radius: 4px;
  background: rgba(255, 253, 248, 0.6);
  color: var(--ink-2); font-size: 9px; line-height: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.preview-empty { color: var(--muted); font-size: 9px; line-height: 14px; }
.prose-warn {
  display: flex; gap: 5px;
  margin-top: 8px; padding: 7px 8px;
  border: 1px solid #e8d1a9; border-radius: 6px;
  background: #fbf2df; color: #8c6422;
  font-size: 9px; line-height: 14px;
}
.drawer-foot .btn.primary[disabled] { opacity: 0.42; }

/* ── Floating composer ─────────────────────────────────────────────────── */
.composer-dock {
  position: fixed; z-index: 35; right: 24px; bottom: 21px;
  display: flex; align-items: center; gap: 7px;
}
.dock-hint {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 7px;
  border: 1px solid rgba(196, 181, 158, 0.7); border-radius: 6px;
  background: rgba(251, 247, 239, 0.82);
  backdrop-filter: blur(8px);
  color: var(--muted); font-size: 9px;
}
.fab {
  height: 40px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 16px 0 11px;
  border: 1px solid rgba(117, 50, 27, 0.22); border-radius: 20px;
  background: var(--rust); color: #fff9f2;
  font-size: 11.5px; font-weight: 500;
  box-shadow: 0 2px 3px rgba(78, 36, 19, 0.14), 0 13px 28px -12px rgba(78, 36, 19, 0.62);
  transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}
.fab:hover { background: var(--rust-deep); transform: translateY(-1px); box-shadow: 0 3px 4px rgba(78, 36, 19, 0.16), 0 16px 32px -12px rgba(78, 36, 19, 0.68); }
.fab .fab-ico {
  width: 21px; height: 21px; display: grid; place-items: center;
  border-radius: 50%; background: rgba(255, 249, 242, 0.15);
}
.composer {
  position: fixed; z-index: 36; right: 24px; bottom: 73px;
  width: min(392px, calc(100vw - 32px));
  max-height: calc(100vh - 110px);
  overflow: auto;
  border: 1px solid var(--line-strong); border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--shadow-float);
  animation: composerIn 170ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes composerIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
.composer-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 8px 12px; border-bottom: 1px solid var(--line); background: rgba(247, 242, 233, 0.55); }
.composer-tabs { display: flex; gap: 2px; flex: 1; }
.composer-tab {
  height: 26px; padding: 0 9px; border-radius: 5px;
  color: var(--muted); font-size: 10.5px;
}
.composer-tab:hover { color: var(--ink-2); }
.composer-tab.active { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(65, 51, 31, 0.08); }
.composer-body { padding: 13px 14px 14px; }
.composer-body .field { margin-top: 10px; }
.composer-body .field:first-child { margin-top: 0; }
.composer-foot { display: flex; align-items: center; gap: 7px; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line-faint); }
.composer-foot .hint { flex: 1; color: var(--muted); font-size: 8.5px; line-height: 12px; }
.composer-foot .hint kbd { font-family: var(--mono); font-size: 8px; }
.composer-advanced {
  display: flex; align-items: center; gap: 4px;
  margin-top: 9px;
  color: var(--muted); font-size: 9px;
}
.composer-advanced:hover { color: var(--ink-2); }
.composer-error { margin-top: 8px; color: var(--brick); font-size: 9px; line-height: 13px; }

/* ── Modals / search / toasts ──────────────────────────────────────────── */
.modal-wrap {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px;
  overflow: auto;
  animation: fadeIn 140ms ease both;
}
.modal-wrap.centered { align-items: center; }
.modal-scrim { position: fixed; inset: 0; background: rgba(39, 31, 21, 0.36); backdrop-filter: blur(2px); }
.dialog {
  position: relative; z-index: 1;
  width: min(508px, 100%);
  margin: auto 0;
  padding: 18px 18px 16px;
  border: 1px solid var(--line-strong); border-radius: 14px;
  background: var(--paper);
  box-shadow: 0 32px 90px -28px rgba(42, 32, 18, 0.66), 0 2px 8px rgba(42, 32, 18, 0.1);
  animation: dialogIn 170ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

function normalizeFilter(nextTab) {
  const mode = nextTab === 'requirements' ? 'req' : 'task';
  const allowed = mode === 'req' ? ['all', 'mine', 'urgent', 'unsplit'] : ['all', 'mine', 'urgent', 'blocked'];
  if (!allowed.includes(state.filter)) state.filter = 'all';
}

function taskMatchesFilter(task) {
  if (state.filter === 'all') return true;
  if (state.filter === 'mine') return task.owner === 'lin';
  if (state.filter === 'urgent') return task.priority === 'P0' || task.priority === 'P1';
  if (state.filter === 'blocked') return task.status === '阻塞';
  return true;
}

function reqMatchesFilter(req) {
  if (state.filter === 'all') return true;
  if (state.filter === 'mine') return req.owner === 'lin';
  if (state.filter === 'urgent') return req.priority === 'P0' || req.priority === 'P1';
  if (state.filter === 'unsplit') return req.status === '待确认' || req.status === '已确认';
  return true;
}

function visibleTaskItems() {
  return liveTasks(state.project).filter(taskMatchesFilter);
}

function visibleReqItems() {
  return liveReqs(state.project).filter(reqMatchesFilter);
}

function nextReqSeq(projectId) {
  return Math.max(0, ...REQS.filter(item => item.project === projectId).map(item => item.seq)) + 1;
}

function newTaskId() {
  taskSeq += 1;
  return 't' + taskSeq;
}

/* Animation-friendly scroll preservation is handled by renderView. */
let toastId = 0;
function showToast(message, options = {}) {
  const root = $('#toasts');
  const item = document.createElement('div');
  item.className = 'toast';
  item.dataset.toast = String(++toastId);
  item.innerHTML = '<span class="toast-mark">' + icon(options.icon || 'check', 10) + '</span>' +
    '<span class="toast-msg">' + esc(message) + '</span>' +
    (options.action ? '<button type="button" class="undo">' + esc(options.action) + '</button>' : '') +
    '<button type="button" class="toast-x" aria-label="关闭提示">' + icon('close', 11) + '</button>';
  root.appendChild(item);
  let timer = window.setTimeout(() => {
    item.style.transition = 'opacity 160ms ease, transform 160ms ease';
    item.style.opacity = '0';
    item.style.transform = 'translateY(4px)';
    window.setTimeout(() => item.remove(), 180);
  }, options.duration || 4200);
  const dismiss = () => {
    window.clearTimeout(timer);
    item.remove();
  };
  $('.toast-x', item).addEventListener('click', dismiss);
  const undo = $('.undo', item);
  if (undo) undo.addEventListener('click', () => {
    if (typeof options.onAction === 'function') options.onAction();
    dismiss();
  });
}

function columnHTML(status, reqMode) {
  const meta = STATUS[status] || STATUS['就绪'];
  const allItems = (reqMode ? visibleReqItems() : visibleTaskItems()).filter(item => item.status === status);
  const items = sortByPriority(allItems);
  const lanes = isAllProjects() && state.lanes;
  const firstStatus = reqMode ? '待确认' : '就绪';
  let content;
  let total = items.length;

  if (lanes && total > 0) {
    content = PROJECTS.map(p => {
      const laneItems = items.filter(item => item.project === p.id);
      return '<div class="lane">' +
        '<div class="lane-head"><span class="project-dot" style="--c:' + p.accent + '"></span>' +
          '<span class="lane-name">' + esc(p.code) + '</span>' +

        (laneItems.length

          : '<div class="lane-empty">此列暂无' + (reqMode ? '需求' : '任务') + '</div>') +
      '</div>';
    }).join('');
  } else if (total > 0) {
    content = items.map(item => reqMode ? reqCardHTML(item) : taskCardHTML(item)).join('');
  } else {
    content = emptyColumnHTML(status, reqMode);
  }

  const ghost = status === firstStatus && state.filter === 'all'
    ? '<button type="button" class="col-ghost" data-action="composer" data-mode="' + (reqMode ? 'req' : 'task') + '">' +
      icon('plus', 10) + '添加' + (reqMode ? '需求' : '任务') + '</button>'
    : '';

  return '<section class="column" role="listitem" data-status="' + status + '" style="--status:' + meta.color + ';--soft:' + meta.soft + '">' +
    '<header class="col-head">' +
      '<div class="col-title"><span class="status-dot"></span><h2>' + status + '</h2><span class="col-count">' + total + '</span></div>' +
    '</header>' +
    '<div class="col-body" data-drop-status="' + status + '">' + content + ghost + '</div>' +
  '</section>';
}

function emptyColumnHTML(status, reqMode) {
  const filtered = state.filter !== 'all';
  const noun = reqMode ? '需求' : '任务';
  let title = '暂无' + status + noun;
  let copy = reqMode ? '新建需求后，会先进入这里等待确认。' : '新建或拆分出的任务，会先落在「就绪」。';
  let action = '';
  if (filtered) {
    title = '没有符合条件的' + noun;
    copy = '当前筛选把这一列清空了，可以清除筛选查看全部。';
    action = '<button type="button" data-action="clear-filter">清除筛选</button>';
  } else if (status === '阻塞') {
    title = '暂无阻塞任务';
    copy = '需要外部依赖或等待决策的任务会在这里获得关注。';
  } else if (status === '完成') {
    title = '还没有完成项';
    copy = '验收通过的任务会在这里累积。';
  } else if (status === '已关闭') {
    title = '暂无已关闭需求';
    copy = '关闭的需求保留上下文，但不再占用注意力。';
  }
  const ico = status === '阻塞' ? 'shield' : filtered ? 'filter' : 'smile';
  return '<div class="col-empty">' +
    '<span class="empty-ico">' + icon(ico, 14) + '</span>' +
    '<b>' + title + '</b><p>' + copy + '</p>' + action +
  '</div>';
}

function taskCardHTML(task) {
  const req = reqOf(task);
  const p = project(task.project);

  const showProject = isAllProjects() && !state.lanes;

    '<div class="card-top">' +
      '<span class="prio ' + PRIORITY_CLASS[task.priority] + '">' + task.priority + '</span>' +
      '<span class="type-chip">' + esc(task.type) + '</span>' +
      (task.auto ? '<span class="auto-mark" title="自动派发">' + icon('bolt', 9) + '</span>' : '') +
      '<span class="card-grip" aria-hidden="true">' + icon('grip', 14) + '</span>' +
    '</div>' +

    (task.blocker ? '<div class="block-reason">' + icon('alert', 9) + '<span class="txt">' + esc(task.blocker) + '</span><em>' + esc(task.blockedFor || '') + '</em></div>' : '') +
    '<div class="card-foot">' +
      '<span class="owner">' + avatar(task.owner) + esc(person(task.owner).name) + '</span>' +

  '</article>';
}

function reqCardHTML(req) {
  const p = project(req.project);
  const items = tasksOfReq(req.id);
  const counts = taskCountText(req);
  const isNew = state.newIds.includes(req.id);
  const showProject = isAllProjects() && !state.lanes;
  const dots = items.slice(0, 8).map(task =>
    '<i data-s="' + task.status + '" title="' + esc(task.title + ' · ' + task.status) + '"></i>').join('');
  const pct = counts.total ? Math.round((counts.done / counts.total) * 100) : 0;
  const unsplit = counts.total === 0
    ? '<div class="req-unsplit"><span>' + (req.status === '已确认' ? '可开始拆分' : req.status === '待确认' ? '确认后可拆分' : '无关联任务') + '</span>' + icon('split', 10) + '</div>'
    : '<div class="task-dots" aria-hidden="true">' + dots + '</div>' +
      '<div class="req-progress-meta"><span><b>' + counts.done + '</b> / ' + counts.total + ' 任务完成</span><span>' + pct + '%</span></div>';
  return '<article class="card req-card' + (req.status === '已关闭' ? ' is-closed' : '') + (isNew ? ' new-card' : '') +
    '" data-priority="' + req.priority + '" draggable="true" tabindex="0" role="button" data-req="' + req.id + '" aria-label="打开需求：' + esc(req.title) + '">' +
    '<div class="card-top">' +
      '<span class="req-seq">#' + req.seq + '</span>' +
      '<span class="prio ' + PRIORITY_CLASS[req.priority] + '">' + req.priority + '</span>' +
      '<span class="card-grip" aria-hidden="true">' + icon('grip', 14) + '</span>' +
    '</div>' +
    (showProject ? '<div class="project-flag" style="--c:' + p.accent + '"><i></i><b>' + esc(p.code) + '</b><span>' + esc(p.name) + '</span></div>' : '') +
    '<h3 class="req-title">' + esc(req.title) + '</h3>' +
    '<div class="req-source">' + icon('inbox', 9) + '<span>' + esc(req.source) + '</span></div>' +
    unsplit +
    '<div class="card-foot">' +
      '<span class="owner">' + avatar(req.owner) + esc(person(req.owner).name) + '</span>' +
      '<span class="time">' + esc(req.updated) + '</span>' +
    '</div>' +
  '</article>';
}

/* ── Overview page ─────────────────────────────────────────────────────── */
function overviewHTML() {
  const scopeName = isAllProjects() ? '全部项目' : project(state.project).code + ' · ' + project(state.project).name;
  const allTasks = liveTasks(state.project);
  const blocked = allTasks.filter(task => task.status === '阻塞').length;
  const acceptance = allTasks.filter(task => task.status === '待验收').length;
  const pendingReqs = liveReqs(state.project).filter(req => req.status === '待确认').length;
  const done = allTasks.filter(task => task.status === '完成').length;
  const focusReqs = liveReqs(state.project)
    .filter(req => tasksOfReq(req.id).length)
    .sort((a, b) => (PRIORITY_WEIGHT[a.priority] ?? 9) - (PRIORITY_WEIGHT[b.priority] ?? 9))
    .slice(0, 2)
    .map(req => ({ req, counts: taskCountText(req) }));
  const focusReq = focusReqs[0] ? focusReqs[0].req : null;
  const scopedActivity = state.project === 'all' ? ACTIVITY : ACTIVITY.filter(item => item.project === state.project);

  const attention = [];
  const blockedTask = allTasks.find(task => task.status === '阻塞');
  if (blockedTask) attention.push({
    kind: 'task', id: blockedTask.id, tone: '#a34434', soft: '#f8e7e2', icon: 'alert',
    label: '阻塞', title: blockedTask.title,
    meta: displayProject(blockedTask.project) + ' · #' + (reqOf(blockedTask)?.seq || '—') + ' · ' + blockedTask.blocker + ' · ' + blockedTask.blockedFor,
    action: '查看阻塞'
  });
  const acceptTask = allTasks.find(task => task.status === '待验收');
  if (acceptTask) attention.push({
    kind: 'task', id: acceptTask.id, tone: '#775a83', soft: '#efe7f2', icon: 'checkCircle',
    label: '待验收', title: acceptTask.title,
    meta: displayProject(acceptTask.project) + ' · #' + (reqOf(acceptTask)?.seq || '—') + ' · ' + person(acceptTask.owner).name + ' · ' + acceptTask.updated,
    action: '去验收'
  });
  const pending = liveReqs(state.project).find(req => req.status === '待确认');
  if (pending) attention.push({
    kind: 'req', id: pending.id, tone: '#a3752c', soft: '#f6ead5', icon: 'target',
    label: '待确认需求', title: pending.title,
    meta: displayProject(pending.project) + ' · ' + pending.priority + ' · ' + pending.source,
    action: '去确认'
  });
  if (!attention.length) {
    attention.push({
      kind: 'task', id: allTasks[0]?.id || 't202', tone: '#5a7751', soft: '#e7eee1', icon: 'checkCircle',
      label: '已清空', title: '当前没有需要你拍板的项目', meta: '可以打开任务画布继续推进。', action: '打开画布'
    });
  }

  const attentionHTML = attention.map(item => {
    const target = item.kind === 'task' ? 'data-task="' + item.id + '"' : 'data-req="' + item.id + '"';
    return '<div class="attention-row click-row">' +
      '<span class="att-icon" style="--soft:' + item.soft + ';--tone:' + item.tone + '">' + icon(item.icon, 14) + '</span>' +
      '<button type="button" class="att-main" ' + target + ' style="text-align:left">' +
        '<div class="att-label" style="--tone:' + item.tone + '">' + item.label + '</div>' +
        '<div class="att-title">' + esc(item.title) + '</div>' +
        '<div class="att-meta">' + esc(item.meta) + '</div>' +
      '</button>' +
      '<div class="att-side"><button type="button" class="btn outline sm" ' + target + '>' + item.action + '</button></div>' +
    '</div>';
  }).join('');

  const doneRatio = Math.min(10, done);
  const bars = [35, 52, 44, 68, 58, 82, 74, 94, 66, 78].map((height, index) =>
    '<i style="height:' + height + '%" class="' + (index > 7 ? 'hot' : '') + '"></i>').join('');

  const projectMinis = PROJECTS.map(p => {
    const tasks = liveTasks(p.id);
    const projectBlocked = tasks.filter(task => task.status === '阻塞').length;
    return '<button type="button" class="project-mini" data-action="open-project" data-project="' + p.id + '">' +
      '<span class="project-dot" style="--c:' + p.accent + '"></span>' +
      '<span class="pm-main"><span class="pm-code">' + esc(p.code) + '</span>' +
        '<span class="pm-name">' + esc(p.name) + '</span>' +
        '<span class="pm-meta">' + tasks.length + ' 个任务 · ' + liveReqs(p.id).length + ' 个需求' + (projectBlocked ? ' · ' + projectBlocked + ' 个阻塞' : '') + '</span>' +
      '</span>' +
      '<span class="pm-stat">' + tasks.filter(task => task.status === '完成').length + '/' + tasks.length + '</span>' +
      icon('chevronRight', 12) +
    '</button>';
  }).join('');

  const makeActivityRows = items => items.map(item =>
    '<div class="activity-row"><span class="activity-dot" style="--c:' + item.tone + '"></span>' +
      '<div class="activity-main">' + item.text + '<div class="activity-time">' + item.meta + '</div></div></div>').join('');
  const activitySplit = Math.ceil(scopedActivity.length / 2);
  const activitiesA = makeActivityRows(scopedActivity.slice(0, activitySplit));
  const activitiesB = makeActivityRows(scopedActivity.slice(activitySplit));

  const attentionPanel = '<div class="panel">' +
    '<div class="panel-head"><h2>需要你处理</h2><span class="head-note">按紧急度排序 · ' + esc(scopeName) + '</span></div>' +
    '<div class="attention-list">' + attentionHTML + '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 15px;border-top:1px solid var(--line-faint);background:rgba(247,242,233,.38)">' +
      '<span style="display:inline-flex;color:var(--muted)">' + icon('target', 12) + '</span>' +
      '<span style="font-size:9.5px;color:var(--muted)">' + attention.length + ' 件待处理 · 最早一项已等待 6 小时</span>' +
      '<button type="button" class="link-btn" style="margin-left:auto" data-tab="inbox">去收件箱 ' + icon('arrowRight', 10) + '</button>' +
    '</div>' +
  '</div>';

  const executorPanel = '<div class="panel">' +
    '<div class="panel-head"><h2>执行器</h2><span class="role-chip"><i class="live-dot"></i>运行中</span></div>' +
    '<div class="panel-body">' +
      '<div class="stat-grid">' +
        '<div class="stat-box"><small>在岗 / 上限</small><b>2<em>/ 3</em></b></div>' +
        '<div class="stat-box"><small>排队任务</small><b>4</b></div>' +
        '<div class="stat-box"><small>本周完成</small><b>' + done + '</b></div>' +
        '<div class="stat-box"><small>阻塞</small><b style="color:var(--brick)">' + blocked + '</b></div>' +
      '</div>' +
      '<div class="sparkbars" aria-label="最近十次运行吞吐">' + bars + '</div>' +
      '<div class="spark-legend"><span>06:00</span><span>今日吞吐 12 次</span><span>现在</span></div>' +
    '</div>' +
  '</div>';

  const projectsPanel = '<div class="panel">' +
    '<div class="panel-head"><h2>项目</h2><button type="button" class="link-btn" data-tab="projects">全部 ' + icon('arrowRight', 10) + '</button></div>' +
    '<div class="panel-body"><div class="project-mini-list">' + projectMinis + '</div></div>' +
  '</div>';

  const weekPanel = '<div class="panel">' +
    '<div class="panel-head"><h2>本周节奏</h2><span class="head-note">完成 ' + done + ' / 10 · 阻塞 ' + blocked + '</span></div>' +
    '<div class="panel-body">' +
      '<div class="progress-line"><span>整体完成度</span><b>' + Math.round(doneRatio * 10) + '%</b></div>' +
      '<div class="seg-progress" style="height:5px">' +
        Array.from({ length: 10 }, (_, index) => '<i class="' + (index < doneRatio ? 'on' : '') + '"></i>').join('') +
      '</div>' +
      '<div style="margin-top:13px;padding-top:11px;border-top:1px solid var(--line-faint)">' +
        '<div class="section-kicker">本周重点</div>' +
        (focusReqs.length ? focusReqs.map(({ req, counts }) =>
          '<button type="button" class="focus-row" data-req="' + req.id + '">' +
            '<span class="focus-row-dot" style="--c:' + (STATUS[req.status] ? STATUS[req.status].color : '#8b8273') + '"></span>' +
            '<span class="fr-title">#' + req.seq + ' ' + esc(req.title) + '</span>' +
            '<span class="fr-count">' + counts.done + ' / ' + counts.total + '</span>' +
            icon('chevronRight', 10) +
          '</button>').join('') : '<p class="block-text" style="color:var(--muted);font-size:9.5px">暂无本周重点需求。</p>') +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-faint)">' +
        '<span class="tag ' + (focusReq && focusReq.priority === 'P0' ? 'danger' : 'info') + '">' + (focusReq ? focusReq.priority : 'P2') + '</span>' +
        '<span style="font-size:10px;color:var(--ink-2)">优先处理高优先级与阻塞链路</span>' +
        (focusReq ? '<button type="button" class="link-btn" style="margin-left:auto" data-req="' + focusReq.id + '">查看需求 #' + focusReq.seq + ' ' + icon('arrowRight', 10) + '</button>' : '') +
      '</div>' +
    '</div>' +
  '</div>';

  const activityPanel = '<div class="panel" style="margin-top:12px">' +
    '<div class="panel-head"><h2>最近活动</h2><span class="head-note">' + (isAllProjects() ? '全部项目' : project(state.project).code) + '</span>' +
      (focusReq ? '<button type="button" class="link-btn" data-req="' + focusReq.id + '" style="margin-left:6px">关注 #' + focusReq.seq + ' ' + icon('arrowRight', 10) + '</button>' : '') +
    '</div>' +
    '<div class="panel-body activity-columns">' +
      '<div class="activity-list">' + activitiesA + '</div>' +
      '<div class="activity-list">' + activitiesB + '</div>' +
    '</div>' +
  '</div>';

  return '<section>' +
    '<div class="page-head">' +
      '<div class="page-title-wrap">' +
        '<div class="crumbs"><span>工作台</span>' + icon('chevronRight', 10) + '<span class="crumb-project">' + esc(scopeName) + '</span>' +
          icon('chevronRight', 10) + '<span>概览</span></div>' +
        '<h1>今天先处理这 ' + attention.length + ' 件事</h1>' +
        '<p class="subtitle">系统运行平稳。' + (blocked ? '<b>' + blocked + ' 个阻塞</b>、' : '') + (acceptance ? '<b>' + acceptance + ' 个待验收</b>' : '没有待验收') +
          (pendingReqs ? '，还有 <b>' + pendingReqs + ' 个需求</b>等待确认。' : '。') + '</p>' +
      '</div>' +
      '<div class="head-actions">' +
        '<button type="button" class="btn outline" data-action="refresh">' + icon('refresh', 13) + '刷新状态</button>' +
        '<button type="button" class="btn primary" data-tab="tasks">打开任务画布 ' + icon('arrowRight', 12) + '</button>' +
      '</div>' +

    '<div class="overview-layout">' +
      '<div class="insight-stack">' + attentionPanel + projectsPanel + '</div>' +
      '<div class="insight-stack">' + executorPanel + weekPanel + '</div>' +
    '</div>' +
    activityPanel +
  '</section>';
}

    return [
      {
        n: 2, status: '运行中', stage: '执行中', session: 'ses_' + task.id + '2', started: '今天 09:54', report: '12 分钟前',

      },

        note: '首轮实现已完成，等待补丁与验收标准对齐。', model: 'claude-sonnet-4.5'
      }

  }
