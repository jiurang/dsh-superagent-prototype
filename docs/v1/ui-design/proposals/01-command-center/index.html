<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 驾驶舱</title>
<style>
/* ============================================================
   01 · Command Center / 驾驶舱
   A single-person operating cockpit for many projects.
   Self-contained: no external fonts, images or libraries.
   ============================================================ */
:root {
  --ink: #18211d;
  --ink-2: #222e28;
  --ink-3: #2d3a33;
  --paper: #f2efe7;
  --paper-2: #f8f6f0;
  --paper-3: #ede9de;
  --card: #fcfbf7;
  --line: #ded9cb;
  --line-strong: #cbc4b4;
  --line-soft: #e8e4d9;
  --text: #1c2621;
  --text-2: #58625b;
  --text-3: #838b84;
  --text-4: #a2a9a3;
  --accent: #bc5430;
  --accent-deep: #9f4224;
  --accent-soft: #f1e1d8;
  --run: #2d7a58;
  --run-bg: #e4efe7;
  --warn: #a46b16;
  --warn-bg: #f5ecd8;
  --danger: #a53c30;
  --danger-bg: #f4e2dd;
  --review: #62508c;
  --review-bg: #ece8f4;
  --info: #386a82;
  --info-bg: #e5eef2;
  --rail: #151c19;
  --rail-2: #1d2722;
  --rail-3: #27342d;
  --rail-line: #2f3b35;
  --rail-text: #e8e5dc;
  --rail-mute: #8c9891;
  --rail-dim: #66736c;
  --mono: "SFMono-Regular", "Cascadia Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
  --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --shadow-1: 0 1px 2px rgba(24, 33, 29, .055);
  --shadow-2: 0 20px 48px rgba(15, 21, 18, .24);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  font-family: var(--sans); font-size: 13px; line-height: 1.45;
  color: var(--text); background: #d9d4c6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
::selection { background: var(--accent-soft); color: var(--ink); }
.ic {
  width: 16px; height: 16px; flex: none; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.55;
  stroke-linecap: round; stroke-linejoin: round;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb {
  background: #c7c1b1; border-radius: 8px;
  border: 2px solid transparent; background-clip: padding-box;
}
*::-webkit-scrollbar-track { background: transparent; }

/* ---------- shell ---------- */
.app {
  height: 100vh; height: 100dvh; min-height: 620px; overflow: hidden;
  display: grid; grid-template-columns: 248px minmax(0, 1fr);
  background: var(--paper);
}
.main {
  min-width: 0; height: 100%; min-height: 0;
  display: grid; grid-template-rows: 54px auto minmax(0, 1fr) 27px;
  background: var(--paper);
}

/* ---------- project rail ---------- */
.rail {
  position: relative; min-height: 0; display: flex; flex-direction: column;
  background: var(--rail); color: var(--rail-text);
  box-shadow: inset -1px 0 0 rgba(0, 0, 0, .24);
}
.brand {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 18px 16px 15px;
}
.brand-mark {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: 10px; color: #fff4ee; font-size: 15px; font-weight: 700;
  background: linear-gradient(145deg, #d0683f, #9c3e21);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 4px 12px rgba(0, 0, 0, .18);
}
.brand-copy { min-width: 0; }
.brand-copy b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: .02em; line-height: 1.3; }
.brand-copy span { display: block; margin-top: 2px; font-size: 8px; letter-spacing: .16em; color: var(--rail-dim); }
.brand-live { margin-left: auto; padding: 4px; display: flex; }
.rail-scroll { flex: 1; min-height: 0; overflow: auto; overflow-x: hidden; padding-bottom: 12px; scrollbar-width: thin; }
.rail-scroll::-webkit-scrollbar-thumb { background: #3b473f; border: 2px solid transparent; }
.rail-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px 8px; font-size: 9px; letter-spacing: .16em;
  color: #7d8a82; text-transform: uppercase;
}
.rail-label .rail-count {
  min-width: 16px; height: 15px; padding: 0 4px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; color: #a5b1aa; background: #26322c; letter-spacing: 0;
}
.project-card {
  position: relative; width: calc(100% - 16px); margin: 0 8px 4px;
  padding: 9px 10px 8px; border: 1px solid transparent; border-radius: 9px;
  background: transparent; color: inherit; text-align: left;
  display: flex; flex-direction: column; gap: 5px;
  transition: background 140ms ease, border-color 140ms ease;
}
.project-card:hover { background: var(--rail-2); }
.project-card.is-active {
  border-color: #35433b;
  background: linear-gradient(90deg, rgba(188, 84, 48, .09), transparent 46%), var(--rail-2);
  box-shadow: inset 2px 0 0 var(--accent);
}
.pc-row1 { display: flex; align-items: center; gap: 6px; }
.pc-code {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: .07em;
  color: #9eaca4; background: #26322c; border-radius: 3px; padding: 1px 4px;
}
.project-card.is-active .pc-code { color: #f2d9ca; background: #3a2a23; }
.pc-health {
  margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
  font-size: 8.5px; color: #b9a06d; white-space: nowrap;
}
.pc-health .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pc-health.is-paused { color: #7c8880; }
.pc-health.is-healthy { color: #7fb798; }
.pc-name {
  font-size: 12.5px; font-weight: 600; line-height: 1.35; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-card.is-active .pc-name { color: #fffaf2; }
.pc-pulse-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; min-width: 0; }
.pc-spark { flex: 1 1 auto; min-width: 50px; height: 19px; color: #6f927f; opacity: .9; }
.pc-spark svg { width: 100%; height: 19px; display: block; overflow: visible; }
.pc-spark .end { fill: currentColor; stroke: none; }
.pc-spark .end.hot { fill: #cf8a66; }
.project-card.is-active .pc-spark { color: #90b59e; opacity: 1; }
.project-card.is-paused .pc-spark { color: #3c4942; opacity: .8; }
.pc-updated { flex: none; margin-left: auto; font-family: var(--mono); font-size: 8px; color: var(--rail-dim); }
.pc-meta { display: flex; align-items: center; gap: 9px; font-size: 8.5px; color: var(--rail-mute); }
.pc-stat { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.pc-stat .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.pc-stat.run { color: #86b79e; }
.pc-stat.block { color: #d09982; }
.pc-stat.quiet { color: var(--rail-dim); }
.pulse { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; flex: none; }
.pulse i { display: block; width: 2px; min-height: 3px; border-radius: 1px; background: #587866; opacity: .9; }
.pulse i.hot { background: #b76e4e; }
.project-card.is-active .pulse i { background: #7fa68d; }
.project-card.is-active .pulse i.hot { background: #d48862; }
.project-card.is-paused .pulse i { background: #3c4942; }
.pulse.wide { height: 28px; gap: 4px; flex: 1; }
.pulse.wide i { width: 4px; border-radius: 1.5px; }
.pulse.hero { height: 32px; width: 100%; justify-content: space-between; gap: 3px; align-items: flex-end; }
.pulse.hero i { width: 4px; flex: 1; max-width: 6px; }

.rail-summary {
  margin: 15px 16px 0; padding-top: 12px; border-top: 1px solid var(--rail-line);
}
.rs-title { font-size: 8.5px; letter-spacing: .13em; color: #7d8a82; text-transform: uppercase; }
.rs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 7px; }
.rs-grid b {
  display: block; font-size: 17px; font-weight: 500; line-height: 1.2;
  color: #e5eae6; font-variant-numeric: tabular-nums;
}
.rs-grid span { display: block; margin-top: 1px; font-size: 8.5px; color: var(--rail-mute); }
.rs-foot {
  display: flex; align-items: center; gap: 6px; margin-top: 10px;
  padding-top: 9px; border-top: 1px solid var(--rail-line);
  font-size: 8.5px; color: var(--rail-dim);
}
.rail-foot { flex: none; border-top: 1px solid var(--rail-line); padding: 9px 12px 10px; }
.rail-system {
  margin: 0 4px 8px; padding: 9px 10px 8px;
  border: 1px solid var(--rail-line); border-radius: 7px;
  background: rgba(255, 255, 255, .016);
}
.rsys-title {
  display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
  font-size: 8px; letter-spacing: .1em; color: #7d8a82; text-transform: uppercase;
}
.rsys-title .ic { width: 11px; height: 11px; }
.rsys-row { display: flex; justify-content: space-between; padding: 1.5px 0; font-size: 9px; color: #94a099; }
.rsys-row b { font-weight: 500; color: #cdd5d0; }
.operator { display: flex; align-items: center; gap: 8px; padding: 5px 4px 1px; }
.avatar {
  width: 25px; height: 25px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 10px;
  color: #e4eae6; background: #2f3e37; border: 1px solid #44544b;
}
.operator-copy { min-width: 0; }
.operator-copy b { display: block; font-size: 10.5px; font-weight: 500; line-height: 1.35; color: #e4e9e5; }
.operator-copy span { display: block; font-size: 8px; color: var(--rail-dim); }
.palette-key {
  margin-left: auto; height: 22px; padding: 0 6px; border: 1px solid #35423b;
  border-bottom-width: 2px; border-radius: 4px; background: #212c26;
  font-family: var(--mono); font-size: 8.5px; color: #97a49c;
}
.palette-key:hover { color: #e7ece8; border-color: #4a584f; }

/* ---------- top status strip ---------- */
.status-strip {
  position: relative; z-index: 3; min-width: 0; display: flex; align-items: center;
  padding: 0 18px 0 22px; background: #f6f3eb;
  border-bottom: 1px solid var(--line);
}
.strip-project { min-width: 0; display: flex; align-items: center; gap: 8px; padding-right: 12px; }
.strip-code {
  flex: none; padding: 3px 6px; border-radius: 4px; background: var(--ink);
  color: #f2eee3; font-family: var(--mono); font-size: 9px; letter-spacing: .08em;
}
.strip-pname { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.strip-pname b { font-size: 11.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.strip-pname span {
  font-size: 8.5px; color: var(--text-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 190px;
}
.strip-health {
  margin-left: 2px; display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; border-radius: 4px; font-size: 8.5px; white-space: nowrap;
}
.strip-health .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.strip-health.amber { color: var(--warn); background: var(--warn-bg); }
.strip-health.green { color: var(--run); background: var(--run-bg); }
.strip-health.grey { color: var(--text-3); background: #eae6db; }
.strip-scope {
  flex: none; margin: 0 10px 0 2px; padding-left: 12px; border-left: 1px solid var(--line);
  font-size: 8px; letter-spacing: .12em; color: var(--text-4); white-space: nowrap;
}
.metrics { display: flex; align-items: center; gap: 1px; min-width: 0; }
.metric {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px;
  border: 0; border-radius: 5px; background: transparent; color: var(--text-3);
  font-size: 9.5px; white-space: nowrap; transition: background 120ms ease;
}
.metric .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); flex: none; }
.metric b { font-size: 11.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.metric:hover { background: #ebe6da; }
.metric.run .dot { background: var(--run); }
.metric.run b { color: var(--run); }
.metric.queue .dot { background: #87958c; }
.metric.block:not(.zero) { background: var(--danger-bg); color: var(--danger); }
.metric.block:not(.zero) .dot { background: var(--danger); }
.metric.block:not(.zero) b { color: var(--danger); }
.metric.memory:not(.zero) { color: var(--warn); }
.metric.memory:not(.zero) .dot { background: var(--warn); }
.metric.memory:not(.zero) b { color: var(--warn); }
.metric.zero { opacity: .5; }
.strip-right { margin-left: auto; display: flex; align-items: center; gap: 11px; flex: none; }
.sync-line {
  display: flex; align-items: center; gap: 5px;
  font-size: 8.5px; color: var(--text-4); font-variant-numeric: tabular-nums;
}
.live-dot {
  position: relative; width: 5px; height: 5px; flex: none;
  display: inline-block; border-radius: 50%; background: var(--run);
}
.live-dot::after {
  content: ''; position: absolute; inset: -3px; border-radius: 50%;
  border: 1px solid var(--run); opacity: .35;
  animation: beat 2.6s ease-out infinite;
}
@keyframes beat {
  0%, 100% { transform: scale(.7); opacity: .4; }
  55% { transform: scale(1.25); opacity: 0; }
}
.search-trigger {
  height: 27px; padding: 0 6px 0 8px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); border-radius: 5px;
  background: rgba(255, 255, 255, .38); color: var(--text-3); font-size: 9.5px;
}
.search-trigger .ic { width: 12px; height: 12px; }
.search-trigger:hover { background: #fffdf7; color: var(--text); }
.search-trigger .kbd { margin-left: 2px; }

/* ---------- workspace header ---------- */
.page-head {
  position: relative; z-index: 2; padding: 17px 24px 0;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.head-copy { min-width: 0; }
.eyebrow {
  display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
  font-size: 8.5px; letter-spacing: .13em; color: var(--text-3);
  text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.eyebrow::before {
  content: ''; width: 4px; height: 4px; flex: none; border-radius: .5px;
  background: var(--accent); transform: rotate(45deg);
}
.head-copy h1 {
  margin: 0; font-size: 24px; line-height: 1.15; font-weight: 600;
  letter-spacing: .01em; white-space: nowrap;
}
.page-sub {
  margin: 5px 0 0; font-size: 10px; line-height: 1.4; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-side { flex: none; display: flex; align-items: center; gap: 12px; padding-bottom: 2px; }
.head-note {
  display: flex; align-items: center; gap: 5px; max-width: 330px;
  font-size: 9px; color: var(--text-4); line-height: 1.4; text-align: right;
}
.head-note .ic { width: 12px; height: 12px; }
.head-actions { display: flex; align-items: center; gap: 6px; }
.tabs {
  display: flex; align-items: stretch; gap: 2px; margin-top: 10px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  height: 33px; padding: 0 9px; border: 0; border-bottom: 2px solid transparent;
  background: transparent; color: var(--text-3); font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  margin-bottom: -1px; transition: color 120ms ease, border-color 120ms ease;
}
.tab:hover { color: var(--text); }
.tab.is-active { color: var(--text); border-bottom-color: var(--ink); font-weight: 600; }
.tab-count {
  min-width: 16px; height: 14px; padding: 0 4px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 8.5px; font-weight: 500; color: var(--text-4);
  background: rgba(0, 0, 0, .045); font-variant-numeric: tabular-nums;
}
.tab.is-active .tab-count { color: var(--text-2); background: #e6e1d4; }
.tab.is-alert .tab-count { color: var(--danger); background: var(--danger-bg); }

/* ---------- common controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 30px; padding: 0 11px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--text); font-size: 10.5px; font-weight: 500;
  white-space: nowrap; transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
.btn .ic { width: 13px; height: 13px; }
.btn:hover { background: #e8e3d7; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: #faf7ef; }
.btn-primary:hover { background: #27342d; border-color: #27342d; }
.btn-primary .kbd { border-color: #4b574f; background: #2c3932; color: #b9c3bc; }
.btn-outline { border-color: var(--line-strong); background: rgba(255, 255, 255, .34); }
.btn-outline:hover { background: #f3efe5; }
.btn-ghost { color: var(--text-2); }
.btn-danger { color: var(--danger); border-color: #d9b3aa; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { height: 25px; padding: 0 8px; font-size: 9.5px; border-radius: 5px; }
.btn-sm .ic { width: 11px; height: 11px; }
.btn:disabled { opacity: .45; }
.icon-btn {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 5px; background: transparent; color: var(--text-3);
}
.icon-btn:hover { background: #e8e3d7; color: var(--text); }
.icon-btn .ic { width: 14px; height: 14px; }
.textlink {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0;
  background: none; color: var(--accent); font-size: 9.5px; text-align: left;
}
.textlink .ic { width: 11px; height: 11px; }
.textlink:hover { color: var(--accent-deep); text-decoration: underline; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  height: 15px; min-width: 15px; padding: 0 4px;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px;
  background: #f8f5ed; color: var(--text-3);
  font-family: var(--mono); font-size: 8px; line-height: 1; white-space: nowrap;
}
.tag {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px;
  border-radius: 3px; font-size: 8.5px; font-weight: 500; line-height: 1;
  white-space: nowrap;
}
.tag.neutral { background: #e9e5da; color: var(--text-2); }
.tag.outline { border: 1px solid var(--line-strong); background: transparent; color: var(--text-3); }
.tag.red { background: var(--danger-bg); color: var(--danger); }
.tag.amber { background: var(--warn-bg); color: var(--warn); }
.tag.blue { background: var(--info-bg); color: var(--info); }
.tag.violet { background: var(--review-bg); color: var(--review); }
.tag.green { background: var(--run-bg); color: var(--run); }
.status {
  display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px;
  border-radius: 3px; font-size: 8.5px; font-weight: 500; white-space: nowrap;
}
.status .dot { width: 4px; height: 4px; flex: none; border-radius: 50%; background: currentColor; }
.status.run { color: var(--run); background: var(--run-bg); }
.status.block { color: var(--danger); background: var(--danger-bg); }
.status.review { color: var(--review); background: var(--review-bg); }
.status.accept { color: var(--warn); background: var(--warn-bg); }
.status.idle { color: var(--text-3); background: #eae6db; }
.status.done { color: #5d7668; background: #e8ede7; }
.status.quiet { color: var(--text-4); background: transparent; padding-left: 0; }
.status.run .dot { animation: softpulse 2s ease-in-out infinite; }
@keyframes softpulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.num { font-variant-numeric: tabular-nums; }

/* ---------- view / split workspace ---------- */
.view { position: relative; min-height: 0; overflow: hidden; background: var(--paper); }
.split {
  height: 100%; min-height: 0; display: grid;
  grid-template-columns: 388px minmax(0, 1fr);
}
.master {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--paper-3); border-right: 1px solid var(--line);
}
.master-head {
  flex: none; display: flex; flex-direction: column; gap: 9px;
  padding: 12px 13px 9px; border-bottom: 1px solid var(--line);
}
.project-mini {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px;
  background: #f8f5ee;
}
.pm-code {
  flex: none; padding: 2px 5px; border-radius: 3px;
  background: var(--ink); color: #f5f1e7;
  font-family: var(--mono); font-size: 8px; letter-spacing: .06em;
}
.pm-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pm-copy b { font-size: 10.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.pm-copy span {
  font-size: 8.5px; color: var(--text-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.pm-health {
  margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px;
  font-size: 8.5px; white-space: nowrap;
}
.pm-health .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.pm-health.amber { color: var(--warn); }
.pm-health.green { color: var(--run); }
.pm-health.grey { color: var(--text-4); }
.master-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.master-title-row h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.master-title-row .count {
  padding: 0 4px; border-radius: 5px; background: #e2ddd0;
  font-size: 8.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
}
.master-title-row .btn { margin-left: auto; }
.master-title-row .micro { margin-left: auto; font-size: 8px; color: var(--text-4); letter-spacing: .04em; }
.chips {
  display: flex; align-items: center; gap: 2px; min-width: 0;
  overflow-x: auto; scrollbar-width: none; margin: 0 -1px; padding: 0 1px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  height: 22px; padding: 0 6px; border: 1px solid transparent; border-radius: 4px;
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  background: transparent; color: var(--text-3); font-size: 9px;
  white-space: nowrap; transition: background 120ms ease, color 120ms ease;
}
.chip:hover { color: var(--text); background: #e3ded1; }
.chip.is-active { background: var(--ink); color: #f8f4ea; }
.chip-n { font-size: 8px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.chip.is-active .chip-n { color: rgba(255, 255, 255, .56); }
.master-scroll {
  flex: 1; min-height: 0; overflow: auto; padding: 3px 8px 16px;
  scrollbar-gutter: stable;
}
.master-foot {
  flex: none; height: 27px; padding: 0 11px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-top: 1px solid var(--line); background: #eae6da;
  font-size: 8px; color: var(--text-4);
}
.master-foot .foot-keys { display: flex; align-items: center; gap: 3px; }
.group { margin-top: 5px; }
.group:first-child { margin-top: 1px; }
.group-head {
  position: sticky; top: -3px; z-index: 2;
  display: flex; align-items: baseline; gap: 5px; padding: 7px 5px 5px;
  background: linear-gradient(var(--paper-3) 70%, rgba(237, 233, 222, 0));
  backdrop-filter: blur(3px);
}
.group-head b {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9px; font-weight: 600; letter-spacing: .06em; color: var(--text-2);
}
.group-head .gh-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); }
.group-head .gh-count { font-size: 8px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.group-head .gh-desc { margin-left: auto; font-size: 8px; color: var(--text-4); letter-spacing: .02em; }

/* list cards */
.req-card, .task-card, .inbox-card, .mem-card, .rev-queue-card {
  display: flex; flex-direction: column; align-items: stretch;
  width: 100%; margin: 0 0 3px; padding: 8px 9px 8px 11px;
  position: relative; text-align: left; border: 1px solid transparent;
  border-radius: 7px; background: transparent; color: inherit;
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.req-card::before, .task-card::before {
  content: ''; position: absolute; left: 3px; top: 10px; bottom: 10px;
  width: 2px; border-radius: 1px; background: var(--rail-color, transparent);
  opacity: .62;
}
.req-card:hover, .task-card:hover, .inbox-card:hover, .mem-card:hover, .rev-queue-card:hover {
  background: #f5f1e7;
}
.req-card.is-selected, .task-card.is-selected, .inbox-card.is-selected,
.mem-card.is-selected, .rev-queue-card.is-selected {
  background: var(--card); border-color: var(--line-strong); box-shadow: var(--shadow-1);
}
.req-card.is-selected::before, .task-card.is-selected::before {
  opacity: 1; width: 3px; left: 2px;
}
.req-card.attention, .task-card.attention {
  background: linear-gradient(90deg, rgba(165, 60, 48, .035), transparent 55%);
}
.rc-top, .tc-top, .mc-top, .ic-top {
  display: flex; align-items: center; gap: 5px; min-width: 0; margin-bottom: 3px;
}
.seq { font-family: var(--mono); font-size: 8.5px; color: var(--text-3); letter-spacing: .02em; }
.rc-age, .mc-time, .ic-time { margin-left: auto; font-size: 8px; color: var(--text-4); white-space: nowrap; }
.rc-title, .tc-title, .mc-title {
  font-size: 12px; line-height: 1.45; font-weight: 500; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.rc-source {
  display: flex; align-items: center; gap: 4px; margin-top: 3px;
  font-size: 9px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-source .ic { width: 10px; height: 10px; color: var(--text-4); }
.rc-foot, .tc-foot, .mc-foot {
  display: flex; align-items: center; gap: 6px; margin-top: 5px;
  font-size: 8.5px; color: var(--text-4); min-width: 0;
}
.rc-foot .blocked { color: var(--danger); }
.mini-track { display: flex; align-items: center; gap: 2px; width: 48px; flex: none; }
.mini-track i { height: 3px; flex: 1; border-radius: 2px; background: #d8d2c3; }
.mini-track i.done { background: var(--run); }
.mini-track i.review { background: var(--review); }
.mini-track i.block { background: var(--danger); }
.mini-track i.accept { background: var(--warn); }
.mini-track i.run { background: var(--run); opacity: .55; }
.tc-code { margin-left: auto; font-family: var(--mono); font-size: 8px; color: var(--text-4); }
.tc-req {
  display: flex; align-items: center; gap: 4px; margin-top: 3px;
  font-size: 9px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tc-req .ic { width: 10px; height: 10px; color: var(--text-4); }
.tc-foot .tc-alert {
  display: inline-flex; align-items: center; gap: 3px; min-width: 0;
  flex: 1 1 auto;
  color: var(--danger); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tc-foot .tc-alert .ic { width: 10px; height: 10px; }
.tc-foot .grow { flex: 1; min-width: 0; }
.tc-foot .stamp { margin-left: auto; white-space: nowrap; }
.add-split { margin-top: 7px; }
.empty-list {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  margin: 7px 2px; padding: 24px 16px; text-align: center;
  border: 1px dashed var(--line-strong); border-radius: 8px;
  color: var(--text-3); background: rgba(255, 255, 255, .16);
}
.empty-list .ic { width: 18px; height: 18px; color: var(--text-4); margin-bottom: 2px; }
.empty-list b { font-size: 10px; font-weight: 500; color: var(--text-2); }
.empty-list p { margin: 0; font-size: 8.5px; line-height: 1.55; color: var(--text-4); max-width: 220px; }
.empty-list .textlink { margin-top: 3px; }

/* ---------- detail pane ---------- */
.detail {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--paper-2);
}
.detail-head {
  flex: none; padding: 16px 22px 13px;
  border-bottom: 1px solid var(--line); background: var(--paper-2);
}
.status-rule { width: 26px; height: 3px; margin-bottom: 8px; border-radius: 2px; background: var(--rule, var(--line-strong)); }
.dh-top {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 8.5px; color: var(--text-4);
}
.dh-code { font-family: var(--mono); letter-spacing: .04em; color: var(--text-3); }
.dh-updated { margin-left: auto; white-space: nowrap; }
.detail-title {
  margin: 6px 0 0; max-width: 100%; font-size: 19px; line-height: 1.34;
  font-weight: 600; letter-spacing: .005em; overflow-wrap: anywhere;
}
.dh-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 9px;
  margin-top: 6px; font-size: 9px; color: var(--text-3);
}
.dh-meta .lbl { color: var(--text-4); }
.meta-link {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0;
  background: none; color: var(--text-3); font-size: 8.5px; text-align: left;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.meta-link .ic { width: 10px; height: 10px; color: var(--text-4); }
.meta-link:hover { color: var(--accent); }
.meta-sep { color: var(--line-strong); }
.detail-actions {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px;
}
.detail-actions .spacer { flex: 1; }
.detail-actions .hint { font-size: 8px; color: var(--text-4); white-space: nowrap; }
.head-state {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9px; color: var(--text-3);
}
.head-state .ic { width: 12px; height: 12px; color: var(--run); }
.stage-trail {
  display: flex; align-items: center; gap: 0; margin-top: 8px;
  font-size: 8px; color: var(--text-4);
}
.stage-trail span { white-space: nowrap; }
.stage-trail span.done { color: var(--text-2); }
.stage-trail span.active { color: var(--accent); font-weight: 600; }
.stage-trail i { width: 16px; height: 1px; margin: 0 5px; background: var(--line-strong); }
.closed-trail { display: inline-flex; align-items: center; gap: 4px; color: var(--text-4); }
.closed-trail .ic { width: 10px; height: 10px; }
.detail-body {
  flex: 1; min-height: 0; overflow: auto; padding: 0 22px 26px;
  scrollbar-gutter: stable;
}
.pause-banner {
  display: flex; align-items: flex-start; gap: 6px; margin: 12px 0 0;
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: #efece3; font-size: 8.5px; line-height: 1.55; color: var(--text-3);
}
.pause-banner .ic { width: 11px; height: 11px; margin-top: 1px; color: var(--text-4); flex: none; }
.pause-banner b { font-weight: 600; color: var(--text-2); }
.blocked-banner {
  display: flex; align-items: flex-start; gap: 8px; margin: 13px 0 0;
  padding: 9px 10px; border: 1px solid #e1c0b8; border-radius: 7px;
  background: linear-gradient(90deg, rgba(165, 60, 48, .07), rgba(165, 60, 48, .02));
}
.bb-icon {
  width: 22px; height: 22px; flex: none; display: grid; place-items: center;
  border-radius: 5px; background: var(--danger-bg); color: var(--danger);
}
.bb-icon .ic { width: 12px; height: 12px; }
.blocked-banner b { display: block; font-size: 9.5px; color: var(--danger); font-weight: 600; }
.blocked-banner p { margin: 2px 0 0; font-size: 9px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere; }
.blocked-banner .btn { margin-left: auto; flex: none; }
.dsec { padding: 13px 0 14px; border-bottom: 1px solid var(--line-soft); }
.dsec:last-child { border-bottom: 0; }
.dsec-head { display: flex; align-items: center; gap: 5px; min-width: 0; margin-bottom: 7px; }
.dsec-head h3 {
  margin: 0; font-size: 9px; font-weight: 600; letter-spacing: .1em;
  color: var(--text-3); white-space: nowrap;
}
.dsec-head .count { font-size: 8px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.dsec-head .hint { margin-left: auto; font-size: 8px; color: var(--text-4); white-space: nowrap; }
.prose {
  margin: 0; font-size: 11px; line-height: 1.68; color: var(--text-2);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.prose.muted { color: var(--text-4); font-style: normal; }
.quote {
  margin: 8px 0 0; padding: 8px 11px;
  border-left: 2px solid #c6beaa; border-radius: 0 5px 5px 0;
  background: #f0ece2; font-size: 10.5px; line-height: 1.65; color: var(--text-2);
  overflow-wrap: anywhere;
}
.quote cite {
  display: block; margin-top: 4px; font-style: normal;
  font-size: 8px; color: var(--text-4);
}
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.sum-card {
  min-width: 0; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--card);
}
.sum-card .sum-label {
  display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
  font-size: 8px; letter-spacing: .08em; color: var(--text-4);
}
.sum-card .sum-label .tag { margin-left: auto; }
.sum-card p {
  margin: 0; font-size: 10px; line-height: 1.6; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.comp-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.comp-progress { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 8px; color: var(--text-4); }
.comp-bar { display: flex; gap: 2px; width: 56px; }
.comp-bar i { height: 4px; flex: 1; border-radius: 2px; background: #dbd5c6; }
.comp-bar i.done { background: var(--run); }
.comp-bar i.review { background: var(--review); }
.comp-bar i.block { background: var(--danger); }
.comp-bar i.accept { background: var(--warn); }
.comp-bar i.run { background: var(--run); opacity: .5; }
.task-line {
  width: 100%; display: grid; grid-template-columns: 3px minmax(0, 1fr) auto;
  align-items: stretch; padding: 0; margin-bottom: 4px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 7px; background: var(--card);
  text-align: left; transition: border-color 120ms ease, background 120ms ease;
}
.task-line:hover { background: #f6f2e8; border-color: var(--line-strong); }
.task-line-rail { background: var(--tc-line, var(--text-4)); opacity: .62; }
.task-line-main { min-width: 0; padding: 7px 9px; }
.task-line-title {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 10px; line-height: 1.45; font-weight: 500;
  overflow-wrap: anywhere;
}
.task-line-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.task-line-side { display: flex; align-items: center; padding: 0 8px; color: var(--text-4); }
.task-line-side .ic { width: 12px; height: 12px; }
.task-line:hover .task-line-side { color: var(--accent); }

/* split composer */
.split-form {
  margin: 4px 0 10px; padding: 11px 11px 10px;
  border: 1px solid #cdc5b3; border-radius: 8px;
  background: #f6f2e7; box-shadow: inset 2px 0 0 var(--accent);
}
.composer-head { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 9px; }
.composer-head h3 { margin: 0; font-size: 10.5px; font-weight: 600; line-height: 1.4; }
.composer-head .hint { margin-left: auto; font-size: 8px; color: var(--text-4); white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-bottom: 9px; }
.field:last-child { margin-bottom: 0; }
.field > span, .field > label {
  display: flex; align-items: center; gap: 4px;
  font-size: 8.5px; color: var(--text-3); letter-spacing: .02em;
}
.field > span em { font-style: normal; font-size: 7.5px; color: var(--accent); }
.input, .textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 5px;
  background: #fffdf8; padding: 6px 8px; font-size: 10px; line-height: 1.5;
  color: var(--text); outline: none;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.input { height: 29px; }
.textarea { min-height: 62px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-4); }
.input:focus, .textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(188, 84, 48, .09);
}
.field .help { font-size: 7.5px; color: var(--text-4); line-height: 1.45; }
.split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.seg {
  display: inline-flex; align-items: center; gap: 1px; padding: 2px; width: max-content;
  max-width: 100%; border: 1px solid var(--line); border-radius: 5px; background: #ece7dc;
}
.seg label { position: relative; display: inline-flex; }
.seg input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.seg span {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
  border-radius: 3px; font-size: 9px; color: var(--text-3); cursor: pointer;
  white-space: nowrap;
}
.seg input:checked + span {
  background: #fffdf8; color: var(--text); font-weight: 500;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
}
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.split-preview {
  margin-bottom: 9px; padding: 7px 8px;
  border: 1px dashed var(--line-strong); border-radius: 5px;
  background: rgba(255, 255, 255, .4); font-size: 8.5px; color: var(--text-3);
}
.split-preview b { color: var(--text); font-weight: 600; }
.split-preview .split-list { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.split-token { padding: 1px 5px; border-radius: 3px; background: #e9e3d5; font-size: 8px; color: var(--text-2); }
.split-warning { margin-top: 4px; color: var(--warn); line-height: 1.45; }
.form-foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.form-foot .hint {
  margin-right: auto; display: inline-flex; align-items: center; gap: 3px;
  font-size: 7.5px; color: var(--text-4);
}

/* attempts */
.attempt { position: relative; padding: 8px 9px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
.attempt:last-child { margin-bottom: 0; }
.attempt.is-active { border-color: #b9d0c2; background: linear-gradient(90deg, rgba(45, 122, 88, .045), var(--card)); }
.attempt.is-blocked { border-color: #dfbeb6; background: linear-gradient(90deg, rgba(165, 60, 48, .05), var(--card)); }
.attempt-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.at-num { font-family: var(--mono); font-size: 8.5px; color: var(--text-4); letter-spacing: .03em; }
.at-stage { margin-left: auto; font-size: 8px; color: var(--text-4); white-space: nowrap; }
.stage-track { display: flex; align-items: center; margin: 6px 0; }
.stage-track span { font-size: 7.5px; color: var(--text-4); white-space: nowrap; }
.stage-track span.done { color: var(--text-2); }
.stage-track span.active { color: var(--run); font-weight: 600; }
.stage-track span.active.bad { color: var(--danger); }
.stage-track i { flex: 1; height: 1px; min-width: 6px; margin: 0 4px; background: var(--line); }
.stage-track i.done { background: #b8cbbb; }
.at-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 8px; font-size: 8px; color: var(--text-4); font-variant-numeric: tabular-nums; }
.at-note { margin: 5px 0 0; font-size: 9.5px; line-height: 1.55; color: var(--text-2); }
.attention {
  display: flex; align-items: flex-start; gap: 4px; margin-top: 5px;
  padding: 5px 7px; border-radius: 4px; background: var(--danger-bg);
  color: var(--danger); font-size: 8.5px; line-height: 1.5; overflow-wrap: anywhere;
}
.attention .ic { width: 11px; height: 11px; margin-top: 1px; }
.empty-inline {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  padding: 11px 12px; border: 1px dashed var(--line-strong); border-radius: 6px;
  background: rgba(255, 255, 255, .22);
}
.empty-inline b { font-size: 9.5px; font-weight: 500; color: var(--text-2); }
.empty-inline p { margin: 0; font-size: 8.5px; line-height: 1.55; color: var(--text-4); }

/* evidence */
.evidence-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 6px; }
.evidence { min-width: 0; padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
.ev-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ev-type {
  width: 23px; height: 23px; flex: none; display: grid; place-items: center;
  border-radius: 4px; background: #e9e4d7; color: var(--text-2);
  font-family: var(--mono); font-size: 7.5px;
}
.ev-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 500; }
.ev-head .tag { margin-left: auto; flex: none; }
.ev-note {
  margin: 5px 0 0; font-size: 9px; line-height: 1.55; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.ev-foot { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 7.5px; color: var(--text-4); }
.ev-foot .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 7.5px; }
.ev-foot .stamp { margin-left: auto; flex: none; }

/* reviews */
.review-card { padding: 8px 9px; margin-bottom: 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); }
.review-card:last-child { margin-bottom: 0; }
.rv-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.rv-who { margin-left: auto; font-size: 8px; color: var(--text-4); white-space: nowrap; }
.rv-comments { margin: 5px 0 0; font-size: 9.5px; line-height: 1.6; color: var(--text-2); overflow-wrap: anywhere; }
.review-pending {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  padding: 10px 11px; border: 1px dashed var(--line-strong); border-radius: 7px;
  background: rgba(255, 255, 255, .25);
}
.rp-title { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 500; }
.review-pending p { margin: 0; font-size: 8.5px; line-height: 1.55; color: var(--text-3); }
.review-pending .btn { margin-top: 2px; }
.review-form {
  margin-top: 7px; padding: 10px; border: 1px solid var(--line-strong);
  border-radius: 7px; background: #f6f2e8;
}
.review-form .field { margin-bottom: 7px; }
.rf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* folds */
.fold { margin-top: 2px; padding-top: 1px; border-top: 1px solid var(--line-soft); }
.fold summary {
  display: flex; align-items: center; gap: 5px; padding: 8px 0 7px;
  list-style: none; cursor: pointer; color: var(--text-3);
  font-size: 9px; font-weight: 600; letter-spacing: .08em;
}
.fold summary::-webkit-details-marker { display: none; }
.fold summary .count { font-size: 8px; font-weight: 400; color: var(--text-4); }
.fold summary .hint { margin-left: auto; font-size: 7.5px; font-weight: 400; color: var(--text-4); letter-spacing: 0; }
.fold summary .chev { margin-left: 6px; color: var(--text-4); transition: transform 150ms ease; }
.fold summary .chev .ic { width: 11px; height: 11px; }
.fold[open] summary .chev { transform: rotate(90deg); }
.fold-body { padding: 1px 0 10px; display: flex; flex-direction: column; gap: 5px; }
.triage-step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 7px; padding: 4px 0; font-size: 8.5px; line-height: 1.55; color: var(--text-2); }
.triage-step b { font-size: 8px; font-weight: 500; color: var(--text-4); padding-top: 1px; }
.event-row { display: flex; align-items: baseline; gap: 7px; padding: 3px 0; border-bottom: 1px solid var(--line-soft); font-size: 8px; color: var(--text-3); }
.event-row:last-child { border-bottom: 0; }
.event-row .mono { font-size: 8px; color: var(--text-2); }
.event-row .actor { color: var(--text-4); }
.event-row .time { margin-left: auto; color: var(--text-4); white-space: nowrap; }
.detail-danger {
  display: flex; align-items: center; gap: 6px; margin-top: 2px; padding-top: 10px;
  border-top: 1px solid var(--line-soft); font-size: 8px; color: var(--text-4);
}
.danger-link {
  margin-left: auto; display: inline-flex; align-items: center; gap: 3px;
  padding: 0; border: 0; background: none; color: var(--danger); font-size: 8.5px;
}
.danger-link .ic { width: 11px; height: 11px; }
.danger-link:hover { text-decoration: underline; }

/* empty detail */
.empty-detail { height: 100%; display: grid; place-items: center; padding: 24px; background: var(--paper-2); }
.empty-detail-inner { max-width: 290px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.empty-glyph {
  width: 46px; height: 46px; margin-bottom: 5px; position: relative;
  display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line-strong); background: #f5f1e7; color: var(--text-4);
}
.empty-glyph .ic { width: 18px; height: 18px; }
.empty-glyph::before, .empty-glyph::after {
  content: ''; position: absolute; background: var(--line); opacity: .8;
}
.empty-glyph::before { width: 64px; height: 1px; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-38deg); }
.empty-glyph::after { width: 1px; height: 64px; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-38deg); }
.empty-detail h3 { margin: 0; font-size: 12px; font-weight: 600; }
.empty-detail p { margin: 0; font-size: 9px; line-height: 1.6; color: var(--text-3); }
.empty-keys { display: flex; align-items: center; gap: 3px; margin-top: 3px; }

/* ---------- overview ---------- */
.overview { height: 100%; overflow: auto; padding: 19px 24px 32px; scrollbar-gutter: stable; }
.hero {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  padding: 2px 2px 16px; border-bottom: 1px solid var(--line);
}
.hero-copy { min-width: 0; }
.hero-kicker {
  display: flex; align-items: center; gap: 6px; font-size: 8px; letter-spacing: .12em;
  color: var(--text-4); text-transform: uppercase;
}
.hero h2 {
  margin: 6px 0 0; max-width: 600px; font-size: 22px; line-height: 1.28;
  font-weight: 500; letter-spacing: .002em;
}
.hero h2 em, .hero h2 .run {
  font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums;
}
.hero h2 em { color: var(--accent); }
.hero h2 .run { color: var(--run); }
.hero p { margin: 6px 0 0; max-width: 560px; font-size: 10px; line-height: 1.6; color: var(--text-3); }
.hero-rhythm {
  flex: none; width: 258px; padding: 9px 11px 8px;
  border: 1px solid var(--line); border-radius: 7px;
  background: rgba(255, 255, 255, .28);
}
.rhythm-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 7.5px; letter-spacing: .06em; color: var(--text-4); }
.hero-rhythm .pulse { width: 100%; height: 30px; }
.rhythm-foot { display: flex; justify-content: space-between; gap: 5px; margin-top: 6px; font-size: 7.5px; color: var(--text-3); }
.ov-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) 326px; gap: 13px;
  margin-top: 14px; align-items: start;
}
.panel {
  min-width: 0; border: 1px solid var(--line); border-radius: 9px;
  background: var(--card); box-shadow: var(--shadow-1);
}
.panel-head {
  display: flex; align-items: center; gap: 6px; padding: 10px 13px 9px;
  border-bottom: 1px solid var(--line-soft);
}
.panel-head h3 { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: .03em; }
.panel-head .count {
  min-width: 15px; height: 14px; padding: 0 4px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-deep);
  font-size: 8px; font-variant-numeric: tabular-nums;
}
.panel-head .hint { margin-left: auto; font-size: 7.5px; letter-spacing: .04em; color: var(--text-4); }
.queue-list { display: flex; flex-direction: column; padding: 3px 5px; }
.q-row {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) auto 54px;
  align-items: center; gap: 8px; padding: 8px; border: 0;
  border-bottom: 1px solid var(--line-soft); border-radius: 5px;
  background: transparent; text-align: left;
  transition: background 120ms ease;
}
.q-row:last-child { border-bottom: 0; }
.q-row:hover { background: #f4f0e6; }
.q-kind { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; white-space: nowrap; color: var(--text-3); }
.q-kind .dot { width: 4px; height: 4px; flex: none; border-radius: 50%; background: currentColor; }
.q-kind.red { color: var(--danger); }
.q-kind.amber { color: var(--warn); }
.q-kind.violet { color: var(--review); }
.q-kind.blue { color: var(--info); }
.q-kind.green { color: var(--run); }
.q-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.q-body b {
  font-size: 10.5px; font-weight: 500; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.q-body small {
  font-size: 8.5px; line-height: 1.4; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.q-age { font-size: 7.5px; color: var(--text-4); white-space: nowrap; font-variant-numeric: tabular-nums; }
.q-cta {
  display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px;
  font-size: 8px; color: var(--text-4); white-space: nowrap;
}
.q-cta .ic { width: 11px; height: 11px; transition: transform 120ms ease; }
.q-row:hover .q-cta { color: var(--accent); }
.q-row:hover .q-cta .ic { transform: translateX(2px); }
.queue-foot {
  display: flex; align-items: center; gap: 5px; padding: 8px 13px;
  border-top: 1px solid var(--line-soft); font-size: 8px; color: var(--text-4);
}
.queue-foot button {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0;
  background: none; color: var(--text-2); font-size: 8px;
}
.queue-foot button:hover { color: var(--accent); }
.queue-foot .ic { width: 11px; height: 11px; }
.queue-foot span { margin-left: auto; }
.ov-side { min-width: 0; display: flex; flex-direction: column; gap: 11px; }
.pulse-card {
  position: relative; overflow: hidden; padding: 12px 13px;
  color: #e9eee9; border: 1px solid #2c3933; border-radius: 9px;
  background: linear-gradient(145deg, #1c2823, #121a17);
}
.pulse-card::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, .032) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .032) 1px, transparent 1px);
  background-size: 22px 22px;
}
.pc-head {
  position: relative; display: flex; align-items: center; gap: 5px;
  font-size: 7.5px; letter-spacing: .13em; color: #91a197; text-transform: uppercase;
}
.pc-head .live-dot { background: #78c59e; }
.pc-head .live-dot::after { border-color: #78c59e; }
.pc-live {
  margin-left: auto; padding: 1px 4px; border: 1px solid #34453c; border-radius: 3px;
  font-family: var(--mono); font-size: 7px; letter-spacing: .06em; color: #7f9a8b;
}
.pc-title { position: relative; margin-top: 9px; font-size: 14px; font-weight: 500; line-height: 1.35; letter-spacing: .01em; }
.pc-sub { position: relative; margin-top: 2px; font-size: 8px; color: #8fa097; }
.pc-track {
  position: relative; display: flex; align-items: center; margin-top: 9px;
  padding: 7px 8px; border-radius: 5px; background: rgba(255, 255, 255, .045);
}
.pc-stage { font-size: 7.5px; color: #82968a; white-space: nowrap; }
.pc-stage.done { color: #b6c8bc; }
.pc-stage.active { color: #91d3ae; font-weight: 600; }
.pc-track i { flex: 1; height: 1px; min-width: 7px; margin: 0 4px; background: rgba(255, 255, 255, .12); }
.pc-track i.done { background: rgba(145, 211, 174, .45); }
.pc-stats { position: relative; display: flex; justify-content: space-between; margin-top: 9px; }
.pc-stats b { display: block; font-family: var(--mono); font-size: 13px; font-weight: 500; color: #e9efe9; font-variant-numeric: tabular-nums; }
.pc-stats span { display: block; margin-top: 1px; font-size: 7px; color: #82958b; }
.pc-foot {
  position: relative; display: flex; align-items: center; gap: 5px;
  margin-top: 9px; padding-top: 7px; border-top: 1px solid #2a3731;
  font-size: 7.5px; color: #83978c;
}
.pc-foot .mono { font-size: 7.5px; }
.pc-empty { position: relative; padding: 9px 0 2px; font-size: 9px; line-height: 1.6; color: #84958b; }
.activity-list { list-style: none; margin: 0; padding: 2px 13px 6px; }
.activity-item {
  display: grid; grid-template-columns: 34px 6px minmax(0, 1fr); gap: 7px;
  padding: 6px 0; border-bottom: 1px solid var(--line-soft);
}
.activity-item:last-child { border-bottom: 0; }
.ai-time { padding-top: 1px; font-family: var(--mono); font-size: 7.5px; color: var(--text-4); }
.ai-dot { width: 5px; height: 5px; margin-top: 4px; border-radius: 50%; background: var(--line-strong); }
.ai-dot.run { background: var(--run); }
.ai-dot.block { background: var(--danger); }
.ai-dot.review { background: var(--review); }
.ai-dot.inbox { background: var(--info); }
.ai-dot.done { background: #6e8878; }
.ai-text { min-width: 0; font-size: 9px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere; }
.ai-text small { display: block; margin-top: 1px; font-size: 7.5px; color: var(--text-4); }

/* ---------- full-width empty workflow ---------- */
.empty-page { display: flex; align-items: center; justify-content: center; }
.empty-work {
  width: min(700px, 100%); padding: 28px 30px;
  border: 1px solid var(--line); border-radius: 13px;
  background: linear-gradient(145deg, #fbfaf5, #f3efe4);
  box-shadow: var(--shadow-1);
}
.empty-work-head { display: flex; align-items: flex-start; gap: 15px; }
.empty-work-head .empty-glyph { flex: none; margin: 0; }
.empty-work-head .hero-kicker { margin-bottom: 2px; }
.empty-work h2 { margin: 3px 0 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: .01em; }
.empty-work-head p { margin: 6px 0 0; max-width: 510px; font-size: 10px; line-height: 1.65; color: var(--text-3); }
.flow-steps {
  display: flex; align-items: stretch; gap: 8px; margin: 20px 0 18px;
  padding: 13px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: #f8f5ed;
}
.flow-step { flex: 1; min-width: 0; }
.flow-step > span { font-family: var(--mono); font-size: 8.5px; color: var(--accent); letter-spacing: .05em; }
.flow-step b { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 600; }
.flow-step p { margin: 2px 0 0; font-size: 8.5px; line-height: 1.5; color: var(--text-3); }
.flow-steps > i { flex: none; align-self: center; width: 18px; height: 1px; background: var(--line-strong); }
.empty-work-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.empty-work-foot {
  margin-top: 15px; padding-top: 9px; border-top: 1px solid var(--line-soft);
  font-size: 8.5px; color: var(--text-4);
}

/* ---------- projects ---------- */
.page-scroll { height: 100%; overflow: auto; padding: 20px 24px 34px; scrollbar-gutter: stable; }
.proj-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.proj-card {
  position: relative; min-width: 0; display: flex; flex-direction: column; gap: 11px;
  padding: 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); box-shadow: var(--shadow-1);
}
.proj-card.is-current { border-color: #c9bfa9; box-shadow: inset 0 2px 0 var(--accent), var(--shadow-1); }
.proj-card.is-paused { background: #f8f5ee; }
.proj-card-head { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
.proj-code {
  flex: none; padding: 4px 6px; border-radius: 4px; background: var(--ink);
  color: #f4f0e6; font-family: var(--mono); font-size: 8.5px; letter-spacing: .07em;
}
.proj-card-head h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
.proj-card-head p { margin: 2px 0 0; font-size: 8.5px; line-height: 1.45; color: var(--text-3); }
.proj-card-head .health { margin-left: auto; flex: none; }
.health-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; white-space: nowrap; }
.health-badge .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.health-badge.amber { color: var(--warn); }
.health-badge.green { color: var(--run); }
.health-badge.grey { color: var(--text-4); }
.proj-pulse {
  display: flex; align-items: flex-end; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--line-soft); border-radius: 6px; background: #f4f0e6;
}
.proj-pulse .pulse { flex: 1; height: 22px; }
.proj-pulse .pulse i { width: 4px; background: #93a99a; }
.proj-pulse .pulse i.hot { background: #c28663; }
.proj-pulse .rhythm-label { flex: none; font-size: 7.5px; color: var(--text-4); text-align: right; line-height: 1.5; }
.proj-stats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line-soft); border-radius: 6px; overflow: hidden;
}
.proj-stats div { min-width: 0; padding: 7px 9px; background: #f9f6ee; border-right: 1px solid var(--line-soft); }
.proj-stats div:last-child { border-right: 0; }
.proj-stats b { display: block; font-size: 16px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.proj-stats span { display: block; margin-top: 1px; font-size: 7.5px; color: var(--text-4); }
.proj-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0; }
.proj-settings div { min-width: 0; }
.proj-settings dt { font-size: 7.5px; color: var(--text-4); }
.proj-settings dd {
  margin: 1px 0 0; font-size: 9px; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.proj-foot {
  display: flex; align-items: center; gap: 7px; padding-top: 9px;
  border-top: 1px solid var(--line-soft); font-size: 7.5px; color: var(--text-4);
}
.proj-foot .scope { display: inline-flex; align-items: center; gap: 3px; }
.proj-foot .scope .ic { width: 10px; height: 10px; }
.proj-foot .btn { margin-left: auto; }
.proj-foot .current-mark {
  margin-left: auto; display: inline-flex; align-items: center; gap: 3px;
  font-size: 8px; color: var(--accent);
}
.system-panel {
  display: flex; align-items: flex-start; gap: 11px; margin-top: 13px;
  padding: 13px 15px; border: 1px dashed var(--line-strong); border-radius: 10px;
  background:
    repeating-linear-gradient(135deg, rgba(0, 0, 0, .012), rgba(0, 0, 0, .012) 8px, transparent 8px, transparent 16px),
    #efece2;
}
.sp-icon {
  width: 29px; height: 29px; flex: none; display: grid; place-items: center;
  border-radius: 6px; background: #e4dfd2; color: var(--text-2);
}
.sp-icon .ic { width: 14px; height: 14px; }
.sp-main { min-width: 0; }
.sp-title { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; }
.sp-title span { padding: 1px 5px; border-radius: 3px; background: var(--warn-bg); color: var(--warn); font-size: 7.5px; font-weight: 500; }
.system-panel p { margin: 3px 0 0; max-width: 660px; font-size: 8.5px; line-height: 1.6; color: var(--text-3); }
.sp-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.sp-chips span { padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 3px; background: #f7f3e9; font-size: 7.5px; color: var(--text-3); }
.sp-note { margin-left: auto; flex: none; align-self: center; font-size: 7.5px; color: var(--text-4); }

/* ---------- inbox / memory / review workspaces ---------- */
.inbox-card .ic-contact { font-size: 10px; font-weight: 500; }
.channel {
  display: inline-flex; align-items: center; height: 17px; padding: 0 5px;
  border-radius: 3px; background: #e9e4d7; color: var(--text-2);
  font-size: 8px; font-weight: 500;
}
.ic-preview {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin: 3px 0 0; font-size: 9px; line-height: 1.55; color: var(--text-3); overflow-wrap: anywhere;
}
.inbox-detail .detail-body, .memory-detail .detail-body { padding-top: 0; }
.triage-form { margin: 4px 0 0; padding: 11px; border: 1px solid var(--line-strong); border-radius: 8px; background: #f7f3e9; }
.triage-form .composer-head { margin-bottom: 8px; }
.triage-form .form-foot { margin-top: 2px; }
.detail-sub { margin: 4px 0 0; font-size: 8.5px; color: var(--text-3); }
.detail-sub .dot-sep { margin: 0 4px; color: var(--line-strong); }
.mem-card .mc-type { flex: none; }
.mem-card .status { margin-left: auto; }
.mem-source { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 8px; color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mem-source .ic { width: 10px; height: 10px; }
.mem-refs { display: flex; flex-direction: column; gap: 0; }
.ref-row {
  display: flex; align-items: center; gap: 6px; min-width: 0; padding: 6px 0;
  border-bottom: 1px solid var(--line-soft); font-size: 8.5px;
}
.ref-row:last-child { border-bottom: 0; }
.ref-row .ic { width: 11px; height: 11px; color: var(--text-4); flex: none; }
.ref-row .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8.5px; color: var(--text-2); }
.ref-state { margin-left: auto; flex: none; font-size: 7.5px; white-space: nowrap; }
.ref-state.ok { color: var(--run); }
.ref-state.stale { color: var(--warn); }
.ref-state.missing { color: var(--danger); }
.tag-row { display: flex; flex-wrap: wrap; gap: 3px; }
.memory-callout {
  display: flex; align-items: flex-start; gap: 6px; margin: 2px 0 10px;
  padding: 7px 9px; border: 1px solid #e2d3ad; border-radius: 6px;
  background: #faf4e4; font-size: 8.5px; line-height: 1.55; color: var(--warn);
}
.memory-callout .ic { width: 11px; height: 11px; margin-top: 1px; }

function countsFor(pid) {
  const rs = reqsOf(pid);
  const ts = tasksOf(pid);
  const ms = memOf(pid);
  const ins = inboxOf(pid);
  const rBy = status => rs.filter(r => r.status === status).length;
  const tBy = status => ts.filter(t => t.status === status).length;
  const memoryPending = ms.filter(m => m.status === '待复核').length;
  return {
    reqs: rs.length,
    pendingReq: rBy('待确认'),
    confirmedReq: rBy('已确认'),
    splitReq: rBy('已拆分'),
    closedReq: rBy('已关闭'),
    tasks: ts.length,
    running: tBy('进行中'),
    ready: tBy('就绪'),
    blocked: tBy('阻塞'),
    review: tBy('评审'),
    accept: tBy('待验收'),
    done: tBy('完成'),
    memory: ms.length,
    memoryPending,
    inbox: ins.length,
    actions: tBy('阻塞') + rBy('待确认') + rBy('已确认') + tBy('评审') + tBy('待验收') + memoryPending
  };
}

function healthOf(p) {
  if (p.status !== '活跃') return { label: p.status === '暂停' ? '暂停' : '归档', cls: 'grey' };
  if (countsFor(p.id).blocked > 0) return { label: '注意', cls: 'amber' };
  return { label: '健康', cls: 'green' };
}

function sparkline(p) {
  const values = p.pulse;
  const last = values.length - 1;
  const points = values.map((value, index) =>
    `${((index / last) * 100).toFixed(2)},${(18 - (value / 8) * 14).toFixed(2)}`).join(' ');
  const endY = (18 - (values[last] / 8) * 14).toFixed(2);
  const hot = p.status === '活跃' && countsFor(p.id).blocked > 0;
  return `<span class="pc-spark" aria-hidden="true"><svg viewBox="0 0 100 20" preserveAspectRatio="none">
    <polygon points="0,19 ${points} 100,19" fill="currentColor" opacity=".07"/>
    <polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    <circle class="end${hot ? ' hot' : ''}" cx="100" cy="${endY}" r="1.8" vector-effect="non-scaling-stroke"/>
  </svg></span>`;
}

function pulseBars(p, kind = 'rail') {
  const hot = p.status === '活跃' && countsFor(p.id).blocked > 0;
  const multiplier = kind === 'hero' ? 3.3 : kind === 'wide' ? 3 : 1.8;
  const base = p.status === '活跃' ? '' : ' is-paused';
  return `<span class="pulse ${kind}${base}" aria-hidden="true">${p.pulse.map((value, index) =>
    `<i class="${hot && index >= p.pulse.length - 2 ? 'hot' : ''}" style="height:${(3 + value * multiplier).toFixed(1)}px"></i>`).join('')}</span>`;
}

function prioTag(priority) {
  return priority ? `<span class="tag ${PRIO_TONE[priority] || 'neutral'}">${priority}</span>` : '';
}
function taskStatusTag(status) {
  return `<span class="status ${TASK_STATUS[status]?.cls || 'quiet'}"><span class="dot"></span>${status}</span>`;
}
function reqStatusTag(status) {
  return `<span class="tag ${REQ_STATUS[status]?.tone || 'outline'}">${status}</span>`;
}
function healthBadge(p) {
  const h = healthOf(p);
  return `<span class="health-badge ${h.cls}"><span class="dot"></span>${h.label}</span>`;
}
function projectHealthPill(p) {
  const h = healthOf(p);
  return `<span class="strip-health ${h.cls}"><span class="dot"></span>${h.label}</span>`;
}
function shortUri(uri) {
  const text = String(uri || '');
  return text.length > 44 ? `${text.slice(0, 41)}…` : text;
}
function extOf(uri, fallback = 'FILE') {
  const match = String(uri || '').match(/\.([a-z0-9]{1,4})$/i);
  return match ? match[1].toUpperCase() : fallback;
}
function sortTasks(list) {
  return list.slice().sort((a, b) => {
    const byStatus = TASK_ORDER.indexOf(a.status) - TASK_ORDER.indexOf(b.status);
    if (byStatus !== 0) return byStatus;
    const byPriority = PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority);
    if (byPriority !== 0) return byPriority;
    return a.seqNo - b.seqNo;
  });
}
function visibleReqs() {
  const list = reqsOf(state.projectId).filter(r => state.reqFilter === '全部' || r.status === state.reqFilter);
  if (state.reqFilter !== '全部') return list.sort((a, b) => b.seqNo - a.seqNo);
  return REQ_ORDER.flatMap(status => list.filter(r => r.status === status).sort((a, b) => b.seqNo - a.seqNo));
}
function visibleTasks() {
  const list = tasksOf(state.projectId).filter(t => state.taskFilter === '全部' || t.status === state.taskFilter);
  return sortTasks(list);
}

function addActivity(pid, text, meta, kind = 'run') {
  if (!activities[pid]) activities[pid] = [];
  activities[pid].unshift({ time: '刚刚', kind, text, meta });
  if (activities[pid].length > 8) activities[pid].pop();
}

function defaultReqFor(pid) {
  const list = reqsOf(pid);
  return list.find(r => r.id === DEFAULT_REQ[pid])?.id || list[0]?.id || null;
}
function defaultTaskFor(pid) {
  const list = tasksOf(pid);
  return list.find(t => t.id === DEFAULT_TASK[pid])?.id || list[0]?.id || null;
}

function syncSelections() {
  const pid = state.projectId;
  const reqs = reqsOf(pid);
  if (!reqs.some(r => r.id === state.reqId)) state.reqId = defaultReqFor(pid);
  const vr = visibleReqs();
  if (vr.length && !vr.some(r => r.id === state.reqId)) state.reqId = vr[0].id;
  if (!vr.length) state.reqId = null;

  const ts = tasksOf(pid);
  if (!ts.some(t => t.id === state.taskId)) state.taskId = defaultTaskFor(pid);
  const vt = visibleTasks();
  if (vt.length && !vt.some(t => t.id === state.taskId)) state.taskId = vt[0].id;
  if (!vt.length) state.taskId = null;

  const ins = inboxOf(pid);
  if (!ins.some(i => i.id === state.inboxId)) state.inboxId = ins[0]?.id || null;
  const ms = memOf(pid);
  if (!ms.some(m => m.id === state.memoryId)) {
    state.memoryId = ms.find(m => m.status === '待复核')?.id || ms[0]?.id || null;
  }
  const pending = tasksOf(pid).filter(t => t.status === '评审');
  const hist = reviews.filter(r => r.projectId === pid);
  if (state.reviewMode === 'queue' && !pending.some(t => t.id === state.reviewTaskId)) {
    if (pending.length) state.reviewTaskId = pending[0].id;
    else if (hist.length) {
      state.reviewMode = 'history';
      state.reviewHistoryId = hist[0].id;
    } else state.reviewTaskId = null;
  }
  if (state.reviewMode === 'history' && !hist.some(r => r.id === state.reviewHistoryId)) {
    if (hist.length) state.reviewHistoryId = hist[0].id;
    else if (pending.length) {
      state.reviewMode = 'queue';
      state.reviewTaskId = pending[0].id;
    }
  }
}

/* ============================================================
   Overview
   ============================================================ */
function queueItems() {
  const pid = state.projectId;
  const rs = reqsOf(pid);
  const ts = tasksOf(pid);
  const ms = memOf(pid);
  const out = [];
  ts.filter(t => t.status === '阻塞').forEach(t => {
    const r = taskReq(t);
    out.push({
      kind: '阻塞', tone: 'red', title: t.title,
      meta: `#${r.seqNo} ${r.title} · ${t.attention || '等待解除'}`,
      age: t.updated.replace('今天 ', '').replace('昨天 ', '昨天 '),
      cta: '查看', action: `blocked:${t.id}`
    });
  });
  rs.filter(r => r.status === '待确认').forEach(r => {
    out.push({
      kind: '待确认', tone: 'amber', title: r.title,
      meta: `#${r.seqNo} · ${r.sourceNote} · ${r.priority}`,
      age: r.age, cta: '去确认', action: `confirm:${r.id}`
    });
  });
  ts.filter(t => t.status === '评审').forEach(t => {
    const r = taskReq(t);
    out.push({
      kind: '评审', tone: 'violet', title: t.title,
      meta: `#${r.seqNo} ${r.title} · 证据与尝试已就绪`,
      age: t.updated.replace('今天 ', ''), cta: '去评审', action: `review:${t.id}`
    });
  });
  ts.filter(t => t.status === '待验收').forEach(t => {
    const r = taskReq(t);
    out.push({
      kind: '验收', tone: 'amber', title: t.title,
      meta: `#${r.seqNo} ${r.title} · 等待人工验收`,
      age: t.updated.replace('昨天 ', ''), cta: '去验收', action: `accept:${t.id}`
    });
  });
  rs.filter(r => r.status === '已确认').forEach(r => {
    out.push({
      kind: '拆任务', tone: 'blue', title: r.title,
      meta: `#${r.seqNo} · ${r.sourceNote} · 已确认，可拆`,
      age: r.age, cta: '去拆', action: `split:${r.id}`
    });
  });
  const pendingMem = ms.filter(m => m.status === '待复核');
  if (pendingMem.length) {
    out.push({
      kind: '记忆', tone: '', title: `${pendingMem.length} 条记忆待复核`,
      meta: pendingMem.slice(0, 2).map(m => m.title).join(' · '),
      age: '今天', cta: '去复核', action: `memory:${pendingMem[0].id}`
    });
  }
  return out;
}

function narrative(p, c) {
  if (p.status !== '活跃') {
    return `项目已暂停，只保留交接与记忆。当前 ${c.pendingReq} 条待确认需求，不会自动派发。`;
  }
  const blockedTask = tasksOf(p.id).find(t => t.status === '阻塞');
  if (blockedTask) {
    return `今天的主要风险是「${blockedTask.title}」因${blockedTask.attention || '外部条件'}而阻塞；其余任务按节律推进。`;
  }
  const runningTask = tasksOf(p.id).find(t => t.status === '进行中');
  if (runningTask) {
    return `「${runningTask.title}」正在执行；${c.actions ? `仍有 ${c.actions} 件需要你处理。` : '人工队列是干净的。'}`;
  }
  return c.actions ? `当前没有执行线，${c.actions} 件人工动作在等你。` : '队列干净，没有需要你介入的动作。';
}

function pulseCard(p, c) {
  const runningTask = tasksOf(p.id).find(t => t.status === '进行中');
  if (!runningTask) {
    return `<div class="pulse-card">
      <div class="pc-head"><span class="live-dot"></span>执行脉搏<span class="pc-live">IDLE</span></div>
      <div class="pc-empty">${c.ready ? `没有执行线。${c.ready} 个任务在排队，等待派发。` : '没有执行线，队列已清空。'}</div>
    </div>`;
  }
  const latest = runningTask.attempts[0];
  const stages = ['接入', '实现', '自检', '报告'];
  const idx = Math.max(0, stages.indexOf(latest?.stage || '接入'));
  const track = stages.map((stage, i) => {
    const done = i < idx;
    const active = i === idx;
    return `<span class="pc-stage ${done ? 'done' : active ? 'active' : ''}">${stage}</span>${i < stages.length - 1 ? `<i class="${done ? 'done' : ''}"></i>` : ''}`;
  }).join('');
  return `<div class="pulse-card">
    <div class="pc-head"><span class="live-dot"></span>正在跑<span class="pc-live">LIVE</span></div>
    <div class="pc-title">${esc(runningTask.title)}</div>
    <div class="pc-sub">${esc(taskReq(runningTask).title)} · ${runningTask.type} · ${runningTask.priority}</div>
    <div class="pc-track">${track}</div>
    <div class="pc-stats">
      <div><b>${runningTask.runningFor || '00:00'}</b><span>已运行</span></div>
      <div><b>${latest?.tokens || '0'}</b><span>tokens</span></div>
      <div><b>${String(runningTask.attempts.length).padStart(2, '0')}</b><span>尝试</span></div>
    </div>
    <div class="pc-foot"><span class="live-dot"></span><span class="mono">${latest?.worker || '—'}</span><span>· ${latest?.lastReport || '刚刚'} 上报</span></div>
  </div>`;
}

  return `<div class="overview">
    <section class="hero">

        <div class="hero-kicker"><span class="live-dot"></span>2026.11.17 · 周二 · 10:24 快照</div>

        <p>${esc(narrative(p, c))}</p>
      </div>
      <div class="hero-rhythm">
        <div class="rhythm-head"><span>项目节律</span><span>过去 12 天</span></div>
        ${pulseBars(p, 'hero')}
        <div class="rhythm-foot"><span>${c.done} 已完成</span><span>${c.review} 待评审</span><span>${c.accept} 待验收</span></div>
      </div>
    </section>
    <div class="ov-grid">
      <section class="panel queue-panel" aria-label="待你处理">
        <header class="panel-head">
          <h3>待你处理</h3><span class="count">${c.actions}</span>
          <span class="hint">按紧急度排列</span>
        </header>
        <div class="queue-list">${rows || `<div class="empty-inline" style="margin:10px 8px">
          <b>没有待处理的动作</b><p>确认、评审、验收与记忆复核都清空了。去看运行中，或者从收件箱起一条新需求。</p>
        </div>`}</div>
        <footer class="queue-foot">
          <button type="button" data-action="goto-inbox">${icon('inbox')}收件箱 ${c.inbox} 条未处理</button>
          <span>转需求或忽略</span>
        </footer>
      </section>
      <aside class="ov-side">
        ${pulseCard(p, c)}
        <section class="panel activity-panel" aria-label="最近活动">
          <header class="panel-head"><h3>最近活动</h3><span class="hint">实时</span></header>
          <ul class="activity-list">${feed || `<li class="activity-item"><span class="ai-time">—</span><span class="ai-dot"></span><span class="ai-text">还没有活动记录。</span></li>`}</ul>
        </section>
      </aside>
    </div>
  </div>`;
}

function reqChips() {
  const rs = reqsOf(state.projectId);
  const count = status => rs.filter(r => r.status === status).length;

      data-filter-group="req" data-filter="${status}">${status}<span class="chip-n">${count(status)}</span></button>`).join('')}
  </div>`;
