function taskChips() {
  const all = `<button type="button" class="chip${state.taskFilter === '全部' ? ' is-active' : ''}" data-filter-group="task" data-filter="全部">全部</button>`;
  return `<div class="chips" role="group" aria-label="按任务状态筛选">${all}${TASK_ORDER.map(status =>
    `<button type="button" class="chip${state.taskFilter === status ? ' is-active' : ''}" data-filter-group="task" data-filter="${status}">${status}</button>`).join('')}</div>`;
}

function miniClass(status) {
  return ({ 完成: 'done', 评审: 'review', 阻塞: 'block', 待验收: 'accept', 进行中: 'run' })[status] || '';
}

function reqProgress(req) {
  const ts = tasks.filter(t => t.requirementId === req.id);
  return { ts, done: ts.filter(t => t.status === '完成').length };
}

function reqCard(r) {
  const selected = r.id === state.reqId;
  const { ts, done } = reqProgress(r);
  const blocked = ts.filter(t => t.status === '阻塞').length;
  const track = ts.length
    ? `<span class="mini-track">${ts.slice(0, 6).map(t => `<i class="${miniClass(t.status)}"></i>`).join('')}</span>`
    : '';
  return `<button type="button" class="req-card${selected ? ' is-selected' : ''}"
    data-req="${r.id}" aria-current="${selected ? 'true' : 'false'}"
    style="--rail-color:${REQ_STATUS[r.status].color}">
    <span class="rc-top">
      <span class="seq">#${r.seqNo}</span>${prioTag(r.priority)}
      <span class="rc-age">${esc(r.age)}</span>
    </span>
    <span class="rc-title">${esc(r.title)}</span>
    <span class="rc-source">${icon('inbox')}${esc(r.sourceNote)}</span>
    <span class="rc-foot">
      ${ts.length ? `${track}<span>${done}/${ts.length} 完成</span>` : '<span>尚未拆任务</span>'}
      ${blocked ? `<span class="blocked">${blocked} 阻塞</span>` : ''}
      <span style="margin-left:auto">${esc(r.updated)}</span>
    </span>
  </button>`;
}

function reqGroupHead(status, count) {
  return `<div class="group-head">
    <b><span class="gh-dot" style="background:${REQ_STATUS[status].color}"></span>${status}</b>
    <span class="gh-count">${count}</span>
    <span class="gh-desc">${REQ_STATUS[status].desc}</span>
  </div>`;
}

function reqListHTML(list) {
  if (!list.length) {
    return `<div class="empty-list">${icon('layers')}
      <b>${state.reqFilter === '全部' ? '还没有需求' : `没有「${state.reqFilter}」的需求`}</b>
      <p>${state.reqFilter === '全部' ? '从收件箱转一条，或直接新建。新需求会先落在「待确认」。' : '切回全部，或新建一条需求。'}</p>
      ${state.reqFilter !== '全部'
        ? `<button type="button" class="textlink" data-filter-group="req" data-filter="全部">${icon('refresh')}显示全部</button>`
        : `<button type="button" class="textlink" data-action="new-req">${icon('plus')}新建需求</button>`}
    </div>`;
  }
  const groups = state.reqFilter === '全部'
    ? REQ_ORDER.map(status => ({ status, items: list.filter(r => r.status === status) })).filter(g => g.items.length)
    : [{ status: state.reqFilter, items: list }];
  return groups.map(g => `<div class="group">
    ${reqGroupHead(g.status, g.items.length)}
    ${g.items.map(reqCard).join('')}
  </div>`).join('');
}

function reqTrail(status) {
  if (status === '已关闭') return `<span class="closed-trail">${icon('check')}已关闭 · 任务保留</span>`;
  const steps = ['待确认', '已确认', '已拆分'];
  const index = steps.indexOf(status);
  return steps.map((step, i) => `${i ? '<i></i>' : ''}<span class="${i < index ? 'done' : i === index ? 'active' : ''}">${step}</span>`).join('');
}

function splitPreviewHTML(value) {
  const titles = String(value || '').split(/\r?\n/).map(item => item.trim()).filter(Boolean);
  const prose = titles.length > 1 && titles.some(title => /^(以及|并且|并|和|与|或|及)/.test(title) || /[。！？]$/.test(title));
  return `<div class="split-preview">
    将拆出 <b>${titles.length}</b> 个任务${titles.length ? '' : ' · 每行一个标题'}
    ${titles.length ? `<div class="split-list">${titles.slice(0, 4).map(title => `<span class="split-token">${esc(title)}</span>`).join('')}${titles.length > 4 ? `<span class="split-token">+${titles.length - 4}</span>` : ''}</div>` : ''}
    ${prose ? '<div class="split-warning">⚠ 这些标题看起来像一段话被拆开了；如果本意是一个任务，请写在一行内。</div>' : ''}
  </div>`;
}

function splitForm(req) {
  const defaultText = SPLIT_DEFAULTS[req.id] || '';
  const defaultCount = defaultText.split(/\r?\n/).map(item => item.trim()).filter(Boolean).length;
  const defaultPriority = req.priority || project().defaultPriority;
  return `<form class="split-form" data-form="split" data-req-id="${req.id}">
    <div class="composer-head">
      <span class="tag neutral">拆任务</span>
      <h3>拆成可派发的任务</h3>
      <span class="hint">提交后需求进入「已拆分」</span>
    </div>
    <div class="field">
      <label for="split-titles">任务标题</label>
      <textarea class="textarea" id="split-titles" name="titles" data-split-titles rows="3"
        placeholder="每行一个任务；一行里的逗号、分号不会拆开">${esc(defaultText)}</textarea>
      <span class="help">标题保持可独立派发；验收标准会应用到本次拆出的全部任务。</span>
    </div>
    <div class="split-row">
      <div class="field">
        <span>任务类型</span>
        <div class="seg" role="radiogroup" aria-label="任务类型">${TASK_TYPES.map((type, i) => `<label><input type="radio" name="type" value="${type}"${i === 1 ? ' checked' : ''}><span>${type}</span></label>`).join('')}</div>
      </div>
      <div class="field">
        <span>优先级</span>
        <div class="seg" role="radiogroup" aria-label="优先级">${PRIORITIES.map(priority => `<label><input type="radio" name="priority" value="${priority}"${priority === defaultPriority ? ' checked' : ''}><span>${priority}</span></label>`).join('')}</div>
      </div>
    </div>
    <div class="field">
      <label for="split-acceptance">验收标准</label>
      <input class="input" id="split-acceptance" name="acceptance" placeholder="可选，应用到本次拆出的全部任务">
    </div>
    ${splitPreviewHTML(defaultText)}
    <div class="form-foot">
      <span class="hint"><span class="kbd">⌘</span><span class="kbd">↵</span> 提交</span>
      <button type="button" class="btn" data-action="cancel-split">取消</button>
      <button type="submit" class="btn btn-primary" data-split-submit${defaultCount ? '' : ' disabled'}>${icon('split')}${defaultCount ? `拆出 ${defaultCount} 个任务` : '拆出任务'}</button>
    </div>
  </form>`;
}

function requirementDetail(req) {
  const p = project();
  const ts = tasks.filter(t => t.requirementId === req.id).slice().sort((a, b) => a.seqNo - b.seqNo);
  const done = ts.filter(t => t.status === '完成').length;
  const splitOpen = state.splitOpen === req.id;
  const canSplit = req.status !== '已关闭';
  const actions = [];
  if (req.status === '待确认') {
    actions.push(`<button type="button" class="btn btn-primary" data-action="confirm-req">${icon('check')}确认需求</button>`);
    if (canSplit) actions.push(`<button type="button" class="btn btn-outline" data-action="open-split">${icon('split')}拆任务</button>`);
  } else if (req.status === '已确认') {
    actions.push(`<button type="button" class="btn btn-primary" data-action="open-split">${icon('split')}拆任务</button>`);
  } else if (req.status === '已拆分') {
    actions.push(`<button type="button" class="btn btn-outline" data-action="open-split">${icon('split')}追加任务</button>`);
    if (ts.length) actions.push(`<button type="button" class="btn btn-ghost" data-action="goto-task" data-id="${ts[0].id}">查看任务${icon('arrow')}</button>`);
  }
  const hint = req.status === '待确认'
    ? '建议先确认，再拆任务'
    : req.status === '已确认'
      ? '拆出的任务会先进入就绪'
      : req.status === '已拆分'
        ? '运行记录在任务页展开'
        : '需求已关闭';
  const bar = ts.length ? `<span class="comp-bar">${ts.slice(0, 8).map(t => `<i class="${miniClass(t.status)}"></i>`).join('')}</span>` : '';
  return `<article class="detail req-detail">
    <header class="detail-head">
      <div class="status-rule" style="--rule:${REQ_STATUS[req.status].color}"></div>
      <div class="dh-top">
        <span class="dh-code">需求 #${req.seqNo}</span>
        ${reqStatusTag(req.status)}${prioTag(req.priority)}
        <span class="dh-updated">更新 ${esc(req.updated)}</span>
      </div>
      <h2 class="detail-title" tabindex="-1">${esc(req.title)}</h2>
      <div class="dh-meta">
        <span class="lbl">项目</span><span>${p.code} ${esc(p.name)}</span><span class="meta-sep">·</span>
        <span class="lbl">来源</span><span>${esc(req.sourceNote)}</span><span class="meta-sep">·</span>
        <span class="lbl">任务</span><span>${ts.length} 个</span>
      </div>
      <div class="stage-trail">${reqTrail(req.status)}</div>
      <div class="detail-actions">${actions.join('')}<span class="spacer"></span><span class="hint">${hint}</span></div>
    </header>
    <div class="detail-body">
      ${p.status !== '活跃' ? `<div class="pause-banner">${icon('pause')}<span><b>项目已暂停</b> · 可以继续整理需求；恢复项目后再派发任务。</span></div>` : ''}
      <section class="dsec">
        <div class="dsec-head"><h3>需求描述</h3><span class="hint">人先定语境</span></div>
        ${req.description
          ? `<p class="prose">${esc(req.description)}</p>`
          : `<p class="prose muted">未填写描述。以来源记录为准；拆任务时把边界写进验收标准。</p>`}
        ${req.sourceQuote ? `<blockquote class="quote">“${esc(req.sourceQuote)}”<cite>${esc(req.sourceNote)} · ${esc(req.updated)}</cite></blockquote>` : ''}
      </section>
      <section class="dsec">
        <div class="dsec-head">
          <h3>任务构成</h3><span class="count">${ts.length}</span>
          ${ts.length ? `<div class="comp-progress">${bar}<span>${done} / ${ts.length} 完成</span></div>` : '<span class="hint">由需求拆出</span>'}
        </div>
        ${splitOpen ? splitForm(req) : ''}
        ${ts.length ? ts.map(t => taskLine(t)).join('') : `<div class="empty-inline">
          <b>还没有任务</b><p>拆成 1–3 个可派发的任务，先写验收标准；任务会继承需求的优先级建议。</p>
        </div>`}
      </section>
    </div>
  </article>`;
}

function renderRequirements() {
  const p = project();
  const all = reqsOf(p.id);
  const list = visibleReqs();
  const req = currentReq();
  let detailHTML;
  if (req) {
    detailHTML = requirementDetail(req);
  } else if (!list.length) {
    const emptyTitle = state.reqFilter === '全部' ? '还没有需求' : `没有「${state.reqFilter}」的需求`;
    detailHTML = emptyDetail(emptyTitle, '从抽屉新建一条，或切回全部查看已有需求。',
      state.reqFilter !== '全部'
        ? `<button type="button" class="btn btn-outline" data-filter-group="req" data-filter="全部">${icon('refresh')}显示全部</button>`
        : `<button type="button" class="btn btn-outline" data-action="new-req">${icon('plus')}新建需求</button>`);
  } else {
    detailHTML = emptyDetail('选择一个需求', '左侧按状态分组。确认、拆任务与任务构成都在这里展开。', `<span class="empty-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览需求</span>`);
  }
  return `<div class="split">
    <section class="master" aria-label="需求列表">
      <div class="master-head">
        ${projectMini(p)}
        <div class="master-title-row">
          <h2>需求</h2><span class="count">${all.length}</span>
          <button type="button" class="btn btn-primary btn-sm" data-action="new-req">${icon('plus')}新建</button>
        </div>
        ${reqChips()}
      </div>
      <div class="master-scroll">${reqListHTML(list)}</div>
      <div class="master-foot">
        <span>${list.length} / ${all.length} 条</span>
        <span class="foot-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览</span>
      </div>
    </section>
    <section class="detail" aria-label="需求详情">${detailHTML}</section>
  </div>`;
}

/* ============================================================
   Tasks
   ============================================================ */
function taskLine(t) {
  const st = TASK_STATUS[t.status] || TASK_STATUS['就绪'];
  return `<button type="button" class="task-line" data-action="goto-task" data-id="${t.id}">
    <span class="task-line-rail" style="background:${st.color}"></span>
    <span class="task-line-main">
      <span class="task-line-title">${esc(t.title)}</span>
      <span class="task-line-meta">${taskStatusTag(t.status)}<span class="tag outline">${t.type}</span>${prioTag(t.priority)}</span>
    </span>
    <span class="task-line-side">${icon('chevron')}</span>
  </button>`;
}

function taskCard(t) {
  const req = taskReq(t);
  const selected = t.id === state.taskId;
  const latest = t.attempts[0];
  const foot = t.status === '阻塞'
    ? `<span class="tc-alert">${icon('alert')}${esc(t.attention || '等待解除')}</span><span class="stamp">${esc(t.updated)}</span>`
    : `<span>${t.status === '进行中' ? `阶段 ${latest?.stage || '接入'} · ${t.runningFor || '00:00'}` : t.status === '完成' ? `验收 ${esc(t.acceptedBy || '姚')} · ${esc(t.acceptedAt || '')}` : `更新 ${esc(t.updated)}`}</span>`;
  return `<button type="button" class="task-card${selected ? ' is-selected' : ''}${t.status === '阻塞' ? ' attention' : ''}"
    data-task="${t.id}" aria-current="${selected ? 'true' : 'false'}" style="--rail-color:${TASK_STATUS[t.status].color}">
    <span class="tc-top">
      ${taskStatusTag(t.status)}<span class="tag outline">${t.type}</span>${prioTag(t.priority)}
      <span class="tc-code">${t.code}</span>
    </span>
    <span class="tc-title">${esc(t.title)}</span>
    <span class="tc-req">${icon('layers')}#${req.seqNo} ${esc(req.title)}</span>
    <span class="tc-foot">${foot}</span>
  </button>`;
}

function taskGroupHead(status, count) {
  return `<div class="group-head">
    <b><span class="gh-dot" style="background:${TASK_STATUS[status].color}"></span>${status}</b>
    <span class="gh-count">${count}</span>
    <span class="gh-desc">${TASK_STATUS[status].desc}</span>
  </div>`;
}

function taskListHTML(list) {
  const all = tasksOf(state.projectId);
  if (!all.length) {
    return `<div class="empty-list">${icon('layers')}
      <b>这个项目还没有任务</b>
      <p>任务由需求拆出。先去需求页确认一个需求，再把它拆成可派发的任务。</p>
      <button type="button" class="textlink" data-tab="requirements">${icon('layers')}去需求页</button>
    </div>`;
  }
  if (!list.length) {
    return `<div class="empty-list">${icon('activity')}
      <b>没有「${state.taskFilter}」的任务</b>
      <p>当前筛选下没有任务。切回全部，或用顶部状态条查看别的状态。</p>
      <button type="button" class="textlink" data-filter-group="task" data-filter="全部">${icon('refresh')}显示全部</button>
    </div>`;
  }
  const groups = state.taskFilter === '全部'
    ? TASK_ORDER.map(status => ({ status, items: list.filter(t => t.status === status) })).filter(g => g.items.length)
    : [{ status: state.taskFilter, items: list }];
  return groups.map(g => `<div class="group">
    ${taskGroupHead(g.status, g.items.length)}
    ${g.items.map(taskCard).join('')}
  </div>`).join('');
}

function attemptStatusTag(status) {
  const cls = { 运行中: 'run', 结束: 'done', 阻塞: 'block', 失败: 'block', 就绪: 'idle', 取消: 'quiet' }[status] || 'quiet';
  return `<span class="status ${cls}"><span class="dot"></span>${status}</span>`;
}

function taskTrail(status) {
  if (status === '阻塞') return `<span class="closed-trail" style="color:var(--danger)">${icon('alert')}阻塞 · 等待外部条件</span>`;
  if (status === '取消') return `<span class="closed-trail">${icon('x')}已取消</span>`;
  const steps = ['就绪', '进行中', '评审', '待验收', '完成'];
  const index = steps.indexOf(status);
  return steps.map((step, i) => `${i ? '<i></i>' : ''}<span class="${i < index ? 'done' : i === index ? 'active' : ''}">${step}</span>`).join('');
}

function attemptCard(task, attempt) {
  const stages = ['接入', '实现', '自检', '报告'];
  const idx = Math.max(0, stages.indexOf(attempt.stage || '接入'));
  const bad = attempt.status === '阻塞' || attempt.status === '失败';
  const track = stages.map((stage, i) => {
    const done = i < idx;
    const active = i === idx;
    return `<span class="${done ? 'done' : active ? `active${bad ? ' bad' : ''}` : ''}">${stage}</span>${i < stages.length - 1 ? `<i class="${done ? 'done' : ''}"></i>` : ''}`;
  }).join('');
  return `<div class="attempt${attempt.status === '运行中' ? ' is-active' : bad ? ' is-blocked' : ''}">
    <div class="attempt-head">
      <span class="at-num">尝试 ${pad2(attempt.n)}</span>
      ${attemptStatusTag(attempt.status)}
      <span class="at-stage">阶段 ${attempt.stage}</span>
    </div>
    <div class="stage-track">${track}</div>
    <div class="at-meta">
      <span class="mono">${esc(attempt.worker || '—')}</span>
      <span>开始 ${esc(attempt.created)}</span>
      <span>${attempt.ended ? `结束 ${esc(attempt.ended)}` : `最近报告 ${esc(attempt.lastReport || '—')}`}</span>
      <span>${esc(attempt.tokens || '0')} tokens</span>
    </div>
    ${attempt.note ? `<p class="at-note">${esc(attempt.note)}</p>` : ''}
    ${attempt.attention ? `<div class="attention">${icon('alert')}<span>${esc(attempt.attention)}</span></div>` : ''}
  </div>`;
}

function artifactCode(artifact) {
  const extension = extOf(artifact.uri, '');
  if (extension) return extension;
  return ({ 文档: 'DOC', 代码: 'CODE', 证据: 'EV', 复盘: 'RPT' })[artifact.type] || 'FILE';
}

function artifactCard(artifact) {
  return `<div class="evidence">
    <div class="ev-head">
      <span class="ev-type">${artifactCode(artifact)}</span>
      <span class="ev-title" title="${esc(artifact.title)}">${esc(artifact.title)}</span>
      <span class="tag outline">${esc(artifact.type)}</span>
    </div>
    ${artifact.note ? `<p class="ev-note">${esc(artifact.note)}</p>` : ''}
    <div class="ev-foot"><span class="mono" title="${esc(artifact.uri)}">${esc(shortUri(artifact.uri))}</span><span class="stamp">${esc(artifact.time)}</span></div>
  </div>`;
}

function reviewCard(rv) {
  return `<div class="review-card">
    <div class="rv-head">
      <span class="tag ${rv.decision === '通过' ? 'green' : 'red'}">${rv.decision}</span>
      <span>${esc(rv.reviewer || '未署名')}</span>
      <span class="rv-who">${esc(rv.time)}</span>
    </div>
    ${rv.comments ? `<p class="rv-comments">${esc(rv.comments)}</p>` : ''}
  </div>`;
}

function reviewForm(task, always = false) {
  return `<form class="review-form" data-form="review" data-task-id="${task.id}">
    <div class="rf-row">
      <div class="field">
        <span>评审结论</span>
        <div class="seg" role="radiogroup" aria-label="评审结论">
          <label><input type="radio" name="decision" value="通过" checked><span>通过</span></label>
          <label><input type="radio" name="decision" value="退回"><span>退回</span></label>
        </div>
      </div>
      <div class="field">
        <span>评审人</span>
        <input class="input" name="reviewer" value="姚" autocomplete="off" aria-label="评审人">
      </div>
    </div>
    <div class="field">
      <label for="review-${task.id}">评审意见</label>
      <textarea class="textarea" id="review-${task.id}" name="comments" rows="3" placeholder="通过或退回的理由；退回必填"></textarea>
    </div>
    <div class="form-foot">
      <span class="hint">通过 → 待验收 · 退回 → 进行中</span>
      ${always ? '' : `<button type="button" class="btn" data-action="cancel-review">取消</button>`}
      <button type="submit" class="btn btn-primary">提交评审</button>
    </div>
  </form>`;
}

function reviewSection(task) {
  const canReview = task.status === '评审';
  const pending = canReview
    ? state.reviewOpen
      ? reviewForm(task)
      : `<div class="review-pending">
          <span class="rp-title">${icon('review')}等待评审</span>
          <p>尝试已结束，证据已就绪。通过会进入待验收；退回需写清理由。</p>
          <button type="button" class="btn btn-sm btn-outline" data-action="open-review">开始评审</button>
        </div>`
    : '';
  return `<div class="dsec">
    <div class="dsec-head"><h3>评审</h3><span class="count">${task.reviews.length}</span><span class="hint">人工关口</span></div>
    ${task.reviews.length ? task.reviews.map(reviewCard).join('') : ''}
    ${!task.reviews.length && !canReview ? `<div class="empty-inline"><b>暂无评审</b><p>任务进入评审后，这里会出现评审人与结论。</p></div>` : ''}
    ${pending}
  </div>`;
}

function taskDetail(task) {
  const req = taskReq(task);
  const parent = projectById(task.projectId);
  const paused = parent && parent.status !== '活跃';
  const latest = task.attempts[0];
  const actions = [];
  let hint = '';
  if (task.status === '阻塞') {
    actions.push(paused
      ? `<button type="button" class="btn btn-outline" disabled title="项目已暂停">${icon('refresh')}重试</button>`
      : `<button type="button" class="btn btn-primary" data-action="retry-task">${icon('refresh')}重试</button>`);
    hint = paused ? '项目暂停中，恢复后才能派发' : '解除权限后重试会新建一次尝试';
  } else if (task.status === '评审') {
    actions.push(`<button type="button" class="btn btn-primary" data-action="open-review">${icon('review')}评审</button>`);
    hint = '结论会写回任务状态';
  } else if (task.status === '待验收') {
    actions.push(`<button type="button" class="btn btn-primary" data-action="accept-task">${icon('check')}验收</button>`);
    hint = '验收后任务完成';
  } else if (task.status === '就绪') {
    actions.push(paused
      ? `<button type="button" class="btn btn-outline" disabled title="项目已暂停">${icon('play')}派发</button>`
      : `<button type="button" class="btn btn-primary" data-action="dispatch-task">${icon('play')}派发</button>`);
    hint = paused ? '项目暂停中，恢复后才能派发' : '派发后生成第一次尝试';
  } else if (task.status === '进行中') {
    actions.push(`<span class="head-state"><span class="live-dot"></span>Worker 执行中 · ${task.runningFor || '00:00'}</span>`);
    hint = latest?.lastReport ? `最近报告 ${latest.lastReport}` : '';
  } else if (task.status === '完成') {
    actions.push(`<span class="head-state">${icon('check')}已验收 · ${esc(task.acceptedBy || '姚')} · ${esc(task.acceptedAt || '')}</span>`);
  }
  return `<article class="detail task-detail">
    <header class="detail-head">
      <div class="status-rule" style="--rule:${TASK_STATUS[task.status].color}"></div>
      <div class="dh-top">
        <span class="dh-code">${task.code}</span>
        ${taskStatusTag(task.status)}<span class="tag outline">${task.type}</span>${prioTag(task.priority)}
        <span class="dh-updated">更新 ${esc(task.updated)}</span>
      </div>
      <h2 class="detail-title" tabindex="-1">${esc(task.title)}</h2>
      <div class="dh-meta">
        <button type="button" class="meta-link" data-action="goto-req" data-id="${req.id}" title="打开需求">
          ${icon('layers')}#${req.seqNo} ${esc(req.title)}
        </button>
        <span class="meta-sep">·</span><span>${task.type}</span>
        <span class="meta-sep">·</span><span>${task.autoDispatch ? '自动派发' : '手动派发'}</span>
      </div>
      <div class="stage-trail">${taskTrail(task.status)}</div>
      <div class="detail-actions">${actions.join('')}<span class="spacer"></span><span class="hint">${hint}</span></div>
    </header>
    <div class="detail-body">
      ${paused ? `<div class="pause-banner">${icon('pause')}<span><b>项目已暂停</b> · 可以查看记录与证据；恢复项目后才能派发或重试。</span></div>` : ''}
      ${task.status === '阻塞' ? `<div class="blocked-banner">
        <span class="bb-icon">${icon('alert')}</span>
        <div><b>执行被阻塞</b><p>${esc(task.attention || '等待外部条件解除。')}</p></div>
      </div>` : ''}
      <div class="dsec">
        <div class="summary-grid">
          <div class="sum-card">
            <div class="sum-label">${icon('target')}验收标准</div>
            <p title="${esc(task.acceptance || '')}">${esc(task.acceptance || '未填写验收标准。')}</p>
          </div>
          <div class="sum-card">
            <div class="sum-label">${icon('file')}规格${task.spec ? `<span class="tag green">${task.spec.status}</span>` : ''}</div>
            <p title="${esc(task.spec?.content || '')}">${task.spec ? esc(task.spec.content) : '未设规格。先有人定目标与边界，再派发。'}</p>
          </div>
        </div>
      </div>
      <div class="dsec">
        <div class="dsec-head"><h3>执行尝试</h3><span class="count">${task.attempts.length}</span><span class="hint">运行记录仅在此处</span></div>
        ${task.attempts.length ? task.attempts.map(attempt => attemptCard(task, attempt)).join('') : `<div class="empty-inline">
          <b>尚未派发</b><p>派发后会记录每次尝试、阶段、Worker Session 与最近报告。</p>
        </div>`}
      </div>
      <div class="dsec">
        <div class="dsec-head"><h3>证据</h3><span class="count">${task.artifacts.length}</span><span class="hint">只读产物</span></div>
        ${task.artifacts.length ? `<div class="evidence-grid">${task.artifacts.map(artifactCard).join('')}</div>` : `<div class="empty-inline">
          <b>暂无证据</b><p>Worker 上报的日志、截图、代码与文档会归档在这里。</p>
        </div>`}
      </div>
      ${reviewSection(task)}
      ${task.triage.length ? `<details class="fold"${task.status === '阻塞' ? ' open' : ''}>
        <summary>排查步骤<span class="count">${task.triage.length}</span><span class="hint">取证 → 假设 → 根因</span><span class="chev">${icon('chevron')}</span></summary>
        <div class="fold-body">${task.triage.map(step => `<div class="triage-step"><b>${step.stage}</b><span>${esc(step.content)}</span></div>`).join('')}</div>
      </details>` : ''}
      ${task.events.length ? `<details class="fold">
        <summary>事件记录<span class="count">${task.events.length}</span><span class="chev">${icon('chevron')}</span></summary>
        <div class="fold-body">${task.events.map(event => `<div class="event-row">
          <span class="mono">${esc(event.type)}</span><span class="actor">${esc(event.actor)}</span><span class="time">${esc(event.time)}</span>
        </div>`).join('')}</div>
      </details>` : ''}
      <div class="detail-danger">
        <span>软删除会保留运行记录、证据与审计，但从列表和统计中移除。</span>
        <button type="button" class="danger-link" data-action="delete-task">${icon('trash')}删除任务</button>
      </div>
    </div>
  </article>`;
}

function emptyDetail(title, text, extra = '') {
  return `<div class="empty-detail"><div class="empty-detail-inner">
    <span class="empty-glyph">${icon('target')}</span>
    <h3>${esc(title)}</h3><p>${esc(text)}</p>${extra}
    <span class="empty-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览列表</span>
  </div></div>`;
}

function emptyTaskPage(p) {
  const c = countsFor(p.id);
  return `<div class="page-scroll empty-page">
    <section class="empty-work">
      <div class="empty-work-head">
        <span class="empty-glyph">${icon('layers')}</span>
        <div>
          <div class="hero-kicker">${p.code} · ${esc(p.name)}</div>
          <h2>任务由需求拆出</h2>
          <p>这个项目还没有任务。先把一条需求确认，再拆成可派发的任务；派发后才会产生执行尝试、证据与评审。</p>
        </div>
      </div>
      <div class="flow-steps">
        <div class="flow-step"><span>01</span><b>确认需求</b><p>人先定语境、优先级与来源。</p></div>
        <i></i>
        <div class="flow-step"><span>02</span><b>拆成任务</b><p>每行一个任务，写验收标准。</p></div>
        <i></i>
        <div class="flow-step"><span>03</span><b>派发 Worker</b><p>尝试、证据与评审只在详情出现。</p></div>
      </div>
      <div class="empty-work-actions">
        <button type="button" class="btn btn-primary" data-tab="requirements">${icon('layers')}去需求页确认</button>
        <button type="button" class="btn btn-outline" data-action="new-req">${icon('plus')}新建需求</button>
      </div>
      <div class="empty-work-foot">当前项目 ${c.reqs} 个需求 · ${c.pendingReq} 待确认 · 0 个任务 · ${c.memoryPending} 条记忆待复核</div>
    </section>
  </div>`;
}

function renderTasks() {
  const p = project();
  const all = tasksOf(p.id);
  const list = visibleTasks();
  const task = currentTask();
  if (!all.length) return emptyTaskPage(p);
  let detailHTML;
  if (task) {
    detailHTML = taskDetail(task);
  } else if (!list.length) {
    detailHTML = emptyDetail('没有可显示的任务', '调整左侧状态筛选，或切回全部。');
  } else {
    detailHTML = emptyDetail('选择一个任务', '运行记录、证据与评审只在右侧展开；执行尝试不会进入左侧列表。');
  }
  return `<div class="split">
    <section class="master" aria-label="任务列表">
      <div class="master-head">
        ${projectMini(p)}
        <div class="master-title-row">
          <h2>任务</h2><span class="count">${all.length}</span>
          <span class="micro">由需求拆出</span>
        </div>
        ${taskChips()}
      </div>
      <div class="master-scroll">${taskListHTML(list)}</div>
      <div class="master-foot">
        <span>${list.length} / ${all.length} 条 · ${countsFor(p.id).blocked} 阻塞</span>
        <span class="foot-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览</span>
      </div>
    </section>
    <section class="detail" aria-label="任务详情">${detailHTML}</section>
  </div>`;
}

/* ============================================================
   Inbox
   ============================================================ */
function inboxCard(item) {
  const selected = item.id === state.inboxId;
  return `<button type="button" class="inbox-card${selected ? ' is-selected' : ''}"
    data-inbox="${item.id}" aria-current="${selected ? 'true' : 'false'}">
    <span class="ic-top"><span class="channel">${item.channel}</span><span class="ic-time">${esc(item.received)}</span></span>
    <span class="ic-contact">${esc(item.contact || '未留联系人')}</span>
    <span class="ic-preview">${esc(item.rawContext || '（无上下文）')}</span>
    <span class="mc-foot"><span>${esc(item.externalRef || '—')}</span><span style="margin-left:auto">关联 ${project().code}</span></span>
  </button>`;
}

function firstSentence(text, max = 46) {
  const value = String(text || '').split(/[。！？\n]/)[0].trim();
  return value.length > max ? `${value.slice(0, max)}…` : value;
}

function renderInbox() {
  const p = project();
  const items = inboxOf(p.id);
  const item = currentInbox();
  const list = items.length ? `<div class="group">
    <div class="group-head"><b><span class="gh-dot" style="background:var(--info)"></span>未处理</b>
      <span class="gh-count">${items.length}</span><span class="gh-desc">等待分流</span></div>
    ${items.map(inboxCard).join('')}
  </div>` : `<div class="empty-list">${icon('inbox')}
    <b>收件箱已清空</b><p>新的企微、邮件、电话或同事转述会落在这里，等你还原成需求。</p>
  </div>`;
  const detail = item ? `<article class="detail inbox-detail">
    <header class="detail-head">
      <div class="status-rule" style="--rule:var(--info)"></div>
      <div class="dh-top">
        <span class="channel">${item.channel}</span>
        <span class="dh-code">${esc(item.received)}</span>
        <button type="button" class="textlink" style="margin-left:auto;color:var(--danger)" data-action="ignore-inbox" data-id="${item.id}">忽略此条</button>
      </div>
      <h2 class="detail-title" tabindex="-1">${esc(item.contact || '未留联系人')}</h2>
      <p class="detail-sub">关联 ${p.code} ${esc(p.name)}<span class="dot-sep">·</span>${esc(item.externalRef || '无外部引用')}</p>
    </header>
    <div class="detail-body">
      <section class="dsec">
        <div class="dsec-head"><h3>原始上下文</h3><span class="hint">未处理 · 只读</span></div>
        <blockquote class="quote">“${esc(item.rawContext || '无上下文')}”<cite>${item.channel} · ${esc(item.contact || '未知')} · ${esc(item.received)}</cite></blockquote>
      </section>
      <section class="dsec">
        <form class="triage-form" data-form="triage" data-inbox-id="${item.id}">
          <div class="composer-head">
            <span class="tag blue">转需求</span>
            <h3>建立需求</h3>
            <span class="hint">建立后进入「待确认」</span>
          </div>
          <div class="project-lock">
            <span class="code">${p.code}</span>
            <span class="pl-copy"><b>${esc(p.name)}</b><span>需求会归入当前项目；切换项目请用左侧项目栏。</span></span>
            ${healthBadge(p)}
          </div>
          <div class="field">
            <label for="triage-title">需求标题</label>
            <input class="input" id="triage-title" name="title" value="${esc(firstSentence(item.rawContext))}" required>
          </div>
          <div class="field">
            <span>优先级</span>
            <div class="seg" role="radiogroup" aria-label="优先级">${PRIORITIES.map(priority => `<label><input type="radio" name="priority" value="${priority}"${priority === 'P2' ? ' checked' : ''}><span>${priority}</span></label>`).join('')}</div>
          </div>
          <div class="field">
            <label for="triage-desc">描述</label>
            <textarea class="textarea" id="triage-desc" name="description" rows="3">${esc(item.rawContext || '')}</textarea>
          </div>
          <div class="form-foot">
            <span class="hint">来源会记录为 ${item.channel} · ${esc(item.contact || '未知')}</span>
            <button type="submit" class="btn btn-primary">${icon('plus')}建立需求</button>
          </div>
        </form>
      </section>
    </div>
  </article>` : emptyDetail(
    items.length ? '选择一条收件' : '收件箱已清空',
    items.length
      ? '把企微、邮件或电话里的原话转成需求，或先忽略。转出的需求会进入待确认。'
      : '新的企微、邮件、电话或同事转述会落在这里，等你还原成需求。');
  return `<div class="split">
    <section class="master" aria-label="收件箱列表">
      <div class="master-head">
        ${projectMini(p)}
        <div class="master-title-row"><h2>收件箱</h2><span class="count">${items.length}</span><span class="micro">未处理</span></div>
      </div>
      <div class="master-scroll">${list}</div>
      <div class="master-foot"><span>${items.length} 条未处理</span><span class="foot-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览</span></div>

/* ============================================================
   Memory
   ============================================================ */
function memoryCard(mem) {
  const selected = mem.id === state.memoryId;
  const statusClass = mem.status === '待复核' ? 'amber' : mem.status === '已确认' ? 'green' : 'neutral';
  return `<button type="button" class="mem-card${selected ? ' is-selected' : ''}"
    data-memory="${mem.id}" aria-current="${selected ? 'true' : 'false'}">
    <span class="mc-top">
      <span class="tag outline">${mem.type}</span>
      <span class="tag ${statusClass}">${mem.status}</span>
    </span>
    <span class="mc-title">${esc(mem.title)}</span>
    <span class="mem-source">${icon('link')}${esc(mem.sourceType)}${mem.sourceRef ? ` · ${esc(mem.sourceRef)}` : ''}</span>
    <span class="mc-foot"><span>${mem.tags.slice(0, 3).join(' / ')}</span><span class="mc-time">${esc(mem.updated)}</span></span>
  </button>`;
}

function renderMemory() {
  const p = project();
  const items = memOf(p.id);
  const mem = currentMemory();
  const order = ['待复核', '已确认', '已废弃'];
  const grouped = order.map(status => ({ status, items: items.filter(m => m.status === status) })).filter(group => group.items.length);
  const list = items.length ? grouped.map(group => `<div class="group">
    <div class="group-head"><b><span class="gh-dot" style="background:${group.status === '待复核' ? 'var(--warn)' : group.status === '已确认' ? 'var(--run)' : 'var(--text-4)'}"></span>${group.status}</b>
      <span class="gh-count">${group.items.length}</span><span class="gh-desc">${group.status === '待复核' ? '需要你确认' : group.status === '已确认' ? '可被引用' : '不再引用'}</span></div>
    ${group.items.map(memoryCard).join('')}
  </div>`).join('') : `<div class="empty-list">${icon('book')}
    <b>这个项目还没有记忆</b><p>任务结束、会话复盘或人工沉淀后，记忆会先进入「待复核」。</p>
  </div>`;
  let detail;
  if (mem) {
    const sourceTask = tasks.find(t => t.projectId === p.id && t.code === mem.sourceRef);
    const refs = mem.refs.length ? mem.refs.map(ref => `<div class="ref-row">
      ${icon('link')}<span class="mono">${esc(ref.path)}</span>
      <span class="ref-state ${ref.state}">${esc(ref.label)}</span>
    </div>`).join('') : `<div class="empty-inline"><b>没有引用文件</b><p>这条记忆还没有绑定代码或文档引用。</p></div>`;
    detail = `<article class="detail memory-detail">
      <header class="detail-head">
        <div class="status-rule" style="--rule:${mem.status === '待复核' ? 'var(--warn)' : mem.status === '已确认' ? 'var(--run)' : 'var(--text-4)'}"></div>
        <div class="dh-top">
          <span class="dh-code">记忆 · ${mem.type}</span>
          <span class="tag ${mem.status === '待复核' ? 'amber' : mem.status === '已确认' ? 'green' : 'neutral'}">${mem.status}</span>
          <span class="dh-updated">更新 ${esc(mem.updated)}</span>
        </div>
        <h2 class="detail-title" tabindex="-1">${esc(mem.title)}</h2>
        <div class="dh-meta">
          <span class="lbl">项目</span><span>${p.code} ${esc(p.name)}</span><span class="meta-sep">·</span>
          <span class="lbl">来源</span>${sourceTask
            ? `<button type="button" class="meta-link" data-action="goto-task" data-id="${sourceTask.id}">${icon('target')}${esc(mem.sourceType)} · ${esc(mem.sourceRef)}</button>`
            : `<span>${esc(mem.sourceType)}${mem.sourceRef ? ` · ${esc(mem.sourceRef)}` : ''}</span>`}
          <span class="meta-sep">·</span><span class="lbl">校验</span><span>${esc(mem.lastVerified || '未校验')}</span>
        </div>
        <div class="detail-actions" style="margin-top:9px">
          ${mem.status === '待复核'
            ? `<button type="button" class="btn btn-primary" data-action="confirm-memory">${icon('check')}确认记忆</button>
               <button type="button" class="btn btn-outline" data-action="reject-memory">退回</button>`
            : mem.status === '已确认'
              ? `<span class="confirmed-line">${icon('check')}${esc(mem.confirmedBy || '姚')} 于 ${esc(mem.confirmedAt || mem.updated)} 确认</span>`
              : `<span class="confirmed-line" style="color:var(--text-4)">${icon('x')}已废弃，不再被任务引用</span>`}
        </div>
      </header>
      <div class="detail-body">
        ${mem.status === '待复核' ? `<div class="memory-callout">${icon('alert')}确认前请对照来源与引用；确认后才会被后续任务引用，退回则标记为已废弃。</div>` : ''}
        <section class="dsec">
          <div class="dsec-head"><h3>记忆内容</h3><span class="hint">由人确认后生效</span></div>
          <p class="prose">${esc(mem.content)}</p>
          <div class="tag-row" style="margin-top:8px">${mem.tags.map(tag => `<span class="tag outline">${esc(tag)}</span>`).join('')}</div>
        </section>
        <section class="dsec">
          <div class="dsec-head"><h3>来源与引用</h3><span class="count">${mem.refs.length}</span><span class="hint">引用失效需复核</span></div>
          <div class="mem-meta">
            <span>来源 ${esc(mem.sourceType)}${mem.sourceRef ? ` · ${esc(mem.sourceRef)}` : ''}</span>
            <span>最近校验 ${esc(mem.lastVerified || '—')}</span>
            <span>确认人 ${esc(mem.confirmedBy || '—')}</span>
          </div>
          <div class="mem-refs" style="margin-top:6px">${refs}</div>
        </section>
      </div>
    </article>`;
  } else {
    detail = emptyDetail(
      items.length ? '选择一条记忆' : '还没有记忆',
      items.length
        ? '待复核、已确认与已废弃的记忆都在左侧分组。确认前先看来源和引用。'
        : '任务结束、会话复盘或人工沉淀后，记忆会先进入「待复核」。');
  }
  return `<div class="split">
    <section class="master" aria-label="记忆列表">
      <div class="master-head">
        ${projectMini(p)}
        <div class="master-title-row"><h2>记忆</h2><span class="count">${items.length}</span><span class="micro">${countsFor(p.id).memoryPending} 待复核</span></div>
      </div>
      <div class="master-scroll">${list}</div>
      <div class="master-foot"><span>${items.length} 条 · ${countsFor(p.id).memoryPending} 待复核</span><span class="foot-keys"><span class="kbd">J</span><span class="kbd">K</span> 浏览</span></div>
    </section>
    <section class="detail" aria-label="记忆详情">${detail}</section>
  </div>`;
}

/* ============================================================
   Reviews
   ============================================================ */
function reviewQueueCard(task) {

    <span class="rq-top">${taskStatusTag(task.status)}${prioTag(task.priority)}<span class="rq-time">${esc(task.updated)}</span></span>
    <span class="rq-title">${esc(task.title)}</span>
    <span class="rq-req">#${req.seqNo} ${esc(req.title)}</span>
    <span class="rq-foot">${icon('file')}${task.artifacts.length} 件证据<span style="margin-left:auto">${task.attempts.length} 次尝试 · 等你</span></span>

function historyRow(rv) {

}

function reviewGroupHead(label, count, color, desc) {

    <span class="gh-count">${count}</span><span class="gh-desc">${desc}</span></div>`;
}

      <h2 class="detail-title" tabindex="-1">${esc(task.title)}</h2>

        <span class="meta-sep">·</span><span>${task.type}</span><span class="meta-sep">·</span><span>${task.artifacts.length} 件证据</span>
      </div>
      <div class="detail-actions">
        <button type="button" class="btn btn-outline" data-action="goto-task" data-id="${task.id}">在任务中查看${icon('external')}</button>
        <span class="spacer"></span><span class="hint">结论会写回任务</span>
      </div>
    </header>
    <div class="detail-body">
      <div class="dsec">
        <div class="summary-grid">
          <div class="sum-card">
            <div class="sum-label">${icon('target')}验收标准</div>
            <p title="${esc(task.acceptance || '')}">${esc(task.acceptance || '未填写验收标准。')}</p>
          </div>
          <div class="sum-card">
            <div class="sum-label">${icon('activity')}最近一次尝试</div>
            <p>${latest ? `${latest.status} · 阶段 ${latest.stage} · ${latest.ended || latest.lastReport}<br><span class="mono">${esc(latest.worker || '—')}</span> · ${esc(latest.tokens || '0')} tokens` : '还没有执行尝试。'}</p>
          </div>
        </div>

function renderReviews() {

const TABS = ['overview', 'projects', 'requirements', 'tasks', 'inbox', 'memory', 'reviews'];

function showToast(message, tone = 'ok') {
  const el = $('#toast');
  if (!el) return;
  clearTimeout(toastTimer);
  el.className = `toast show${tone === 'ok' ? '' : ` ${tone}`}`;
  el.innerHTML = `${icon(tone === 'ok' ? 'check' : 'alert')}<span>${esc(message)}</span>`;
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3400);
}

function rememberFocus() {
  const active = document.activeElement;
  if (active && active !== document.body && typeof active.focus === 'function') state.lastFocus = active;
}
function restoreFocus() {
  const el = state.lastFocus;
  if (el && document.contains(el)) requestAnimationFrame(() => el.focus({ preventScroll: true }));
}
function scrollInto(selector) {
  requestAnimationFrame(() => {
    const el = $(selector);
    if (el) el.scrollIntoView({ block: 'nearest' });
  });
}

function closeDrawer() {
  state.drawerOpen = false;
  renderOverlay();
  restoreFocus();
}
function openDrawer() {
  if (state.drawerOpen) return;
  rememberFocus();
  state.paletteOpen = false;
  state.drawerOpen = true;
  renderOverlay();
}
function openPalette() {
  if (state.drawerOpen || state.deleteTaskId) return;
  rememberFocus();
  state.paletteOpen = true;
  state.paletteQuery = '';
  state.paletteIndex = 0;
  renderOverlay();
}
function closePalette() {
  state.paletteOpen = false;
  state.paletteQuery = '';
  renderOverlay();
  restoreFocus();
}
function openDeleteForCurrent() {
  const task = currentTask();
  if (!task) return;
  rememberFocus();
  state.deleteTaskId = task.id;
  renderOverlay();
}
function closeDelete() {
  state.deleteTaskId = null;
  renderOverlay();
  restoreFocus();
}

/* ---------- command palette ---------- */
function paletteItems() {
  const p = project();
  const c = countsFor(p.id);
  const items = [];
  const push = (group, label, hint, iconName, run) => items.push({ group, label, hint, icon: iconName, run });

  push('操作', '新建需求', 'N', 'plus', () => { closePalette(); openDrawer(); });
  if (c.blocked) push('操作', '查看阻塞任务', `${c.blocked} 个`, 'alert', () => {
    closePalette(); state.tab = 'tasks'; state.taskFilter = '阻塞'; state.reviewOpen = false; syncSelections(); renderAll(); scrollInto('.task-card.is-selected');
  });
  if (c.inbox) push('操作', '处理收件箱', `${c.inbox} 条未处理`, 'inbox', () => {
    closePalette(); state.tab = 'inbox'; syncSelections(); renderAll();
  });
  if (c.memoryPending) push('操作', '复核待处理记忆', `${c.memoryPending} 条`, 'book', () => {
    closePalette(); focusPendingMemory();
  });
  push('操作', '检查记忆引用', `${c.memory} 条记忆`, 'refresh', () => { closePalette(); verifyMemory(); });

  reqsOf(p.id).forEach(r => push('需求', `#${r.seqNo} ${r.title}`, r.status, 'layers', () => {
    closePalette(); openReq(r.id);
  }));
  tasksOf(p.id).forEach(t => push('任务', t.title, `${t.status} · ${t.code}`, 'target', () => {
    closePalette(); openTask(t.id);
  }));
  projects.filter(item => item.id !== p.id).forEach(item => push('项目', `${item.code} ${item.name}`, `${item.status} · 切换`, 'grid', () => {
    closePalette(); state.tab = 'overview'; selectProject(item.id);
  }));

  const query = state.paletteQuery.trim().toLowerCase();
  const filtered = query
    ? items.filter(item => `${item.group} ${item.label} ${item.hint}`.toLowerCase().includes(query))
    : items;
  return filtered.slice(0, 36);
}

function paletteListHTML() {
  paletteCache = paletteItems();
  if (state.paletteIndex >= paletteCache.length) state.paletteIndex = Math.max(0, paletteCache.length - 1);
  if (!paletteCache.length) return `<div class="palette-empty">没有匹配的需求、任务或命令。试试项目代码，或按 Esc 关闭。</div>`;
  let lastGroup = '';
  return paletteCache.map((item, index) => {
    const group = item.group !== lastGroup ? `<div class="pal-group">${item.group}</div>` : '';
    lastGroup = item.group;
    return `${group}<button type="button" class="pal-item${index === state.paletteIndex ? ' is-selected' : ''}" data-palette-index="${index}">
      <span class="pal-icon">${icon(item.icon)}</span>
      <span class="pal-label">${esc(item.label)}</span>
      <span class="pal-hint">${esc(item.hint)}</span>
    </button>`;
  }).join('');
}

function renderPaletteList() {
  const list = $('#palette-list');
  if (!list) return;
  list.innerHTML = paletteListHTML();
  requestAnimationFrame(() => $('.pal-item.is-selected')?.scrollIntoView({ block: 'nearest' }));
}

function executePalette(index) {
  const items = paletteItems();
  const item = items[index];
  if (item) item.run();
}

/* ---------- navigation and selection ---------- */
function setTab(tab) {
  state.tab = tab;
  state.splitOpen = null;
  state.reviewOpen = false;
  if (tab === 'requirements') state.reqFilter = '全部';
  if (tab === 'tasks') state.taskFilter = '全部';
  syncSelections();
  renderAll();
}

function selectProject(id) {
  if (!projectById(id) || id === state.projectId) return;
  state.projectId = id;
  state.reqFilter = '全部';
  state.taskFilter = '全部';
  state.reqId = null;
  state.taskId = null;
  state.inboxId = null;
  state.memoryId = null;
  state.reviewMode = 'queue';
  state.reviewTaskId = null;
  state.reviewHistoryId = null;
  state.splitOpen = null;
  state.reviewOpen = false;
  state.memoryCheck = null;
  syncSelections();
  renderAll();
}

function openReq(id, options = {}) {
  const req = reqById(id);
  if (!req) return;
  state.projectId = req.projectId;
  state.tab = 'requirements';
  state.reqFilter = '全部';
  state.reqId = id;
  state.reviewOpen = false;
  state.splitOpen = options.split ? id : null;
  syncSelections();
  renderAll();
  scrollInto('.req-card.is-selected');
  if (options.split) {
    requestAnimationFrame(() => {
      const field = $('[data-split-titles]');
      if (field) {
        field.focus({ preventScroll: true });
        field.setSelectionRange(field.value.length, field.value.length);
        field.scrollIntoView({ block: 'center' });
      }
    });
  }
}

function openTask(id, options = {}) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  state.projectId = task.projectId;
  state.tab = 'tasks';
  state.taskFilter = '全部';
  state.taskId = id;
  state.reviewOpen = !!options.review && task.status === '评审';
  state.splitOpen = null;
  syncSelections();
  renderAll();
  scrollInto('.task-card.is-selected');
  if (options.review && task.status === '评审') {
    requestAnimationFrame(() => {
      const form = $('.review-form');
      if (form) {
        form.scrollIntoView({ block: 'center' });
        form.querySelector('textarea')?.focus({ preventScroll: true });
      }
    });
  }
}

function openMemory(id) {
  const mem = memories.find(m => m.id === id);
  if (!mem) return;
  state.projectId = mem.projectId;
  state.tab = 'memory';
  state.memoryId = id;
  syncSelections();
  renderAll();
  scrollInto('.mem-card.is-selected');
}

function openInbox(id) {
  const item = inboxItems.find(i => i.id === id);
  if (!item) return;
  state.projectId = item.projectId;
  state.tab = 'inbox';
  state.inboxId = id;
  syncSelections();
  renderAll();
  scrollInto('.inbox-card.is-selected');
}

function goTaskFilter(status) {
  state.tab = 'tasks';
  state.taskFilter = status;
  state.reviewOpen = false;
  state.splitOpen = null;
  syncSelections();
  renderAll();
  scrollInto('.task-card.is-selected');
}

function focusPendingMemory() {
  state.tab = 'memory';
  const pending = memOf(state.projectId).filter(mem => mem.status === '待复核');
  if (pending.length) state.memoryId = pending[0].id;
  syncSelections();
  renderAll();
  scrollInto('.mem-card.is-selected');
}

function moveSelection(delta) {
  if (state.tab === 'requirements') {
    const list = visibleReqs();
    if (!list.length) return;
    let index = list.findIndex(r => r.id === state.reqId);
    if (index < 0) index = 0;
    index = (index + delta + list.length) % list.length;
    state.reqId = list[index].id;
    state.splitOpen = null;
    renderAll();
    scrollInto('.req-card.is-selected');
    return;
  }
  if (state.tab === 'tasks') {
    const list = visibleTasks();
    if (!list.length) return;
    let index = list.findIndex(t => t.id === state.taskId);
    if (index < 0) index = 0;
    index = (index + delta + list.length) % list.length;
    state.taskId = list[index].id;
    state.reviewOpen = false;
    renderAll();
    scrollInto('.task-card.is-selected');
    return;
  }
  if (state.tab === 'inbox') {
    const list = inboxOf(state.projectId);
    if (!list.length) return;
    let index = list.findIndex(i => i.id === state.inboxId);
    if (index < 0) index = 0;
    index = (index + delta + list.length) % list.length;
    state.inboxId = list[index].id;
    renderAll();
    scrollInto('.inbox-card.is-selected');
    return;
  }
  if (state.tab === 'memory') {
    const list = memOf(state.projectId);
    if (!list.length) return;
    let index = list.findIndex(m => m.id === state.memoryId);
    if (index < 0) index = 0;
    index = (index + delta + list.length) % list.length;
    state.memoryId = list[index].id;
    renderAll();
    scrollInto('.mem-card.is-selected');
    return;
  }
  if (state.tab === 'reviews') {
    const pending = tasksOf(state.projectId).filter(t => t.status === '评审');
    const history = reviews.filter(r => r.projectId === state.projectId);
    if (state.reviewMode === 'queue' && pending.length) {
      let index = pending.findIndex(t => t.id === state.reviewTaskId);
      if (index < 0) index = 0;
      index = (index + delta + pending.length) % pending.length;
      state.reviewTaskId = pending[index].id;
      renderAll();
      scrollInto('.rev-queue-card.is-selected');
    } else if (history.length) {
      state.reviewMode = 'history';
      let index = history.findIndex(r => r.id === state.reviewHistoryId);
      if (index < 0) index = 0;
      index = (index + delta + history.length) % history.length;
      state.reviewHistoryId = history[index].id;
      renderAll();
      scrollInto('.hist-row.is-selected');
    }
  }
}

function updateNewSubmit() {
  const input = $('#new-title');
  const submit = $('#new-submit');
  if (input && submit) submit.disabled = !input.value.trim();
}

function fillExample() {
  const form = $('#new-req-form');
  if (!form) return;
  const example = EXAMPLES[state.projectId] || EXAMPLES['p-demo'];
  const title = form.querySelector('[name="title"]');
  const source = form.querySelector('[name="sourceNote"]');
  const description = form.querySelector('[name="description"]');
  if (title) title.value = example.title;
  if (source) source.value = example.sourceNote;
  if (description) description.value = example.description;
  const radio = form.querySelector(`[name="priority"][value="${example.priority}"]`);
  if (radio) radio.checked = true;
  updateNewSubmit();
  title?.focus();
}

function submitNewRequirement(form) {
  const data = new FormData(form);
  const title = String(data.get('title') || '').trim();
  if (!title) return;
  const p = project();
  const seqNo = Math.max(0, ...reqsOf(p.id).map(r => r.seqNo)) + 1;
  const req = {
    id: uid('r'),
    projectId: p.id,
    seqNo,
    title,
    status: '待确认',
    priority: String(data.get('priority') || p.defaultPriority),
    sourceNote: String(data.get('sourceNote') || '').trim() || '手动记录',
    sourceQuote: null,
    description: String(data.get('description') || '').trim() || null,
    updated: '刚刚',
    age: '刚刚'
  };
  requirements.unshift(req);
  addActivity(p.id, `新建需求 #${seqNo}「${title}」`, '姚 · 手动记录', 'inbox');
  state.reqId = req.id;
  state.reqFilter = '全部';
  state.tab = 'requirements';
  state.splitOpen = null;
  state.reviewOpen = false;
  state.drawerOpen = false;
  syncSelections();
  renderAll();
  renderOverlay();
  showToast(`已创建需求 #${seqNo}，等待确认`);
  requestAnimationFrame(() => $('.detail-title')?.focus());
}

function submitSplit(form) {
  const req = reqById(form.dataset.reqId);
  if (!req) return;
  const data = new FormData(form);
  const titles = String(data.get('titles') || '').split(/\r?\n/).map(item => item.trim()).filter(Boolean);
  if (!titles.length) return;
  const type = String(data.get('type') || '开发');
  const priority = String(data.get('priority') || req.priority || project().defaultPriority);
  const acceptance = String(data.get('acceptance') || '').trim() || null;
  const existing = tasks.filter(t => t.requirementId === req.id);
  const suffixBase = Math.max(0, ...existing.map(task => {
    const match = task.code.match(/-(\d+)$/);
    return match ? Number(match[1]) : 0;
  }));
  const seqBase = Math.max(0, ...tasksOf(req.projectId).map(task => task.seqNo));
  titles.forEach((title, index) => {
    tasks.push({
      id: uid('t'),
      projectId: req.projectId,
      requirementId: req.id,
      seqNo: seqBase + index + 1,
      code: `T-${String(req.seqNo).padStart(3, '0')}-${pad2(suffixBase + index + 1)}`,
      title, type, status: '就绪', priority, acceptance,
      description: null, spec: null,
      currentAttemptId: null, autoDispatch: false,
      acceptedBy: null, acceptedAt: null,
      updated: '刚刚', attention: null, runningFor: null,
      attempts: [], artifacts: [], reviews: [], triage: [], events: []
    });
  });
  req.status = '已拆分';
  req.updated = '刚刚';
  req.age = '刚刚';
  addActivity(req.projectId, `需求 #${req.seqNo} 拆出 ${titles.length} 个任务`, '姚 · 拆分', 'run');
  state.splitOpen = null;
  state.taskFilter = '全部';
  if (!state.taskId) state.taskId = tasks.find(t => t.requirementId === req.id)?.id || null;
  syncSelections();
  renderAll();
  showToast(`已拆出 ${titles.length} 个任务，需求 #${req.seqNo} 进入已拆分`);
}

function submitTriage(form) {
  const item = inboxItems.find(i => i.id === form.dataset.inboxId);
  if (!item) return;
  const data = new FormData(form);
  const title = String(data.get('title') || '').trim();
  if (!title) return;
  const p = projectById(item.projectId) || project();
  const seqNo = Math.max(0, ...reqsOf(p.id).map(r => r.seqNo)) + 1;
  const description = String(data.get('description') || '').trim();
  const req = {
    id: uid('r'),
    projectId: p.id,
    seqNo,
    title,
    status: '待确认',
    priority: String(data.get('priority') || p.defaultPriority),
    sourceNote: `${item.channel} · ${item.contact || '未知'}`,
    sourceQuote: item.rawContext,
    description: description && description !== String(item.rawContext || '').trim() ? description : null,
    updated: '刚刚',
    age: '刚刚'
  };
  requirements.unshift(req);
  inboxItems = inboxItems.filter(entry => entry.id !== item.id);
  state.inboxId = inboxOf(state.projectId)[0]?.id || null;
  addActivity(p.id, `收件转为需求 #${seqNo}「${title}」`, `${item.channel} · ${item.contact || '未知'}`, 'inbox');
  syncSelections();
  renderAll();
  showToast(`已建立需求 #${seqNo}，收件已移出队列`);
}

function ignoreInbox(id) {
  const item = inboxItems.find(entry => entry.id === id);
  if (!item) return;
  inboxItems = inboxItems.filter(entry => entry.id !== id);
  addActivity(item.projectId, `忽略收件：${item.contact || '未知联系人'}`, item.channel, 'inbox');
  state.inboxId = inboxOf(state.projectId)[0]?.id || null;
  syncSelections();
  renderAll();
  showToast('已忽略这条收件；记录仍保留在来源系统');
}

function confirmRequirement() {
  const req = currentReq();
  if (!req || req.status !== '待确认') return;
  req.status = '已确认';
  req.updated = '刚刚';
  req.age = '刚刚';
  addActivity(req.projectId, `确认需求 #${req.seqNo}「${req.title}」`, '姚 · 人工确认', 'done');
  syncSelections();
  renderAll();
  showToast(`需求 #${req.seqNo} 已确认，可以拆任务了`);
  scrollInto('.req-card.is-selected');
}

function openSplit() {
  const req = currentReq();
  if (!req || req.status === '已关闭') return;
  state.splitOpen = req.id;
  state.reviewOpen = false;
  renderAll();
  requestAnimationFrame(() => {
    const field = $('[data-split-titles]');
    if (field) {
      field.focus({ preventScroll: true });
      field.setSelectionRange(field.value.length, field.value.length);
      field.scrollIntoView({ block: 'center' });
    }
  });
}

function dispatchTask(retry) {
  const task = currentTask();
  if (!task) return;
  const parent = projectById(task.projectId);
  if (parent && parent.status !== '活跃') {
    showToast('项目已暂停，恢复后才能派发任务', 'warn');
    return;
  }
  if (retry && task.status !== '阻塞') return;
  if (!retry && task.status !== '就绪') return;
  const attempt = {
    n: task.attempts.length + 1,
    status: '运行中',
    stage: '接入',
    worker: `w-${Math.random().toString(16).slice(2, 8)}`,
    created: '刚刚',
    lastReport: '刚刚',
    ended: null,
    tokens: '0',
    note: retry ? '已重新派发，等待 Worker 接入。' : '已派发，等待 Worker 接入。',
    attention: null
  };
  task.attempts.unshift(attempt);
  task.status = '进行中';
  task.attention = null;
  task.updated = '刚刚';
  task.runningFor = '00:00';
  addActivity(task.projectId, `${retry ? '重试' : '派发'}「${task.title}」`, '姚 · 主控会话', 'run');
  syncSelections();
  renderAll();
  showToast(retry ? `已重新派发「${task.title}」` : `已派发「${task.title}」`);
}

function acceptTask() {
  const task = currentTask();
  if (!task || task.status !== '待验收') return;
  task.status = '完成';
  task.acceptedBy = '姚';
  task.acceptedAt = '刚刚';
  task.updated = '刚刚';
  addActivity(task.projectId, `验收通过「${task.title}」`, '姚 · 人工验收', 'done');
  syncSelections();
  renderAll();
  showToast(`已验收「${task.title}」`);
}

function submitReview(form) {
  const task = tasks.find(t => t.id === form.dataset.taskId);
  if (!task) return;
  const data = new FormData(form);
  const decision = String(data.get('decision') || '通过');
  const comments = String(data.get('comments') || '').trim();
  const reviewer = String(data.get('reviewer') || '').trim() || '姚';
  if (decision === '退回' && !comments) {
    showToast('退回需要填写评审意见', 'warn');
    form.querySelector('textarea')?.focus();
    return;
  }
  const review = {
    id: uid('rv'),
    projectId: task.projectId,
    taskId: task.id,
    taskTitle: task.title,
    reviewer,
    decision,
    comments,
    createdAt: '刚刚'
  };
  reviews.unshift(review);
  task.reviews.unshift({ decision, reviewer, comments, time: '刚刚' });
  task.status = decision === '通过' ? '待验收' : '进行中';
  task.updated = '刚刚';
  task.attention = decision === '退回' ? `评审退回：${comments}` : null;
  addActivity(task.projectId, `评审${decision}「${task.title}」`, `${reviewer}${comments ? ` · ${comments.slice(0, 24)}` : ''}`, 'review');
  state.reviewOpen = false;
  state.reviewMode = 'history';
  state.reviewHistoryId = review.id;
  syncSelections();
  renderAll();
  showToast(decision === '通过' ? '评审通过，任务进入待验收' : '已退回，任务回到进行中');
  scrollInto('.detail-title');
}

function confirmDelete() {
  const task = tasks.find(t => t.id === state.deleteTaskId);
  if (!task) { closeDelete(); return; }
  tasks = tasks.filter(t => t.id !== task.id);
  if (state.taskId === task.id) state.taskId = null;
  if (state.reviewTaskId === task.id) state.reviewTaskId = null;
  state.deleteTaskId = null;
  addActivity(task.projectId, `删除任务「${task.title}」，运行记录与证据保留`, '姚 · 软删除', 'block');
  syncSelections();
  renderAll();
  renderOverlay();
  showToast('已删除任务；运行记录、证据与审计保留');
}

function verifyMemory() {
  const p = project();
  const entries = memOf(p.id);
  const refs = entries.flatMap(entry => entry.refs);
  const bad = refs.filter(ref => ref.state !== 'ok').length;
  if (!refs.length) {
    showToast('当前项目没有可检查的记忆引用', 'warn');
    return;
  }
  addActivity(p.id, `检查记忆引用：${refs.length} 条，${bad} 条需关注`, '姚 · 引用校验', 'review');
  renderAll();
  showToast(`已检查 ${refs.length} 条引用：${bad} 条失效或待复核`);
}

function confirmMemory() {
  const mem = currentMemory();
  if (!mem || mem.status !== '待复核') return;
  mem.status = '已确认';
  mem.confirmedBy = '姚';
  mem.confirmedAt = '刚刚';
  mem.updated = '刚刚';
  mem.lastVerified = '刚刚';
  addActivity(mem.projectId, `确认记忆「${mem.title}」`, '姚 · 人工确认', 'done');
  syncSelections();
  renderAll();
  showToast('记忆已确认，后续任务可以引用');
}

function rejectMemory() {
  const mem = currentMemory();
  if (!mem || mem.status !== '待复核') return;
  mem.status = '已废弃';
  mem.updated = '刚刚';
  addActivity(mem.projectId, `退回记忆「${mem.title}」`, '姚 · 不再引用', 'block');
  syncSelections();
  renderAll();
  showToast('记忆已退回并标记为废弃，不再被任务引用');
}

/* ============================================================
   Event wiring
   ============================================================ */
function handleAction(action, el) {
  switch (action) {
    case 'new-req': openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'fill-example': fillExample(); break;
    case 'confirm-req': confirmRequirement(); break;
    case 'open-split': openSplit(); break;
    case 'cancel-split': state.splitOpen = null; renderAll(); break;
    case 'goto-task': openTask(el.dataset.id); break;
    case 'goto-req': openReq(el.dataset.id || currentTask()?.requirementId); break;
    case 'drawer-open-req':
      state.drawerOpen = false;
      renderOverlay();
      openReq(el.dataset.id);
      break;
    case 'open-review':
      state.reviewOpen = true;
      renderAll();
      requestAnimationFrame(() => {
        const form = $('.review-form');
        if (form) {
          form.scrollIntoView({ block: 'center' });
          form.querySelector('textarea')?.focus({ preventScroll: true });
        }
      });
      break;
    case 'cancel-review': state.reviewOpen = false; renderAll(); break;
    case 'dispatch-task': dispatchTask(false); break;
    case 'retry-task': dispatchTask(true); break;
    case 'accept-task': acceptTask(); break;
    case 'delete-task': openDeleteForCurrent(); break;
    case 'close-delete': closeDelete(); break;
    case 'confirm-delete': confirmDelete(); break;
    case 'verify-memory': verifyMemory(); break;
    case 'confirm-memory': confirmMemory(); break;
    case 'reject-memory': rejectMemory(); break;
    case 'ignore-inbox': ignoreInbox(el.dataset.id); break;
    case 'open-palette': openPalette(); break;
    case 'close-palette': closePalette(); break;
    case 'goto-inbox': setTab('inbox'); break;
    default: break;
  }
}

document.addEventListener('click', event => {
  const el = event.target.closest('[data-action],[data-tab],[data-project],[data-project-go],[data-filter-group],[data-metric],[data-queue],[data-req],[data-task],[data-memory],[data-inbox],[data-review-task],[data-review-history],[data-palette-index]');
  if (!el) return;

  if (el.dataset.paletteIndex !== undefined) {
    executePalette(Number(el.dataset.paletteIndex));
    return;
  }
  if (el.dataset.action) {
    handleAction(el.dataset.action, el);
    return;
  }
  if (el.dataset.tab) { setTab(el.dataset.tab); return; }
  if (el.dataset.project) { selectProject(el.dataset.project); return; }
  if (el.dataset.projectGo) {
    state.tab = 'overview';
    selectProject(el.dataset.projectGo);
    return;
  }
  if (el.dataset.filterGroup === 'req') {
    state.reqFilter = el.dataset.filter;
    state.splitOpen = null;
    syncSelections();
    renderAll();
    scrollInto('.req-card.is-selected');
    return;
  }
  if (el.dataset.filterGroup === 'task') {
    state.taskFilter = el.dataset.filter;
    state.reviewOpen = false;
    syncSelections();
    renderAll();
    scrollInto('.task-card.is-selected');
    return;
  }
  if (el.dataset.metric) {
    const metric = el.dataset.metric;
    if (metric === 'memory') {
      focusPendingMemory();
    } else {
      goTaskFilter(metric === 'running' ? '进行中' : metric === 'queued' ? '就绪' : '阻塞');
    }
    return;
  }
  if (el.dataset.queue) {
    const [kind, id] = el.dataset.queue.split(':');
    if (kind === 'blocked') openTask(id);
    else if (kind === 'confirm') openReq(id);
    else if (kind === 'split') openReq(id, { split: true });
    else if (kind === 'review') openTask(id, { review: true });
    else if (kind === 'accept') openTask(id);
    else if (kind === 'memory') openMemory(id);
    return;
  }
  if (el.dataset.req) { openReq(el.dataset.req); return; }
  if (el.dataset.task) { openTask(el.dataset.task); return; }
  if (el.dataset.memory) {
    state.memoryId = el.dataset.memory;
    renderAll();
    scrollInto('.mem-card.is-selected');
    return;
  }
  if (el.dataset.inbox) {
    state.inboxId = el.dataset.inbox;
    renderAll();
    scrollInto('.inbox-card.is-selected');
    return;
  }
  if (el.dataset.reviewTask) {
    state.reviewMode = 'queue';
    state.reviewTaskId = el.dataset.reviewTask;
    renderAll();
    scrollInto('.rev-queue-card.is-selected');
    return;
  }
  if (el.dataset.reviewHistory) {
    state.reviewMode = 'history';
    state.reviewHistoryId = el.dataset.reviewHistory;
    renderAll();
    scrollInto('.hist-row.is-selected');
  }
});

document.addEventListener('submit', event => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  switch (form.dataset.form) {
    case 'new-requirement': submitNewRequirement(form); break;
    case 'split': submitSplit(form); break;
    case 'triage': submitTriage(form); break;
    case 'review': submitReview(form); break;
    default: break;
  }
});

document.addEventListener('input', event => {
  if (event.target.id === 'new-title') updateNewSubmit();
  if (event.target.matches('[data-split-titles]')) {
    const form = event.target.closest('.split-form');
    if (form) {
      const value = event.target.value;
      const titles = value.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
      const preview = form.querySelector('.split-preview');
      if (preview) preview.outerHTML = splitPreviewHTML(value);
      const submit = form.querySelector('[data-split-submit]');
      if (submit) {
        submit.disabled = !titles.length;
        submit.innerHTML = `${icon('split')}${titles.length ? `拆出 ${titles.length} 个任务` : '拆出任务'}`;
      }
    }
  }
  if (event.target.id === 'palette-input') {
    state.paletteQuery = event.target.value;
    state.paletteIndex = 0;
    renderPaletteList();
  }
});

document.addEventListener('keydown', event => {
  const active = document.activeElement;
  const typing = active && (/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName) || active.isContentEditable);

  if (state.paletteOpen) {
    if (event.key === 'Escape') { event.preventDefault(); closePalette(); return; }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const items = paletteItems();
      if (!items.length) return;
      state.paletteIndex = (state.paletteIndex + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      renderPaletteList();
      return;
    }
    if (event.key === 'Enter') {
      event.preventDefault();
      executePalette(state.paletteIndex);
      return;
    }
    return;
  }

  if (state.deleteTaskId) {
    if (event.key === 'Escape') { event.preventDefault(); closeDelete(); }
    return;
  }
  if (state.drawerOpen) {
    if (event.key === 'Escape') { event.preventDefault(); closeDrawer(); return; }
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      $('#new-req-form')?.requestSubmit();
    }
    return;
  }

  if (event.key === 'Escape') {
    if (state.splitOpen) { event.preventDefault(); state.splitOpen = null; renderAll(); return; }
    if (state.reviewOpen) { event.preventDefault(); state.reviewOpen = false; renderAll(); return; }
    return;
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    openPalette();
    return;
  }
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
    const form = active?.closest?.('form[data-form]') || (state.splitOpen ? $('.split-form') : null) || (state.reviewOpen ? $('.review-form') : null);
    if (form) {
      event.preventDefault();
      form.requestSubmit();
    }
    return;
  }
  if (typing) return;
  if (event.key === '/') { event.preventDefault(); openPalette(); return; }
  if (event.key.toLowerCase() === 'n') { event.preventDefault(); openDrawer(); return; }
  if (/^[1-7]$/.test(event.key)) {
    event.preventDefault();
    setTab(TABS[Number(event.key) - 1]);
    return;
  }
  if (event.key.toLowerCase() === 'j' || event.key.toLowerCase() === 'k') {
    event.preventDefault();
    moveSelection(event.key.toLowerCase() === 'j' ? 1 : -1);
  }
});

/* ---------- boot ----------
   Query parameters are a prototype convenience for deep-linking into a state:
   ?tab=requirements&project=p-demo&req=r-demo-4&split=1
   ?tab=tasks&task=t-demo-2&review=1 / ?drawer=1 / ?palette=1 / ?delete=<taskId>
   In React these map to route params, not component state. */
const initialQuery = new URLSearchParams(location.search);
const queryProject = projects.find(item => item.id === initialQuery.get('project') ||
  item.code.toLowerCase() === String(initialQuery.get('project') || '').toLowerCase() ||
  item.slug.toLowerCase() === String(initialQuery.get('project') || '').toLowerCase());
if (queryProject) state.projectId = queryProject.id;
if (TABS.includes(initialQuery.get('tab'))) state.tab = initialQuery.get('tab');
if (initialQuery.get('req')) state.reqId = initialQuery.get('req');
if (initialQuery.get('task')) state.taskId = initialQuery.get('task');
syncSelections();
if (initialQuery.get('split')) state.splitOpen = state.reqId;
if (initialQuery.get('review')) state.reviewOpen = true;
if (initialQuery.get('drawer')) state.drawerOpen = true;
if (initialQuery.get('palette')) state.paletteOpen = true;
if (initialQuery.get('delete')) state.deleteTaskId = initialQuery.get('delete');
renderAll();
if (state.drawerOpen || state.paletteOpen || state.deleteTaskId) renderOverlay();





</script>
