<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 需求</title>
<style>
/* ==========================================================================
   00 · Final synthesis
   01 persistent project context + 03 dense split workspace + 04 board canvas
   Self-contained: system fonts, inline SVG, mock data only.
   ========================================================================== */
:root {
  --paper: #f6f3ec;
  --paper-2: #faf8f2;
  --paper-3: #f0ece2;
  --panel: #fffdf9;
  --panel-2: #f8f5ee;
  --line: #e3ddd1;
  --line-2: #efeae0;
  --line-strong: #cec5b5;
  --ink: #20251f;
  --ink-2: #596159;
  --ink-3: #858c82;
  --ink-4: #a7ada3;
  --accent: #2547e8;
  --accent-deep: #1b37c4;
  --accent-soft: #eef1ff;
  --accent-line: #d6ddff;
  --green: #2f7a58;
  --green-bg: #e8f1ea;
  --amber: #9a6c1e;
  --amber-bg: #f7efdd;
  --red: #a9432f;
  --red-bg: #f8e7e1;
  --violet: #6656a4;
  --violet-bg: #efedf8;
  --slate: #47687a;
  --slate-bg: #eaf0f3;
  --muted-ink: #737a6d;
  --muted-bg: #eeeee6;
  --ink-fill: #252b24;
  --mono: "SFMono-Regular", "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --shadow-1: 0 1px 1px rgba(52, 43, 28, .04), 0 6px 18px -14px rgba(52, 43, 28, .34);
  --shadow-2: 0 18px 48px -16px rgba(40, 33, 22, .28), 0 2px 8px rgba(40, 33, 22, .06);
  --shadow-3: 0 28px 90px -24px rgba(32, 27, 19, .38), 0 3px 12px rgba(32, 27, 19, .08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-width: 1080px;
  color: var(--ink);
  background: #e3ded2;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select, textarea { outline: none; }
h1, h2, h3, h4, p, dl, dd, dt, ul, ol, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }
svg { display: block; flex: none; }
::selection { background: #dbe1ff; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb {
  background: #c9c1b1; border-radius: 9px;
  border: 2px solid transparent; background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover { background: #b6ad9b; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-track { background: transparent; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic {
  width: 14px; height: 14px; flex: none; display: block;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.spacer { flex: 1; }

/* ---------------- Shell ---------------- */
.app {
  height: 100vh; height: 100dvh;
  display: grid; grid-template-columns: 216px minmax(0, 1fr);
  overflow: hidden;
  background: var(--paper);
}
.main {
  min-width: 0; min-height: 0;
  display: grid; grid-template-rows: 54px auto minmax(0, 1fr) 26px;
  background: var(--paper);
}
.view { position: relative; min-height: 0; overflow: hidden; background: var(--paper); }

/* ---------------- Rail ---------------- */
.rail {
  min-height: 0; display: flex; flex-direction: column;
  background:
    radial-gradient(rgba(92, 78, 55, .045) .6px, transparent .7px) 0 0 / 17px 17px,
    linear-gradient(180deg, #f1ede4, #ece7db);
  border-right: 1px solid var(--line);
}
.brand { flex: none; height: 56px; display: flex; align-items: center; gap: 9px; padding: 0 14px; }
.brand-mark {
  width: 30px; height: 30px; flex: none; padding: 6px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px;
  border-radius: 8px; background: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(255, 250, 240, .14), 0 2px 6px rgba(30, 25, 17, .16);
}
.brand-mark i { display: block; border-radius: 1.5px; background: #f6eee0; }
.brand-mark i:nth-child(2) { background: var(--accent); }
.brand-mark i:nth-child(3) { background: #cdb18a; }
.brand-mark i:nth-child(4) { background: #746b5c; }
.brand-copy { min-width: 0; }
.brand-copy b { display: block; font-size: 13px; line-height: 17px; font-weight: 650; letter-spacing: .01em; }
.brand-copy span {
  display: block; margin-top: 1px; font-family: var(--mono);
  font-size: 8px; line-height: 10px; letter-spacing: .13em; color: var(--ink-4);
}
.rail-scroll { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 12px; scrollbar-width: thin; }
.rail-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 6px 7px; font-size: 8.5px; line-height: 12px; font-weight: 650;
  letter-spacing: .13em; color: var(--ink-4); text-transform: uppercase;
}
.rail-label span { letter-spacing: 0; font-family: var(--mono); font-weight: 400; color: var(--ink-4); }
.rail-all {
  width: 100%; height: 34px; display: flex; align-items: center; gap: 8px;
  padding: 0 9px; margin-bottom: 5px;
  border: 1px solid transparent; border-radius: 7px;
  color: var(--ink-2); font-size: 11.5px; text-align: left;
}
.rail-all:hover { background: rgba(255, 253, 249, .6); }
.rail-all.is-active { background: rgba(255, 253, 249, .92); border-color: var(--line-strong); box-shadow: inset 2px 0 0 var(--accent), var(--shadow-1); }
.rail-all .ic { width: 13px; height: 13px; color: var(--ink-3); }
.rail-all.is-active .ic { color: var(--accent); }
.rail-all .ra-count { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); }
.rail-all.is-active .ra-count { color: var(--ink-2); }
.project-card {
  position: relative; width: 100%; display: flex; flex-direction: column; gap: 5px;
  margin-bottom: 5px; padding: 9px 9px 8px 11px;
  border: 1px solid transparent; border-radius: 8px;
  color: inherit; text-align: left;
  transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.project-card:hover { background: rgba(255, 253, 249, .55); }
.project-card.is-active {
  background: var(--panel); border-color: var(--line-strong);
  box-shadow: inset 2px 0 0 var(--accent), var(--shadow-1);
}
.pc-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.pc-code {
  flex: none; padding: 1px 4px; border-radius: 3px;
  background: rgba(32, 37, 31, .06); color: var(--ink-2);
  font-family: var(--mono); font-size: 8px; line-height: 13px; letter-spacing: .04em;
}
.project-card.is-active .pc-code { background: var(--ink); color: #f5f0e5; }
.pc-health { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 8.5px; color: var(--ink-4); white-space: nowrap; }
.pc-health .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.pc-health.warn { color: var(--amber); }
.pc-health.ok { color: var(--green); }
.pc-name { font-size: 11.5px; line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-spark { height: 13px; color: #9aab9c; opacity: .85; }
.project-card.is-active .pc-spark { color: #6f9781; opacity: 1; }
.pc-spark .spark { height: 13px; gap: 2px; }
.pc-meta { display: flex; align-items: center; gap: 7px; font-size: 8.5px; color: var(--ink-4); white-space: nowrap; }
.pc-meta b { font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pc-meta .blocked { color: var(--red); }

.spark { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 24px; }
.spark i { flex: 1; min-width: 2px; max-width: 7px; border-radius: 1.5px; background: currentColor; opacity: .32; }
.spark i.on { opacity: .76; }
.spark i.hot { opacity: .95; }

.rail-summary { margin: 12px 5px 0; padding-top: 10px; border-top: 1px solid rgba(146, 132, 108, .28); }
.rs-title { font-size: 8px; line-height: 11px; font-weight: 650; letter-spacing: .12em; color: var(--ink-4); text-transform: uppercase; }
.rs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; }
.rs-grid b { display: block; font-size: 15px; line-height: 18px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rs-grid span { display: block; margin-top: 0; font-size: 8px; line-height: 11px; color: var(--ink-4); }
.rs-foot { display: flex; align-items: center; gap: 5px; margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(146, 132, 108, .22); font-size: 8px; color: var(--ink-4); }
.live-dot { width: 5px; height: 5px; flex: none; display: inline-block; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px rgba(47, 122, 88, .12); }
.live-dot.amber { background: var(--amber); box-shadow: 0 0 0 2px rgba(154, 108, 30, .12); }

.rail-foot { flex: none; padding: 0 8px 9px; }
.rail-system {
  margin: 0 1px 8px; padding: 8px 9px 7px;
  border: 1px dashed #c9c0ae; border-radius: 7px;
  background: rgba(255, 253, 249, .32);
}
.rsys-title { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; font-size: 7.5px; line-height: 10px; font-weight: 650; letter-spacing: .09em; color: var(--ink-4); text-transform: uppercase; }
.rsys-title .ic { width: 10px; height: 10px; }
.rsys-row { display: flex; justify-content: space-between; gap: 6px; padding: 1.5px 0; font-size: 8.5px; color: var(--ink-4); }
.rsys-row b { font-weight: 500; color: var(--ink-2); font-family: var(--mono); font-size: 8px; }
.sys-link {
  display: flex; align-items: center; gap: 3px; width: 100%; margin-top: 5px; padding-top: 5px;
  border-top: 1px solid rgba(146, 132, 108, .22); color: var(--ink-2); font-size: 8.5px;
}
.sys-link:hover { color: var(--accent); }
.sys-link .ic { width: 10px; height: 10px; margin-left: auto; color: var(--ink-4); }
.operator { display: flex; align-items: center; gap: 7px; padding: 2px 5px 0; }
.avatar {
  width: 18px; height: 18px; flex: none; display: inline-grid; place-items: center;
  border-radius: 50%; background: #e9e2d4; color: #6b6254;
  font-size: 8px; font-weight: 650; line-height: 1;
  box-shadow: inset 0 0 0 1px rgba(90, 74, 51, .06);
}
.avatar.a1 { background: #e6ece3; color: #4f6b56; }
.avatar.a2 { background: #ece4dc; color: #8a5c45; }
.avatar.a3 { background: #e4e9ef; color: #4c647b; }
.avatar.a4 { background: #ece6ef; color: #6c597e; }
.avatar.lg { width: 23px; height: 23px; font-size: 10px; }
.operator-copy { min-width: 0; }
.operator-copy b { display: block; font-size: 9.5px; line-height: 13px; font-weight: 550; }
.operator-copy span { display: block; font-size: 8px; line-height: 11px; color: var(--ink-4); }
.operator .kbd { margin-left: auto; }

/* ---------------- Project context bar ---------------- */
.projectbar {
  position: relative; z-index: 30;
  min-width: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 13px;
  background: rgba(251, 249, 243, .94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.pb-left { min-width: 0; display: flex; align-items: center; gap: 6px; }
.pb-switch-wrap { position: relative; flex: none; }
.pb-switch {
  height: 32px; display: flex; align-items: center; gap: 6px;
  padding: 0 7px; border: 1px solid var(--line-strong); border-radius: 7px;
  background: var(--panel); box-shadow: 0 1px 1px rgba(55, 44, 28, .04);
  text-align: left;
}
.pb-switch:hover { border-color: #bdb3a1; }
.pb-switch[aria-expanded="true"] { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.pb-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--p-color, var(--accent)); }
.pb-code { font-family: var(--mono); font-size: 8.5px; font-weight: 650; letter-spacing: .04em; color: var(--ink-2); }
.pb-switch .pb-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; font-weight: 600; }
.pb-switch .ic { width: 11px; height: 11px; color: var(--ink-4); }
.pb-status { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; font-size: 9px; color: var(--ink-3); white-space: nowrap; }
.pb-status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.pb-status.paused .dot { background: var(--ink-4); }
.tag {
  display: inline-flex; align-items: center; height: 18px; padding: 0 5px;
  border: 1px solid var(--line); border-radius: 3px;
  background: rgba(255, 253, 249, .5); color: var(--ink-3);
  font-size: 8.5px; line-height: 1; white-space: nowrap;
}
.tag.solid { border-color: transparent; background: var(--muted-bg); color: var(--ink-2); }
.tag.accent { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-deep); }
.tag.red { border-color: transparent; background: var(--red-bg); color: var(--red); }
.tag.amber { border-color: transparent; background: var(--amber-bg); color: var(--amber); }
.tag.green { border-color: transparent; background: var(--green-bg); color: var(--green); }
.pb-root {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 176px;
  font-family: var(--mono); font-size: 8.5px; color: var(--ink-4); white-space: nowrap;
}
.pb-root .ic { width: 10px; height: 10px; }
.pb-root span { overflow: hidden; text-overflow: ellipsis; }
.pb-divider { width: 1px; height: 14px; flex: none; background: var(--line); margin: 0 2px; }
.pb-metrics { display: flex; align-items: center; gap: 1px; margin-left: auto; flex: none; }
.metric {
  height: 32px; display: inline-flex; align-items: center; gap: 5px;
  padding: 0 7px; border-radius: 5px; color: var(--ink-3);
  font-size: 9px; white-space: nowrap;
}
.metric:hover { background: #f0ece2; }
.metric .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); flex: none; }
.metric b { font-size: 11.5px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.metric[data-tone="amber"] .dot { background: var(--amber); }
.metric[data-tone="amber"] b { color: var(--amber); }
.metric[data-tone="green"] .dot { background: var(--green); }
.metric[data-tone="green"] b { color: var(--green); }
.metric[data-tone="red"] { background: var(--red-bg); color: var(--red); }
.metric[data-tone="red"] .dot { background: var(--red); }
.metric[data-tone="red"] b { color: var(--red); }
.metric[data-tone="violet"] .dot { background: var(--violet); }
.metric[data-tone="violet"] b { color: var(--violet); }
.metric.zero { opacity: .48; }
.pb-right { display: flex; align-items: center; gap: 5px; flex: none; }
.sync-line { display: inline-flex; align-items: center; gap: 4px; padding: 0 3px; font-size: 8.5px; color: var(--ink-4); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Project menu */
.popover {
  position: absolute; z-index: 80; padding: 4px;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: var(--shadow-2);
  animation: popIn 110ms ease-out;
}
@keyframes popIn { from { opacity: 0; transform: translateY(-3px); } }
.project-pop { top: calc(100% + 6px); left: 0; width: 306px; }
.pop-group { padding: 6px 8px 3px; font-size: 8px; line-height: 11px; font-weight: 650; letter-spacing: .08em; color: var(--ink-4); text-transform: uppercase; }
.pop-item {
  width: 100%; display: flex; align-items: center; gap: 7px;
  padding: 6px 7px; border-radius: 5px; text-align: left; color: var(--ink-2); font-size: 11px;
}
.pop-item:hover { background: #f5f1e8; }
.pop-item.is-active { background: var(--accent-soft); }
.pop-item .pb-dot { width: 6px; height: 6px; }
.pop-item-main { flex: 1; min-width: 0; }
.pop-item-name { display: block; font-size: 11px; line-height: 15px; font-weight: 550; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-item-meta { display: block; margin-top: 1px; font-family: var(--mono); font-size: 8px; line-height: 11px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-item .check { color: var(--accent); }
.pop-sep { height: 1px; margin: 4px 5px; background: var(--line-2); }
.pop-foot { padding: 2px; }
.pop-foot .pop-item { color: var(--ink-3); font-size: 10px; }

/* ---------------- Header ---------------- */
.pagehead {
  position: relative; z-index: 10;
  padding: 11px 17px 0;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.head-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; min-height: 39px; }
.head-copy { min-width: 0; }
.eyebrow {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 8px; line-height: 11px;
  letter-spacing: .09em; color: var(--ink-4); text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.eyebrow::before { content: ""; width: 4px; height: 4px; flex: none; background: var(--accent); transform: rotate(45deg); border-radius: .5px; }
.eyebrow .slash { color: var(--ink-4); opacity: .55; }
.title-row { display: flex; align-items: baseline; gap: 7px; min-width: 0; margin-top: 2px; }
.title-row h1 { font-size: 21px; line-height: 27px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.title-count {
  min-width: 17px; height: 16px; padding: 0 5px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  background: #e8e3d7; color: var(--ink-3);
  font-family: var(--mono); font-size: 8.5px; font-variant-numeric: tabular-nums;
}
.title-count.hot { background: var(--amber-bg); color: var(--amber); }
.title-sub { font-size: 10px; line-height: 15px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-actions { flex: none; display: flex; align-items: center; gap: 6px; padding-bottom: 2px; }
.tabs { display: flex; align-items: stretch; gap: 1px; margin-top: 7px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  height: 31px; padding: 0 9px; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 5px;
  border-bottom: 2px solid transparent; border-radius: 3px 3px 0 0;
  color: var(--ink-3); font-size: 12px; white-space: nowrap;
}
.tab:hover { color: var(--ink); background: rgba(255, 253, 249, .55); }
.tab.is-active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab .n {
  min-width: 15px; height: 14px; padding: 0 4px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(32, 37, 31, .055); color: var(--ink-4);
  font-family: var(--mono); font-size: 8px; font-weight: 400;
}
.tab.is-active .n { background: #e8e3d7; color: var(--ink-2); }
.tab .n.hot { background: var(--amber-bg); color: var(--amber); }

/* ---------------- Buttons / controls ---------------- */
.btn {
  height: 29px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 0 10px; border: 1px solid transparent; border-radius: 6px;
  color: var(--ink-2); font-size: 10.5px; line-height: 1; font-weight: 550;
  white-space: nowrap; transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
.btn .ic { width: 12px; height: 12px; }
.btn:hover { background: #f0ece2; color: var(--ink); }
.btn-primary { background: var(--ink-fill); border-color: var(--ink-fill); color: #fbf7ee; }
.btn-primary:hover { background: #141813; border-color: #141813; color: #fff; }
.btn-primary .ic { color: #cfd3cb; }
.btn-outline { border-color: var(--line-strong); background: rgba(255, 253, 249, .55); }
.btn-outline:hover { background: var(--panel); border-color: #bdb3a1; }
.btn-ghost { color: var(--ink-3); }
.btn-ghost:hover { color: var(--ink); }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff8f4; }
.btn-danger:hover { background: #913726; border-color: #913726; }
.btn-danger-ghost { color: var(--red); }
.btn-danger-ghost:hover { background: var(--red-bg); color: var(--red); }
.btn-sm { height: 26px; padding: 0 8px; font-size: 10px; border-radius: 5px; }
.btn-sm .ic { width: 11px; height: 11px; }
.btn[disabled] { opacity: .42; }

}

}

.kbd {

}

/* ---------------- Workspace toolbar ---------------- */
.toolbar {

}

}
.seg:hover { background: #f5f1e8; color: var(--ink-2); }

.seg .n { font-family: var(--mono); font-size: 8px; color: var(--ink-4); }

.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.tool-btn {

  border-radius: 5px; color: var(--ink-3); font-size: 9.5px; white-space: nowrap;
}
.tool-btn:hover { background: #f5f1e8; color: var(--ink-2); }

.tool-btn .n { font-family: var(--mono); font-size: 8px; }
.search-field {

}
.search-field:hover { background: #f5f1e8; }
.search-field:focus-within { background: var(--panel); border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-field .ic { width: 11px; height: 11px; }
.search-field input { flex: 1; min-width: 0; border: 0; background: none; font-size: 10px; color: var(--ink); }
.search-field input::placeholder { color: var(--ink-4); }
.search-field .kbd { height: 13px; min-width: 13px; padding: 0 3px; font-size: 7px; border-radius: 3px; }
.filter-wrap { position: relative; flex: none; }
.filter-pop { top: calc(100% + 5px); right: 0; width: 236px; padding: 5px; }
.filter-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 7px 4px; font-size: 9px; font-weight: 600; color: var(--ink-2); }
.filter-head button { color: var(--ink-4); font-size: 8.5px; }

.pop-options { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 6px 4px; }
.pop-chip {

  border: 1px solid var(--line); border-radius: 4px; background: var(--panel);

}

.filter-note { margin: 3px 6px 4px; padding-top: 6px; border-top: 1px solid var(--line-2); font-size: 8px; line-height: 12px; color: var(--ink-4); }
.chips {
  flex: none; min-height: 29px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 4px 9px; border-bottom: 1px solid var(--line); background: #fcfaf5;
}
.chip {
  height: 19px; display: inline-flex; align-items: center; gap: 4px;
  padding: 0 3px 0 6px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); color: var(--ink-3); font-size: 8.5px; white-space: nowrap;
}

.chip button { width: 13px; height: 13px; display: grid; place-items: center; border-radius: 3px; color: var(--ink-4); }

/* ---------------- Master / detail split ---------------- */
.workspace { height: 100%; min-height: 0; position: relative; }
.workspace.split { display: grid; grid-template-columns: minmax(0, 1fr) 428px; }
.workspace.split.no-detail { display: block; }

.list-head {

  padding: 0 9px; border-bottom: 1px solid var(--line);
  background: #f7f3ea; color: var(--ink-4);
  font-size: 8.5px; letter-spacing: .02em; user-select: none;
}
.req-cols { grid-template-columns: 42px minmax(0, 1fr) 42px 50px 49px 42px; }
.task-cols { grid-template-columns: 42px 58px minmax(0, 1fr) 34px 34px 43px 40px; }
.rows { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
.group { margin: 0; }
.group-head {
  position: sticky; top: 0; z-index: 3;
  display: flex; align-items: center; gap: 5px; min-height: 27px;
  padding: 6px 9px 4px;

}
.group-head .gh-dot { width: 5px; height: 5px; flex: none; border-radius: 50%; background: var(--tone, var(--ink-4)); }

.row {
  position: relative; width: 100%; height: 40px;
  display: grid; align-items: center; gap: 6px;
  padding: 0 9px; border-bottom: 1px solid #f1ede4;
  background: transparent; text-align: left; color: var(--ink-2);

}
.req-row { grid-template-columns: 42px minmax(0, 1fr) 42px 50px 49px 42px; }
.task-row { grid-template-columns: 42px 58px minmax(0, 1fr) 34px 34px 43px 40px; }
.row::before {

}
.row:hover { background: #f6f2e9; }
.row.is-selected { background: var(--accent-soft); }

.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row-id { font-family: var(--mono); font-size: 8.5px; color: var(--ink-4); white-space: nowrap; letter-spacing: -.01em; }

.row-title {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;

}

.row-title .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row-title .blocked-flag { color: var(--red); font-size: 9px; }
.proj-chip {
  flex: none; padding: 0 3px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--panel-2); color: var(--ink-3);
  font-family: var(--mono); font-size: 7.5px; line-height: 12px; letter-spacing: .02em;
}
.row-status { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--ink-2); white-space: nowrap; }

.row-type { font-size: 9px; color: var(--ink-3); white-space: nowrap; }
.req-ref { font-family: var(--mono); font-size: 8px; color: var(--ink-4); white-space: nowrap; }
.row-act-cell { display: flex; justify-content: flex-end; min-width: 0; }
.row-act {
  height: 20px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;

  opacity: .56; transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease;
}
.row:hover .row-act, .row.is-selected .row-act, .row-act:focus-visible { opacity: 1; }
.row-act:hover { border-color: var(--accent-line); color: var(--accent-deep); background: var(--accent-soft); }
.row-dash { color: var(--ink-4); font-size: 9px; }
.source-mini { display: inline-flex; align-items: center; gap: 3px; min-width: 0; color: var(--ink-3); font-size: 8.5px; white-space: nowrap; }
.source-mini .ic { width: 9px; height: 9px; color: var(--ink-4); }

.task-cell { display: flex; align-items: center; gap: 4px; min-width: 0; }
.task-cell .num { font-family: var(--mono); font-size: 8px; color: var(--ink-4); white-space: nowrap; }

.block-alert { color: var(--red); font-size: 9px; font-weight: 650; }
.mini-track { display: flex; align-items: center; gap: 2px; width: 38px; flex: none; }
.mini-track i { height: 3px; flex: 1; border-radius: 2px; background: #ded8ca; }
.mini-track i.t-green { background: var(--green); }
.mini-track i.t-amber { background: var(--amber); }
.mini-track i.t-violet { background: var(--violet); }
.mini-track i.t-red { background: var(--red); }
.mini-track i.t-slate { background: var(--slate); }

.prio { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); white-space: nowrap; }
.prio .bars { display: flex; align-items: flex-end; gap: 1px; height: 9px; }

.status-pill {
  display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px;
  border-radius: 3px; font-size: 8.5px; font-weight: 550; line-height: 1; white-space: nowrap;
}

.status-pill.tone-red { background: var(--red-bg); color: var(--red); }
.status-pill.tone-violet { background: var(--violet-bg); color: var(--violet); }
.status-pill.tone-slate { background: var(--slate-bg); color: var(--slate); }
.status-pill.tone-muted { background: var(--muted-bg); color: var(--muted-ink); }

.list-foot {
  flex: none; height: 26px; display: flex; align-items: center; gap: 8px;
  padding: 0 9px; border-top: 1px solid var(--line);
  background: #f7f3ea; color: var(--ink-4); font-size: 8px;
}

.empty-state {

  align-items: center; justify-content: center; gap: 5px; padding: 30px; text-align: center;
}

}

/* ---------------- Detail pane ---------------- */
.detail-shell {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--line);
}

}

.detail-top .top-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8.5px; color: var(--ink-4); }
.detail-top .actions { margin-left: auto; display: flex; align-items: center; gap: 1px; }
.detail-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
.detail-body { padding: 13px 17px 26px; }
.status-rule { width: 26px; height: 3px; margin-bottom: 8px; border-radius: 2px; background: var(--tone, var(--line-strong)); }
.detail-title { margin: 0 0 7px; font-size: 17px; line-height: 23px; font-weight: 650; letter-spacing: -.012em; overflow-wrap: anywhere; }
.detail-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; font-size: 9px; color: var(--ink-3); }
.badge-sep { width: 1px; height: 11px; background: var(--line); }
.badge-dot { color: var(--ink-4); }
.detail-owner { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 9px; }

.lifecycle span { white-space: nowrap; }
.lifecycle span.done { color: var(--ink-2); }
.lifecycle span.active { color: var(--accent-deep); font-weight: 650; }
.lifecycle i { width: 11px; height: 1px; margin: 0 4px; background: var(--line-strong); }
.detail-actions {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  margin: 10px 0 0; padding: 9px 0 11px; border-bottom: 1px solid var(--line);
}

.section { margin-top: 14px; }
.section-head { display: flex; align-items: center; gap: 5px; min-height: 17px; margin-bottom: 5px; }

.section-head .right { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.prose { font-size: 11.5px; line-height: 19px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.quote {

  overflow-wrap: anywhere;
}

.criteria { display: flex; flex-direction: column; gap: 4px; }

.comp-bar { display: flex; align-items: center; gap: 2px; width: 64px; flex: none; }
.comp-bar i { height: 4px; flex: 1; border-radius: 2px; background: #ded8ca; }
.comp-bar i.t-green { background: var(--green); }
.comp-bar i.t-amber { background: var(--amber); }
.comp-bar i.t-violet { background: var(--violet); }
.comp-bar i.t-red { background: var(--red); }
.comp-bar i.t-slate { background: var(--slate); }

.task-mini {

.task-mini .tm-meta .st .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--tone, var(--ink-4)); }

.add-task {

/* ---------------- Split composer ---------------- */

}

}

.composer-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 8px; color: var(--ink-3); }
.composer-line b { color: var(--accent-deep); font-family: var(--mono); }
.composer-line .warn { margin-left: auto; color: var(--amber); font-size: 7.5px; }
.split-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.split-chip { max-width: 100%; padding: 1px 5px; border-radius: 3px; background: #e9e5d8; color: var(--ink-2); font-size: 7.5px; line-height: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.composer .field { gap: 3px; margin: 0; }
.composer .field > span, .composer .field > label { font-size: 7.5px; color: var(--ink-4); }
.composer select, .composer input {
  width: 100%; height: 23px; padding: 0 5px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
  font-size: 8.5px; color: var(--ink-2);
}
.composer select:focus, .composer input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
.composer-foot { display: flex; align-items: center; gap: 5px; margin-top: 7px; padding-top: 6px; border-top: 1px solid #e6e9f8; }
.composer-foot .hint { font-size: 7.5px; color: var(--ink-4); }
.composer-foot .actions { margin-left: auto; display: flex; gap: 4px; }
.form-error { margin-top: 4px; font-size: 8px; line-height: 12px; color: var(--red); }

/* ---------------- Task detail ---------------- */
.req-link-row {
  display: flex; align-items: center; gap: 5px; min-width: 0;
  margin-top: 7px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel-2); font-size: 8.5px; color: var(--ink-3);
}
.req-link-row .ic { width: 10px; height: 10px; color: var(--ink-4); }
.req-link-row button { min-width: 0; display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 9px; text-align: left; }
.req-link-row button:hover { color: var(--accent-deep); }
.req-link-row button .seq { font-family: var(--mono); font-size: 8px; color: var(--ink-4); }
.req-link-row button .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blocked-banner {
  display: flex; align-items: flex-start; gap: 7px; margin-top: 9px;
  padding: 8px 9px; border: 1px solid #e5c2ba; border-radius: 6px;
  background: linear-gradient(90deg, rgba(169, 67, 47, .075), rgba(169, 67, 47, .018));
}
.blocked-banner .bb-ico { width: 21px; height: 21px; flex: none; display: grid; place-items: center; border-radius: 5px; background: var(--red-bg); color: var(--red); }
.blocked-banner .bb-ico .ic { width: 11px; height: 11px; }
.blocked-banner b { display: block; font-size: 9px; line-height: 14px; color: var(--red); font-weight: 650; }
.blocked-banner p { margin-top: 1px; font-size: 9px; line-height: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.blocked-banner .since { flex: none; margin-left: auto; font-family: var(--mono); font-size: 7.5px; color: var(--red); opacity: .8; white-space: nowrap; }
.spec-block { margin-top: 7px; padding: 7px 8px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--panel-2); }
.spec-block h4 { font-size: 7.5px; line-height: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-4); text-transform: uppercase; margin-bottom: 3px; }
.spec-block p { font-size: 9px; line-height: 14px; color: var(--ink-2); white-space: pre-wrap; }
.detail-tabs { display: flex; align-items: center; gap: 2px; margin: 13px -17px 0; padding: 0 17px; border-bottom: 1px solid var(--line); }
.detail-tab {
  position: relative; height: 29px; padding: 0 5px; margin-right: 7px;
  display: inline-flex; align-items: center; gap: 4px;
  border-bottom: 1.5px solid transparent; color: var(--ink-3); font-size: 9.5px;
}
.detail-tab:hover { color: var(--ink-2); }
.detail-tab.is-active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.detail-tab .n { font-family: var(--mono); font-size: 8px; color: var(--ink-4); }
.tab-body { padding-top: 9px; }
.attempt-list { display: flex; flex-direction: column; }
.attempt { position: relative; padding: 0 0 10px 12px; border-left: 1px solid var(--line); }
.attempt:last-child { padding-bottom: 2px; }
.attempt::before {
  content: ""; position: absolute; left: -3px; top: 5px; width: 5px; height: 5px;
  border-radius: 50%; background: var(--line-strong); box-shadow: 0 0 0 2px var(--panel);
}
.attempt.is-fail::before { background: var(--red); }
.attempt.is-run::before { background: var(--green); }
.attempt.is-done::before { background: var(--ink-4); }
.attempt-head { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.attempt-head .at-n { font-family: var(--mono); font-size: 9px; font-weight: 600; color: var(--ink); }
.attempt-head .at-stage { font-size: 8.5px; color: var(--ink-3); }
.attempt-head .session { margin-left: auto; max-width: 118px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 7.5px; color: var(--ink-4); }
.attempt-report { margin: 4px 0 0; font-size: 9.5px; line-height: 15px; color: var(--ink-2); }
.attempt-foot { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-family: var(--mono); font-size: 7.5px; color: var(--ink-4); }
.attempt-foot .live { color: var(--green); display: inline-flex; align-items: center; gap: 3px; font-family: var(--sans); }
.attempt-foot .live .live-dot { width: 4px; height: 4px; box-shadow: none; }
.error-block {
  margin-top: 5px; padding: 5px 7px; border-radius: 4px;
  background: var(--red-bg); color: #8f392a;
  font-family: var(--mono); font-size: 7.5px; line-height: 12px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.evidence { margin-bottom: 5px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.evidence:last-child { margin-bottom: 0; }
.evidence-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ev-type { flex: none; padding: 0 4px; height: 16px; display: inline-flex; align-items: center; border-radius: 3px; background: #e9e5d8; color: var(--ink-2); font-family: var(--mono); font-size: 7px; letter-spacing: .02em; }
.evidence-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; font-weight: 500; color: var(--ink); }
.evidence-meta { margin-left: auto; flex: none; font-family: var(--mono); font-size: 7px; color: var(--ink-4); }
.evidence pre {
  margin: 5px 0 0; padding: 5px 6px; max-height: 94px; overflow: auto;
  border-radius: 3px; background: #f5f1e8; color: var(--ink-2);
  font-family: var(--mono); font-size: 7.5px; line-height: 12.5px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.review-card { margin-bottom: 5px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.review-card:last-child { margin-bottom: 0; }
.review-head { display: flex; align-items: center; gap: 5px; }
.decision { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 3px; font-size: 7.5px; font-weight: 650; }
.decision.pass { background: var(--green-bg); color: var(--green); }
.decision.return { background: var(--red-bg); color: var(--red); }
.review-head .who { font-size: 8.5px; color: var(--ink-2); }
.review-head .time { margin-left: auto; font-family: var(--mono); font-size: 7.5px; color: var(--ink-4); }
.review-text { margin-top: 4px; font-size: 9.5px; line-height: 15px; color: var(--ink-2); overflow-wrap: anywhere; }
.review-form { margin-bottom: 8px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: #faf8f2; }
.review-form .rf-head { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.review-form .rf-head b { font-size: 9px; color: var(--ink); }
.review-form .rf-head span { margin-left: auto; font-size: 7.5px; color: var(--ink-4); }
.decision-row { display: flex; align-items: center; gap: 4px; margin-bottom: 5px; }
.decision-pill {
  height: 21px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); color: var(--ink-3); font-size: 8.5px;
}
.decision-pill:hover { border-color: var(--line-strong); }
.decision-pill.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-deep); font-weight: 550; }
.review-form textarea {
  width: 100%; min-height: 48px; padding: 5px 6px; border: 1px solid var(--line);
  border-radius: 4px; background: var(--panel); font-size: 9.5px; line-height: 15px; resize: vertical;
}
.review-form textarea:focus { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
.review-form .rf-foot { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.review-form .rf-foot .hint { font-size: 7.5px; color: var(--ink-4); }
.review-form .rf-foot .actions { margin-left: auto; display: flex; gap: 4px; }
.detail-footer {
  flex: none; display: flex; align-items: center; gap: 5px; min-height: 42px;
  padding: 7px 12px; border-top: 1px solid var(--line); background: var(--panel);
}
.detail-footer .hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 7.5px; color: var(--ink-4); }
.detail-footer .actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
.empty-inline {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 9px 10px; border: 1px dashed var(--line-strong); border-radius: 5px;
  background: rgba(255, 253, 249, .36);
}
.empty-inline b { font-size: 9px; font-weight: 550; color: var(--ink-2); }
.empty-inline p { font-size: 8px; line-height: 13px; color: var(--ink-4); }
.empty-inline .btn { margin-top: 3px; }

/* ---------------- Board ---------------- */
.workspace.board { display: flex; flex-direction: column; background: var(--paper); }
.board-toolbar {
  flex: none; height: 39px; display: flex; align-items: center; gap: 6px;
  padding: 0 11px; border-bottom: 1px solid var(--line);
  background: var(--panel); min-width: 0;
}
.board-note { display: inline-flex; align-items: center; gap: 5px; min-width: 0; font-size: 9px; color: var(--ink-3); white-space: nowrap; }
.board-note .ic { width: 11px; height: 11px; color: var(--ink-4); }
.board-note b { font-weight: 600; color: var(--ink-2); }
.board-note .dim { font-family: var(--mono); font-size: 8px; color: var(--ink-4); }
.board-toolbar .search-field { width: 128px; }
.board-toolbar .spacer { flex: 1; min-width: 4px; }
.board-nav { display: flex; align-items: center; gap: 0; flex: none; }
.board-nav .icon-btn { width: 23px; height: 23px; border-radius: 4px; }
.board-nav .icon-btn .ic { width: 11px; height: 11px; }
.board-toolbar .chips { border: 0; background: transparent; padding: 0; min-height: 0; flex: none; }
.board-toolbar .chip { height: 18px; font-size: 8px; }
.board-scroll { flex: 1; min-height: 0; overflow: auto; padding: 9px 11px 13px; scrollbar-gutter: stable; }
.board { display: flex; align-items: stretch; gap: 8px; min-height: 100%; }
.board-col {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
  position: relative; padding: 0 6px 6px;
  border: 1px solid rgba(206, 197, 181, .55); border-radius: 10px;
  background: rgba(251, 248, 242, .62);
}
.board.task-board .board-col { min-width: 148px; flex: 1 1 148px; }
.board-col::before {
  content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 2px;
  border-radius: 0 0 2px 2px; background: var(--status, var(--line-strong)); opacity: .78;
}
.col-head { flex: none; display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 9px 3px 5px; }
.col-head .status-dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--status, var(--ink-4)); }
.col-head h2 { font-size: 10.5px; line-height: 15px; font-weight: 650; letter-spacing: .02em; color: var(--ink-2); white-space: nowrap; }
.col-count {
  min-width: 16px; height: 15px; padding: 0 4px; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(232, 226, 214, .82); color: var(--ink-4);
  font-family: var(--mono); font-size: 8px; line-height: 1;
}
.col-hint { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 7.5px; color: var(--ink-4); }
.task-board .col-hint { display: none; }
.col-body { flex: 1; display: flex; flex-direction: column; gap: 5px; min-height: 70px; }
.lane { display: flex; flex-direction: column; gap: 5px; padding-top: 6px; border-top: 1px solid rgba(206, 197, 181, .38); }
.lane:first-child { padding-top: 1px; border-top: 0; }
.lane-head { display: flex; align-items: center; gap: 4px; padding: 0 2px; min-width: 0; color: var(--ink-4); font-size: 8px; }
.lane-head .pb-dot { width: 5px; height: 5px; }
.lane-head .lane-code { font-family: var(--mono); font-size: 7.5px; font-weight: 650; letter-spacing: .03em; color: var(--ink-3); }
.lane-head .lane-count { margin-left: auto; font-family: var(--mono); font-size: 7.5px; color: var(--ink-3); }
.lane-empty {
  padding: 5px 6px; border: 1px dashed rgba(196, 181, 158, .55); border-radius: 5px;
  color: var(--ink-4); font-size: 8px; line-height: 12px;
}
.col-empty {
  flex: 1; min-height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 12px 6px; border: 1px dashed rgba(196, 181, 158, .5); border-radius: 6px;
  text-align: center; color: var(--ink-4);
}
.col-empty b { font-size: 9px; font-weight: 500; color: var(--ink-3); }
.col-empty span { font-size: 7.5px; line-height: 11px; }
.bcard {
  position: relative; padding: 8px 9px 7px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); box-shadow: var(--shadow-1);
  cursor: pointer; transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}
.bcard:hover { border-color: #d3c8b6; box-shadow: 0 2px 3px rgba(52, 43, 28, .05), 0 12px 24px -18px rgba(52, 43, 28, .45); transform: translateY(-1px); }
.bcard.is-selected { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line), var(--shadow-1); }
.bcard[data-status="完成"]:not(.is-selected), .bcard[data-status="已关闭"]:not(.is-selected) { opacity: .86; }
.bcard[data-status="完成"] .bcard-title, .bcard[data-status="已关闭"] .bcard-title { color: var(--ink-2); }
.bcard::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px;
  border-radius: 0 2px 2px 0; background: var(--prio-color, transparent);
}
.bcard[data-p="P0"] { --prio-color: var(--red); }
.bcard[data-p="P1"] { --prio-color: rgba(165, 118, 31, .75); }
.bcard-top { display: flex; align-items: center; gap: 4px; min-height: 16px; margin-bottom: 5px; }
.bcard-top .prio { flex: none; }
.type-chip { flex: none; display: inline-flex; align-items: center; height: 15px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-3); font-size: 7.5px; line-height: 1; }
.bcard-top .proj-chip { line-height: 13px; font-size: 7px; }
.bcard-quick { margin-left: auto; display: flex; opacity: 0; transition: opacity 120ms ease; }
.bcard:hover .bcard-quick, .bcard.is-selected .bcard-quick, .bcard-quick:focus-within { opacity: 1; }
.quick-act {
  height: 18px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); color: var(--ink-3); font-size: 7.5px; white-space: nowrap;
}
.quick-act:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-deep); }
.bcard-title {
  font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--ink); letter-spacing: -.005em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.bcard-meta { display: flex; align-items: center; gap: 3px; min-width: 0; margin-top: 4px; font-size: 8px; color: var(--ink-4); }
.bcard-meta .ic { width: 8px; height: 8px; }
.bcard-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard-req { display: flex; align-items: center; gap: 3px; min-width: 0; margin-top: 4px; font-size: 8px; color: var(--ink-4); }
.bcard-req .seq { flex: none; padding: 0 2px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel-2); font-family: var(--mono); font-size: 7px; line-height: 11px; }
.bcard-req .rq { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard-progress { margin-top: 5px; }
.bcard-progress .bp-line { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 7.5px; color: var(--ink-4); }
.bcard-progress .bp-line b { font-family: var(--mono); font-weight: 500; color: var(--ink-3); }
.bcard-progress .bp-track { display: flex; gap: 1px; height: 3px; margin-top: 3px; }
.bcard-progress .bp-track i { flex: 1; border-radius: 1px; background: #e1dccd; min-width: 2px; }
.bcard-progress .bp-track i.t-green { background: var(--green); }
.bcard-progress .bp-track i.t-amber { background: var(--amber); }
.bcard-progress .bp-track i.t-violet { background: var(--violet); }
.bcard-progress .bp-track i.t-red { background: var(--red); }
.bcard-progress .bp-track i.t-slate { background: var(--slate); }
.bcard-progress .bp-track i.t-muted { background: var(--ink-4); }
.bcard-progress .unsplit { padding: 3px 0 0; border-top: 1px dashed var(--line); font-size: 7.5px; color: var(--ink-4); }
.block-reason {
  display: flex; align-items: center; gap: 3px; margin-top: 5px; padding: 3px 5px;
  border-radius: 4px; background: var(--red-bg); color: #8f392a; font-size: 7.5px; line-height: 11px;
}
.block-reason .ic { width: 8px; height: 8px; }
.block-reason .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard-foot { display: flex; align-items: center; gap: 4px; margin-top: 6px; min-width: 0; font-size: 8px; color: var(--ink-4); }
.bcard-foot .avatar { width: 15px; height: 15px; font-size: 7px; }
.bcard-foot .owner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); }
.bcard-foot .time { margin-left: auto; white-space: nowrap; font-family: var(--mono); font-size: 7px; }
.board-empty {
  height: 100%; min-height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 36px 24px; border: 1px dashed var(--line-strong); border-radius: 10px;
  background: rgba(255, 253, 249, .4); text-align: center;
}
.board-empty .empty-glyph { width: 43px; height: 43px; border-radius: 11px; }
.board-empty h2 { font-size: 13px; line-height: 19px; font-weight: 600; color: var(--ink-2); }
.board-empty p { max-width: 360px; font-size: 9.5px; line-height: 15px; color: var(--ink-4); }
.board-empty .actions { display: flex; gap: 6px; margin-top: 5px; }
.drawer-backdrop {
  position: absolute; inset: 0; z-index: 8;
  background: rgba(35, 32, 24, .16);
  animation: fadeIn 120ms ease-out;
}
@keyframes fadeIn { from { opacity: 0; } }
.detail-shell.is-drawer {
  position: absolute; z-index: 9; top: 9px; right: 9px; bottom: 9px; width: 432px;
  border: 1px solid var(--line-strong); border-radius: 9px;
  box-shadow: var(--shadow-3); overflow: hidden;
  animation: drawerIn 150ms cubic-bezier(.2, .8, .3, 1);
}
@keyframes drawerIn { from { opacity: 0; transform: translateX(10px); } }

/* ---------------- Overview ---------------- */
.page-scroll { height: 100%; overflow: auto; padding: 16px 18px 26px; scrollbar-gutter: stable; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; padding: 2px 1px 13px; border-bottom: 1px solid var(--line); }
.hero-copy { min-width: 0; }
.hero-kicker { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 8px; letter-spacing: .08em; color: var(--ink-4); text-transform: uppercase; }
.hero-kicker::before { content: ""; width: 4px; height: 4px; background: var(--accent); transform: rotate(45deg); border-radius: .5px; }
.hero h2 { margin-top: 5px; max-width: 620px; font-size: 21px; line-height: 28px; font-weight: 600; letter-spacing: -.015em; }
.hero h2 em { font-style: normal; font-weight: 650; color: var(--accent); }
.hero h2 .run { color: var(--green); }
.hero p { margin-top: 5px; max-width: 580px; font-size: 10px; line-height: 16px; color: var(--ink-3); }
.hero-actions { flex: none; display: flex; align-items: center; gap: 5px; padding-bottom: 2px; }
.hero-rhythm {
  flex: none; width: 226px; padding: 8px 10px 7px;
  border: 1px solid var(--line); border-radius: 7px;
  background: rgba(255, 253, 249, .52);
}
.rhythm-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 7.5px; letter-spacing: .07em; color: var(--ink-4); text-transform: uppercase; }
.rhythm-head b { font-family: var(--mono); font-size: 7px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.hero-rhythm .spark { height: 27px; color: #7f9a88; gap: 3px; }

  box-shadow: var(--shadow-3); animation: modalIn 130ms cubic-bezier(.2,.8,.3,1);
}

.form-hint { margin-top: 3px; font-size: 7.5px; line-height: 11px; color: var(--ink-4); }
.form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.sheet-overlay { justify-content: flex-end; align-items: stretch; padding: 0; }

  position: relative; z-index: 1; width: 438px; max-width: 100%; height: 100%;

  }).join('') + '</div>';

function actionQueue() {
  const q = [];
  scopedTasks().filter(function (t) { return t.status === '阻塞'; }).forEach(function (t) {
    q.push({ kind: '阻塞', tone: 'red', title: t.title, sub: taskCode(t) + ' · ' + (t.blockedReason || '等待依赖'), age: t.blockedSince || '', action: 'go-task', id: t.id, label: '处理' });
  });
  scopedReqs().filter(function (r) { return r.status === '待确认'; }).forEach(function (r) {
    q.push({ kind: '待确认', tone: 'amber', title: r.title, sub: reqCode(r) + ' · ' + r.source + ' · ' + r.sourceNote, age: r.updated, action: 'quick-confirm', id: r.id, label: '确认' });
  });
  scopedTasks().filter(function (t) { return t.status === '评审'; }).forEach(function (t) {
    q.push({ kind: '评审', tone: 'violet', title: t.title, sub: taskCode(t) + ' · ' + projectOf(t).chip, age: t.updated, action: 'task-review', id: t.id, label: '评审' });
  });
  scopedTasks().filter(function (t) { return t.status === '待验收'; }).forEach(function (t) {
    q.push({ kind: '待验收', tone: 'green', title: t.title, sub: taskCode(t) + ' · ' + projectOf(t).chip, age: t.updated, action: 'task-accept', id: t.id, label: '验收' });
  });
  scopedMemories().filter(function (m) { return m.status === '待复核'; }).forEach(function (m) {
    q.push({ kind: '记忆', tone: 'amber', title: m.title, sub: m.type + ' · ' + projectOf(m).chip, age: m.updated, action: 'go-memory', id: m.id, label: '复核' });
  });
  return q;
}

function captureScroll() {
  const out = {};
  document.querySelectorAll('[data-scroll]').forEach(function (el) {
    out[el.getAttribute('data-scroll')] = { top: el.scrollTop, left: el.scrollLeft };
  });
  return out;
}
function restoreScroll(out, resetDetail) {
  document.querySelectorAll('[data-scroll]').forEach(function (el) {
    const key = el.getAttribute('data-scroll');
    if (key === 'detail') {
      el.scrollTop = resetDetail ? 0 : (out.detail ? out.detail.top : 0);
      el.scrollLeft = 0;
      return;
    }
    const s = out[key];
    if (s) { el.scrollTop = s.top; el.scrollLeft = s.left; }
  });
}
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.id) return null;
  let start = null, end = null;
  try { start = el.selectionStart; end = el.selectionEnd; } catch (e) { /* select */ }
  return { id: el.id, start: start, end: end };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  if (f.start != null && el.setSelectionRange) {
    try { el.setSelectionRange(f.start, f.end); } catch (e) { /* noop */ }
  }
}
function renderApp() {
  const key = detailKey();
  const resetDetail = key !== state.lastDetailKey;
  const scroll = captureScroll();
  const focus = captureFocus();

  document.getElementById('rail').innerHTML = railHTML();
  document.getElementById('projectbar').innerHTML = projectBarHTML();
  document.getElementById('pagehead').innerHTML = headerHTML();
  document.getElementById('view').innerHTML = viewHTML();
  document.getElementById('statusbar').innerHTML = statusBarHTML();
  document.getElementById('overlays').innerHTML = overlaysHTML();

  restoreScroll(scroll, resetDetail);
  state.lastDetailKey = key;
  restoreFocus(focus);

  if (state.pendingFocus) {
    const id = state.pendingFocus;
    state.pendingFocus = null;
    const el = document.getElementById(id);
    if (el) {
      try { el.focus({ preventScroll: false }); } catch (e) { el.focus(); }
      if (el.tagName === 'INPUT' && el.type === 'text') {
        try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* noop */ }
      }
    }
  }
  document.title = '雄大工作台 · ' + TAB_TITLE[state.tab] + ' · ' + (state.scope === 'ALL' ? '全部项目' : PROJECTS[state.scope].code);
}

/* ==========================================================================
   Action routing
   ========================================================================== */
function handleAction(action, el) {
  const id = el.getAttribute('data-id');
  switch (action) {
    case 'tab': setTab(el.getAttribute('data-tab')); return;
    case 'scope': setScope(el.getAttribute('data-scope')); return;
    case 'toggle-projects': state.projectMenu = !state.projectMenu; state.filterMenu = null; renderApp(); return;
    case 'set-view': setView(el.getAttribute('data-mode'), el.getAttribute('data-view')); return;
    case 'req-status': state.reqStatus = el.getAttribute('data-status'); state.filterMenu = null; renderApp(); return;
    case 'task-status': state.taskStatus = el.getAttribute('data-status'); state.filterMenu = null; renderApp(); return;
    case 'toggle-filter': {
      const target = el.getAttribute('data-target');
      state.filterMenu = state.filterMenu === target ? null : target;
      state.projectMenu = false;
      renderApp();
      return;
    }
    case 'req-priority': {
      const v = el.getAttribute('data-value');
      state.reqPriority = state.reqPriority === v ? '' : v;
      renderApp();
      return;
    }
    case 'req-source': {
      const v = el.getAttribute('data-value');
      state.reqSource = state.reqSource === v ? '' : v;
      renderApp();
      return;
    }
    case 'task-type': {
      const v = el.getAttribute('data-value');
      state.taskType = state.taskType === v ? '' : v;
      renderApp();
      return;
    }
    case 'task-priority': {
      const v = el.getAttribute('data-value');
      state.taskPriority = state.taskPriority === v ? '' : v;
      renderApp();
      return;
    }
    case 'clear-req-filters': state.reqPriority = ''; state.reqSource = ''; state.reqQ = ''; state.reqStatus = 'active'; state.filterMenu = null; renderApp(); return;
    case 'clear-task-filters': state.taskType = ''; state.taskPriority = ''; state.taskQ = ''; state.taskStatus = 'active'; state.filterMenu = null; renderApp(); return;
    case 'clear-req-search': state.reqQ = ''; renderApp(); return;
    case 'clear-task-search': state.taskQ = ''; renderApp(); return;
    case 'new-req': openCreate(); return;
    case 'select-req':
      state.selectedReq = id; state.tab = 'requirements'; state.splitOpen = false; state.splitReqId = null; state.splitDraft = ''; state.splitError = ''; state.lastDetailKey = null; renderApp(); return;
    case 'select-task':
      state.selectedTask = id; state.tab = 'tasks'; state.detailTab = 'attempts'; resetReviewForm(); state.lastDetailKey = null; renderApp(); return;
    case 'quick-confirm': confirmReq(id); return;
    case 'quick-split': openSplit(id); return;
    case 'confirm-req': confirmReq(id); return;
    case 'open-split': openSplit(id); return;
    case 'close-split': closeSplit(); return;
    case 'submit-split': submitSplit(); return;
    case 'close-detail': {
      if (state.tab === 'requirements') { state.selectedReq = null; state.splitOpen = false; }
      else if (state.tab === 'tasks') state.selectedTask = null;
      else if (state.tab === 'inbox') state.selectedInbox = null;
      else if (state.tab === 'memory') state.selectedMemory = null;
      else if (state.tab === 'reviews') state.selectedReview = null;
      state.lastDetailKey = null;
      renderApp();
      return;
    }
    case 'go-tasks': {
      const t = tasks.find(function (x) { return x.reqId === id; });
      state.tab = 'tasks'; state.selectedTask = t ? t.id : defaultTaskId(); state.detailTab = 'attempts'; state.lastDetailKey = null; renderApp(); return;
    }
    case 'go-task':
      state.tab = 'tasks'; state.selectedTask = id; state.detailTab = 'attempts'; resetReviewForm(); state.lastDetailKey = null; renderApp(); return;
    case 'go-req':
      state.tab = 'requirements'; state.selectedReq = id; state.splitOpen = false; state.lastDetailKey = null; renderApp(); return;
    case 'task-dispatch': dispatchTask(id); return;
    case 'task-retry': retryTask(id); return;
    case 'task-accept': acceptTask(id); return;
    case 'task-review': openTaskReview(id); return;
    case 'detail-tab': state.detailTab = el.getAttribute('data-tab'); renderApp(); return;
    case 'delete-task': state.deleteTarget = id; state.pendingFocus = 'delete-cancel'; renderApp(); return;
    case 'close-delete': state.deleteTarget = null; renderApp(); return;
    case 'confirm-delete': deleteTask(id); return;
    case 'undo-delete': undoDelete(); return;
    case 'toggle-lanes': state.lanes = !state.lanes; renderApp(); return;
    case 'board-scroll': {
      const scroller = document.querySelector('.board-scroll');
      if (scroller) scroller.scrollBy({ left: Number(el.getAttribute('data-dir')) * 260, behavior: 'smooth' });
      return;
    }
    case 'open-settings': {
      const kind = el.getAttribute('data-kind');
      const pid = el.getAttribute('data-project');
      if (kind === 'project' && state.scope === 'ALL' && !pid) {
        showToast('先选择一个项目，再打开项目设置');
        return;
      }
      state.settingsModal = kind;
      state.settingsProject = pid || state.scope;
      state.pendingFocus = kind === 'system' ? 'sys-concurrency' : 'ps-root';
      state.projectMenu = false;
      renderApp();
      return;
    }
    case 'close-settings': state.settingsModal = null; renderApp(); return;
    case 'save-project-settings': saveProjectSettings(el.getAttribute('data-id') || state.settingsProject || state.scope); return;
    case 'save-system-settings': saveSystemSettings(); return;
    case 'select-inbox': state.selectedInbox = id; state.lastDetailKey = null; renderApp(); return;
    case 'triage': {
      const item = inboxById(id);
      if (item) openCreateFromInbox(item);
      return;
    }
    case 'ignore-inbox': ignoreInbox(id); return;
    case 'select-memory': state.selectedMemory = id; state.lastDetailKey = null; renderApp(); return;
    case 'mem-status': {
      const status = el.getAttribute('data-status');
      if (status === 'all') { state.memStatus = 'all'; renderApp(); return; }
      if (id) setMemoryStatus(id, status);
      else { state.memStatus = status; renderApp(); }
      return;
    }
    case 'verify-refs': verifyRefs(id); return;
    case 'select-review': state.selectedReview = id; resetReviewForm(); state.lastDetailKey = null; renderApp(); return;
    case 'open-task': state.tab = 'tasks'; state.selectedTask = id; state.detailTab = 'attempts'; state.lastDetailKey = null; renderApp(); return;
    case 'set-review-decision': {
      state.reviewDecision = el.getAttribute('data-decision');
      state.reviewError = '';
      document.querySelectorAll('[data-action="set-review-decision"]').forEach(function (b) {
        b.classList.toggle('is-on', b.getAttribute('data-decision') === state.reviewDecision);
      });
      const err = document.querySelector('.review-form .form-error');
      if (err) err.hidden = true;
      return;
    }
    case 'submit-review': submitReview(id); return;
    case 'open-project': setScope(id); state.tab = 'requirements'; state.reqView = 'list'; renderApp(); return;
    case 'fill-sample': fillSample(); return;
    case 'create-req': createRequirement(); return;
    case 'close-create': closeCreate(); return;
    case 'metric': {
      const target = el.getAttribute('data-target');
      if (target === 'req-pending') { state.tab = 'requirements'; state.reqView = 'list'; state.reqStatus = '待确认'; }
      else if (target === 'task-running') { state.tab = 'tasks'; state.taskView = 'list'; state.taskStatus = '进行中'; }
      else if (target === 'task-blocked') { state.tab = 'tasks'; state.taskView = 'list'; state.taskStatus = '阻塞'; }
      else if (target === 'memory') { state.tab = 'memory'; state.memStatus = '待复核'; }
      state.filterMenu = null;
      state.lastDetailKey = null;
      ensureSelections(state.tab);
      renderApp();
      return;
    }
    case 'go-memory': {
      state.tab = 'memory'; state.memStatus = '待复核'; state.selectedMemory = id; state.lastDetailKey = null; renderApp(); return;
    }
    default: return;
  }
}

/* ==========================================================================
   Event wiring
   ========================================================================== */
document.addEventListener('click', function (e) {
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    e.preventDefault();
    handleAction(actionEl.getAttribute('data-action'), actionEl);
    return;
  }
  if (state.projectMenu && !e.target.closest('.pb-switch-wrap')) {
    state.projectMenu = false;
    renderApp();
  } else if (state.filterMenu && !e.target.closest('.filter-wrap')) {
    state.filterMenu = null;
    renderApp();
  }
});
document.addEventListener('keydown', function (e) {
  const row = e.target.closest && e.target.closest('[role="button"][data-action]');
  if ((e.key === 'Enter' || e.key === ' ') && row && e.target === row) {
    e.preventDefault();
    handleAction(row.getAttribute('data-action'), row);
    return;
  }
  const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.isContentEditable);

  if (e.key === 'Escape') {
    if (state.projectMenu) { state.projectMenu = false; renderApp(); return; }
    if (state.filterMenu) { state.filterMenu = null; renderApp(); return; }
    if (state.settingsModal) { state.settingsModal = null; renderApp(); return; }
    if (state.deleteTarget) { state.deleteTarget = null; renderApp(); return; }
    if (state.createOpen) { closeCreate(); return; }
    if (state.splitOpen) { closeSplit(); return; }
    if (typing) { e.target.blur(); return; }
    if (state.tab === 'requirements' && state.selectedReq) { state.selectedReq = null; state.lastDetailKey = null; renderApp(); return; }
    if (state.tab === 'tasks' && state.selectedTask) { state.selectedTask = null; state.lastDetailKey = null; renderApp(); return; }
    return;
  }

  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    if (state.createOpen) { e.preventDefault(); createRequirement(); return; }
    if (state.splitOpen) { e.preventDefault(); submitSplit(); return; }
    if (state.tab === 'tasks' && state.selectedTask) {
      const t = taskById(state.selectedTask);
      if (t && t.status === '评审') { e.preventDefault(); submitReview(t.id); return; }
    }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key >= '1' && e.key <= '7') {
    e.preventDefault();
    setTab(TABS[Number(e.key) - 1].id);
    return;
  }
  if (e.key === '/') {
    e.preventDefault();
    const input = document.getElementById(state.tab === 'tasks' ? 'task-search' : state.tab === 'requirements' ? 'req-search' : null);
    if (input) input.focus();
    return;
  }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openCreate(); return; }
  if (e.key === 'j' || e.key === 'J') { e.preventDefault(); moveSelection(1); return; }
  if (e.key === 'k' || e.key === 'K') { e.preventDefault(); moveSelection(-1); return; }
  if (e.key === 's' || e.key === 'S') {
    if (state.tab === 'requirements' && state.selectedReq) { e.preventDefault(); openSplit(state.selectedReq); }
    return;
  }
  if (state.tab === 'tasks' && state.selectedTask) {
    const t = taskById(state.selectedTask);
    if (!t) return;
    if (e.key === 'd' || e.key === 'D') { if (t.status === '就绪') { e.preventDefault(); dispatchTask(t.id); } return; }
    if (e.key === 'r' || e.key === 'R') { if (t.status === '阻塞') { e.preventDefault(); retryTask(t.id); } return; }
    if (e.key === 'a' || e.key === 'A') { if (t.status === '待验收') { e.preventDefault(); acceptTask(t.id); } return; }
  }
});
document.addEventListener('input', function (e) {
  if (e.isComposing) return;
  const t = e.target;
  if (t.id === 'req-search') { state.reqQ = t.value; renderApp(); return; }
  if (t.id === 'task-search') { state.taskQ = t.value; renderApp(); return; }
  if (t.id === 'split-draft') { state.splitDraft = t.value; updateSplitPreview(); return; }
  if (t.id === 'review-comment') { state.reviewComment = t.value; return; }
  if (t.id === 'create-quote') { if (state.create) state.create.quote = t.value; return; }
  if (t.getAttribute('data-create-field') && state.create) {
    state.create[t.getAttribute('data-create-field')] = t.value;
    return;
  }
});
document.addEventListener('change', function (e) {
  const t = e.target;
  if (t.getAttribute('data-create-field') && state.create) {
    state.create[t.getAttribute('data-create-field')] = t.value;
  }
});
function moveSelection(delta) {
  if (state.tab === 'requirements' && state.reqView === 'list') {
    const list = filteredReqs();
    if (!list.length) return;
    let i = list.findIndex(function (r) { return r.id === state.selectedReq; });
    i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + delta));
    state.selectedReq = list[i].id;
    state.splitOpen = false;
    state.lastDetailKey = null;
    renderApp();
    return;
  }
  if (state.tab === 'tasks' && state.taskView === 'list') {
    const list = filteredTasks();
    if (!list.length) return;
    let i = list.findIndex(function (t) { return t.id === state.selectedTask; });
    i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + delta));
    state.selectedTask = list[i].id;
    state.detailTab = 'attempts';
    state.lastDetailKey = null;
    renderApp();
  }
}

/* ==========================================================================
   Boot
   ========================================================================== */
buildSprite();
state.lastDetailKey = null;
renderApp();
</script>
</body>
