<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 时间线工作流</title>
<style>
/* ============================================================
   05 · Timeline / Flow Workspace
   Light canvas, one strong cobalt accent, hairline rails,
   status dots. Self-contained: system fonts + inline SVG only.
   ============================================================ */
:root{
  --canvas:#EEEDE6;
  --surface:#F7F6F0;
  --surface-2:#F7F6F0;
  --paper:#FFFFFF;
  --ink:#1A1A1F;
  --ink-2:#43434B;
  --muted:#69685F;
  --faint:#8B897E;
  --line:#E4E2D8;
  --line-strong:#D5D2C5;
  --accent:#2547E8;
  --accent-ink:#1A35BE;
  --accent-soft:#EDF0FF;
  --green:#2F7D59;
  --green-soft:#EAF4EE;
  --amber:#A96F15;
  --amber-soft:#FBF2DF;
  --red:#BE4438;
  --red-soft:#FBEDEB;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --radius:12px;
  --shadow-soft:0 10px 30px -22px rgba(20,20,30,.28);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:13.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D5D2C7;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#C4C0B3;border:3px solid transparent;background-clip:content-box}
[hidden]{display:none !important}

/* ---------- app frame ---------- */
.app{
  height:100vh;max-width:1320px;margin:0 auto;background:var(--paper);
  display:grid;grid-template-rows:58px 45px minmax(0,1fr);
  box-shadow:0 0 0 1px var(--line);
}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 24px;background:#fff;
  border-bottom:1px solid var(--line);position:relative;z-index:40;min-width:0;
}
.brand{display:inline-flex;align-items:center;gap:9px;flex:none;border:0;background:none;padding:0}
.brand-mark{
  width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;
  color:#fff;box-shadow:0 2px 7px rgba(37,71,232,.27);flex:none;
}
.brand-name{font-size:14px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand-name span{color:var(--faint);font-weight:450;margin-left:2px}
.top-grow{flex:1;min-width:8px}

/* ---------- project switcher ---------- */
.project-switch{position:relative;flex:none}
.project-btn{
  display:flex;align-items:center;gap:9px;height:34px;padding:0 9px 0 6px;
  border:1px solid var(--line-strong);border-radius:9px;background:#fff;transition:.15s;
}
.project-btn:hover{border-color:#C9C5B9;background:#FCFCF9}
.proj-code{
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--accent);
  background:var(--accent-soft);padding:3px 6px;border-radius:5px;white-space:nowrap;
  max-width:112px;overflow:hidden;text-overflow:ellipsis;
}
.proj-btn-name{font-size:13px;font-weight:500;max-width:158px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-btn .chev{color:var(--faint);transition:transform .15s}
.project-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.project-menu{
  position:absolute;left:0;top:calc(100% + 8px);width:326px;padding:6px;background:#fff;
  border:1px solid var(--line);border-radius:13px;z-index:80;
  box-shadow:0 18px 44px -18px rgba(20,20,30,.26),0 2px 6px rgba(20,20,30,.04);
}
.menu-label{
  padding:7px 10px 5px;font-size:9px;font-weight:600;letter-spacing:.09em;
  color:var(--faint);text-transform:uppercase;
}
.project-option{
  display:grid;grid-template-columns:16px minmax(0,1fr) 16px;gap:2px 8px;width:100%;
  padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;align-items:center;
}
.project-option:hover{background:#F4F3ED}
.project-option .dot{margin-top:1px}
.opt-main{min-width:0}
.opt-name{display:block;font-size:12px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-code{display:block;font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.02em}
.opt-check{color:var(--accent);display:grid;place-items:center}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.menu-foot{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;
  border-radius:8px;background:none;color:var(--ink-2);font-size:11px;text-align:left;
}
.menu-foot:hover{background:#F4F3ED;color:var(--ink)}
.menu-foot svg{margin-left:auto;color:var(--faint)}

/* ---------- global search ---------- */
.global-search{position:relative;width:268px;flex:none}
.search-box{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 9px;
  border:1px solid var(--line-strong);border-radius:8px;background:#FAFAF7;color:var(--faint);
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.search-box:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search-box input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px;color:var(--ink)}
.search-box input::placeholder{color:var(--faint)}
.search-box kbd{
  font-family:var(--mono);font-size:8.5px;color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px;background:#fff;white-space:nowrap;
}
.search-pop{
  position:absolute;top:calc(100% + 8px);right:0;width:430px;max-height:min(520px,68vh);
  overflow:auto;padding:7px;background:#fff;border:1px solid var(--line);border-radius:13px;
  z-index:90;box-shadow:0 18px 44px -18px rgba(20,20,30,.26),0 2px 6px rgba(20,20,30,.04);
}
.search-head{padding:6px 9px 5px;font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--faint);display:flex;align-items:center;justify-content:space-between}
.search-result{
  display:flex;align-items:flex-start;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:8px;
  background:none;text-align:left;
}
.search-result:hover{background:#F4F3ED}
.sr-ico{
  width:22px;height:22px;border-radius:6px;background:#F3F2EB;color:var(--muted);
  display:grid;place-items:center;flex:none;margin-top:1px;
}
.sr-main{min-width:0}
.sr-title{font-size:11.5px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-meta{font-size:9px;color:var(--faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.search-empty{padding:18px 10px;font-size:10.5px;color:var(--faint);line-height:1.6}
.search-hint{padding:5px 9px 7px;font-size:9px;color:var(--faint);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.search-hint kbd{font-family:var(--mono);font-size:8.5px;border:1px solid var(--line);border-radius:3px;padding:0 3px;background:#FAFAF7}

/* ---------- top icon buttons / bell ---------- */
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;
  background:none;color:var(--muted);position:relative;flex:none;transition:.12s;
}
.icon-btn:hover{background:#F3F2EC;color:var(--ink)}
.icon-btn:focus-visible,.project-btn:focus-visible,.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bell-wrap{position:relative;flex:none}
.bell-badge{
  position:absolute;top:2px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--accent);color:#fff;font-size:8.5px;font-weight:600;display:grid;place-items:center;
  border:2px solid #fff;line-height:1;
}
.bell-pop{
  position:absolute;top:calc(100% + 10px);right:0;width:330px;padding:7px;background:#fff;
  border:1px solid var(--line);border-radius:13px;z-index:90;
  box-shadow:0 18px 44px -18px rgba(20,20,30,.26),0 2px 6px rgba(20,20,30,.04);
}
.bell-item{display:grid;grid-template-columns:8px 1fr auto;gap:8px;width:100%;padding:9px 9px;border:0;border-radius:8px;background:none;text-align:left;align-items:start}
.bell-item:hover{background:#F4F3ED}
.bell-kind{font-size:8.5px;color:var(--faint);font-weight:600}
.bell-title{font-size:11px;font-weight:500;line-height:1.45;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell-cta{font-size:9px;color:var(--accent);font-weight:500;margin-top:2px}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.02em;flex:none;user-select:none;
}

/* ---------- tabs ---------- */
.tabbar{
  display:flex;align-items:stretch;gap:24px;padding:0 24px;background:#fff;
  border-bottom:1px solid var(--line);position:relative;z-index:30;min-width:0;
}
.tab{
  position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 0 1px;
  border:0;background:none;font-size:13.5px;color:var(--muted);font-weight:450;
  transition:color .15s;white-space:nowrap;flex:none;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:-2px;right:-2px;bottom:-1px;height:2px;
  border-radius:2px 2px 0 0;background:var(--accent);
}
.tab:focus-visible{outline:none;text-decoration:underline;text-underline-offset:4px}
.tab-badge{
  min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#EFEEE7;
  color:var(--muted);font-size:8.5px;font-weight:600;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;line-height:1;
}
.tab-badge.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tab-spacer{flex:1}
.sync-note{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,125,89,.1);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- scroll canvas + sticky context ---------- */
.scroll{
  position:relative;overflow:auto;min-width:0;
  background:radial-gradient(1100px 520px at 88% -12%,rgba(37,71,232,.05),transparent 62%),var(--surface);
  scrollbar-gutter:stable;
}
.contextbar{
  position:sticky;top:0;z-index:25;height:68px;display:flex;align-items:center;justify-content:space-between;
  gap:22px;padding:0 30px;background:rgba(250,250,246,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.ctx-main{display:flex;align-items:center;gap:11px;min-width:0}
.ctx-badge{
  width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;font-weight:600;flex:none;box-shadow:0 2px 7px rgba(0,0,0,.13);
}
.ctx-text{min-width:0}
.ctx-title{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.ctx-code{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--accent);
  background:var(--accent-soft);padding:2px 5px;border-radius:4px;flex:none;
}
.ctx-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ctx-state{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--green);font-weight:500;flex:none}
.ctx-tag{font-size:9.5px;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:0 5px;line-height:15px;flex:none}
.ctx-meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;margin-top:1px;min-width:0}
.ctx-meta .path{font-family:var(--mono);font-size:9.5px;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ctx-sep{width:2px;height:2px;border-radius:50%;background:var(--faint);opacity:.7;flex:none}
.ctx-side{display:flex;align-items:center;gap:18px;flex:none}
.ctx-metrics{display:flex;align-items:center}
.ctx-metric{display:flex;flex-direction:column;align-items:flex-start;padding:0 12px;border-left:1px solid var(--line);line-height:1.3}
.ctx-metric:first-child{border-left:0;padding-left:0}
.ctx-metric b{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ctx-metric span{font-size:9px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.ctx-metric.hot b{color:var(--accent)}
.ctx-metric.alert b{color:var(--red)}

/* ---------- buttons / tags / dots ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:33px;padding:0 13px;
  border:1px solid var(--line-strong);border-radius:8px;background:#fff;font-size:11.5px;font-weight:500;
  color:var(--ink);transition:.15s;white-space:nowrap;
}
.btn:hover{background:#F7F6F0;border-color:#C9C5B9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(37,71,232,.24)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{height:28px;padding:0 10px;font-size:10.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:#F3F2EC;color:var(--ink)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{
  display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:4px;
  font-size:9px;font-weight:500;white-space:nowrap;border:1px solid transparent;flex:none;line-height:1;
}
.tag.priority{font-family:var(--mono);font-size:8.5px;letter-spacing:.02em}
.tag.p0{color:var(--red);background:var(--red-soft)}
.tag.p1{color:var(--amber);background:var(--amber-soft)}
.tag.p2{color:var(--ink-2);background:#EEEDE6}
.tag.p3{color:var(--faint);background:#F3F2EC}
.tag.type{color:var(--muted);border-color:var(--line-strong);background:#fff}
.tag.soft{background:#F1F0E9;color:var(--muted)}
.tag.status{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--faint);display:inline-block}
.dot.lg{width:8px;height:8px}
.dot.blue{background:var(--accent)}
.dot.green{background:var(--green)}
.dot.amber{background:var(--amber)}
.dot.red{background:var(--red)}
.dot.gray{background:#B9B6AB}
.dot.ink{background:#55555E}
.dot.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px #B9B6AB}
.dot.ring-amber{box-shadow:0 0 0 3px rgba(169,111,21,.13)}
.dot.ring-red{box-shadow:0 0 0 3px rgba(190,68,56,.12)}
.dot.ring-blue{box-shadow:0 0 0 3px rgba(37,71,232,.1)}
.sts{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.sts.blue{color:var(--accent)}
.sts.amber{color:var(--amber)}
.sts.red{color:var(--red)}
.sts.green{color:var(--green)}

/* ---------- page shell ---------- */
.view{padding:26px 30px 72px}
.view-inner{max-width:1200px;margin:0 auto;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}
.eyebrow{
  display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.13em;color:var(--faint);text-transform:uppercase;line-height:1.4;
}
.page-head h1,.flow-head h1{
  margin:4px 0 5px;font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.02em;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.title-count{font-size:11.5px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0}
.page-sub{margin:0;font-size:12px;color:var(--muted);line-height:1.7;max-width:680px}
.flow-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:16px}
.flow-meta{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:10.5px;color:var(--faint);flex-wrap:wrap}
.flow-meta .dot{width:5px;height:5px}
.seg{display:inline-flex;padding:2px;background:#EAE9E2;border-radius:8px;gap:2px;flex:none}
.seg button{
  height:27px;padding:0 11px;border:0;border-radius:6px;background:none;
  font-size:10.5px;color:var(--muted);font-weight:500;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,20,20,.08)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- commitment strip ---------- */
.commit-strip{
  display:flex;align-items:center;gap:20px;padding:12px 15px;background:#fff;
  border:1px solid var(--line);border-radius:12px;margin-bottom:20px;box-shadow:var(--shadow-soft);
}
.commit-lead{display:flex;flex-direction:column;gap:1px;min-width:92px;border-right:1px solid var(--line);padding-right:18px;align-self:stretch;justify-content:center}
.commit-lead .eyebrow{font-size:8.5px;letter-spacing:.1em}
.commit-total{display:flex;align-items:baseline;gap:5px}
.commit-total b{font-size:22px;line-height:1.15;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.commit-total span{font-size:9.5px;color:var(--faint)}
.commit-body{flex:1;min-width:0}
.commit-bar{display:flex;height:5px;gap:2px;border-radius:2px;overflow:hidden;background:var(--line)}
.commit-seg{height:100%;min-width:0;background:var(--muted);transition:flex-grow .2s}
.commit-seg[data-k="待确认"]{background:var(--amber)}
.commit-seg[data-k="已确认"]{background:#7B8798}
.commit-seg[data-k="已拆分"]{background:var(--green)}
.commit-seg[data-k="已关闭"]{background:#D9D6CB}
.commit-legend{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:7px}
.commit-legend button{
  display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;
  font-size:10.5px;color:var(--muted);white-space:nowrap;
}
.commit-legend button:hover{color:var(--ink)}
.commit-legend b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.commit-link{border:0;background:none;font-size:10.5px;color:var(--accent);font-weight:500;white-space:nowrap;flex:none;padding:2px 0}
.commit-link:hover{text-decoration:underline}

/* ---------- flow grid + stream ---------- */
.flow-grid{display:grid;grid-template-columns:minmax(0,1fr) 326px;gap:26px;align-items:start}
.flow-main{min-width:0}
.stream-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 0}
.stream-head h2{margin:0;font-size:13.5px;font-weight:600}
.stream-note{font-size:10.5px;color:var(--faint)}
.filters{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:wrap}
.chip{
  height:25px;padding:0 9px;border:1px solid transparent;border-radius:999px;background:none;
  font-size:10.5px;color:var(--muted);font-weight:450;transition:.12s;
}
.chip:hover{background:#ECEBE3;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.day{margin-top:2px}
.day-head{
  position:sticky;top:68px;z-index:8;display:flex;align-items:center;gap:9px;
  padding:10px 0 7px;background:var(--surface);
}
.day-head::after{content:"";flex:1;height:1px;background:var(--line)}
.day-label{display:flex;align-items:baseline;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.day-label em{font-style:normal;font-weight:400;font-size:10px;color:var(--faint)}
.day-label.today{color:var(--accent)}
.day-count{
  font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;
  padding:0 6px;line-height:16px;background:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.events{list-style:none;margin:0;padding:0 0 6px}
.event{
  position:relative;display:grid;grid-template-columns:46px 18px minmax(0,1fr);
  padding:9px 12px 10px 0;margin-left:-12px;border-radius:10px;cursor:pointer;
  transition:background .12s;
}
.event:hover{background:rgba(255,255,255,.82)}
.event:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ev-time{
  padding-top:2px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.ev-time.live{color:var(--accent);font-weight:600}
.ev-rail{position:relative;display:flex;justify-content:center;padding-top:4px}
.ev-rail::before{
  content:"";position:absolute;top:-9px;bottom:-9px;left:50%;width:1px;
  background:var(--line);transform:translateX(-.5px);
}
.event:first-child .ev-rail::before{top:8px}
.event:last-child .ev-rail::before{bottom:auto;height:8px}
.event:only-child .ev-rail::before{display:none}
.ev-dot{
  width:7px;height:7px;border-radius:50%;position:relative;z-index:1;margin-top:2px;
  background:var(--muted);box-shadow:0 0 0 3px var(--surface);
}
.event:hover .ev-dot{box-shadow:0 0 0 3px #fff}
.ev-dot.blue{background:var(--accent)}
.ev-dot.green{background:var(--green)}
.ev-dot.amber{background:var(--amber)}
.ev-dot.red{background:var(--red)}
.ev-dot.gray{background:#B9B6AB}
.ev-dot.ink{background:#55555E}
.ev-dot.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px #B9B6AB,0 0 0 3px var(--surface)}
.ev-dot.ring{box-shadow:0 0 0 3px rgba(190,68,56,.14),0 0 0 3px var(--surface)}
.ev-main{min-width:0;padding-left:4px}
.ev-kicker{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--faint);line-height:1.5;flex-wrap:wrap}
.ev-kind{font-weight:600;color:var(--muted);letter-spacing:.03em}
.ev-actor{color:var(--muted)}
.ev-proj{
  font-family:var(--mono);font-size:8.5px;color:var(--faint);border:1px solid var(--line);
  border-radius:3px;padding:0 3px;line-height:14px;
}
.ev-title{margin:0;font-size:13px;line-height:1.5;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.ev-title .quiet{font-weight:400;color:var(--muted)}
.ev-text{margin:2px 0 0;font-size:11.5px;line-height:1.65;color:var(--muted);max-width:640px;overflow-wrap:anywhere}
.ev-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ev-chip{
  font-size:9px;color:var(--faint);background:#EFEEE7;border-radius:3px;padding:1px 5px;
  font-variant-numeric:tabular-nums;line-height:14px;
}
.ev-chip.warn{color:var(--amber);background:var(--amber-soft)}
.ev-chip.red{color:var(--red);background:var(--red-soft)}
.ev-open{
  position:absolute;right:12px;bottom:11px;font-size:10px;color:var(--accent);font-weight:500;
  opacity:0;transform:translateX(-2px);transition:.15s;display:flex;align-items:center;gap:2px;
}
.event:hover .ev-open{opacity:1;transform:none}
.stream-empty{padding:34px 0;font-size:10.5px;color:var(--faint);line-height:1.7}
.stream-foot{padding:18px 0 8px;font-size:9px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* ---------- now panel ---------- */
.now-panel{
  position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:15px 15px 13px;box-shadow:0 12px 34px -24px rgba(20,20,30,.3);
  max-height:calc(100vh - 168px);overflow:auto;scrollbar-width:thin;
}
.now-panel::before{content:"";position:absolute;left:15px;right:15px;top:-1px;height:2px;background:linear-gradient(90deg,var(--accent),rgba(37,71,232,.15))}
.now-head{display:flex;align-items:center;gap:8px}
.now-mark{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.now-head h2{margin:0;font-size:13.5px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.now-head h2 em{font-family:var(--mono);font-style:normal;font-size:8.5px;letter-spacing:.12em;color:var(--faint)}
.now-total{margin-left:auto;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.now-sub{margin:4px 0 0;font-size:10.5px;color:var(--faint);line-height:1.55}
.now-items{list-style:none;margin:8px 0 0;padding:0}
.now-item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.now-item:first-child{border-top:0}
.now-item .dot{margin-top:6px}
.now-kind{font-size:9.5px;font-weight:600;letter-spacing:.03em;color:var(--faint);line-height:1.4}
.now-kind.warn{color:var(--amber)}
.now-kind.red{color:var(--red)}
.now-kind.blue{color:var(--accent)}
.now-title{
  margin:1px 0 0;font-size:12px;line-height:1.45;font-weight:500;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
}
.now-meta{margin-top:3px;font-size:9.5px;color:var(--faint);display:flex;gap:4px 7px;flex-wrap:wrap;line-height:1.45}
.now-meta .p{font-family:var(--mono)}
.now-cta{
  height:24px;padding:0 8px;border:1px solid #D9DDF3;border-radius:6px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:9.5px;font-weight:600;white-space:nowrap;margin-top:1px;transition:.12s;
}
.now-cta:hover{background:#E1E6FF;border-color:#C4CCF0}
.now-empty{padding:12px 0 4px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);line-height:1.6}
.now-rule{border:0;border-top:1px solid var(--line);margin:11px 0 0}
.now-section{margin-top:12px}
.now-section-head{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--faint);margin-bottom:2px}
.now-section-head .n{font-weight:500;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 4px;line-height:14px}
.running-item{display:flex;gap:7px;width:100%;padding:6px 0;border:0;background:none;text-align:left;align-items:flex-start}
.running-item:hover .run-title{color:var(--accent)}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:5px;position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(37,71,232,.32);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.8}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}
.run-main{min-width:0}
.run-title{font-size:11px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s}
.run-meta{font-size:9px;color:var(--faint);margin-top:1px;display:flex;gap:5px;flex-wrap:wrap}
.next-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:10px;color:var(--muted);min-width:0}
.next-item .dot{width:5px;height:5px}
.next-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.next-link{border:0;background:none;color:var(--accent);font-size:9.5px;font-weight:500;padding:0;white-space:nowrap}
.next-link:hover{text-decoration:underline}
.now-inbox{
  margin-top:11px;width:100%;display:flex;align-items:center;gap:6px;padding:8px 9px;
  border:1px solid var(--line);border-radius:8px;background:#FAFAF7;font-size:9.5px;color:var(--muted);
  text-align:left;transition:.12s;
}
.now-inbox:hover{border-color:var(--line-strong);color:var(--ink)}
.now-inbox b{font-weight:600;color:var(--ink-2)}
.now-inbox svg{margin-left:auto;color:var(--faint)}

/* ---------- toolbars / pills ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.toolbar-note{font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.pill-row{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.status-filter{
  height:25px;padding:0 9px;border-radius:999px;border:1px solid transparent;background:none;
  font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.status-filter:hover{background:#ECEBE3;color:var(--ink)}
.status-filter[aria-pressed="true"]{background:#fff;border-color:var(--line-strong);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.status-filter .n{color:var(--faint);font-size:9px;font-variant-numeric:tabular-nums}

/* ---------- requirements ---------- */
.req-project{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-soft)}
.req-project-head{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);background:#FCFCF9;flex-wrap:wrap}
.req-project-head .pcode{
  font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:2px 5px;border-radius:4px;letter-spacing:.03em;
}
.req-project-head h2{margin:0;font-size:12.5px;font-weight:600;line-height:1.4}
.req-project-head .meta{margin-left:auto;font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
.req-group{padding-bottom:5px}
.req-group + .req-group{border-top:1px solid var(--line)}
.req-group-head{display:flex;align-items:center;gap:6px;padding:9px 15px 6px;flex-wrap:wrap}
.req-group-head h3{margin:0;font-size:10.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.req-group-head .n{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.req-group-head .hint{font-size:9px;color:var(--faint)}
.req-empty{padding:1px 15px 8px 27px;font-size:10px;color:var(--faint)}
.req-row{
  display:grid;grid-template-columns:17px minmax(0,1fr) auto;gap:6px;padding:9px 15px 10px 13px;
  border-top:1px solid #F3F2EC;cursor:pointer;transition:background .12s;position:relative;
}
.req-row:hover{background:#FBFBF7}
.req-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.req-chev{color:var(--faint);padding-top:4px;transition:transform .15s;display:grid;place-items:start center}
.req-row.open .req-chev{transform:rotate(90deg);color:var(--ink-2)}
.req-main{min-width:0}
.req-title-line{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.req-seq{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:-.02em;flex:none}
.req-title{
  font-size:12.5px;font-weight:500;line-height:1.45;overflow-wrap:anywhere;border:0;background:none;
  padding:0;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
}
.req-title:hover{color:var(--accent)}
.req-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.req-time{font-size:9px;color:var(--faint);margin-left:1px;white-space:nowrap}
.req-meta{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:9.5px;color:var(--faint);margin-top:2px;line-height:1.5}
.req-meta .source{color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.req-side{display:flex;align-items:center;gap:7px;padding-top:1px}
.mini-pips{display:flex;align-items:center;gap:2px}
.mini-pips .dot{width:5px;height:5px}
.req-side-note{font-size:9.5px;color:var(--faint);white-space:nowrap}
.row-act{
  height:23px;padding:0 8px;border:1px solid var(--line-strong);background:#fff;border-radius:6px;
  font-size:9.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;transition:.12s;
}
.row-act:hover{border-color:var(--accent);color:var(--accent)}
.row-act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row-act.primary:hover{background:var(--accent-ink);color:#fff}
.req-expand{padding:0 15px 14px 36px;background:#FBFAF5;border-top:1px solid #EFEEE8;animation:unfold .18s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.req-expand-top{display:flex;gap:14px;padding:11px 0 12px;align-items:flex-start;flex-wrap:wrap}
.req-note{
  flex:1;min-width:240px;margin:0;padding:9px 11px;border-left:2px solid #D9D6CB;
  background:#F3F2EC;border-radius:0 6px 6px 0;font-size:10.5px;color:var(--muted);line-height:1.7;
}
.req-note b{display:block;font-size:8px;font-weight:600;color:var(--ink-2);margin-bottom:2px;letter-spacing:.04em}
.req-note .req-desc{margin:4px 0 0;color:var(--ink-2);font-size:9.5px;line-height:1.6}
.req-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding-top:1px}
.req-tasks{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.req-tasks-head{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:#FCFCF9}
.req-tasks-head h4{margin:0;font-size:10px;font-weight:600;color:var(--ink-2)}
.req-tasks-head .n{font-size:9px;color:var(--faint);font-variant-numeric:tabular-nums}
.req-tasks-head .hint{margin-left:auto;font-size:9px;color:var(--faint)}
.mini-task{
  display:grid;grid-template-columns:7px minmax(0,1fr) auto auto auto auto;gap:7px;align-items:center;
  padding:8px 10px;border-top:1px solid #F3F2EC;cursor:pointer;transition:background .12s;
}
.mini-task:first-of-type{border-top:0}
.mini-task:hover{background:#FAFAF6}
.mini-task:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mini-title{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-attempt{font-size:9.5px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.mini-open{font-size:9.5px;color:var(--accent);opacity:0;transition:.12s;white-space:nowrap}
.mini-task:hover .mini-open{opacity:1}
.req-task-empty{padding:13px 11px;font-size:10.5px;color:var(--faint);line-height:1.65}
.req-flash{animation:flash 1.8s ease}
.event.ev-flash{animation:flash 1.8s ease}
@keyframes flash{0%,100%{background-color:transparent}18%{background-color:#EDF0FF}}

/* ---------- tasks table ---------- */
.task-table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-soft)}
.task-thead,.task-row{
  display:grid;grid-template-columns:minmax(230px,1.55fr) 62px 52px minmax(180px,1.05fr) 66px 14px;
  gap:12px;align-items:center;
}
.task-thead{padding:8px 15px;background:#FBFBF7;border-bottom:1px solid var(--line);font-size:9px;color:var(--faint);letter-spacing:.07em;font-weight:600}
.task-row{width:100%;padding:11px 15px;border:0;border-top:1px solid #F2F1EB;background:none;text-align:left;transition:background .12s}
.task-thead + .task-row{border-top:0}
.task-row:hover{background:#FAFAF6}
.task-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.task-row-main{display:flex;align-items:flex-start;gap:7px;min-width:0}
.task-row-main > .dot{margin-top:5px}
.task-row-title{font-size:12.5px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row-sub{font-size:9.5px;color:var(--faint);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.task-attempt{display:flex;flex-direction:column;gap:1px;min-width:0}
.att-line{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-sub{font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-updated{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.task-arrow{color:var(--faint);display:grid;place-items:center}
.task-row:hover .task-arrow{color:var(--accent)}
.empty{padding:42px 20px;text-align:center;color:var(--faint);font-size:10.5px;line-height:1.7}

/* ---------- inbox ---------- */
.inbox-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:22px;align-items:start}
.inbox-list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-soft)}
.inbox-item{padding:13px 15px;border-top:1px solid var(--line)}
.inbox-item:first-child{border-top:0}
.inbox-head{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--faint);margin-bottom:6px;flex-wrap:wrap}
.channel{font-size:9px;background:#F1F0E9;border-radius:3px;padding:1px 5px;color:var(--ink-2);font-weight:500}
.inbox-contact{font-size:11.5px;color:var(--ink-2);font-weight:500}
.inbox-time{margin-left:auto;font-variant-numeric:tabular-nums}
.inbox-text{font-size:12px;line-height:1.7;color:var(--ink-2);margin:0 0 8px;overflow-wrap:anywhere}
.inbox-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.inbox-proj{font-size:9.5px;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.inbox-actions{margin-left:auto;display:flex;gap:5px}
.aside-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:sticky;top:88px;box-shadow:var(--shadow-soft)}
.aside-card h3{margin:0 0 3px;font-size:11.5px;font-weight:600}
.aside-card > p{margin:0;font-size:10.5px;color:var(--faint);line-height:1.7}
.principle-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.principle-list li{display:flex;gap:7px;font-size:10.5px;color:var(--muted);line-height:1.7;align-items:flex-start}
.principle-list b{color:var(--ink-2);font-weight:500}
.step-n{
  font-family:var(--mono);font-size:8px;color:var(--accent);background:var(--accent-soft);
  border-radius:3px;width:15px;height:15px;display:grid;place-items:center;flex:none;margin-top:1px;
}
.inbox-flash{animation:flash 1.8s ease}

/* ---------- memory ---------- */
.mem-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.memory{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-soft);
}
.memory.flash{animation:flash 1.8s ease}
.memory-head{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.memory-title{font-size:12.5px;font-weight:600;line-height:1.5;margin:0;overflow-wrap:anywhere}
.memory-text{
  font-size:10.5px;color:var(--muted);line-height:1.7;margin:0;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.memory-meta{font-size:9.5px;color:var(--faint);display:flex;gap:5px 8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:3px;flex-wrap:wrap}
.tag-mini{font-size:9px;background:#F3F2EC;color:var(--faint);padding:1px 5px;border-radius:3px;line-height:14px}
.memory-foot{margin-top:auto;padding-top:8px;border-top:1px solid #F3F2EC;display:flex;align-items:center;gap:5px}
.memory-foot .spacer{flex:1}

/* ---------- reviews ---------- */
.review-section{margin-bottom:22px}
.section-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.section-head h2{margin:0;font-size:12px;font-weight:600}
.section-head .n{font-size:9px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 5px;line-height:15px;background:#fff;font-variant-numeric:tabular-nums}
.section-head .hint{margin-left:auto;font-size:9.5px;color:var(--faint)}
.pending-review{
  display:flex;align-items:center;gap:9px;padding:12px 14px;background:#fff;border:1px solid var(--line);
  border-radius:11px;width:100%;text-align:left;transition:.12s;box-shadow:var(--shadow-soft);
}
.pending-review:hover{border-color:#CCC8BC;background:#FCFCF9}
.pr-main{flex:1;min-width:0}
.pr-title{font-size:12px;font-weight:500;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-meta{font-size:9.5px;color:var(--faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.review-list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-soft)}
.review-item{padding:11px 14px;border-top:1px solid #F2F1EB}
.review-item:first-child{border-top:0}
.review-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.review-task{font-size:11.5px;font-weight:500}
.review-task:hover{text-decoration:underline;text-underline-offset:2px}
.review-comment{
  margin:5px 0 0;font-size:10.5px;color:var(--muted);line-height:1.7;padding-left:9px;
  border-left:2px solid var(--line);overflow-wrap:anywhere;
}
.review-meta{font-size:9.5px;color:var(--faint);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* ---------- projects ---------- */
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.project-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;box-shadow:var(--shadow-soft);
}
.project-card.current::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.project-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.project-code{font-family:var(--mono);font-size:9px;color:var(--accent);background:var(--accent-soft);padding:2px 5px;border-radius:4px;letter-spacing:.03em}
.project-card h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.project-desc{margin:0;font-size:10.5px;color:var(--muted);line-height:1.7}
.project-root{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin:0;overflow-wrap:anywhere}
.project-stats{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:1px 0}
.project-stat{padding:0 13px;border-left:1px solid var(--line)}
.project-stat:first-child{padding-left:0;border-left:0}
.project-stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.3}
.project-stat span{font-size:9px;color:var(--faint);white-space:nowrap}
.project-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.project-foot .last{font-size:9px;color:var(--faint)}
.project-foot .btn{margin-left:auto}
.hierarchy-strip{
  display:flex;align-items:center;gap:9px;margin-top:20px;padding:12px 15px;
  border:1px dashed var(--line-strong);border-radius:11px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;
}
.hierarchy-strip b{color:var(--ink-2);font-weight:500}
.hier-step{display:inline-flex;align-items:center;gap:5px}
.hier-arrow{color:var(--faint);display:grid;place-items:center}

/* ---------- overlays: sheets / composer / modal ---------- */
.overlay{position:fixed;inset:0;z-index:1000;display:flex;justify-content:flex-end}
.overlay-mask{position:absolute;inset:0;background:rgba(23,23,28,.3);backdrop-filter:blur(2px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:relative;z-index:1;height:100%;width:min(470px,100%);background:var(--surface);
  box-shadow:-24px 0 70px -30px rgba(15,15,20,.38);display:flex;flex-direction:column;
  animation:slideIn .24s cubic-bezier(.2,.8,.25,1);min-height:0;
}
.detail-sheet{width:min(760px,100%)}
@keyframes slideIn{from{transform:translateX(30px);opacity:.55}to{transform:none;opacity:1}}
.sheet-head{
  display:flex;align-items:flex-start;gap:14px;padding:19px 22px 15px;border-bottom:1px solid var(--line);
  background:#FCFCF9;flex:none;
}
.sheet-head h2{margin:3px 0 0;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.3;overflow-wrap:anywhere}
.sheet-head .icon-btn{margin-left:auto;margin-top:-2px}
.sheet-body{flex:1;overflow:auto;padding:17px 22px 30px;min-height:0}
.sheet-foot{
  display:flex;align-items:center;gap:8px;padding:12px 22px;border-top:1px solid var(--line);
  background:#FCFCF9;flex:none;
}
.sheet-foot .hint{font-size:9.5px;color:var(--faint);line-height:1.5;margin-right:auto;max-width:240px}
.sheet-foot .btn{flex:none}
.detail-head{padding:17px 24px 14px;border-bottom:1px solid var(--line);background:#FCFCF9;flex:none}
.detail-crumb{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--faint);flex-wrap:wrap;line-height:1.5}
.detail-crumb .pcode{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 4px;border-radius:3px}
.detail-title-row{display:flex;align-items:flex-start;gap:12px;margin-top:5px}
.detail-title-row h2{margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.detail-title-row .icon-btn{margin-left:auto;flex:none}
.detail-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:10px;color:var(--faint);line-height:1.5}
.detail-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.detail-actions .spacer{flex:1}
.text-danger{border:0;background:none;color:var(--red);font-size:10.5px;padding:4px 0;font-weight:500;white-space:nowrap}
.text-danger:hover{text-decoration:underline}
.detail-body{padding:16px 24px 36px;overflow:auto;flex:1;min-height:0}
.detail-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:10px;margin-bottom:14px}
.info-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.info-label{
  display:flex;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.05em;
  color:var(--faint);margin-bottom:4px;text-transform:uppercase;
}
.info-card p{margin:0;font-size:10.5px;line-height:1.7;color:var(--ink-2);overflow-wrap:anywhere}
.info-card .sub{margin-top:4px;font-size:9.5px;color:var(--faint);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.info-card.full{grid-column:1/-1}
.action-card{border:1px solid;border-radius:11px;padding:12px 13px;margin-bottom:16px}
.action-card.review{background:#FCF7EC;border-color:#EBDBBC}
.action-card.accept{background:var(--accent-soft);border-color:#D7DCF7}
.action-card.blocked{background:var(--red-soft);border-color:#F0D5D1}
.action-card.ready{background:#F5F4EE;border-color:var(--line)}
.action-card h3{margin:0;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:1.5}
.action-card p.hint{margin:3px 0 0;font-size:10.5px;color:var(--muted);line-height:1.65}
.action-card .btn{margin-top:9px}
.review-input{
  width:100%;margin-top:8px;border:1px solid #E4D4B4;border-radius:8px;background:#fff;
  padding:7px 9px;font-size:11.5px;line-height:1.6;resize:vertical;min-height:52px;outline:none;
}
.review-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(169,111,21,.1)}
.review-actions{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.review-actions .spacer{flex:1}
.btn.review-pass{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.review-pass:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.timeline-title{display:flex;align-items:center;gap:7px;margin:5px 0 1px}
.timeline-title h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-2)}
.timeline-title .n{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.timeline-title .line{flex:1;height:1px;background:var(--line)}
.task-timeline{position:relative}
.tl-day{display:flex;align-items:center;gap:8px;margin:12px 0 1px;padding-top:3px;font-size:9.5px;color:var(--faint);font-weight:500}
.tl-day::after{content:"";flex:1;height:1px;background:var(--line)}
.tl-day.today{color:var(--accent)}
.tl-entry{display:grid;grid-template-columns:37px 16px minmax(0,1fr);padding:6px 0;position:relative}
.tl-time{padding-top:1px;text-align:right;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tl-rail{position:relative;display:flex;justify-content:center;padding-top:3px}
.tl-rail::before{content:"";position:absolute;top:-6px;bottom:-6px;left:50%;width:1px;background:var(--line);transform:translateX(-.5px)}
.tl-entry:first-child .tl-rail::before{top:3px}
.tl-entry:last-child .tl-rail::before{bottom:auto;height:3px}
.tl-dot{width:6px;height:6px;border-radius:50%;background:var(--faint);position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.tl-dot.blue{background:var(--accent)}
.tl-dot.green{background:var(--green)}
.tl-dot.amber{background:var(--amber)}
.tl-dot.red{background:var(--red)}
.tl-dot.ink{background:#55555E}
.tl-main{min-width:0;padding:0 0 2px 4px}
.tl-kicker{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--faint);flex-wrap:wrap;line-height:1.5}
.tl-kicker b{font-weight:600;color:var(--muted)}
.tl-text{margin:1px 0 0;font-size:11.5px;line-height:1.65;color:var(--ink-2);overflow-wrap:anywhere}
.tl-text.quote{color:var(--muted);background:#F4F3ED;border-left:2px solid #DDD9CD;padding:5px 8px;border-radius:0 5px 5px 0;margin-top:4px}
.attempt-chip{font-family:var(--mono);font-size:7.5px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:12px;background:#fff}
.evidence{
  display:flex;align-items:flex-start;gap:7px;margin-top:5px;padding:6px 8px;
  background:#fff;border:1px solid var(--line);border-radius:7px;
}
.evidence svg{color:var(--faint);margin-top:1px}
.evidence .ev-title2{font-size:10.5px;font-weight:500;color:var(--ink-2);line-height:1.45}
.evidence .ev-sub{font-size:9.5px;color:var(--faint);margin-top:1px;overflow-wrap:anywhere;line-height:1.5}
.danger-zone{
  margin-top:20px;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:9px;flex-wrap:wrap;
}
.danger-zone span{font-size:9.5px;color:var(--faint);line-height:1.5;max-width:360px}
.danger-zone .text-danger{margin-left:auto}

/* modal */
.modal-layer{justify-content:center;align-items:center;z-index:1200}
.modal{
  position:relative;z-index:1;width:min(400px,calc(100% - 40px));background:#fff;border-radius:15px;
  padding:21px;box-shadow:0 30px 80px -20px rgba(0,0,0,.38);animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.975);opacity:0}to{transform:none;opacity:1}}
.modal-icon{width:31px;height:31px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin-bottom:10px}
.modal h2{margin:0 0 5px;font-size:15px;font-weight:600}
.modal p{margin:0;font-size:11.5px;line-height:1.75;color:var(--muted);overflow-wrap:anywhere}
.modal .modal-task{color:var(--ink);font-weight:500}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}

/* form fields */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:15px}
.field > label,.field-label{
  font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.03em;display:flex;align-items:center;gap:5px;
}
.field .req{font-weight:400;color:var(--faint)}
.field .note{font-size:9px;color:var(--faint);line-height:1.55;font-weight:400}
.input,.textarea,.select{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;background:#fff;
  padding:8px 10px;font-size:12px;color:var(--ink);outline:none;transition:.15s;
}
.input{height:34px}
.textarea{resize:vertical;min-height:80px;line-height:1.65}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder,.textarea::placeholder{color:#B2AFA5}
.select{height:33px;padding-right:26px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field-row .field{margin-bottom:0}
.seg-control{display:inline-flex;gap:2px;padding:2px;background:#EFEEE7;border-radius:8px;flex-wrap:wrap}
.seg-control button{
  min-width:34px;height:24px;padding:0 8px;border:0;border-radius:6px;background:none;
  font-size:10.5px;color:var(--muted);font-weight:500;
}
.seg-control button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.seg-control.prio button[aria-pressed="true"][data-value="P0"]{color:var(--red)}
.seg-control.prio button[aria-pressed="true"][data-value="P1"]{color:var(--amber)}
.seg-control button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;color:var(--muted);line-height:1.55;cursor:pointer;margin:2px 0 0}
.check input{width:13px;height:13px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.source-card{background:#F4F3ED;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:14px}
.src-label{font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--faint);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.source-card p{margin:3px 0 0;font-size:10.5px;line-height:1.7;color:var(--ink-2);overflow-wrap:anywhere}
.ctx-req{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#FCFCF9;margin-bottom:14px}
.ctx-req .seq{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:2px}
.ctx-req h3{margin:0;font-size:11.5px;font-weight:500;line-height:1.55}
.ctx-req p{margin:2px 0 0;font-size:9.5px;color:var(--faint)}
.split-preview{margin-top:-3px;padding:10px 11px;background:#F6F5EF;border:1px solid var(--line);border-radius:9px;margin-bottom:14px}
.split-preview-head{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:600;color:var(--faint);letter-spacing:.05em;margin-bottom:6px}
.split-preview-count{margin-left:auto;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.split-item{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10.5px;min-width:0}
.split-item .n{font-family:var(--mono);font-size:9px;color:var(--faint);width:14px;flex:none}
.split-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-empty{font-size:10px;color:var(--faint);line-height:1.65;padding:1px 0}
.warn-line{display:flex;gap:5px;font-size:9.5px;color:var(--amber);line-height:1.55;margin-top:6px}
.form-error{font-size:10.5px;color:var(--red);min-height:0;margin:2px 0 0;line-height:1.5}

/* toasts */
.toast-root{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:7px;background:#232329;color:#fff;padding:8px 13px;
  border-radius:9px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);font-size:10.5px;
  animation:toastIn .2s ease;max-width:min(560px,calc(100vw - 40px));line-height:1.5;
}
.toast svg{color:#8FE0B4}
.toast.out{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(4px)}}

/* responsive */
@media (max-width:1180px){
  .proj-btn-name{max-width:110px}
  .global-search{width:218px}
  .ctx-meta .path{max-width:150px}
  .flow-grid{grid-template-columns:minmax(0,1fr) 300px;gap:20px}
  .view{padding-inline:24px}
  .contextbar{padding-inline:24px}
  .now-panel{top:84px}
}
@media (max-width:1024px){
  .tabbar{gap:17px;overflow-x:auto;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .brand-name span{display:none}
  .project-btn{padding-right:7px}
  .ctx-metrics{display:none}
  .flow-grid{grid-template-columns:1fr;gap:20px}
  .now-panel{position:static;max-height:none;order:-1}
  .now-items{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
  .now-item:nth-child(2){border-top:0}
  .now-panel::before{left:14px;right:14px}
  .project-grid,.mem-grid{grid-template-columns:1fr}
  .inbox-layout{grid-template-columns:1fr}
  .aside-card{position:static}
  .task-thead,.task-row{grid-template-columns:minmax(220px,1.6fr) minmax(160px,1fr) 60px 14px}
  .task-table .col-type,.task-table .col-prio{display:none}
}
@media (max-width:820px){
  .app{grid-template-rows:56px 44px minmax(0,1fr)}
  .topbar{padding:0 14px;gap:10px}
  .project-switch{max-width:220px}
  .proj-btn-name{max-width:80px}
  .global-search{width:180px}
  .avatar{display:none}
  .tabbar{padding:0 14px;gap:16px}
  .sync-note{display:none}
  .contextbar{padding:0 16px;height:62px;gap:12px}
  .ctx-meta{display:none}
  .ctx-side{gap:8px}
  .ctx-side .btn span.long{display:none}
  .view{padding:20px 16px 56px}
  .day-head{top:62px}
  .page-head{align-items:flex-start;flex-direction:column;gap:10px}
  .flow-head{align-items:flex-start;flex-direction:column;gap:10px}
  .commit-strip{gap:12px;padding:11px 12px}
  .commit-lead{padding-right:12px;min-width:76px}
  .commit-link{display:none}
  .now-items{display:block}
  .now-item:nth-child(2){border-top:1px solid var(--line)}
  .sheet-body,.detail-body{padding-inline:16px}
  .sheet-head,.detail-head,.sheet-foot{padding-inline:16px}
  .detail-grid{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .req-expand{padding-left:22px}
  .req-side-note,.mini-pips{display:none}
  .task-thead,.task-row{grid-template-columns:minmax(0,1fr) 70px 14px;gap:8px}
  .task-table .col-attempt{display:none}
  .req-title-line{flex-wrap:wrap}
  .req-time{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="雄大工作台 · 概览">
      <span class="brand-mark">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <circle cx="4" cy="3" r="1.6" fill="currentColor"/>
          <circle cx="9" cy="6.5" r="1.6" fill="currentColor" opacity=".65"/>
          <circle cx="4" cy="10" r="1.6" fill="currentColor"/>
          <path d="M4 4.6v3.8M5.4 6.5h2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">雄大<span>工作台</span></span>
    </button>
    <div class="project-switch" id="projectSwitch"></div>
    <div class="top-grow"></div>
    <div class="global-search">
      <div class="search-box">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="globalSearch" type="search" placeholder="搜索需求、任务、记忆" autocomplete="off" aria-label="全局搜索">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="search-pop" id="searchPop" hidden></div>
    </div>
    <div class="bell-wrap" id="bellWrap"></div>
    <div class="avatar" title="你 · 当前操作者" aria-label="当前用户 你">Y</div>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
  <div class="scroll" id="scroll">
    <div class="contextbar" id="contextbar"></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="overlayRoot"></div>
<div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ============================================================
   0 · tiny helpers
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function projectOf(id) { return byId(PROJECTS, id); }

function tasksOfReq(reqId) { return tasks.filter(task => task.requirementId === reqId); }
function attemptsOfTask(taskId) {
  return attempts.filter(attempt => attempt.taskId === taskId).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
}
function latestAttempt(task) {
  if (task.currentAttemptId) {
    const current = byId(attempts, task.currentAttemptId);
    if (current) return current;
  }
  const all = attemptsOfTask(task.id);
  return all[all.length - 1];
}
function inboxOpen() { return inbox.filter(item => item.status === '未处理'); }
function scopeProjectId() { return state.timelineScope === 'all' ? null : state.projectId; }

function stamp() {
  clock = new Date(clock.getTime() + 60000);
  return `2026-11-17 ${pad2(clock.getHours())}:${pad2(clock.getMinutes())}`;
}
function nowClockText() { return `${pad2(clock.getHours())}:${pad2(clock.getMinutes())}`; }
function timeAgo(at) {
  if (!at) return '—';
  const date = new Date(at.replace(' ', 'T'));
  if (Number.isNaN(date.getTime())) return at;
  const mins = Math.max(0, Math.floor((clock - date) / 60000));
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} 小时前`;
  const days = Math.floor(hours / 24);
  if (days < 8) return `${days} 天前`;
  return `${Math.floor(days / 7)} 周前`;
}
function waitingFor(at) {
  const date = new Date(at.replace(' ', 'T'));
  const mins = Math.max(0, Math.floor((clock - date) / 60000));
  if (mins < 60) return `${mins} 分钟`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} 小时`;
  return `${Math.floor(hours / 24)} 天`;
}
function dayMeta(date) {
  return DAY_META[date] || {
    label: `${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日`,
    sub: '',
    today: false,
  };
}
function createdLabel(at) {
  if (!at) return '';
  const date = at.slice(0, 10);
  const meta = dayMeta(date);
  if (date === '2026-11-17') return `今天 ${at.slice(11, 16)}`;
  if (date === '2026-11-16') return `昨天 ${at.slice(11, 16)}`;
  return `${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日`;
}

}

}

function makeNowItem(kind, opts) {
  return {
    key: `${kind}-${opts.id}`,
    kind, kindLabel: opts.kindLabel, kindClass: opts.kindClass || '',
    title: opts.title, meta: opts.meta || [], dot: opts.dot || 'amber',
    rank: opts.rank ?? 9, cta: opts.cta, action: opts.action, id: opts.id,
    projectId: opts.projectId,
  };
}
function nowItemsFor(projectId) {

  const items = [];

      const project = projectOf(req.projectId);
      items.push(makeNowItem('req', {
        id: req.id, projectId: req.projectId, kindLabel: '需求待确认',
        kindClass: req.priority === 'P0' ? 'red' : 'warn', dot: req.priority === 'P0' ? 'red' : 'amber',
        title: req.title, meta: [project.shortCode, req.priority || 'P2', `等 ${waitingFor(req.createdAt)}`],
        rank: req.priority === 'P0' ? 1 : 3, cta: '确认', action: 'confirm-req',
      }));
    });
  tasks
    .filter(task => inScope(task.projectId))
    .forEach(task => {
      const project = projectOf(task.projectId);
      const attempt = latestAttempt(task);
      if (task.status === '阻塞') {
        items.push(makeNowItem('task', {
          id: task.id, projectId: task.projectId, kindLabel: '阻塞', kindClass: 'red', dot: 'red',
          title: task.title, meta: [project.shortCode, task.attention || '需要处理', `等 ${waitingFor(task.updatedAt)}`],
          rank: 2, cta: '处理', action: 'open-task',
        }));
      } else if (task.status === '评审') {
        items.push(makeNowItem('review', {
          id: task.id, projectId: task.projectId, kindLabel: '等你评审', kindClass: 'warn', dot: 'amber',
          title: task.title, meta: [project.shortCode, attempt ? attempt.stage : '评审', `更新 ${timeAgo(task.updatedAt)}`],
          rank: 4, cta: '评审', action: 'open-task',
        }));
      } else if (task.status === '待验收') {
        items.push(makeNowItem('accept', {
          id: task.id, projectId: task.projectId, kindLabel: '待验收', kindClass: 'blue', dot: 'amber',
          title: task.title, meta: [project.shortCode, attempt ? attempt.stage : '待验收', `更新 ${timeAgo(task.updatedAt)}`],
          rank: 5, cta: '验收', action: 'open-task',
        }));
      }
    });
  memories
    .filter(memory => memory.status === '待复核' && inScope(memory.projectId))
    .forEach(memory => {
      items.push(makeNowItem('memory', {
        id: memory.id, projectId: memory.projectId, kindLabel: '记忆待复核', kindClass: '', dot: 'amber',
        title: memory.title, meta: [memory.type, projectOf(memory.projectId).shortCode, `更新 ${timeAgo(memory.updatedAt)}`],
        rank: 6, cta: '复核', action: 'open-memory',
      }));
    });
  return items.sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title, 'zh'));
}
function nextItemsFor(projectId) {
  const inScope = id => !projectId || id === projectId;
  const readyTasks = tasks
    .filter(task => task.status === '就绪' && inScope(task.projectId))
    .map(task => ({
      key: `next-${task.id}`, projectId: task.projectId, dot: 'gray', title: task.title,
      kind: 'task', id: task.id, cta: '派发', action: 'dispatch-task', meta: '任务就绪',
    }));
  const unsplitReqs = requirements
    .filter(req => req.status === '已确认' && !tasksOfReq(req.id).length && inScope(req.projectId))
    .map(req => ({
      key: `next-${req.id}`, projectId: req.projectId, dot: 'ink', title: req.title,
      kind: 'req', id: req.id, cta: '拆任务', action: 'split-req', meta: '需求已确认',
    }));
  return [...unsplitReqs, ...readyTasks].slice(0, 4);
}
function inboxCountFor(projectId) {
  return inboxOpen().filter(item => !projectId || item.projectId === projectId).length;
}
function eventMatches(ev) {
  const filter = state.eventFilter;
  if (filter === 'all') return true;
  if (filter === 'commit') return ['requirement', 'split', 'confirm'].includes(ev.kind);
  if (filter === 'exec') return ['attempt', 'report', 'evidence'].includes(ev.kind);
  if (filter === 'review') return ['review', 'accept'].includes(ev.kind);
  if (filter === 'inbox') return ev.kind === 'inbox';
  return true;
}

function eventsHtml(evs) {
  if (!evs.length) {
    return `<p class="stream-empty">这个筛选下还没有活动。切回「全部」看看承诺与执行的全貌。</p>`;
  }
  let lastDate = '';
  let html = '';
  evs.forEach(ev => {
    const date = ev.at.slice(0, 10);
    if (date !== lastDate) {
      if (lastDate) html += '</ol></section>';
      const meta = dayMeta(date);
      const count = evs.filter(item => item.at.slice(0, 10) === date).length;
      html += `<section class="day">
        <div class="day-head">
          <span class="day-label ${meta.today ? 'today' : ''}">${meta.label}${meta.sub ? `<em>${meta.sub}</em>` : ''}</span>
          <span class="day-count">${count} 条</span>
        </div>
        <ol class="events">`;
      lastDate = date;
    }
    html += eventHtml(ev);
  });
  if (lastDate) html += '</ol></section>';
  return html + `<p class="stream-foot">${icon('check', 11)} 已展示最近 3 天的活动 · 原型使用模拟数据</p>`;
}

            <span class="last">最近活动 ${projectLastActivity(project.id)}</span>

            </button>
          </div>
        </article>`;
      }).join('')}
    </div>
    <div class="hierarchy-strip">
