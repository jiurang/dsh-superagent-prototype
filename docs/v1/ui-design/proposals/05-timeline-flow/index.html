      <span style="margin-left:auto">尝试只进入任务详情，不污染任务列表。</span>
    </div>`;
}

/* ============================================================
   9 · requirements, grouped by project and status
   ============================================================ */
function requirementsHtml() {
  const scopes = state.reqScope === 'all' ? PROJECTS : [currentProject()];
  const scopedReqs = requirements.filter(req => scopes.some(project => project.id === req.projectId));
  const statuses = state.reqStatus === 'all' ? REQUIREMENT_STATUSES : [state.reqStatus];
  const visible = scopedReqs.filter(req => state.reqStatus === 'all' || req.status === state.reqStatus);
  return `
    ${pageHead('REQUIREMENTS · 承诺容器', `需求 <span class="title-count">${visible.length} 条</span>`,
      '按项目归档，再按状态推进。展开一条需求，看到它拆出的任务与每个任务的最新尝试。',
      `<button class="btn" data-action="new-requirement">${icon('plus', 12)} 新建需求</button>`)}
    <div class="toolbar">
      <div class="seg" role="group" aria-label="需求范围">
        <button data-action="req-scope" data-scope="current" aria-pressed="${state.reqScope === 'current'}">当前项目</button>
        <button data-action="req-scope" data-scope="all" aria-pressed="${state.reqScope === 'all'}">全部项目</button>
      </div>
      <div class="pill-row">
        <button class="status-filter" data-action="req-status" data-status="all" aria-pressed="${state.reqStatus === 'all'}">全部 <span class="n">${scopedReqs.length}</span></button>
        ${REQUIREMENT_STATUSES.map(status => `<button class="status-filter" data-action="req-status" data-status="${status}" aria-pressed="${state.reqStatus === status}">
          <span class="dot ${REQ_DOT[status]}"></span>${status} <span class="n">${scopedReqs.filter(req => req.status === status).length}</span>
        </button>`).join('')}
      </div>
      <span class="spacer"></span>
      <span class="toolbar-note">${icon('folder', 10)} ${state.reqScope === 'all' ? '2 个项目' : esc(currentProject().shortCode)}</span>
    </div>
    ${scopes.map(project => requirementsProjectHtml(project, statuses)).join('')}`;
}

function requirementsProjectHtml(project, statuses) {
  const reqs = requirements.filter(req => req.projectId === project.id);
  return `
    <section class="req-project">
      <div class="req-project-head">
        <span class="pcode">${esc(project.shortCode)}</span>
        <h2>${esc(project.name)}</h2>
        <span class="sts"><span class="dot green"></span>${esc(project.status)}</span>
        <span class="tag soft">${esc(project.sensitivity)}</span>
        <span class="meta">${reqs.length} 个需求 <span class="ctx-sep"></span> ${reqs.filter(req => req.status !== '已关闭').length} 个未关闭</span>
      </div>
      ${statuses.map(status => {
        const list = reqs.filter(req => req.status === status);
        return `<div class="req-group">
          <div class="req-group-head">
            <span class="dot ${REQ_DOT[status]}"></span>
            <h3>${status}</h3><span class="n">${list.length}</span>
            <span class="hint">${REQ_HINT[status]}</span>
          </div>
          ${list.length ? list.map(req => requirementRowHtml(req)).join('') : `<p class="req-empty">这个状态下没有需求。</p>`}
        </div>`;
      }).join('')}
    </section>`;
}

function requirementRowHtml(req) {
  const open = state.expandedReq === req.id;
  const ts = tasksOfReq(req.id);
  const quick = req.status === '待确认'
    ? `<button class="row-act primary" data-action="confirm-req" data-id="${req.id}">确认</button>`
    : req.status === '已确认'
      ? `<button class="row-act" data-action="split-req" data-id="${req.id}">拆任务</button>`
      : '';
  return `<div class="req-row ${open ? 'open' : ''}" data-action="toggle-req" data-id="${req.id}" data-req-id="${req.id}">
    <span class="req-chev">${icon('chevRight', 11)}</span>
    <div class="req-main">
      <div class="req-title-line">
        <span class="req-seq">#${req.seqNo}</span>
        <button type="button" class="req-title" data-action="toggle-req" data-id="${req.id}" aria-expanded="${open}">${esc(req.title)}</button>
        ${priorityTag(req.priority)}
        <span class="req-time">${createdLabel(req.createdAt)}</span>
      </div>
      <div class="req-meta">
        <span class="source">${icon(sourceIcon(req.sourceNote), 9)} ${esc(sourceShort(req.sourceNote))}</span>
        <span>·</span>
        <span>${ts.length} 个任务</span>
        <span>·</span>
        <span>更新 ${timeAgo(req.updatedAt)}</span>
      </div>
    </div>
    <div class="req-side">
      ${ts.length ? `<span class="mini-pips" title="${esc(ts.map(task => task.status).join(' / '))}">${ts.slice(0, 6).map(task => `<span class="dot ${TASK_DOT[task.status]}"></span>`).join('')}</span>
        <span class="req-side-note">${taskSignal(ts)}</span>` : `<span class="req-side-note">还未拆任务</span>`}
      ${quick}
    </div>
  </div>
  ${open ? requirementExpandHtml(req, ts) : ''}`;
}

function requirementExpandHtml(req, ts) {
  return `<div class="req-expand">
    <div class="req-expand-top">
      <blockquote class="req-note">
        <b>来源 · ${esc(sourceShort(req.sourceNote))}</b>
        ${esc(req.sourceNote || '手动记录')}
        ${req.description ? `<p class="req-desc">${esc(req.description)}</p>` : ''}
      </blockquote>
      <div class="req-actions">
        ${req.status === '待确认' ? `<button class="btn primary sm" data-action="confirm-req" data-id="${req.id}">${icon('check', 11)} 确认需求</button>` : ''}
        ${req.status !== '已关闭' ? `<button class="btn ${req.status === '已确认' ? 'primary' : ''} sm" data-action="split-req" data-id="${req.id}">${icon('split', 11)} 拆任务</button>` : ''}
        <button class="btn ghost sm" data-action="open-req-timeline" data-id="${req.id}">在时间线中查看</button>
      </div>
    </div>
    <div class="req-tasks">
      <div class="req-tasks-head">
        <span class="dot ${req.status === '已关闭' ? 'gray' : 'green'}"></span>
        <h4>任务</h4><span class="n">${ts.length}</span>
        <span class="hint">最新尝试在这里展开，详情里看完整时间线</span>
      </div>
      ${ts.length ? ts.map(task => miniTaskHtml(task)).join('') : `<div class="req-task-empty">还没有任务。拆任务后，任务与它们的尝试会出现在这里。</div>`}
    </div>
  </div>`;
}

function miniTaskHtml(task) {
  const attempt = latestAttempt(task);
  return `<div class="mini-task" data-action="open-task" data-id="${task.id}" role="button" tabindex="0">
    <span class="dot ${TASK_DOT[task.status]}"></span>
    <span class="mini-title">${esc(task.title)}</span>
    <span class="tag type">${esc(task.type)}</span>
    ${priorityTag(task.priority)}
    <span class="mini-attempt">${attempt ? `${icon('play', 9)} ${shortAttempt(attempt)} · ${esc(attempt.status)} · ${esc(attempt.stage)} · ${timeAgo(attempt.lastReportAt || attempt.createdAt)}` : '未派发'}</span>
    <span class="mini-open">打开 ${icon('arrow', 9)}</span>
  </div>`;
}
function shortAttempt(attempt) { return attempt.id; }

/* ============================================================
   10 · tasks
   ============================================================ */
function tasksHtml() {
  const project = currentProject();
  const all = tasks.filter(task => task.projectId === project.id);
  const list = state.taskFilter === 'all' ? all : all.filter(task => task.status === state.taskFilter);
  return `
    ${pageHead('TASKS · 需求之下', `任务 <span class="title-count">${list.length} 个</span>`,
      '任务是需求的切片；状态、阻塞与最新尝试一眼可见，完整执行记录只在详情里展开。',
      `<span class="toolbar-note">${icon('folder', 10)} 当前项目 · ${esc(project.name)}</span>`)}
    <div class="toolbar">
      <div class="pill-row">
        <button class="status-filter" data-action="task-filter" data-status="all" aria-pressed="${state.taskFilter === 'all'}">全部 <span class="n">${all.length}</span></button>
        ${TASK_STATUSES.map(status => `<button class="status-filter" data-action="task-filter" data-status="${status}" aria-pressed="${state.taskFilter === status}">
          <span class="dot ${TASK_DOT[status]}"></span>${status} <span class="n">${all.filter(task => task.status === status).length}</span>
        </button>`).join('')}
      </div>
      <span class="spacer"></span>
      <span class="toolbar-note">${icon('split', 10)} 任务来自需求的拆分</span>
    </div>
    <div class="task-table">
      <div class="task-thead">
        <span>任务 / 所属需求</span><span class="col-type">类型</span><span class="col-prio">优先级</span><span class="col-attempt">最新尝试</span><span>更新</span><span></span>
      </div>
      ${list.length ? list.map(task => taskRowHtml(task)).join('') : `<div class="empty">这个状态下没有任务。<br>切换筛选，或到需求里拆出新的任务。</div>`}
    </div>`;
}

function taskRowHtml(task) {
  const attempt = latestAttempt(task);
  const req = reqOf(task);
  const project = projectOf(task.projectId);
  return `<button class="task-row" data-action="open-task" data-id="${task.id}">
    <span class="task-row-main">
      <span class="dot ${TASK_DOT[task.status]}"></span>
      <span style="min-width:0">
        <span class="task-row-title">${esc(task.title)}</span>
        <span class="task-row-sub">
          <span>${esc(project.shortCode)} · #${req ? req.seqNo : '—'} ${esc(req ? req.title : '')}</span>
          ${task.attention ? `<span class="sts red">${icon('alert', 9)} ${esc(task.attention)}</span>` : ''}
        </span>
      </span>
    </span>
    <span class="col-type"><span class="tag type">${esc(task.type)}</span></span>
    <span class="col-prio">${priorityTag(task.priority)}</span>
    <span class="task-attempt col-attempt">
      <span class="att-line"><span class="dot ${attempt ? ATTEMPT_DOT[attempt.status] : 'gray'}"></span>${attempt ? esc(attempt.stage) : '未派发'}<span class="sts">${attempt ? esc(attempt.status) : ''}</span></span>
      <span class="att-sub">${attempt ? `${shortAttempt(attempt)} · ${timeAgo(attempt.lastReportAt || attempt.createdAt)}` : '等待派发'}</span>
    </span>
    <span class="task-updated">${timeAgo(task.updatedAt)}</span>
    <span class="task-arrow">${icon('arrow', 12)}</span>
  </button>`;
}

/* ============================================================
   11 · inbox
   ============================================================ */
function inboxHtml() {
  const open = inboxOpen();
  return `
    ${pageHead('INBOX · 入口', `收件箱 <span class="title-count">${open.length} 条未处理</span>`,
      '收件不是需求。先保留原话，再决定它落到哪个项目、成为哪条承诺。')}
    <div class="inbox-layout">
      <div class="inbox-list">
        ${open.length ? open.map(item => inboxItemHtml(item)).join('') : `<div class="empty">收件箱清空了。新的企微、邮件或电话记录会先落在这里。</div>`}
      </div>
      <aside class="aside-card">
        <h3>分诊原则</h3>
        <p>一条收件进入工作流之前，只做三件事。</p>
        <ul class="principle-list">
          <li><span class="step-n">01</span><span><b>保留原话。</b>不急着改写，引用是后续确认需求的依据。</span></li>
          <li><span class="step-n">02</span><span><b>落到项目。</b>项目是第一层上下文，跨项目混在一起会让承诺失焦。</span></li>
          <li><span class="step-n">03</span><span><b>转成可确认的需求。</b>标题一句话，来源留在旁边，剩下的交给拆任务。</span></li>
        </ul>
        <hr class="now-rule">
        <p style="margin-top:9px">${icon('clock', 10)} 原型时钟固定在 14:32，时间为模拟值。</p>
      </aside>
    </div>`;
}

function inboxItemHtml(item) {
  const project = projectOf(item.projectId);
  const channelIco = item.channel === '邮箱' ? 'doc' : item.channel === '电话' ? 'clock' : 'inbox';
  return `<article class="inbox-item" data-inbox-id="${item.id}">
    <div class="inbox-head">
      <span class="channel">${esc(item.channel)}</span>
      <span class="inbox-contact">${esc(item.contact || '未留联系人')}</span>
      <span class="inbox-proj">· ${esc(project.shortCode)}</span>
      <span class="inbox-time">${createdLabel(item.receivedAt)} · ${timeAgo(item.receivedAt)}</span>
    </div>
    <p class="inbox-text">「${esc(item.rawContext)}」</p>
    <div class="inbox-foot">
      <span class="inbox-proj">${icon(channelIco, 10)} ${item.externalRef ? esc(item.externalRef) : '无外部引用'}</span>
      <div class="inbox-actions">
        <button class="btn sm" data-action="inbox-ignore" data-id="${item.id}">忽略</button>
        <button class="btn primary sm" data-action="inbox-triage" data-id="${item.id}">${icon('split', 10)} 转需求</button>
      </div>
    </div>
  </article>`;
}

/* ============================================================
   12 · memory
   ============================================================ */
function memoryHtml() {
  const project = currentProject();
  const all = memories.filter(memory => memory.projectId === project.id);
  const list = state.memoryFilter === 'all' ? all : all.filter(memory => memory.status === state.memoryFilter);
  const actionable = all.filter(memory => memory.status === '待复核' || memory.status === '草稿').length;
  return `
    ${pageHead('MEMORY · 长期上下文', `记忆 <span class="title-count">${list.length} 条</span>`,
      '只把经过确认的事实留在项目里；草稿与待复核的记忆不会直接进入执行上下文。')}
    <div class="toolbar">
      <div class="pill-row">
        <button class="status-filter" data-action="memory-filter" data-status="all" aria-pressed="${state.memoryFilter === 'all'}">全部 <span class="n">${all.length}</span></button>
        ${['待复核', '已确认', '草稿', '已废弃'].map(status => `<button class="status-filter" data-action="memory-filter" data-status="${status}" aria-pressed="${state.memoryFilter === status}">
          <span class="dot ${MEMORY_DOT[status]}"></span>${status} <span class="n">${all.filter(memory => memory.status === status).length}</span>
        </button>`).join('')}
      </div>
      <span class="spacer"></span>
      <span class="toolbar-note">${actionable} 条等你复核 · ${esc(project.shortCode)}</span>
    </div>
    ${list.length ? `<div class="mem-grid">${list.map(memory => memoryCardHtml(memory)).join('')}</div>`
      : `<div class="empty">这个状态下没有记忆。记忆来自任务结论、会话与人工交接。</div>`}`;
}

function memoryCardHtml(memory) {
  const project = projectOf(memory.projectId);
  const actionable = memory.status === '待复核' || memory.status === '草稿';
  return `<article class="memory" data-memory-id="${memory.id}">
    <div class="memory-head">
      <span class="tag soft">${esc(memory.type)}</span>
      <span class="sts"><span class="dot ${MEMORY_DOT[memory.status]}"></span>${esc(memory.status)}</span>
      <span class="memory-meta" style="margin-left:auto">${esc(project.shortCode)}</span>
    </div>
    <h3 class="memory-title">${esc(memory.title)}</h3>
    <p class="memory-text">${esc(memory.content)}</p>
    <div class="memory-meta">
      <span>来源 ${esc(memory.sourceType)}${memory.sourceRef ? ` · ${esc(memory.sourceRef)}` : ''}</span>
      <span>·</span>
      <span>更新 ${timeAgo(memory.updatedAt)}</span>
    </div>
    <div class="tags">${memory.tags.map(tag => `<span class="tag-mini">${esc(tag)}</span>`).join('')}</div>
    <div class="memory-foot">
      <span class="memory-meta">${actionable ? '确认后进入项目上下文' : memory.status === '已确认' ? '已在项目上下文中' : '已归档'}</span>
      <span class="spacer"></span>
      ${actionable ? `<button class="btn ghost sm" data-action="memory-decision" data-id="${memory.id}" data-decision="退回">退回</button>
        <button class="btn sm" data-action="memory-decision" data-id="${memory.id}" data-decision="确认">${icon('check', 10)} 确认</button>` : ''}
    </div>
  </article>`;
}

/* ============================================================
   13 · reviews
   ============================================================ */
function reviewsHtml() {
  const project = currentProject();
  const pending = tasks.filter(task => task.projectId === project.id && task.status === '评审');
  const history = reviews
    .filter(review => {
      const task = byId(tasks, review.taskId);
      return task && task.projectId === project.id;
    })
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  return `
    ${pageHead('REVIEWS · 人的判断', `评审 <span class="title-count">${pending.length} 待评审</span>`,
      '执行可以自动化，判断不能。评审结论会进入任务时间线，并决定它转向验收还是继续执行。')}
    ${pending.length ? `<section class="review-section">
      <div class="section-head"><h2>待你评审</h2><span class="n">${pending.length}</span><span class="hint">点开后可直接给出结论</span></div>
      ${pending.map(task => {
        const attempt = latestAttempt(task);
        const req = reqOf(task);
        return `<button class="pending-review" data-action="open-task" data-id="${task.id}">
          <span class="dot amber ring-amber"></span>
          <span class="pr-main">
            <span class="pr-title">${esc(task.title)}</span>
            <span class="pr-meta"><span>${esc(req ? `需求 #${req.seqNo} · ${req.title}` : '')}</span><span>·</span><span>${attempt ? `${shortAttempt(attempt)} · ${esc(attempt.stage)}` : '等待评审'}</span><span>·</span><span>${timeAgo(task.updatedAt)}</span></span>
          </span>
          <span class="btn sm">开始评审 ${icon('arrow', 10)}</span>
        </button>`;
      }).join('')}
    </section>` : `<section class="review-section"><div class="section-head"><h2>待你评审</h2></div><div class="empty" style="padding:24px;background:#fff;border:1px solid var(--line);border-radius:11px">当前项目没有待评审的任务。</div></section>`}
    <section class="review-section">
      <div class="section-head"><h2>评审记录</h2><span class="n">${history.length}</span><span class="hint">当前项目 · 近 30 天</span></div>
      <div class="review-list">
        ${history.length ? history.map(review => {
          const task = byId(tasks, review.taskId);
          const req = task ? reqOf(task) : null;
          return `<div class="review-item">
            <div class="review-top">
              <span class="dot ${review.decision === '通过' ? 'green' : 'red'}"></span>
              <button class="review-task" style="border:0;background:none;padding:0;text-align:left" data-action="open-task" data-id="${review.taskId}">${esc(task ? task.title : review.taskId)}</button>
              <span class="tag ${review.decision === '通过' ? 'soft' : 'soft'}">${esc(review.decision)}</span>
              <span class="review-meta" style="margin-left:auto">${review.reviewer || '未署名'} · ${createdLabel(review.createdAt)}</span>
            </div>
            ${review.comments ? `<p class="review-comment">「${esc(review.comments)}」</p>` : ''}
            <div class="review-meta">
              <span>${esc(req ? `#${req.seqNo} ${req.title}` : '')}</span>
              <span>·</span>
              <span>${timeAgo(review.createdAt)}</span>
            </div>
          </div>`;
        }).join('') : `<div class="empty">还没有评审记录。</div>`}
      </div>
    </section>`;
}

/* ============================================================
   14 · overlays: task detail, composer, delete confirmation
   ============================================================ */
function renderOverlays() {
  let html = '';
  if (state.detailTaskId) {
    const task = byId(tasks, state.detailTaskId);
    if (task) html += taskSheetHtml(task);
    else state.detailTaskId = null;
  }
  if (state.composer) html += composerHtml();
  if (state.deleteTaskId) html += deleteModalHtml();

  $('#overlayRoot').innerHTML = html;
  const locked = !!(state.detailTaskId || state.composer || state.deleteTaskId);
  const scrollEl = $('#scroll');
  if (scrollEl) scrollEl.style.overflow = locked ? 'hidden' : '';
}

function taskSheetHtml(task) {
  const req = reqOf(task);
  const project = projectOf(task.projectId);
  const attempt = latestAttempt(task);
  const entryCount = taskTimelineEntries(task).length;
  return `
    <div class="overlay" role="presentation">
      <div class="overlay-mask" data-action="close-sheet"></div>
      <section class="sheet detail-sheet" role="dialog" aria-modal="true" aria-labelledby="taskSheetTitle">
        <header class="detail-head">
          <div class="detail-crumb">

function taskActionCardHtml(task) {
  if (task.status === '评审') {
    return `<div class="action-card review">
      <h3><span class="dot amber ring-amber"></span>等你评审</h3>
      <p class="hint">通过后任务转入待验收；退回会回到进行中，并记录你的意见。</p>
      <textarea id="reviewComment" class="review-input" rows="2" placeholder="评审意见（可选）：关注点、风险或补充要求"></textarea>
      <div class="review-actions">
        <span class="hint">结论会写入任务时间线</span>
        <span class="spacer"></span>
        <button class="btn sm" type="button" data-action="review-submit" data-id="${task.id}" data-decision="退回">退回</button>
        <button class="btn sm review-pass" type="button" data-action="review-submit" data-id="${task.id}" data-decision="通过">通过并转待验收</button>
      </div>
    </div>`;
  }
  if (task.status === '待验收') {
    return `<div class="action-card accept">
      <h3><span class="dot amber ring-amber"></span>等待你验收</h3>
      <p class="hint">${esc(task.acceptance || '验收标准未填写；建议补全后再验收。')}</p>
      <div class="review-actions">
        <span class="hint">验收后任务关闭，证据保留</span>
        <span class="spacer"></span>
        <button class="btn sm primary" type="button" data-action="accept-task" data-id="${task.id}">${icon('check', 11)} 验收通过</button>
      </div>
    </div>`;
  }
  if (task.status === '阻塞') {
    return `<div class="action-card blocked">
      <h3><span class="dot red ring-red"></span>阻塞 · ${esc(task.attention || '需要处理')}</h3>
      <p class="hint">执行尝试已停下，没有产生新的写入。解除外部条件后可重新派发；历史尝试仍会保留。</p>
      <div class="review-actions">
        <span class="hint">等待 ${waitingFor(task.updatedAt)}</span>
        <span class="spacer"></span>
        <button class="btn sm" type="button" data-action="retry-task" data-id="${task.id}">${icon('refresh', 11)} 重试派发</button>
      </div>
    </div>`;
  }
  if (task.status === '就绪') {
    return `<div class="action-card ready">
      <h3><span class="dot gray"></span>就绪 · 等待派发</h3>
      <p class="hint">任务已经拆出，但还没有执行尝试。派发后执行器会接管；自动派发可以在项目设置里开启。</p>
      <div class="review-actions">
        <span class="hint">${esc(task.acceptance || '')}</span>
        <span class="spacer"></span>
        <button class="btn sm primary" type="button" data-action="dispatch-task" data-id="${task.id}">${icon('play', 11)} 派发</button>
      </div>
    </div>`;
  }
  return '';
}

function taskTimelineEntries(task) {
  const entries = [];
  const req = reqOf(task);
  entries.push({
    at: task.createdAt, kind: 'created', label: '任务创建', actor: '你',
    text: `由需求 #${req ? req.seqNo : '—'} 拆出 · ${task.type} · ${task.priority}`,
    tone: 'ink',
  });
  attemptsOfTask(task.id).forEach(attempt => {
    entries.push({
      at: attempt.createdAt, kind: 'attempt', label: '尝试开始', actor: '小雄 · 执行器',
      attemptId: attempt.id, text: `${attempt.stage} · 会话 ${attempt.workerSessionId}`, tone: 'blue',
    });
    (attempt.reports || []).forEach(report => {
      entries.push({
        at: report.at, kind: 'report', label: '报告', actor: '小雄 · 执行器',
        attemptId: attempt.id, text: report.text, tone: report.tone === 'red' ? 'red' : 'green',
      });
    });
    artifacts.filter(artifact => artifact.attemptId === attempt.id).forEach(artifact => {
      entries.push({
        at: artifact.createdAt, kind: 'evidence', label: `证据 · ${artifact.type}`,
        attemptId: attempt.id, artifact, tone: 'green',
      });
    });
    if (attempt.endedAt) {
      entries.push({
        at: attempt.endedAt, kind: 'attempt-end', label: '尝试结束', attemptId: attempt.id,
        actor: '系统', text: `状态 ${attempt.status} · 阶段 ${attempt.stage}`,
        tone: ATTEMPT_DOT[attempt.status] === 'green' ? 'green' : ATTEMPT_DOT[attempt.status] === 'red' ? 'red' : 'gray',
      });
    } else if (attempt.status === '阻塞') {
      entries.push({
        at: attempt.lastReportAt || attempt.createdAt, kind: 'attempt-block', label: '尝试阻塞',
        attemptId: attempt.id, actor: '系统', text: task.attention || `阶段 ${attempt.stage}`,
        tone: 'red',
      });
    }
  });
  reviews.filter(review => review.taskId === task.id).forEach(review => {
    entries.push({
      at: review.createdAt, kind: 'review', label: `评审${review.decision}`,
      actor: review.reviewer || '未署名', text: review.comments || '评审结论已记录。',
      tone: review.decision === '通过' ? 'green' : 'red',
    });
  });
  if (task.acceptedAt) {
    entries.push({
      at: task.acceptedAt, kind: 'accept', label: '验收通过', actor: task.acceptedBy || '你',
      text: '任务关闭；运行记录、证据与审计保留。', tone: 'green',
    });
  }
  return entries.sort((a, b) => b.at.localeCompare(a.at) || b.kind.localeCompare(a.kind));
}

function taskTimelineHtml(task) {
  const entries = taskTimelineEntries(task);
  let html = '';
  let lastDate = '';
  entries.forEach(entry => {
    const date = entry.at.slice(0, 10);
    if (date !== lastDate) {
      const meta = dayMeta(date);
      html += `<div class="tl-day ${meta.today ? 'today' : ''}">${meta.label}${meta.sub ? ` · ${meta.sub}` : ''}</div>`;
      lastDate = date;
    }
    const artifact = entry.artifact;
    html += `<div class="tl-entry">
      <span class="tl-time">${entry.at.slice(11, 16)}</span>
      <span class="tl-rail"><span class="tl-dot ${entry.tone || 'gray'}"></span></span>
      <div class="tl-main">
        <div class="tl-kicker">
          <b>${esc(entry.label)}</b>
          ${entry.actor ? `<span>${esc(entry.actor)}</span>` : ''}
          ${entry.attemptId ? `<span class="attempt-chip">${shortAttempt({ id: entry.attemptId })}</span>` : ''}
        </div>
        ${artifact ? `<div class="evidence">
          ${icon('doc', 11)}
          <div>
            <div class="ev-title2">${esc(artifact.title)}</div>
            <div class="ev-sub">${esc(artifact.uri || '')}${artifact.content ? ` · ${esc(artifact.content)}` : ''}</div>
          </div>
        </div>` : `<p class="tl-text">${esc(entry.text || '')}</p>`}
      </div>
    </div>`;
  });
  return `<div class="task-timeline">${html}</div>`;
}

          </div>
          <div class="split-preview" id="splitPreview">
            ${splitPreviewContent([])}
          </div>

function splitPreviewContent(titles) {
  if (!titles.length) {
    return `<div class="split-preview-head">${icon('split', 10)} 预览 <span class="split-preview-count">0 个任务</span></div>
      <p class="split-empty">每行一个任务；输入后这里会实时预览。拆出的任务会立即出现在需求下。</p>`;
  }
  const prose = titles.length > 1 && titles.some(title => /^(以及|并且|并|和|与|或|及)/.test(title) || /[。！？]$/.test(title));
  return `<div class="split-preview-head">${icon('split', 10)} 预览 <span class="split-preview-count">${titles.length} 个任务</span></div>
    ${titles.map((title, index) => `<div class="split-item"><span class="n">${pad2(index + 1)}</span><span class="t">${esc(title)}</span></div>`).join('')}
    ${prose ? `<p class="warn-line">${icon('alert', 10)} 有些行看起来像一段话被拆开了；如果本意是一个任务，请写在一行内。</p>` : ''}
    ${titles.length > 8 ? `<p class="warn-line">${icon('alert', 10)} 一次拆太多会难以验收，建议控制在 6 个以内。</p>` : ''}`;
}

function updateSplitForm() {
  const textarea = $('#splitTitles');
  if (!textarea) return;
  const titles = textarea.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const box = $('#splitPreview');
  if (box) box.innerHTML = splitPreviewContent(titles);
  const submit = $('#splitSubmit');
  if (submit) {
    submit.disabled = !titles.length;
    submit.innerHTML = titles.length ? `${icon('split', 11)} 拆出 ${titles.length} 个任务` : '拆出任务';
  }
}

/* ============================================================
   15 · navigation helpers
   ============================================================ */
function goTab(tab) {
  state.tab = tab;
  if (tab !== 'overview') state.timelineScope = 'project';
  state.detailTaskId = null;
  state.composer = null;
  state.deleteTaskId = null;
  state.bellOpen = false;
  state.projectMenuOpen = false;
  renderAll({ resetScroll: true });
}

function openTask(id) {
  const task = byId(tasks, id);
  if (!task) return;
  state.detailTaskId = task.id;
  state.deleteTaskId = null;
  state.composer = null;
  state.bellOpen = false;
  state.projectMenuOpen = false;
  renderAll();
}

function openRequirement(id) {
  const req = byId(requirements, id);
  if (!req) return;
  state.projectId = req.projectId;
  state.tab = 'requirements';
  state.reqScope = 'current';
  state.reqStatus = 'all';
  state.expandedReq = req.id;
  state.detailTaskId = null;
  state.composer = null;
  state.deleteTaskId = null;
  state.bellOpen = false;
  state.projectMenuOpen = false;
  renderAll({ resetScroll: true });
  flashElement(`[data-req-id="${req.id}"]`, 'req-flash');
}

function openTaskTimelineForRequirement(id) {
  const req = byId(requirements, id);
  if (!req) return;
  state.projectId = req.projectId;
  state.tab = 'overview';
  state.timelineScope = 'project';
  state.eventFilter = 'all';
  state.detailTaskId = null;
  state.composer = null;
  state.deleteTaskId = null;
  renderAll({ resetScroll: true });
  flashElement(`[data-event-req="${req.id}"]`, 'ev-flash');
}

function switchProject(id) {
  const project = projectOf(id);
  if (!project) return;
  state.projectId = id;
  state.timelineScope = 'project';
  state.reqScope = 'current';
  state.reqStatus = 'all';
  state.expandedReq = requirements.find(req => req.projectId === id && req.status === '待确认')?.id || null;
  state.taskFilter = 'all';
  state.memoryFilter = 'all';
  state.tab = 'overview';
  state.detailTaskId = null;
  state.composer = null;
  state.deleteTaskId = null;
  state.projectMenuOpen = false;
  state.bellOpen = false;
  renderAll({ resetScroll: true });
  toast(`已切换到 ${project.shortCode}`);
}

function openComposer(config) {
  state.composer = config;
  state.detailTaskId = null;
  state.deleteTaskId = null;
  state.bellOpen = false;
  state.projectMenuOpen = false;
  renderAll();
  requestAnimationFrame(() => {
    const el = $('[data-autofocus]');
    if (el) {
      el.focus();
      if (typeof el.select === 'function') el.select();
    }
  });
}

function flashElement(selector, className) {
  requestAnimationFrame(() => {
    const el = $(selector);
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.add(className);
    setTimeout(() => el.classList.remove(className), 1900);
  });
}

function openSearchTarget(type, id) {
  if (type === 'req') openRequirement(id);
  else if (type === 'task') openTask(id);
  else if (type === 'memory') {
    const memory = byId(memories, id);
    if (memory) state.projectId = memory.projectId;
    state.tab = 'memory';
    state.memoryFilter = 'all';
    state.detailTaskId = null;
    state.composer = null;
    state.deleteTaskId = null;
    renderAll({ resetScroll: true });
    flashElement(`[data-memory-id="${id}"]`, 'flash');
  }
}

   ============================================================ */
function pushEvent(entry) {
  const at = entry.at || stamp();
  events.unshift({
    id: `live-${Date.now()}-${Math.random().toString(16).slice(2, 7)}`,
    at,
    actor: '你',
    title: '',
    tone: 'blue',
    chips: [],
    ...entry,
  });
}

function confirmRequirement(id) {
  const req = byId(requirements, id);
  if (!req || req.status !== '待确认') return;
  const at = stamp();
  req.status = '已确认';
  req.updatedAt = at;
  pushEvent({
    at, kind: 'confirm', projectId: req.projectId, actor: '你',
    title: `确认需求 #${req.seqNo}`, text: `${req.title} · 进入可拆任务状态。`,
    reqId: req.id, tone: 'blue', chips: [`#${projectOf(req.projectId).shortCode}-${req.seqNo}`],
  });
  toast(`需求已确认：${req.title}`);
  renderAll();
}

function submitReview(id, decision) {
  const task = byId(tasks, id);
  if (!task || task.status !== '评审') return;
  const commentEl = $('#reviewComment');
  const comments = commentEl ? commentEl.value.trim() : '';
  const at = stamp();
  reviews.push({
    id: `rv-live-${Date.now()}`,
    taskId: task.id,
    reviewAttemptId: task.currentAttemptId,
    implementationAttemptId: null,
    reviewer: '你',
    decision,
    comments: comments || null,
    createdAt: at,
  });
  task.status = decision === '通过' ? '待验收' : '进行中';
  task.updatedAt = at;
  pushEvent({
    at, kind: 'review', projectId: task.projectId, actor: '你',
    title: `评审${decision} · ${task.title}`,
    text: comments ? `「${comments}」` : (decision === '通过' ? '评审通过，任务转入待验收。' : '评审退回，任务回到进行中。'),
    taskId: task.id, tone: decision === '通过' ? 'green' : 'red', chips: [decision],
  });
  toast(decision === '通过' ? '评审通过，任务转入待验收' : '已退回任务，执行器将继续处理');
  renderAll();
}

function acceptTask(id) {
  const task = byId(tasks, id);
  if (!task || task.status !== '待验收') return;
  const at = stamp();
  task.status = '完成';
  task.acceptedBy = '你';
  task.acceptedAt = at;
  task.updatedAt = at;
  pushEvent({
    at, kind: 'accept', projectId: task.projectId, actor: '你',
    title: `验收通过 · ${task.title}`,
    text: '任务关闭；运行记录、证据与审计保留。',
    taskId: task.id, tone: 'green', chips: ['验收人 你'],
  });
  toast('已验收，任务关闭');
  renderAll();
}

function dispatchTask(id) {
  const task = byId(tasks, id);
  if (!task || (task.status !== '就绪' && task.status !== '阻塞')) return;
  const at = stamp();
  const attempt = {
    id: `a-live-${Date.now().toString(36)}`,
    taskId: task.id,
    stage: '执行中',
    status: '运行中',
    workerSessionId: `sess-${Math.random().toString(36).slice(2, 7)}`,
    createdAt: at,
    endedAt: null,
    lastReportAt: at,
    reports: [{ at, text: '执行器已接管，正在建立工作副本。' }],
  };
  attempts.push(attempt);
  task.currentAttemptId = attempt.id;
  task.status = '进行中';
  task.attention = null;
  task.updatedAt = at;
  pushEvent({
    at, kind: 'attempt', projectId: task.projectId, actor: '小雄 · 执行器',
    title: `尝试开始 · ${task.title}`,
    text: '任务已派发，执行器接管；最新报告会出现在这条时间线。',
    taskId: task.id, tone: 'blue', chips: ['阶段 执行中'],
  });
  toast('已派发，执行器会继续推进');
  renderAll();
}

function deleteTask(id) {
  const task = byId(tasks, id);
  if (!task) return;
  const index = tasks.findIndex(item => item.id === id);
  if (index >= 0) tasks.splice(index, 1);
  state.deleteTaskId = null;
  state.detailTaskId = null;
  toast(`已删除「${task.title}」，运行记录与证据保留`);
  renderAll();
}

function settleMemory(id, decision) {
  const memory = byId(memories, id);
  if (!memory) return;
  memory.status = decision === '确认' ? '已确认' : '已废弃';
  memory.updatedAt = stamp();
  toast(decision === '确认' ? '记忆已确认，进入项目上下文' : '记忆已退回');
  renderAll();
}

function ignoreInbox(id) {
  const item = byId(inbox, id);
  if (!item) return;
  item.status = '已忽略';
  toast(`已忽略这条${item.channel}收件`);
  renderAll();
}

/* ============================================================
   17 · composer submits
   ============================================================ */
function submitRequirementForm(form) {
  const data = new FormData(form);
  const projectId = String(data.get('projectId') || '');
  const title = String(data.get('title') || '').trim();
  const priority = String(data.get('priority') || 'P2');
  const note = String(data.get('note') || '').trim();
  const inboxId = String(data.get('inboxId') || '');
  const continueSplit = data.get('continueSplit') === '1';
  const errorEl = $('#composerError');
  if (!projectId || !title) {
    if (errorEl) errorEl.textContent = '请选择项目，并写清需求标题。';
    return;
  }
  const item = inboxId ? byId(inbox, inboxId) : null;
  const sourceNote = note || (item ? `${item.channel} · ${item.contact || '未留联系人'}：${item.rawContext}` : '');
  const at = stamp();
  const seqNo = Math.max(0, ...requirements.filter(req => req.projectId === projectId).map(req => req.seqNo)) + 1;
  const req = {
    id: `r-live-${Date.now()}`,
    projectId,
    seqNo,
    title,
    description: null,
    status: '待确认',
    priority,
    sourceNote: sourceNote || null,
    createdAt: at,
    updatedAt: at,
  };
  requirements.unshift(req);
  if (item) {
    item.status = '已建需求';
    item.triagedAt = at;
  }
  pushEvent({
    at, kind: 'requirement', projectId, actor: item ? '你 · 收件分诊' : '你',
    title: `新需求 · ${title}`,
    text: sourceNote || '手动创建，等待确认。',
    reqId: req.id, tone: 'ink', chips: [priority, '待确认'],
  });
  state.tab = 'requirements';
  state.projectId = projectId;
  state.reqScope = 'current';
  state.reqStatus = 'all';
  state.expandedReq = req.id;
  state.projectMenuOpen = false;
  state.bellOpen = false;
  state.composer = continueSplit ? { mode: 'split', reqId: req.id } : null;
  renderAll({ resetScroll: true });
  if (continueSplit) {
    toast('需求已创建，继续拆任务');
    requestAnimationFrame(() => {
      const el = $('[data-autofocus]');
      if (el) el.focus();
    });
  } else {
    flashElement(`[data-req-id="${req.id}"]`, 'req-flash');
    toast(`需求已创建 · #${projectOf(projectId).shortCode}-${req.seqNo}`);
  }
}

function submitSplitForm(form) {
  const reqId = form.dataset.req;
  const req = byId(requirements, reqId);
  const errorEl = $('#splitError');
  if (!req) {
    if (errorEl) errorEl.textContent = '需求不存在，无法拆任务。';
    return;
  }
  const data = new FormData(form);
  const titles = String(data.get('titles') || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  if (!titles.length) {
    if (errorEl) errorEl.textContent = '每行写一个任务，至少需要一行。';
    return;
  }
  const type = String(data.get('taskType') || '开发');
  const priority = String(data.get('priority') || req.priority || 'P2');
  const acceptance = String(data.get('acceptance') || '').trim();
  const at = stamp();
  let seqNo = Math.max(0, ...tasks.filter(task => task.projectId === req.projectId).map(task => task.seqNo)) + 1;
  titles.forEach((title, index) => {
    tasks.push({
      id: `t-live-${Date.now()}-${index}`,
      projectId: req.projectId,
      requirementId: req.id,
      seqNo: seqNo++,
      title,
      type,
      status: '就绪',
      priority,
      acceptance: acceptance || null,
      currentAttemptId: null,
      autoDispatch: false,
      attention: null,
      acceptedBy: null,
      acceptedAt: null,
      createdAt: at,
      updatedAt: at,
      spec: null,
    });
  });
  req.status = '已拆分';
  req.updatedAt = at;
  pushEvent({
    at, kind: 'split', projectId: req.projectId, actor: '你',
    title: `需求 #${projectOf(req.projectId).shortCode}-${req.seqNo} 拆出 ${titles.length} 个任务`,
    text: `${titles.slice(0, 3).join(' / ')}${titles.length > 3 ? ' …' : ''}`,
    reqId: req.id, tone: 'ink', chips: [`${titles.length} 个任务`],
  });
  state.composer = null;
  state.tab = 'requirements';
  state.projectId = req.projectId;
  state.reqScope = 'current';
  state.reqStatus = 'all';
  state.expandedReq = req.id;
  state.bellOpen = false;
  renderAll({ resetScroll: true });
  flashElement(`[data-req-id="${req.id}"]`, 'req-flash');
  toast(`已拆出 ${titles.length} 个任务`);
}

/* ============================================================
   18 · search
   ============================================================ */
function openSearch() {
  const pop = $('#searchPop');
  if (!pop) return;
  pop.hidden = false;
  state.searchOpen = true;
  renderSearch($('#globalSearch') ? $('#globalSearch').value : '');
}

function hideSearch() {
  const pop = $('#searchPop');
  if (pop) pop.hidden = true;
  state.searchOpen = false;
}

function renderSearch(rawQuery) {
  const pop = $('#searchPop');
  if (!pop) return;
  const query = String(rawQuery || '').trim();
  const lower = query.toLowerCase();
  const match = text => !query || String(text || '').toLowerCase().includes(lower);
  const reqs = requirements
    .filter(req => match(`${req.title} ${req.sourceNote || ''}`))
    .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))
    .slice(0, query ? 5 : 3);
  const taskList = tasks
    .filter(task => match(`${task.title} ${task.acceptance || ''}`))
    .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))
    .slice(0, query ? 4 : 2);
  const mems = memories
    .filter(memory => match(`${memory.title} ${memory.content}`))
    .slice(0, query ? 3 : 1);
  const total = reqs.length + taskList.length + mems.length;
  const block = (label, rows) => rows.length ? `<div class="search-head"><span>${label}</span></div>${rows.join('')}` : '';
  const reqRows = reqs.map(req => {
    const project = projectOf(req.projectId);
    return `<button class="search-result" data-search-type="req" data-search-id="${req.id}">
      <span class="sr-ico">${icon('flow', 11)}</span>
      <span class="sr-main">
        <span class="sr-title">${esc(req.title)}</span>
        <span class="sr-meta"><span>需求 #${req.seqNo}</span><span>${esc(project.shortCode)}</span><span>${esc(req.status)}</span></span>
      </span>
    </button>`;
  });
  const taskRows = taskList.map(task => {
    const project = projectOf(task.projectId);
    return `<button class="search-result" data-search-type="task" data-search-id="${task.id}">
      <span class="sr-ico">${icon('task', 11)}</span>
      <span class="sr-main">
        <span class="sr-title">${esc(task.title)}</span>
        <span class="sr-meta"><span>任务</span><span>${esc(project.shortCode)}</span><span>${esc(task.status)}</span></span>
      </span>
    </button>`;
  });
  const memRows = mems.map(memory => `<button class="search-result" data-search-type="memory" data-search-id="${memory.id}">
      <span class="sr-ico">${icon('memory', 11)}</span>
      <span class="sr-main">
        <span class="sr-title">${esc(memory.title)}</span>
        <span class="sr-meta"><span>记忆 · ${esc(memory.type)}</span><span>${esc(projectOf(memory.projectId).shortCode)}</span></span>
      </span>
    </button>`);
  pop.innerHTML = `<div class="search-head"><span>${query ? `搜索结果 · ${total}` : '快速跳转'}</span><span>Esc 关闭</span></div>
    ${query && !total ? `<div class="search-empty">没有找到「${esc(query)}」。试试项目代号、需求标题或任务名。</div>` : ''}
    ${block('需求', reqRows)}
    ${block('任务', taskRows)}
    ${block('记忆', memRows)}
    <div class="search-hint">${icon('search', 10)} 支持需求、任务与记忆 · <kbd>Ctrl K</kbd> 唤起搜索</div>`;
}

/* ============================================================
   19 · events: clicks, inputs, submit, keyboard
   ============================================================ */
function handleClick(event) {
  const target = event.target;
  if (!(target instanceof Element)) return;
  const actionEl = target.closest('[data-action]');
  const inProject = target.closest('.project-switch');
  const inBell = target.closest('.bell-wrap');
  let chromeDirty = false;

  if (!inProject && !(actionEl && actionEl.dataset.action === 'toggle-project-menu') && state.projectMenuOpen) {
    state.projectMenuOpen = false;
    chromeDirty = true;
  }
  if (!inBell && !(actionEl && actionEl.dataset.action === 'toggle-bell') && state.bellOpen) {
    state.bellOpen = false;
    chromeDirty = true;
  }
  if (!target.closest('.global-search')) hideSearch();

  const searchResult = target.closest('[data-search-type]');
  if (searchResult) {
    hideSearch();
    openSearchTarget(searchResult.dataset.searchType, searchResult.dataset.searchId);
    return;
  }

  if (!actionEl) {
    if (target.closest('.search-box')) openSearch();
    if (chromeDirty) renderChrome();
    return;
  }

  const action = actionEl.dataset.action;
  const id = actionEl.dataset.id;
  if (action !== 'toggle-project-menu' && action !== 'toggle-bell') {
    if (state.projectMenuOpen) { state.projectMenuOpen = false; chromeDirty = true; }
    if (state.bellOpen) { state.bellOpen = false; chromeDirty = true; }
  }

  switch (action) {
    case 'home': {
      state.tab = 'overview';
      state.timelineScope = 'project';
      state.detailTaskId = null;
      state.composer = null;
      state.deleteTaskId = null;
      state.projectMenuOpen = false;
      state.bellOpen = false;
      renderAll({ resetScroll: true });
      break;
    }
    case 'tab':
      goTab(actionEl.dataset.tab || 'overview');
      break;
    case 'toggle-project-menu':
      state.projectMenuOpen = !state.projectMenuOpen;
      state.bellOpen = false;
      renderChrome();
      break;
    case 'toggle-bell':
      state.bellOpen = !state.bellOpen;
      state.projectMenuOpen = false;
      renderChrome();
      break;
    case 'switch-project':
      switchProject(id);
      break;
    case 'scope-all':
      state.timelineScope = 'all';
      state.tab = 'overview';
      state.projectMenuOpen = false;
      state.bellOpen = false;
      renderAll({ resetScroll: true });
      break;
    case 'timeline-scope':
      state.timelineScope = actionEl.dataset.scope || 'project';
      renderAll();
      break;
    case 'event-filter':
      state.eventFilter = actionEl.dataset.filter || 'all';
      renderAll();
      break;
    case 'req-scope':
      state.reqScope = actionEl.dataset.scope || 'current';
      if (state.reqScope === 'all') state.expandedReq = null;
      renderAll();
      break;
    case 'req-status':
      state.reqStatus = actionEl.dataset.status || 'all';
      renderAll();
      break;
    case 'req-status-jump': {
      state.tab = 'requirements';
      state.reqStatus = actionEl.dataset.status || 'all';
      if (state.timelineScope === 'all') state.reqScope = 'all';
      renderAll({ resetScroll: true });
      break;
    }
    case 'toggle-req':
      state.expandedReq = state.expandedReq === id ? null : id;
      renderAll();
      break;
    case 'confirm-req':
      confirmRequirement(id);
      break;
    case 'split-req':
      openComposer({ mode: 'split', reqId: id });
      break;
    case 'new-requirement':
      openComposer({ mode: 'create' });
      break;
    case 'open-req':
      if (id) openRequirement(id);
      break;
    case 'open-req-timeline':
      openTaskTimelineForRequirement(id);
      break;
    case 'open-task':
      openTask(id);
      break;
    case 'open-inbox':
      state.tab = 'inbox';
      state.detailTaskId = null;
      state.composer = null;
      state.deleteTaskId = null;
      renderAll({ resetScroll: true });
      if (id) flashElement(`[data-inbox-id="${id}"]`, 'inbox-flash');
      break;
    case 'open-memory': {
      const memory = id ? byId(memories, id) : null;
      if (memory) state.projectId = memory.projectId;
      state.tab = 'memory';
      state.memoryFilter = memory ? 'all' : '待复核';
      state.detailTaskId = null;
      state.composer = null;
      state.deleteTaskId = null;
      renderAll({ resetScroll: true });
      if (id) flashElement(`[data-memory-id="${id}"]`, 'flash');
      break;
    }
    case 'ask-delete':
      state.deleteTaskId = id || state.detailTaskId;
      renderOverlays();
      break;
    case 'cancel-delete':
      state.deleteTaskId = null;
      renderOverlays();
      break;
    case 'confirm-delete':
      deleteTask(state.deleteTaskId);
      break;
    case 'review-submit':
      submitReview(id, actionEl.dataset.decision || '通过');
      break;
    case 'accept-task':
      acceptTask(id);
      break;
    case 'dispatch-task':
    case 'retry-task':
      dispatchTask(id);
      break;
    case 'memory-decision':
      settleMemory(id, actionEl.dataset.decision || '确认');
      break;
    case 'memory-filter':
      state.memoryFilter = actionEl.dataset.status || 'all';
      renderAll();
      break;
    case 'inbox-triage':
      openComposer({ mode: 'triage', inboxId: id });
      break;
    case 'inbox-ignore':
      ignoreInbox(id);
      break;
    case 'task-filter':
      state.taskFilter = actionEl.dataset.status || 'all';
      renderAll();
      break;
    case 'close-overlay':
      state.composer = null;
      renderOverlays();
      break;
    case 'close-sheet':
      state.detailTaskId = null;
      state.deleteTaskId = null;
      renderOverlays();
      break;
    case 'pick': {
      const group = actionEl.closest('.seg-control');
      const form = actionEl.closest('form');
      if (group) group.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button === actionEl)));
      if (form) {
        const hidden = form.querySelector(`input[type="hidden"][name="${actionEl.dataset.field}"]`);
        if (hidden) hidden.value = actionEl.dataset.value || '';
      }
      if ($('#splitTitles') && actionEl.dataset.field === 'priority') updateSplitForm();
      break;
    }
    default:
      break;
  }

  if (chromeDirty) renderChrome();
}

function handleInput(event) {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;
  if (target.id === 'splitTitles') updateSplitForm();
  if (target.id === 'composerTitle') {
    const submit = $('[data-submit="composer"]');
    if (submit) submit.disabled = !target.value.trim();
  }
  if (target.id === 'globalSearch') renderSearch(target.value);
}

function handleSubmit(event) {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  if (!form.matches('form[data-form]')) return;
  event.preventDefault();
  if (form.dataset.form === 'composer') submitRequirementForm(form);
  else if (form.dataset.form === 'split') submitSplitForm(form);
}

function handleKeydown(event) {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    const input = $('#globalSearch');
    if (input) {
      input.focus();
      input.select();
      openSearch();
    }
    return;
  }
  if (event.key === 'Escape') {
    if (state.deleteTaskId) {
      state.deleteTaskId = null;
      renderOverlays();
    } else if (state.composer) {
      state.composer = null;
      renderOverlays();
    } else if (state.detailTaskId) {
      state.detailTaskId = null;
      renderOverlays();
    } else if (state.projectMenuOpen || state.bellOpen) {
      state.projectMenuOpen = false;
      state.bellOpen = false;
      renderChrome();
    } else {
      hideSearch();
      const input = $('#globalSearch');
      if (input && document.activeElement === input) input.blur();
    }
    return;
  }
  if ((event.key === 'Enter' || event.key === ' ') && event.target instanceof Element) {
    const row = event.target.closest('[data-action][role="button"]');
    if (row && event.target === row) {
      event.preventDefault();
      row.click();
    }
  }
}

/* ============================================================
   20 · toast + boot
   ============================================================ */
function toast(message) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon('check', 13)}<span>${esc(message)}</span>`;
  root.appendChild(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  }, 2600);
}

document.addEventListener('click', handleClick);
document.addEventListener('input', handleInput);
document.addEventListener('submit', handleSubmit);
document.addEventListener('keydown', handleKeydown);
document.addEventListener('focusin', event => {
  if (event.target instanceof HTMLElement && event.target.id === 'globalSearch') openSearch();
});

renderAll();
</script>
