function renderOverlays() {
  let html = '';
  if (state.paletteOpen) html += renderPalette();
  if (state.createOpen) html += renderCreateModal();
  if (state.deleteTarget) html += renderDeleteModal();
  if (state.helpOpen) html += renderHelpModal();
  document.getElementById('overlays').innerHTML = html;
}

/* ============================================================
   State transitions used by events
   ============================================================ */
function closeCreate() {
  state.createOpen = false;
  state.createSeed = null;
  state.createFrom = null;
}
function openPalette() {
  state.paletteOpen = true;
  state.paletteQuery = '';
  state.paletteIndex = 0;
  state.projectMenu = false;
  state.filterMenu = false;
  focusAfterRender('palette-input');
}
function closePalette() {
  state.paletteOpen = false;
  state.paletteQuery = '';
  state.paletteIndex = 0;
}
function toggleSplit() {
  const req = getReq(state.reqId);
  if (!req || req.status === '已关闭') return;
  state.splitOpen = !state.splitOpen;
  if (state.splitOpen) {
    state.splitType = '开发';
    state.splitPriority = req.priority || PROJECTS[state.project].defaultPriority || 'P2';
    focusAfterRender('split-lines');
  }
}
function confirmRequirement(id) {
  const req = getReq(id || state.reqId);
  if (!req || req.status !== '待确认') return;
  req.status = '已确认';
  req.updated = '刚刚';
  showToast('已确认需求 #' + req.seq);
}
function closeRequirement(id) {
  const req = getReq(id || state.reqId);
  if (!req || req.status === '已关闭') return;
  req.status = '已关闭';
  req.updated = '刚刚';
  state.splitOpen = false;
  showToast('已关闭需求 #' + req.seq);
}
function reopenRequirement(id) {
  const req = getReq(id || state.reqId);
  if (!req) return;
  req.status = '已确认';
  req.updated = '刚刚';
  showToast('已重新打开需求 #' + req.seq);
}
function addAttempt(task, stage) {
  const next = Math.max(0, ...task.attempts.map((item) => item.n)) + 1;
  task.attempts.unshift({
    n: next, status: '运行中', stage, session: 'sess_' + Math.random().toString(16).slice(2, 10),
    started: '刚刚', duration: '刚刚开始', report: stage === '重试' ? '已重新排队，等待执行器接管。' : '已派发，等待执行器接管。'
  });
}
function doTaskAction(kind, id) {
  const task = getTask(id || state.taskId);
  if (!task) return;
  if (kind === 'dispatch') {
    if (task.status !== '就绪' && task.status !== '阻塞') return;
    task.status = '进行中';
    addAttempt(task, '派发');
    task.updated = '刚刚';
    showToast('已派发 T-' + task.seq);
  } else if (kind === 'retry') {
    if (task.status !== '阻塞') return;
    task.status = '进行中';
    addAttempt(task, '重试');
    task.updated = '刚刚';
    showToast('已重新派发 T-' + task.seq);
  } else if (kind === 'cancel') {
    if (task.status === '完成' || task.status === '取消') return;
    task.status = '取消';
    task.updated = '刚刚';
    showToast('已取消 T-' + task.seq);
  } else if (kind === 'accept') {
    if (task.status !== '待验收') return;
    task.status = '完成';
    task.updated = '刚刚';
    showToast('已验收 T-' + task.seq);
  }
  if (state.page === 'tasks') {
    state.taskId = task.id;
    state.taskTab = 'attempts';
  }
}
function startTriage(id) {
  const item = inbox.find((entry) => entry.id === id);
  if (!item) return;
  const title = item.text.length > 28 ? item.text.slice(0, 28) + '…' : item.text;
  openCreate({
    project: item.project || state.project,
    title,
    description: item.text,
    source: item.channel,
    sourceNote: item.channel + ' · ' + item.contact,
    priority: 'P2',
    inboxId: item.id
  });
}
function useProject(id, page) {
  if (!PROJECTS[id]) return;
  if (state.project !== id) switchProject(id);
  state.projectView = id;
  goPage(page);
}
function handleOvStat(target) {
  if (target === 'reqs') {
    state.page = 'requirements';
    state.reqFilter = { status: 'pending', priority: null, source: null, q: '' };
    state.splitOpen = false;
    state.reqId = null;
  } else if (target === 'blocked') {
    state.page = 'tasks';
    state.taskFilter = { status: 'blocked', q: '' };
    state.taskId = null;
    state.taskTab = 'attempts';
  } else if (target === 'acceptance') {
    state.page = 'tasks';
    state.taskFilter = { status: 'acceptance', q: '' };
    state.taskId = null;
    state.taskTab = 'attempts';
  } else if (target === 'memory') {
    state.page = 'memory';
    state.memoryType = 'all';
    state.memoryQ = '';
  }
}

/* ============================================================
   Events
   ============================================================ */
function onClick(event) {
  const backdrop = event.target.closest('[data-backdrop]');
  if (backdrop) {
    const kind = backdrop.dataset.backdrop;
    if (kind === 'palette') closePalette();
    else if (kind === 'create') closeCreate();
    else if (kind === 'delete') state.deleteTarget = null;
    else if (kind === 'help') state.helpOpen = false;
    render();
    return;
  }
  const inProject = event.target.closest('#project-wrap');
  const inFilter = event.target.closest('#filter-wrap');
  let changed = false;
  if (!inProject && state.projectMenu) { state.projectMenu = false; changed = true; }
  if (!inFilter && state.filterMenu) { state.filterMenu = false; changed = true; }
  const actionEl = event.target.closest('[data-act]');
  if (!actionEl) { if (changed) render(); return; }
  const act = actionEl.dataset.act;
  if (act === 'palette-item') { executePalette(Number(actionEl.dataset.index)); return; }
  switch (act) {
    case 'nav': goPage(actionEl.dataset.page); break;
    case 'toggle-project': state.projectMenu = !state.projectMenu; state.filterMenu = false; break;
    case 'switch-project': switchProject(actionEl.dataset.project); break;
    case 'manage-projects': goPage('projects'); break;
    case 'palette': openPalette(); break;
    case 'open-help': state.helpOpen = true; state.paletteOpen = false; break;
    case 'close-help': state.helpOpen = false; break;
    case 'open-create': openCreate(); break;
    case 'close-create': closeCreate(); break;

    case 'req-status': state.reqFilter.status = actionEl.dataset.status; state.splitOpen = false; break;
    case 'toggle-filter': state.filterMenu = !state.filterMenu; state.projectMenu = false; break;
    case 'filter-priority': {
      const value = actionEl.dataset.value;
      state.reqFilter.priority = state.reqFilter.priority === value ? null : value;
      break;
    }
    case 'filter-source': {
      const value = actionEl.dataset.value;
      state.reqFilter.source = state.reqFilter.source === value ? null : value;
      break;
    }
    case 'clear-chip': {
      const kind = actionEl.dataset.kind;
      if (kind === 'status') state.reqFilter.status = 'all';
      else if (kind === 'priority') state.reqFilter.priority = null;
      else if (kind === 'source') state.reqFilter.source = null;
      else if (kind === 'q') state.reqFilter.q = '';
      else if (kind === 'task-status') state.taskFilter.status = 'all';
      else if (kind === 'task-q') state.taskFilter.q = '';
      break;
    }
    case 'clear-req-filters':
      state.reqFilter = { status: 'active', priority: null, source: null, q: '' };
      state.filterMenu = false;
      break;
    case 'open-req': openReq(actionEl.dataset.id); break;
    case 'close-req': state.reqId = null; state.splitOpen = false; break;
    case 'confirm-req': confirmRequirement(actionEl.dataset.id); break;
    case 'close-requirement': closeRequirement(actionEl.dataset.id); break;
    case 'reopen-req': reopenRequirement(actionEl.dataset.id); break;
    case 'toggle-split': toggleSplit(); break;
    case 'delete-req':
      state.deleteTarget = { type: 'req', id: actionEl.dataset.id || state.reqId };
      focusAfterRender('delete-cancel');
      break;
    case 'open-task': openTask(actionEl.dataset.id); break;
    case 'close-task': state.taskId = null; break;

    case 'task-status': state.taskFilter.status = actionEl.dataset.status; break;
    case 'clear-task-filters': state.taskFilter = { status: 'active', q: '' }; break;
    case 'task-tab': state.taskTab = actionEl.dataset.tab; break;
    case 'task-review': {
      state.taskTab = 'reviews';
      const reviewTask = getTask(state.taskId);
      if (reviewTask && reviewTask.status === '评审') focusAfterRender('review-comment');
      break;
    }
    case 'task-action': doTaskAction(actionEl.dataset.kind, actionEl.dataset.id); break;
    case 'delete-task':
      state.deleteTarget = { type: 'task', id: actionEl.dataset.id || state.taskId };
      focusAfterRender('delete-cancel');
      break;
    case 'close-delete': state.deleteTarget = null; break;
    case 'confirm-delete': {
      const target = state.deleteTarget;
      if (target && target.type === 'req') {
        const req = getReq(target.id);
        if (req) {
          for (let index = tasks.length - 1; index >= 0; index -= 1) {
            if (tasks[index].reqId === req.id) tasks.splice(index, 1);
          }
          const index = requirements.findIndex((item) => item.id === req.id);
          if (index >= 0) requirements.splice(index, 1);
          if (state.reqId === req.id) {
            const list = visibleReqs();
            state.reqId = list.length ? list[0].id : null;
          }
          const remaining = visibleTasks();
          state.taskId = remaining.length ? remaining[0].id : null;
          state.splitOpen = false;
          showToast('已删除需求 #' + req.seq);
        }
      } else if (target && target.type === 'task') {
        const task = getTask(target.id);
        if (task) {
          const index = tasks.findIndex((item) => item.id === task.id);
          if (index >= 0) tasks.splice(index, 1);
          if (state.taskId === task.id) {
            const list = visibleTasks();
            state.taskId = list.length ? list[0].id : null;
          }
          showToast('已删除 T-' + task.seq);
        }
      }
      state.deleteTarget = null;
      break;
    }

    case 'inbox-triage': startTriage(actionEl.dataset.id); break;
    case 'inbox-ignore': {
      const index = inbox.findIndex((item) => item.id === actionEl.dataset.id);
      if (index >= 0) {
        inbox.splice(index, 1);
        showToast('已忽略这条收件');
      }
      break;
    }
    case 'memory-type': state.memoryType = actionEl.dataset.type; break;
    case 'clear-memory-filters': state.memoryType = 'all'; state.memoryQ = ''; break;
    case 'memory-confirm':
    case 'memory-reject': {
      const entry = getMemory(actionEl.dataset.id);
      if (entry && (entry.status === '草稿' || entry.status === '待复核')) {
        entry.status = act === 'memory-confirm' ? '已确认' : '已废弃';
        entry.updated = '刚刚';
        showToast(act === 'memory-confirm' ? '记忆已确认并写入项目' : '记忆已退回');
      }
      break;
    }
    case 'review-filter': state.reviewFilter = actionEl.dataset.filter; break;
    case 'open-review-task': openTask(actionEl.dataset.id); state.taskTab = 'reviews'; break;
    case 'view-project': state.projectView = actionEl.dataset.project; break;
    case 'use-project': useProject(actionEl.dataset.project, 'requirements'); break;
    case 'use-project-tasks': useProject(actionEl.dataset.project, 'tasks'); break;
    case 'ov-stat': handleOvStat(actionEl.dataset.target); break;
    default: break;
  }
  render();
}

function onChange(event) {
  const el = event.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'req-status') {
    const req = getReq(el.dataset.id);
    if (req) {
      req.status = el.value;
      req.updated = '刚刚';
      if (req.status === '已关闭') state.splitOpen = false;
      showToast('需求 #' + req.seq + ' 状态更新为 ' + req.status);
      render();
    }
  } else if (kind === 'req-priority') {
    const req = getReq(el.dataset.id);
    if (req) {
      req.priority = el.value;
      req.updated = '刚刚';
      showToast('需求 #' + req.seq + ' 优先级更新为 ' + req.priority);
      render();
    }
  } else if (kind === 'split-meta') {
    if (el.dataset.field === 'type') state.splitType = el.value;
    if (el.dataset.field === 'priority') state.splitPriority = el.value;
  }
}

function onInput(event) {
  const id = event.target.id;
  if (id === 'split-lines') {
    state.splitDraft = event.target.value;
    updateSplitPreviewDom();
    return;
  }
  if (id === 'req-search') { state.reqFilter.q = event.target.value; if (!event.isComposing) render(); return; }
  if (id === 'task-search') { state.taskFilter.q = event.target.value; if (!event.isComposing) render(); return; }
  if (id === 'memory-search') { state.memoryQ = event.target.value; if (!event.isComposing) render(); return; }
  if (id === 'palette-input') {
    state.paletteQuery = event.target.value;
    state.paletteIndex = 0;
    if (!event.isComposing) render();
  }
}

function onSubmit(event) {
  const form = event.target;
  if (form.id === 'create-form') {
    event.preventDefault();
    const data = new FormData(form);
    const title = String(data.get('title') || '').trim();
    if (!title) {
      const input = form.querySelector('[name="title"]');
      if (input) input.focus();
      return;
    }
    const projectId = PROJECTS[String(data.get('project'))] ? String(data.get('project')) : state.project;
    const priority = PRIORITIES.includes(String(data.get('priority'))) ? String(data.get('priority')) : 'P2';
    const source = SOURCES.includes(String(data.get('source'))) ? String(data.get('source')) : '手动';
    const description = String(data.get('description') || '').trim();
    const sourceNote = String(data.get('sourceNote') || '').trim() || (source + ' · 王工');
    const seq = Math.max(0, ...requirements.filter((item) => item.project === projectId).map((item) => item.seq)) + 1;
    const req = {
      id: 'r' + projectId.toLowerCase() + '-' + seq, project: projectId, seq, title, status: '待确认', priority, source, sourceNote,
      description, quote: '', quoteBy: '', created: '刚刚', updated: '刚刚'
    };
    requirements.unshift(req);
    const fromInbox = state.createFrom;
    if (fromInbox) {
      const index = inbox.findIndex((item) => item.id === fromInbox);
      if (index >= 0) inbox.splice(index, 1);
    }
    state.project = projectId;
    state.projectView = projectId;
    state.page = 'requirements';
    state.reqFilter = { status: 'active', priority: null, source: null, q: '' };
    state.reqId = req.id;
    state.splitOpen = false;
    state.splitDraft = '';
    closeCreate();
    showToast(fromInbox ? '已创建需求 #' + seq + ' · 收件已归档' : '已创建需求 #' + seq);
    render();
    return;
  }
  if (form.id === 'split-form') {
    event.preventDefault();
    const req = getReq(state.reqId);
    if (!req) return;
    const data = new FormData(form);
    const lines = splitLines(state.splitDraft || String(data.get('lines') || ''));
    if (!lines.length) return;
    const type = TASK_TYPES.includes(String(data.get('type'))) ? String(data.get('type')) : state.splitType;
    const priority = PRIORITIES.includes(String(data.get('priority'))) ? String(data.get('priority')) : state.splitPriority;
    const acceptance = String(data.get('acceptance') || '').trim();
    let nextSeq = Math.max(0, ...tasks.map((item) => item.seq)) + 1;
    lines.forEach((line) => {
      tasks.unshift({
        id: 't' + nextSeq, project: req.project, reqId: req.id, seq: nextSeq,
        title: line, type, status: '就绪', priority, acceptance, updated: '刚刚',
        attempts: [], evidence: [], reviews: []
      });
      nextSeq += 1;
    });
    req.status = '已拆分';
    req.updated = '刚刚';
    state.splitOpen = false;
    state.splitDraft = '';
    showToast('已拆出 ' + lines.length + ' 个任务');
    render();
    return;
  }
  if (form.id === 'review-form') {
    event.preventDefault();
    const task = getTask(state.taskId);
    if (!task || task.status !== '评审') return;
    const data = new FormData(form);
    const decision = String(data.get('decision') || '通过');
    const comments = String(data.get('comments') || '').trim();
    const attemptNo = task.attempts[0] ? task.attempts[0].n : 1;
    task.reviews.unshift({
      decision, reviewer: '王工', comments, createdAt: '刚刚', attempt: '#' + attemptNo
    });
    reviews.unshift({
      id: 'rv' + Date.now(), project: task.project, taskId: task.id, decision,
      reviewer: '王工', comments, createdAt: '刚刚'
    });
    task.status = decision === '通过' ? '待验收' : '进行中';
    task.updated = '刚刚';
    state.taskTab = 'reviews';
    showToast(decision === '通过' ? '评审通过，T-' + task.seq + ' 进入待验收' : '已退回，T-' + task.seq + ' 回到进行中');
    render();
  }
}

function moveReq(delta) {
  const list = visibleReqs();
  if (!list.length) return;
  let index = list.findIndex((item) => item.id === state.reqId);
  if (index < 0) index = delta > 0 ? -1 : 0;
  const next = (index + delta + list.length) % list.length;
  state.reqId = list[next].id;
  state.splitOpen = false;
  state.scrollReq = true;
  render();
}
function moveTask(delta) {
  const list = visibleTasks();
  if (!list.length) return;
  let index = list.findIndex((item) => item.id === state.taskId);
  if (index < 0) index = delta > 0 ? -1 : 0;
  const next = (index + delta + list.length) % list.length;
  state.taskId = list[next].id;
  const task = getTask(state.taskId);
  if (state.taskTab === 'reviews' && task && task.status !== '评审') state.taskTab = 'attempts';
  state.scrollTask = true;
  render();
}
function focusSearch() {
  const map = { requirements: 'req-search', tasks: 'task-search', memory: 'memory-search' };
  const id = map[state.page];
  if (!id) return false;
  const el = document.getElementById(id);
  if (!el) return false;
  el.focus();
  if (el.select) el.select();
  return true;
}

function onKeyDown(event) {
  const mod = event.ctrlKey || event.metaKey;
  const key = event.key;
  const lower = key.toLowerCase();
  if (event.isComposing && key !== 'Escape') return;

  if (mod && lower === 'k') {
    if (state.createOpen || state.deleteTarget || state.helpOpen) return;
    event.preventDefault();
    if (state.paletteOpen) closePalette(); else openPalette();
    render();
    return;
  }
  if (state.paletteOpen) {
    const items = flatPalette();
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      event.preventDefault();
      if (!items.length) return;
      const delta = key === 'ArrowDown' ? 1 : -1;
      state.paletteIndex = (state.paletteIndex + delta + items.length) % items.length;
      render();
      return;
    }
    if (key === 'Enter') { event.preventDefault(); executePalette(state.paletteIndex); return; }
    if (key === 'Escape') { event.preventDefault(); closePalette(); render(); return; }
    return;
  }
  if (state.createOpen) {
    if (key === 'Escape') { event.preventDefault(); closeCreate(); render(); }
    else if (mod && key === 'Enter') {
      event.preventDefault();
      const form = document.getElementById('create-form');
      if (form) form.requestSubmit();
    }
    return;
  }
  if (state.deleteTarget) {
    if (key === 'Escape') { event.preventDefault(); state.deleteTarget = null; render(); }
    return;
  }
  if (state.helpOpen) {
    if (key === 'Escape') { event.preventDefault(); state.helpOpen = false; render(); }
    return;
  }

  if (key === 'Escape') {
    event.preventDefault();
    if (state.projectMenu || state.filterMenu) {
      state.projectMenu = false;
      state.filterMenu = false;
      render();
      return;
    }
    if (isTyping()) {
      const id = document.activeElement ? document.activeElement.id : '';
      if (id === 'split-lines') {
        state.splitOpen = false;
        state.splitDraft = '';
        render();
        return;
      }
      if (id === 'req-search') { state.reqFilter.q = ''; render(); return; }
      if (id === 'task-search') { state.taskFilter.q = ''; render(); return; }
      if (id === 'memory-search') { state.memoryQ = ''; render(); return; }
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      return;
    }
    if (state.splitOpen) {
      state.splitOpen = false;
      state.splitDraft = '';
      render();
      return;
    }
    if (state.page === 'requirements' && state.reqId) {
      state.reqId = null;
      render();
      return;
    }
    if (state.page === 'tasks' && state.taskId) {
      state.taskId = null;
      render();
      return;
    }
    return;
  }

  if (mod && key === 'Enter' && document.activeElement && document.activeElement.closest) {
    const form = document.activeElement.closest('form');
    if (form) { event.preventDefault(); form.requestSubmit(); return; }
  }
  if (isTyping()) return;
  if (mod || event.altKey) return;
  if (state.projectMenu || state.filterMenu) return;

  if (key === '?') {
    event.preventDefault();
    state.helpOpen = true;
    render();
    return;
  }
  if (key === '/') {
    event.preventDefault();
    if (!focusSearch()) { openPalette(); render(); }
    return;
  }
  if (lower === 'c') {
    event.preventDefault();
    openCreate();
    render();
    return;
  }
  if (lower === 's' && state.page === 'requirements' && state.reqId) {
    event.preventDefault();
    toggleSplit();
    render();
    return;
  }
  if (state.page === 'requirements' && (key === 'ArrowDown' || key === 'ArrowUp' || lower === 'j' || lower === 'k')) {
    event.preventDefault();
    moveReq((key === 'ArrowDown' || lower === 'j') ? 1 : -1);
    return;
  }
  if (state.page === 'tasks' && (key === 'ArrowDown' || key === 'ArrowUp' || lower === 'j' || lower === 'k')) {
    event.preventDefault();
    moveTask((key === 'ArrowDown' || lower === 'j') ? 1 : -1);
    return;
  }
  if (key === 'Enter') {
    const active = document.activeElement;
    const interactive = active && active.matches && active.matches('button, a, input, select, textarea, [role="button"]');
    if (interactive) return;
    const target = state.page === 'requirements' ? document.getElementById('req-detail') : state.page === 'tasks' ? document.getElementById('task-detail') : null;
    if (target) { event.preventDefault(); target.focus(); }
    return;
  }
  if (state.page === 'tasks' && state.taskId) {
    const task = getTask(state.taskId);
    if (!task) return;
    if (lower === 'd' && task.status === '就绪') { event.preventDefault(); doTaskAction('dispatch', task.id); render(); return; }
    if (lower === 'r' && task.status === '阻塞') { event.preventDefault(); doTaskAction('retry', task.id); render(); return; }
    if (lower === 'a' && task.status === '待验收') { event.preventDefault(); doTaskAction('accept', task.id); render(); return; }
  }
}

/* ============================================================
   Boot
   ============================================================ */
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKeyDown);
render();

</script>
</body>
</html>
