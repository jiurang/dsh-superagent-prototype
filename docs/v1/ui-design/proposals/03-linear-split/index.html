<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雄大工作台 · 需求</title>
<style>
/* ============================================================
   Linear-style Split Workspace · 雄大工作台
   Self-contained prototype. No external fonts, images or scripts.
   Design target: 1200px desktop, 13px base, 40px dense rows.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #f1f1ee;
  --panel: #ffffff;
  --sidebar: #f7f7f5;
  --hover: #f5f5f3;
  --hover-strong: #ededeb;
  --active: #ececea;
  --line: #e9e9e6;
  --line-strong: #dededb;
  --line-dark: #cfcfcb;
  --ink: #1b1c1f;
  --ink-2: #55585f;
  --ink-3: #868a91;
  --ink-4: #aeb1b6;
  --ink-5: #c4c6ca;
  --accent: #5b5fd6;
  --accent-ink: #4a4fc4;
  --accent-soft: #f1f2fc;
  --accent-line: #d9dcf7;
  --green: #2f8f5b;
  --green-soft: #eaf5ef;
  --amber: #b07818;
  --amber-soft: #fbf3e3;
  --red: #c9453d;
  --red-soft: #fbecea;
  --blue: #3d6fa8;
  --blue-soft: #edf3fa;
  --violet: #7862c4;
  --violet-soft: #f2effc;
  --mono: "SFMono-Regular", "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --detail-w: 400px;
}
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex: none; }
::selection { background: #dfe2fb; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: #d5d5d0; border: 2px solid transparent; background-clip: padding-box; border-radius: 8px; }
*::-webkit-scrollbar-thumb:hover { background: #c2c2bc; border: 2px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-track { background: transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- App frame ---------- */
.app {
  position: relative;
  width: 1200px;
  max-width: calc(100vw - 24px);
  height: min(830px, calc(100vh - 24px));
  display: flex;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid #e0e0dd;
  border-radius: 11px;
  box-shadow: 0 14px 44px rgba(24, 24, 32, .08), 0 1px 2px rgba(24, 24, 32, .05);
}

/* ---------- Sidebar ---------- */
.sidebar {
  width: 212px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
}
.brand {
  flex: none;
  height: 52px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.brand-mark {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 7px;
  background: #23242a;
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: -.02em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.brand > span:last-child, .user > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 12.5px; line-height: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand-sub { font-size: 10px; line-height: 13px; color: var(--ink-3); }
.sidebar-main { flex: 1; min-height: 0; overflow: auto; padding-bottom: 8px; }

.project-wrap { position: relative; margin: 0 8px 10px; }
.project-btn {
  width: 100%;
  height: 43px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: #fff;
  text-align: left;
}
.project-btn:hover { border-color: var(--line-dark); background: #fff; }
.project-btn[aria-expanded="true"] { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.project-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.03); }
.project-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.project-name { font-size: 11.5px; line-height: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-code { font-family: var(--mono); font-size: 9px; line-height: 12px; letter-spacing: .04em; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-chev { color: var(--ink-4); margin-left: 1px; }

.popover {
  position: absolute;
  z-index: 60;
  padding: 4px;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(22, 22, 30, .14), 0 1px 2px rgba(22, 22, 30, .06);
  animation: pop-in 110ms ease-out;
}
@keyframes pop-in { from { opacity: 0; transform: translateY(-3px); } }
.project-pop { top: calc(100% + 6px); left: 0; width: 100%; }
.pop-group { padding: 5px 8px 2px; font-size: 9.5px; font-weight: 600; letter-spacing: .05em; color: var(--ink-4); }
.pop-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border: 0;
  border-radius: 5px;
  background: none;
  font-size: 11.5px;
  text-align: left;
}
.pop-item:hover { background: var(--hover); }
.pop-item.active { background: var(--accent-soft); }
.pop-item-main { flex: 1; min-width: 0; }
.pop-item-name { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-item-meta { display: block; font-family: var(--mono); font-size: 9px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-check { color: var(--accent); }
.pop-sep { height: 1px; margin: 4px 6px; background: var(--line); }
.pop-foot { padding: 2px; }
.pop-foot .pop-item { color: var(--ink-2); font-size: 11px; }

.nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
.nav-label { padding: 10px 8px 5px; font-size: 9.5px; line-height: 14px; font-weight: 650; letter-spacing: .06em; color: var(--ink-4); }
.nav-label:first-child { padding-top: 2px; }
.nav-item {
  width: 100%;
  height: 28px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 18px;
  text-align: left;
}
.nav-item:hover { background: var(--hover-strong); color: var(--ink); }
.nav-item.active { background: #e9e9e6; color: var(--ink); font-weight: 500; }
.nav-icon { color: var(--ink-3); }
.nav-item.active .nav-icon { color: var(--ink-2); }
.nav-count { margin-left: auto; font-size: 10px; color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.nav-count.hot { color: var(--amber); }
.nav-count.danger { color: var(--red); }

.proj-link {
  width: 100%;
  height: 27px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink-2);
  font-size: 11.5px;
  text-align: left;
}
.proj-link:hover { background: var(--hover-strong); color: var(--ink); }
.proj-link.active { color: var(--ink); font-weight: 500; }
.proj-link .project-dot { width: 6px; height: 6px; }
.proj-link-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-link-count { font-size: 9.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.proj-link.active .proj-link-count { color: var(--ink-3); }

.sidebar-foot { flex: none; padding: 7px 8px 9px; border-top: 1px solid var(--line); }
.cmd-hint {
  width: 100%;
  height: 27px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 7px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink-3);
  font-size: 11px;
  text-align: left;
}
.cmd-hint:hover { background: var(--hover-strong); color: var(--ink-2); }
.cmd-hint .kbd { margin-left: auto; }
.user { display: flex; align-items: center; gap: 8px; padding: 8px 7px 0; margin-top: 2px; }
.avatar {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: #e6e3dc;
  color: #625e55;
  font-size: 10px;
  font-weight: 650;
}
.user-name { font-size: 10.5px; line-height: 14px; font-weight: 500; color: var(--ink-2); }
.user-role { font-size: 9.5px; line-height: 12px; color: var(--ink-4); }

/* ---------- Main / topbar ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.topbar {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
}
.tb-left { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.crumb { display: flex; align-items: center; gap: 5px; font-size: 9.5px; line-height: 12px; color: var(--ink-4); white-space: nowrap; }
.crumb b { font-weight: 500; color: var(--ink-3); }
.crumb .slash { color: var(--ink-5); }
.page-title { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.page-title h1 { margin: 0; font-size: 16px; line-height: 21px; font-weight: 650; letter-spacing: -.015em; }
.page-title .page-count { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.page-title .page-aside { font-size: 10px; color: var(--ink-4); margin-left: 1px; }
.page-title .page-aside::before { content: '·'; margin-right: 5px; color: var(--ink-5); }
.tb-actions { margin-left: auto; display: flex; align-items: center; gap: 5px; }

.search-trigger {
  height: 27px;
  min-width: 188px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fbfbfa;
  color: var(--ink-3);
  font-size: 10.5px;
  text-align: left;
}
.search-trigger:hover { border-color: var(--line-strong); background: #fff; color: var(--ink-2); }
.search-trigger .kbd { margin-left: auto; }

.btn {
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  font-size: 11.5px;
  line-height: 17px;
  font-weight: 500;
  white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: #25262b; border-color: #25262b; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #111216; border-color: #111216; }
.btn-outline { background: #fff; border-color: var(--line-strong); color: var(--ink-2); }
.btn-outline:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #b23831; border-color: #b23831; }
.btn-sm { height: 25px; padding: 0 8px; font-size: 11px; border-radius: 5px; }
.btn-tiny { height: 21px; padding: 0 7px; font-size: 10px; border-radius: 4px; }
.danger-hover { color: var(--ink-3); }
.danger-hover:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
.icon-btn {
  width: 27px; height: 27px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--ink-3);
}
.icon-btn:hover { background: var(--hover-strong); color: var(--ink); }
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 16px;
  min-width: 16px;
  padding: 0 4px;
  border: 1px solid var(--line-strong);
  border-bottom-color: #d1d1cc;
  border-radius: 4px;
  background: #fff;
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: 9px;
  line-height: 1;
  font-weight: 550;
  letter-spacing: 0;
  white-space: nowrap;
}
.kbd-dark { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.75); }
.kbd-flat { background: #f5f5f2; border-color: var(--line); }

.page { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.page-scroll { height: 100%; overflow: auto; padding: 14px 16px 22px; }
.statusbar {
  height: 27px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 11px;
  border-top: 1px solid var(--line);
  background: #fcfcfb;
  color: var(--ink-3);
  font-size: 9.5px;
  white-space: nowrap;
}
.status-left { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.status-left .sep { color: var(--ink-5); }
.status-left .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex: none; }
.status-right { margin-left: auto; display: flex; align-items: center; gap: 9px; overflow: hidden; }
.hint { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-4); }
.hint .kbd { height: 15px; min-width: 15px; font-size: 8.5px; border-radius: 3px; }

/* ---------- Requirements / tasks pages ---------- */
.req-page, .task-page { height: 100%; display: flex; flex-direction: column; }
.toolbar {
  flex: none;
  height: 41px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  border-bottom: 1px solid var(--line);
}
.segmented { display: flex; align-items: center; gap: 1px; min-width: 0; }
.seg {
  height: 24px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--ink-3);
  font-size: 11px;
  line-height: 18px;
  white-space: nowrap;
}
.seg:hover { background: var(--hover); color: var(--ink-2); }
.seg.active { background: var(--active); color: var(--ink); font-weight: 550; }
.seg .n { font-size: 9.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.seg.active .n { color: var(--ink-3); }
.toolbar .spacer { flex: 1; }
.tool-btn {
  height: 25px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--ink-3);
  font-size: 10.5px;
}
.tool-btn:hover { background: var(--hover); color: var(--ink-2); }
.tool-btn.active { background: var(--accent-soft); color: var(--accent-ink); }
.tool-btn .n { font-size: 9px; color: var(--accent-ink); }
.filter-wrap { position: relative; }
.filter-pop { top: calc(100% + 5px); right: 0; width: 238px; padding: 5px; }
.filter-pop .pop-group { padding: 7px 8px 4px; }
.pop-options { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 5px; }
.pop-chip {
  height: 23px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink-2);
  font-size: 10px;
}
.pop-chip:hover { border-color: var(--line-dark); background: var(--hover); }
.pop-chip.on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
.pop-foot .text-btn { padding: 3px 8px; }
.search-field {
  width: 152px;
  height: 25px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 5px;
  border: 1px solid transparent;
  border-radius: 5px;
  color: var(--ink-3);
}
.search-field:hover { background: var(--hover); }
.search-field:focus-within { background: #fff; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-field input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 11px; color: var(--ink); }
.search-field input::placeholder { color: var(--ink-4); }
.search-field .kbd { height: 14px; min-width: 14px; font-size: 8px; border-radius: 3px; }
.chips {
  flex: none;
  height: 31px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 11px;
  border-bottom: 1px solid var(--line);
  background: #fdfdfc;
  overflow: hidden;
}
.chip {
  height: 20px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink-4);
  font-size: 9.5px;
  white-space: nowrap;
}
.chip b { font-weight: 500; color: var(--ink-2); max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.chip button {
  width: 14px; height: 14px;
  display: grid; place-items: center;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: none;
  color: var(--ink-4);
}
.chip button:hover { background: var(--hover-strong); color: var(--ink); }
.chips-count { margin-left: auto; font-size: 9.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips .clear {
  border: 0; background: none; padding: 0; margin-left: 4px;
  color: var(--ink-3); font-size: 9.5px; white-space: nowrap;
}
.chips .clear:hover { color: var(--ink); text-decoration: underline; }

.split { flex: 1; min-height: 0; display: flex; }
.listpane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.split:not(.no-detail) .listpane { border-right: 1px solid var(--line); }
.detailpane { width: var(--detail-w); flex: none; min-height: 0; display: flex; flex-direction: column; background: #fff; }
.split.no-detail .detailpane { display: none; }
.thead {
  flex: none;
  height: 27px;
  display: grid;
  align-items: center;
  padding: 0 10px;
  border-bottom: 1px solid var(--line);
  background: #fcfcfb;
  color: var(--ink-4);
  font-size: 9px;
  letter-spacing: .03em;
  user-select: none;
}
.req-cols { grid-template-columns: 42px minmax(0, 1fr) 68px 46px 86px 34px 46px; column-gap: 6px; }
.task-cols { grid-template-columns: 42px minmax(0, 1fr) 66px 42px 38px 46px; column-gap: 6px; }
.rows { flex: 1; min-height: 0; overflow: auto; }
.req-row, .task-row {
  position: relative;
  width: 100%;
  height: 40px;
  display: grid;
  align-items: center;
  padding: 0 10px;
  border: 0;
  border-bottom: 1px solid #f1f1ee;
  border-radius: 0;
  background: none;
  text-align: left;
  color: var(--ink-2);
}
.req-row { grid-template-columns: 42px minmax(0, 1fr) 68px 46px 86px 34px 46px; column-gap: 6px; }
.task-row { grid-template-columns: 42px minmax(0, 1fr) 66px 42px 38px 46px; column-gap: 6px; }
.req-row:hover, .task-row:hover { background: #f8f8f6; }
.req-row.selected, .task-row.selected { background: var(--accent-soft); }
.req-row.selected::before, .task-row.selected::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
}
.req-id, .task-id {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink-4);
  letter-spacing: -.02em;
  white-space: nowrap;
}
.req-row.selected .req-id, .task-row.selected .task-id { color: var(--ink-3); }
.req-title, .task-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 430;
  color: var(--ink);
  padding-right: 4px;
}
.req-row.selected .req-title, .task-row.selected .task-title { font-weight: 500; }
.time-cell { font-size: 9.5px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count-cell { display: flex; align-items: center; gap: 3px; font-size: 9.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.risk {
  width: 12px; height: 12px;
  display: inline-grid; place-items: center;

}
.type-cell { font-size: 9.5px; color: var(--ink-3); white-space: nowrap; }
.list-foot {
  flex: none;
  height: 27px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 11px;
  border-top: 1px solid var(--line);
  background: #fcfcfb;
  color: var(--ink-4);
  font-size: 9px;
}
.list-foot .spacer { flex: 1; }
.empty {
  height: 100%;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;

}

}

/* ---------- Status / priority / source ---------- */
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-2); white-space: nowrap; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); flex: none; }

.status[data-tone="blue"] .dot { background: #5586c4; }
.status[data-tone="green"] .dot { background: #43a06d; }
.status[data-tone="red"] .dot { background: #d0574f; }
.status[data-tone="violet"] .dot { background: #8a72d4; }
.status[data-tone="gray"] .dot { background: #b0b3b8; }
.prio { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); white-space: nowrap; }
.prio .bars { display: flex; align-items: flex-end; gap: 1px; height: 9px; }
.prio .bars i { width: 2px; height: 4px; background: currentColor; border-radius: 1px; opacity: .25; }
.prio .bars i:nth-child(2) { height: 6px; }
.prio .bars i:nth-child(3) { height: 9px; }
.prio .bars i.on { opacity: 1; }
.prio-label { font-family: var(--mono); font-size: 9px; letter-spacing: -.02em; }
.prio[data-p="P0"] { color: #c04a42; }
.prio[data-p="P1"] { color: #b07a1e; }
.prio[data-p="P2"] { color: #6d7f95; }
.prio[data-p="P3"] { color: #9a9ea5; }
.source { display: inline-flex; align-items: center; gap: 4px; min-width: 0; font-size: 9.5px; color: var(--ink-3); }
.source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source svg { color: var(--ink-4); }
.tag {
  display: inline-flex;
  align-items: center;
  height: 17px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: #fff;
  color: var(--ink-3);
  font-size: 9px;
  white-space: nowrap;
}
.tag.accent { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- Detail pane ---------- */
.detail-top {
  flex: none;
  height: 33px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 13px;
  border-bottom: 1px solid var(--line);
}
.detail-top .ref { flex: none; font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); letter-spacing: -.01em; }
.detail-top .top-proj { flex: none; font-size: 9.5px; color: var(--ink-4); }
.detail-top .top-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; color: var(--ink-3); }
.detail-top .actions { margin-left: auto; display: flex; align-items: center; gap: 1px; }
.detail-scroll { flex: 1; min-height: 0; overflow: auto; }
.detail-scroll:focus { outline: none; }
.detail-body { padding: 13px 15px 26px; outline: none; }
.detail-title {
  margin: 0 0 9px;

  font-weight: 650;

}
.detail-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
.detail-badges .sep { width: 1px; height: 11px; background: var(--line); }
.inline-select {
  position: relative;
  height: 22px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 4px 0 5px;
  border-radius: 4px;
  color: var(--ink-2);
}
.inline-select:hover { background: var(--hover); }
.inline-select select {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0 11px 0 0;
  font-size: 10.5px;
  line-height: 18px;
  color: var(--ink-2);
  cursor: pointer;
  outline: none;
  max-width: 120px;
}
.inline-select .chev { position: absolute; right: 2px; color: var(--ink-4); pointer-events: none; }
.inline-select .status { pointer-events: none; }
.inline-select .status + select { margin-left: 0; }
.prio-select .bars { pointer-events: none; }
.detail-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; padding: 10px 0 12px; border-top: 1px solid var(--line); margin-top: 3px; }
.detail-actions .spacer { flex: 1; }
.detail-actions .btn .kbd { height: 14px; min-width: 14px; font-size: 8px; border-radius: 3px; opacity: .7; margin-left: 1px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; margin: 0; padding: 10px 0 13px; border-bottom: 1px solid var(--line); }
.field { min-width: 0; }
.field dt { font-size: 9px; line-height: 13px; color: var(--ink-4); margin-bottom: 1px; }
.field dd { margin: 0; font-size: 10.5px; line-height: 15px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field dd.wrap { white-space: normal; overflow-wrap: anywhere; }
.field .link-btn { padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 10.5px; text-align: left; }
.field .link-btn:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.section { margin-top: 15px; }
.section-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; min-height: 20px; }
.section-head h3 { margin: 0; font-size: 10.5px; line-height: 16px; font-weight: 650; color: var(--ink-2); letter-spacing: .01em; }
.section-head .count { font-size: 9.5px; color: var(--ink-4); font-weight: 400; font-variant-numeric: tabular-nums; }
.section-head .right { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.text-btn { padding: 0; border: 0; background: none; color: var(--accent-ink); font-size: 10px; line-height: 16px; }
.text-btn:hover { text-decoration: underline; text-underline-offset: 2px; }
.desc { margin: 0; font-size: 11.5px; line-height: 18.5px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.quote {
  margin: 9px 0 0;
  padding: 7px 9px;
  border-left: 2px solid #dad9d3;

}

.mini-task {

}

.inline-empty {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px;
  border: 1px dashed var(--line-strong);

/* ---------- Split composer ---------- */
.composer {
  margin-top: 8px;

}
.composer-head { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.composer-title { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 650; color: var(--accent-ink); }
.composer-help { margin-left: auto; font-size: 9px; color: var(--ink-4); }
.composer textarea {
  width: 100%;
  min-height: 62px;
  display: block;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  font-size: 10.5px;
  line-height: 17px;
  resize: vertical;
  outline: none;
}
.composer textarea::placeholder { color: var(--ink-4); }
.composer textarea:focus { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
.composer-hintline { margin-top: 4px; font-size: 8.5px; line-height: 13px; color: var(--ink-4); }
.composer-row { display: flex; align-items: center; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.mini-select {
  height: 22px;
  padding: 0 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink-2);
  font-size: 9.5px;
  outline: none;
}
.mini-select:focus { border-color: var(--accent-line); }
.composer-preview { margin-left: auto; font-size: 9px; color: var(--ink-3); white-space: nowrap; }
.composer-preview b { color: var(--accent-ink); font-weight: 650; }
.composer-preview.warn { color: var(--amber); }
.composer-input {
  width: 100%;
  height: 24px;
  margin-top: 5px;
  padding: 0 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  font-size: 9.5px;
  outline: none;
}
.composer-input:focus { border-color: var(--accent-line); }
.composer-foot { display: flex; align-items: center; gap: 6px; margin-top: 7px; padding-top: 7px; border-top: 1px solid #e9e9f6; }
.composer-foot .hint { font-size: 8.5px; }
.composer-foot .foot-actions { margin-left: auto; display: flex; gap: 4px; }

/* ---------- Task detail ---------- */
.tabs { display: flex; align-items: center; gap: 2px; margin: 11px -15px 0; padding: 0 15px; border-bottom: 1px solid var(--line); }
.tab {
  position: relative;
  height: 30px;
  padding: 0 6px;
  margin-right: 6px;
  border: 0;
  border-bottom: 1.5px solid transparent;
  background: none;
  color: var(--ink-3);
  font-size: 10.5px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--ink); font-weight: 550; border-bottom-color: var(--ink); }
.tab .n { font-size: 8.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.tab .tab-dot { width: 5px; height: 5px; border-radius: 50%; background: #d39a2c; }
.tab-body { padding-top: 10px; }
.attempt-list { display: flex; flex-direction: column; }
.attempt { position: relative; padding: 0 0 12px 13px; border-left: 1px solid var(--line); }
.attempt:last-child { padding-bottom: 2px; }
.attempt::before {
  content: "";
  position: absolute;
  left: -3px; top: 6px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--line-dark);
  box-shadow: 0 0 0 2px #fff;
}
.attempt.fail::before { background: var(--red); }
.attempt.run::before { background: #5586c4; }
.attempt.done::before { background: #43a06d; }
.attempt-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.attempt-head b { font-family: var(--mono); font-size: 10px; color: var(--ink); font-weight: 600; }
.attempt-head .stage { font-size: 9px; color: var(--ink-3); }
.attempt-head .session { font-family: var(--mono); font-size: 8.5px; color: var(--ink-4); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 132px; }
.attempt-report { margin: 4px 0 0; font-size: 10.5px; line-height: 17px; color: var(--ink-2); }
.attempt-foot { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 8.5px; color: var(--ink-4); }
.errbox {
  margin-top: 5px;
  padding: 5px 7px;
  border-radius: 4px;
  background: var(--red-soft);
  color: #98342d;
  font-family: var(--mono);
  font-size: 8.5px;
  line-height: 13.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.evidence { position: relative; margin-bottom: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
.evidence-head { display: flex; align-items: center; gap: 5px; min-width: 0; }
.evidence-title { font-size: 10.5px; line-height: 15px; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evidence-meta { margin-left: auto; flex: none; font-size: 8.5px; color: var(--ink-4); }
.evidence pre { margin: 6px 0 0; padding: 6px 7px; border-radius: 3px; background: #f7f7f5; color: var(--ink-2); font-family: var(--mono); font-size: 8.5px; line-height: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 120px; overflow: auto; }
.review-card { margin-bottom: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; }
.review-head { display: flex; align-items: center; gap: 5px; }
.review-text { margin: 5px 0 0; font-size: 10.5px; line-height: 17px; color: var(--ink-2); }
.review-meta { margin-top: 4px; font-size: 8.5px; color: var(--ink-4); }
.decision { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 3px; font-size: 8.5px; font-weight: 600; }
.decision.pass { background: var(--green-soft); color: var(--green); }
.decision.return { background: var(--red-soft); color: var(--red); }
.review-composer { margin-bottom: 9px; padding: 8px; border: 1px solid var(--amber); border-color: #ecd9b7; border-radius: 5px; background: #fffdf8; }
.review-composer .composer-head { margin-bottom: 6px; }
.review-composer .composer-title { color: var(--amber); }
.review-composer textarea { width: 100%; min-height: 48px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-size: 10.5px; line-height: 16px; resize: vertical; outline: none; }
.review-composer textarea:focus { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber-soft); }
.radio-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.radio-pill { position: relative; display: inline-flex; align-items: center; }
.radio-pill input { position: absolute; opacity: 0; pointer-events: none; }
.radio-pill span {
  display: inline-flex; align-items: center; gap: 4px;
  height: 21px; padding: 0 7px;
  border: 1px solid var(--line); border-radius: 4px;
  background: #fff; color: var(--ink-3); font-size: 9.5px; cursor: pointer;
}

.review-composer .foot { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.review-composer .foot .hint { margin-right: auto; font-size: 8.5px; }
.tab-empty { padding: 12px 0 4px; font-size: 10px; line-height: 16px; color: var(--ink-4); }

/* ---------- Overview ---------- */
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 12px; align-items: start; }
.ov-main, .ov-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.stat {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 9px 10px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  text-align: left;
  font: inherit;
}
.stat:hover { border-color: var(--line-dark); background: #fcfcfb; }
.stat-top { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 9.5px; }
.stat-top svg { color: var(--ink-4); }
.stat-top .stat-hot { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
.stat-value { margin-top: 3px; font-size: 21px; line-height: 25px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-value small { margin-left: 3px; font-size: 9px; font-weight: 400; letter-spacing: 0; color: var(--ink-4); }
.stat-sub { margin-top: 0; font-size: 8.5px; line-height: 12px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel { border: 1px solid var(--line); border-radius: 7px; background: #fff; min-width: 0; }
.panel-head {
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 11px;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { margin: 0; font-size: 10.5px; line-height: 16px; font-weight: 650; color: var(--ink-2); letter-spacing: .01em; }
.panel-head .count { font-size: 9.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.panel-head .right { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.action-list { display: flex; flex-direction: column; }
.action-row { display: flex; align-items: center; gap: 8px; min-height: 43px; padding: 6px 9px 6px 10px; border-bottom: 1px solid #f1f1ee; }
.action-row:last-child { border-bottom: 0; }
.action-row:hover { background: #fafaf8; }
.action-icon { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 5px; background: var(--hover); color: var(--ink-3); }
.action-icon.red { background: var(--red-soft); color: var(--red); }
.action-icon.amber { background: var(--amber-soft); color: var(--amber); }
.action-icon.blue { background: var(--blue-soft); color: var(--blue); }
.action-icon.violet { background: var(--violet-soft); color: var(--violet); }
.action-main { flex: 1; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
.action-title { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 10.5px; line-height: 15px; color: var(--ink); font-weight: 450; white-space: nowrap; }
.action-title .kind { flex: none; font-size: 8.5px; color: var(--ink-4); }
.action-sub { display: block; margin-top: 1px; font-size: 9px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.action-main:hover .action-title { color: var(--accent-ink); }
.action-time { flex: none; font-size: 8.5px; color: var(--ink-4); }
.action-side { flex: none; }
.mini-table { display: flex; flex-direction: column; }
.mini-row {
  display: grid;
  grid-template-columns: 68px minmax(0, 1fr) 42px 50px;
  align-items: center;
  column-gap: 7px;
  min-height: 35px;
  padding: 0 11px;
  border: 0;
  border-bottom: 1px solid #f1f1ee;
  background: none;
  text-align: left;
}
.mini-row:last-child { border-bottom: 0; }
.mini-row:hover { background: #fafaf8; }
.mini-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; color: var(--ink); }
.mini-row .time-cell { text-align: right; }
.mini-type { font-size: 8.5px; color: var(--ink-4); }
.project-mini {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid #f1f1ee;
  background: none;
  text-align: left;
}

.project-mini:hover { background: #fafaf8; }
.project-mini .project-dot { width: 7px; height: 7px; }
.pm-main { flex: 1; min-width: 0; }
.pm-name { display: block; font-size: 10.5px; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm-meta { display: block; margin-top: 1px; font-size: 8.5px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-state { flex: none; font-size: 8.5px; color: var(--ink-4); }
.project-mini.active .pm-name { color: var(--accent-ink); }
.activity { padding: 4px 10px 6px; }
.activity-item { position: relative; padding: 6px 0 6px 13px; border-left: 1px solid var(--line); }
.activity-item::before { content: ""; position: absolute; left: -3px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-5); box-shadow: 0 0 0 2px #fff; }
.activity-item.blue::before { background: #5586c4; }
.activity-item.red::before { background: var(--red); }
.activity-item.amber::before { background: #d39a2c; }
.activity-item.green::before { background: #43a06d; }
.activity-text { font-size: 9.5px; line-height: 14px; color: var(--ink-2); }

/* ---------- Inbox ---------- */

/* ---------- Overlays / modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; }

.modal {

.form-group { margin-top: 12px; }

}

.radio-cards { display: flex; gap: 5px; }

  align-items: center;
  gap: 6px;
  padding: 6px 7px;
  border: 1px solid var(--line-strong);

  background: #fff;

}

.radio-card .rc-main { min-width: 0; }

}

.form-grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; }

.form-foot { display: flex; align-items: center; gap: 6px; margin-top: 15px; padding-top: 11px; border-top: 1px solid var(--line); }

.pi-label .dim { color: var(--ink-4); }
.pi-hint { margin-left: auto; flex: none; font-size: 8.5px; color: var(--ink-4); display: inline-flex; align-items: center; gap: 4px; }
.palette-empty { padding: 26px 12px; text-align: center; color: var(--ink-4); font-size: 10.5px; }
.palette-foot { height: 28px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-top: 1px solid var(--line); font-size: 8.5px; color: var(--ink-4); }

/* ---------- Toast ---------- */
#toast-root { position: absolute; inset: 0; z-index: 200; pointer-events: none; }
.toast {
  position: absolute;
  left: 50%;
  bottom: 38px;
  z-index: 200;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: min(520px, calc(100vw - 32px));
  padding: 7px 11px;
  border-radius: 6px;
  background: #202126;
  color: #fff;
  font-size: 10.5px;
  line-height: 16px;
  box-shadow: 0 10px 30px rgba(15, 15, 20, .25);
  animation: toast-in 140ms ease-out;
}
.toast svg { color: #8fd0a7; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 5px); } }

/* ---------- Responsive guards (design target stays 1200px) ---------- */
@media (max-width: 1120px) {
  :root { --detail-w: 378px; }
  .source-col { display: none !important; }
  .req-cols { grid-template-columns: 42px minmax(0, 1fr) 68px 46px 34px 46px !important; }
  .req-row { grid-template-columns: 42px minmax(0, 1fr) 68px 46px 34px 46px !important; }
  .source { display: none !important; }
}

  .app { max-width: 100vw; height: 100vh; margin: 0; border-radius: 0; border: 0; }
  .sidebar { width: 190px; }
  .search-trigger { min-width: 140px; }
  .search-trigger .label-text { display: none; }
  .ov-grid { grid-template-columns: minmax(0, 1fr); }
  .ov-side { display: grid; grid-template-columns: 1fr 1fr; }
  .projects-grid { grid-template-columns: minmax(0, 1fr); }
  .search-field { width: 120px; }
  .name-col { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

    .filter((task) => {
      if (filter.status === 'all') return true;
      if (filter.status === 'active') return task.status !== '完成' && task.status !== '取消';
      return status ? task.status === status : true;
    })
    .filter((task) => !q || (task.title + ' T-' + task.seq + ' ' + task.type + ' ' + task.status).toLowerCase().includes(q));
}
function reqCounts() {
  const list = projectReqs();
  const count = (status) => list.filter((item) => item.status === status).length;
  return {
    active: list.filter((item) => item.status !== '已关闭').length,
    pending: count('待确认'), confirmed: count('已确认'), split: count('已拆分'), closed: count('已关闭'), all: list.length
  };
}
function taskCounts() {
  const list = projectTasks();
  const count = (status) => list.filter((item) => item.status === status).length;
  return {
    active: list.filter((item) => item.status !== '完成' && item.status !== '取消').length,
    ready: count('就绪'), running: count('进行中'), review: count('评审'), acceptance: count('待验收'),
    done: count('完成'), blocked: count('阻塞'), all: list.length
  };
}
function memoryCounts() {
  const list = projectMemories();
  const count = (status) => list.filter((item) => item.status === status).length;
  return { all: list.length, draft: count('草稿'), review: count('待复核'), confirmed: count('已确认'), deprecated: count('已废弃') };
}
function reviewCounts() {
  const list = projectReviews();
  return { all: list.length, pass: list.filter((item) => item.decision === '通过').length, back: list.filter((item) => item.decision === '退回').length };
}
function splitLines(draft) {
  return String(draft || '').split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
}
function looksLikeProse(lines) {
  return lines.length > 1 && lines.some((line) => /^(以及|并且|并|和|与|或|及)/.test(line) || /[。！？]$/.test(line));
}
function splitPreviewHTML(count) {
  if (!count) return '尚未输入任务';
  return '将拆出 <b>' + count + '</b> 个任务 · 逗号不拆分';
}
function updateSplitPreviewDom() {
  const lines = splitLines(state.splitDraft);
  const preview = document.getElementById('split-preview');
  const submit = document.getElementById('split-submit');
  if (preview) {
    const warn = looksLikeProse(lines);
    preview.className = 'composer-preview' + (warn ? ' warn' : '');
    preview.innerHTML = warn ? '⚠️ 看起来像一段话被拆开，请确认' : splitPreviewHTML(lines.length);
  }
  if (submit) {
    submit.disabled = lines.length === 0;
    submit.textContent = '拆出 ' + lines.length + ' 个任务';
  }
}

/* ---------- State transitions (no direct rendering) ---------- */
function normalizeSelections() {
  if (state.page === 'requirements') {
    const reqList = visibleReqs();
    if (state.reqId && !reqList.some((item) => item.id === state.reqId)) {
      state.reqId = reqList.length ? reqList[0].id : null;
      state.splitOpen = false;
    }
  }
  if (state.page === 'tasks') {
    const taskList = visibleTasks();
    if (state.taskId && !taskList.some((item) => item.id === state.taskId)) {
      state.taskId = taskList.length ? taskList[0].id : null;
    }
  }
}
function goPage(page) {
  state.page = page;
  state.projectMenu = false;
  state.filterMenu = false;
  state.paletteOpen = false;
  state.paletteQuery = '';
  state.paletteIndex = 0;
  state.splitOpen = false;
  if (page === 'requirements' && !state.reqId) {
    const list = visibleReqs();
    state.reqId = list.length ? list[0].id : null;
  }
  if (page === 'tasks' && !state.taskId) {
    const list = visibleTasks();
    state.taskId = list.length ? list[0].id : null;
  }
  if (page === 'projects') state.projectView = state.project;
}
function switchProject(id) {
  if (!PROJECTS[id]) return;
  state.project = id;
  state.projectView = id;
  state.reqFilter = { status: 'active', priority: null, source: null, q: '' };
  state.taskFilter = { status: 'active', q: '' };
  state.memoryType = 'all';
  state.memoryQ = '';
  state.reviewFilter = 'all';
  state.splitOpen = false;
  state.splitDraft = '';
  state.projectMenu = false;
  state.filterMenu = false;
  const reqList = visibleReqs();
  state.reqId = reqList.length ? reqList[0].id : null;
  const taskList = visibleTasks();
  state.taskId = taskList.length ? taskList[0].id : null;
  state.taskTab = 'attempts';
  showToast('已切换到 ' + PROJECTS[id].short);
}
function openReq(id) {
  const req = getReq(id);
  if (!req) return;
  if (req.project !== state.project) state.project = req.project;
  state.page = 'requirements';
  if (!visibleReqs().some((item) => item.id === id)) {
    state.reqFilter = { status: 'all', priority: null, source: null, q: '' };
  }
  state.reqId = id;
  state.splitOpen = false;
  state.splitDraft = '';
}
function openTask(id) {
  const task = getTask(id);
  if (!task) return;
  if (task.project !== state.project) state.project = task.project;
  state.page = 'tasks';
  if (!visibleTasks().some((item) => item.id === id)) {
    state.taskFilter = { status: 'all', q: '' };
  }
  state.taskId = id;
  state.taskTab = task.status === '评审' ? 'reviews' : 'attempts';
}
function openCreate(seed) {
  state.createOpen = true;
  state.createSeed = seed || null;
  state.createFrom = seed && seed.inboxId ? seed.inboxId : null;
  state.paletteOpen = false;
  focusAfterRender('create-title');
}

function render() {
  normalizeSelections();
  const reqChanged = state.reqId !== lastReqRendered;
  const taskChanged = state.taskId !== lastTaskRendered;
  const scrolls = {};
  ['req-list', 'task-list', 'req-detail', 'task-detail', 'page-scroll'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) scrolls[id] = el.scrollTop;
  });
  if (reqChanged) delete scrolls['req-detail'];
  if (taskChanged) delete scrolls['task-detail'];
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  let selStart = null, selEnd = null;
  if (active && activeId && 'selectionStart' in active) {
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (error) { void error; }
  }

  renderSidebar();
  renderTopbar();
  const page = document.getElementById('page');
  page.innerHTML = pageHTML();
  document.getElementById('statusbar').innerHTML = statusbarHTML();
  renderOverlays();

  Object.keys(scrolls).forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.scrollTop = scrolls[id];
  });
  if (state.focusTarget) {
    const target = document.getElementById(state.focusTarget);
    if (target) {
      target.focus();
      if ('setSelectionRange' in target) {
        try { const length = target.value ? target.value.length : 0; target.setSelectionRange(length, length); } catch (error) { void error; }
      }
    }
    state.focusTarget = null;
  } else if (activeId) {
    const target = document.getElementById(activeId);
    if (target) {
      target.focus();
      if (selStart !== null && 'setSelectionRange' in target) {
        try { target.setSelectionRange(selStart, selEnd === null ? selStart : selEnd); } catch (error) { void error; }
      }
    }
  }
  if (state.scrollReq) {
    const row = document.querySelector('#req-list .req-row.selected');
    if (row) row.scrollIntoView({ block: 'nearest' });
    state.scrollReq = false;
  }
  if (state.scrollTask) {
    const row = document.querySelector('#task-list .task-row.selected');
    if (row) row.scrollIntoView({ block: 'nearest' });
    state.scrollTask = false;
  }
  if (state.paletteOpen) {
    const activeItem = document.querySelector('.palette-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });
  }
  lastReqRendered = state.reqId;
  lastTaskRendered = state.taskId;
}

function emptyReqsHTML() {

}
function prioritySelectHTML(req) {
  return '<label class="inline-select prio-select" title="优先级">' + priorityBars(req.priority) + '<select data-change="req-priority" data-id="' + req.id + '" aria-label="优先级">' +

function requirementActionsHTML(req) {

    '<button class="btn btn-outline btn-sm" data-act="close-requirement" data-id="' + req.id + '">关闭需求</button>';

function renderRequirementDetail(req) {
  const list = reqTasks(req.id);
  const blocked = list.filter((task) => task.status === '阻塞').length;
  const project = PROJECTS[req.project];
  return '<aside class="detailpane" aria-label="需求详情">' +
    '<div class="detail-top"><span class="ref">REQ-' + req.seq + '</span><span class="top-title">' + esc(req.title) + '</span>' +
      '<div class="actions"><button class="icon-btn" data-act="close-req" title="关闭详情 (Esc)" aria-label="关闭详情">' + svg('close', 13) + '</button></div>' +
    '</div>' +
    '<div class="detail-scroll" id="req-detail" tabindex="-1"><div class="detail-body">' +
      '<h2 class="detail-title">' + esc(req.title) + '</h2>' +
      '<div class="detail-badges">' + statusSelectHTML(req) + prioritySelectHTML(req) +
        '<span class="sep"></span><span class="source" title="' + esc(req.sourceNote) + '">' + svg(SOURCE_ICON[req.source], 11) + '<span>' + esc(req.sourceNote || req.source) + '</span></span>' +

      '</div>' +
      '<dl class="fields">' +
        '<div class="field"><dt>项目</dt><dd>' + project.code + ' · ' + esc(project.short) + '</dd></div>' +
        '<div class="field"><dt>负责人</dt><dd>王工</dd></div>' +
        '<div class="field"><dt>来源</dt><dd title="' + esc(req.sourceNote) + '">' + esc(req.sourceNote || req.source) + '</dd></div>' +
        '<div class="field"><dt>创建</dt><dd>' + esc(req.created) + '</dd></div>' +
        '<div class="field"><dt>更新</dt><dd>' + esc(req.updated) + '</dd></div>' +
        '<div class="field"><dt>关联任务</dt><dd>' + list.length + (blocked ? ' · <span style="color:var(--red)">' + blocked + ' 阻塞</span>' : '') + '</dd></div>' +
      '</dl>' +
      '<section class="section"><div class="section-head"><h3>描述</h3></div>' +

        (state.splitOpen && req.status !== '已关闭' ? renderSplitComposer(req) : '') +

function miniTaskHTML(task) {
  return '<button class="mini-task" data-act="open-task" data-id="' + task.id + '" title="' + esc(task.title) + '">' +
    statusHTML(task.status) +
    '<span class="mt-main"><span class="mt-title">' + esc(task.title) + '</span><span class="mt-meta"><span>' + esc(task.status) + '</span><span class="dot-sep">·</span><span>T-' + task.seq + '</span><span class="dot-sep">·</span><span>' + task.type + '</span><span class="dot-sep">·</span>' + priorityHTML(task.priority) + '</span></span>' +

function inlineTaskEmptyHTML(req) {

}

function renderSplitComposer(req) {
  const lines = splitLines(state.splitDraft);

  return '<form class="composer" id="split-form">' +
    '<div class="composer-head"><span class="composer-title">' + svg('split', 12) + '拆任务</span><span class="composer-help">每行一个任务</span></div>' +
    '<textarea id="split-lines" name="lines" rows="3" placeholder="每行一个任务，例如：&#10;设计客户维度导出字段&#10;实现按客户聚合的导出接口">' + esc(state.splitDraft) + '</textarea>' +

    '<div class="composer-row">' +
      '<select class="mini-select" name="type" data-change="split-meta" data-field="type" aria-label="任务类型">' + TASK_TYPES.map((type) => '<option value="' + type + '"' + (state.splitType === type ? ' selected' : '') + '>' + type + '</option>').join('') + '</select>' +
      '<select class="mini-select" name="priority" data-change="split-meta" data-field="priority" aria-label="优先级">' + PRIORITIES.map((p) => '<option value="' + p + '"' + (state.splitPriority === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select>' +
      '<span class="composer-preview ' + (warning ? 'warn' : '') + '" id="split-preview">' + (warning ? '⚠️ 看起来像一段话被拆开，请确认' : splitPreviewHTML(lines.length)) + '</span>' +
    '</div>' +
    '<input class="composer-input" name="acceptance" placeholder="验收标准（可选，应用到本次拆出的任务）">' +
    '<div class="composer-foot"><span class="hint">' + kbd('Ctrl') + kbd('↵') + ' 提交</span>' +
      '<div class="foot-actions"><button type="button" class="btn btn-ghost btn-sm" data-act="toggle-split">取消</button>' +
      '<button type="submit" class="btn btn-primary btn-sm" id="split-submit"' + (lines.length ? '' : ' disabled') + '>拆出 ' + lines.length + ' 个任务</button></div>' +
    '</div>' +
  '</form>';
}

/* ============================================================
   Tasks: filtered list + detail with attempts / evidence / review
   ============================================================ */
const TASK_FILTER_STATUS = { ready: '就绪', running: '进行中', review: '评审', acceptance: '待验收', blocked: '阻塞', done: '完成' };
const TASK_FILTER_LABEL = { active: '活跃', ready: '就绪', running: '进行中', review: '评审', acceptance: '待验收', blocked: '阻塞', done: '完成', all: '全部' };

function renderTasksPage() {
  const counts = taskCounts();
  const list = visibleTasks();
  const selected = getTask(state.taskId) && getTask(state.taskId).project === state.project ? getTask(state.taskId) : null;
  const filter = state.taskFilter;
  const segments = [
    ['active', '活跃', counts.active], ['ready', '就绪', counts.ready], ['running', '进行中', counts.running],
    ['review', '评审', counts.review], ['acceptance', '待验收', counts.acceptance], ['blocked', '阻塞', counts.blocked], ['done', '完成', counts.done]
  ];
  const chips = [];
  if (filter.status !== 'all') chips.push(chipHTML('状态', TASK_FILTER_LABEL[filter.status], 'task-status'));
  if (filter.q.trim()) chips.push(chipHTML('搜索', filter.q.trim(), 'task-q'));
  return '<div class="task-page">' +
    '<div class="toolbar">' +
      '<div class="segmented" role="tablist" aria-label="任务状态筛选">' +
        segments.map(([key, label, count]) => '<button class="seg ' + (filter.status === key ? 'active' : '') + '" role="tab" aria-selected="' + (filter.status === key ? 'true' : 'false') + '" data-act="task-status" data-status="' + key + '">' + label + '<span class="n">' + count + '</span></button>').join('') +
      '</div>' +
      '<div class="spacer"></div>' +
      '<div class="search-field">' + svg('search', 12) +
        '<input id="task-search" type="search" placeholder="搜索任务" aria-label="搜索任务" value="' + esc(filter.q) + '">' + kbd('/') +
      '</div>' +
    '</div>' +
    '<div class="chips">' + (chips.length ? chips.join('') : '<span class="chip"><b>全部任务</b></span>') +
      '<span class="chips-count">' + list.length + ' 条结果</span>' +
      '<button class="clear" data-act="clear-task-filters">重置</button>' +
    '</div>' +
    '<div class="split ' + (selected ? '' : 'no-detail') + '">' +
      '<div class="listpane">' +
        '<div class="thead task-cols"><span>ID</span><span>任务</span><span>状态</span><span>优先级</span><span>类型</span><span>更新</span></div>' +
        '<div class="rows" id="task-list">' + (list.length ? list.map(taskRowHTML).join('') : emptyTasksHTML()) + '</div>' +
        '<div class="list-foot"><span>共 ' + projectTasks().length + ' 个任务</span><span>·</span><span>' + counts.blocked + ' 个阻塞</span><span class="spacer"></span><span>运行记录只在详情中展示</span></div>' +
      '</div>' +
      (selected ? renderTaskDetail(selected) : '') +
    '</div>' +
  '</div>';
}

function taskRowHTML(task) {
  const selected = task.id === state.taskId;
  return '<button class="task-row ' + (selected ? 'selected' : '') + '" data-act="open-task" data-id="' + task.id + '" aria-selected="' + (selected ? 'true' : 'false') + '">' +
    '<span class="task-id">T-' + task.seq + '</span>' +
    '<span class="task-title" title="' + esc(task.title) + '">' + esc(task.title) + '</span>' +
    '<span>' + statusHTML(task.status) + '</span>' +
    '<span>' + priorityHTML(task.priority) + '</span>' +
    '<span class="type-cell">' + esc(task.type) + '</span>' +
    '<span class="time-cell">' + esc(task.updated) + '</span>' +
  '</button>';
}

function emptyTasksHTML() {
  return '<div class="empty"><span class="empty-icon">' + svg('tasks', 18) + '</span><p>没有符合条件的任务</p><span class="muted">调整状态或搜索词再试</span>' +
    '<button class="btn btn-outline btn-sm" data-act="clear-task-filters">清除筛选</button></div>';
}

function taskActionsHTML(task) {
  let html = '';
  if (task.status === '就绪') {
    html = '<button class="btn btn-primary btn-sm" data-act="task-action" data-kind="dispatch" data-id="' + task.id + '">' + svg('play', 11) + '派发' + kbd('D', 'kbd-dark') + '</button>';
  } else if (task.status === '阻塞') {
    html = '<button class="btn btn-primary btn-sm" data-act="task-action" data-kind="retry" data-id="' + task.id + '">' + svg('retry', 11) + '重试' + kbd('R', 'kbd-dark') + '</button>';
  } else if (task.status === '待验收') {
    html = '<button class="btn btn-primary btn-sm" data-act="task-action" data-kind="accept" data-id="' + task.id + '">' + svg('check', 12) + '验收通过' + kbd('A', 'kbd-dark') + '</button>';
  } else if (task.status === '评审') {
    html = '<button class="btn btn-primary btn-sm" data-act="task-review">' + svg('reviews', 12) + '写评审</button>';
  }
  if (task.status !== '完成' && task.status !== '取消') {
    html += '<button class="btn btn-outline btn-sm" data-act="task-action" data-kind="cancel" data-id="' + task.id + '">取消任务</button>';
  }
  return html;
}

function renderTaskDetail(task) {
  const req = getReq(task.reqId);
  const current = task.attempts[0];
  return '<aside class="detailpane" aria-label="任务详情">' +
    '<div class="detail-top"><span class="ref">TASK-' + task.seq + '</span><span class="top-title">' + esc(task.title) + '</span>' +
      '<div class="actions"><button class="icon-btn" data-act="close-task" title="关闭详情 (Esc)" aria-label="关闭详情">' + svg('close', 13) + '</button></div>' +
    '</div>' +
    '<div class="detail-scroll" id="task-detail" tabindex="-1"><div class="detail-body">' +
      '<h2 class="detail-title">' + esc(task.title) + '</h2>' +
      '<div class="detail-badges">' + statusHTML(task.status) + priorityHTML(task.priority) + typeTag(task.type) +
        '<span class="sep"></span><span class="muted" style="font-size:9.5px">尝试 ' + task.attempts.length + '</span>' +
      '</div>' +
      '<div class="detail-actions">' + taskActionsHTML(task) + '<span class="spacer"></span>' +
        '<button class="btn btn-ghost btn-sm danger-hover" data-act="delete-task" data-id="' + task.id + '">' + svg('trash', 12) + '删除</button>' +
      '</div>' +
      '<dl class="fields">' +
        '<div class="field"><dt>所属需求</dt><dd>' + (req ? '<button class="link-btn" data-act="open-req" data-id="' + req.id + '" title="#' + req.seq + ' ' + esc(req.title) + '">#' + req.seq + ' ' + esc(req.title) + '</button>' : '<span class="muted">需求已删除</span>') + '</dd></div>' +
        '<div class="field"><dt>项目</dt><dd>' + task.project + ' · ' + esc(PROJECTS[task.project].short) + '</dd></div>' +
        '<div class="field" style="grid-column:1/-1"><dt>验收标准</dt><dd class="wrap">' + (esc(task.acceptance) || '<span class="muted">未填写。</span>') + '</dd></div>' +
        '<div class="field"><dt>当前尝试</dt><dd>' + (current ? '#' + current.n + ' · ' + esc(current.status) + ' · ' + esc(current.stage || '—') : '<span class="muted">尚未派发</span>') + '</dd></div>' +
        '<div class="field"><dt>更新时间</dt><dd>' + esc(task.updated) + '</dd></div>' +
        '<div class="field"><dt>任务类型</dt><dd>' + esc(task.type) + '</dd></div>' +
        '<div class="field"><dt>标识</dt><dd class="mono" style="font-size:9px">' + task.id + '</dd></div>' +
      '</dl>' +
      '<div class="tabs" role="tablist" aria-label="任务详情分区">' +
        tabButton('attempts', '运行记录', task.attempts.length, state.taskTab === 'attempts') +
        tabButton('evidence', '证据', task.evidence.length, state.taskTab === 'evidence') +
        tabButton('reviews', '评审', task.reviews.length, state.taskTab === 'reviews', task.status === '评审') +
      '</div>' +
      '<div class="tab-body">' +
        (state.taskTab === 'attempts' ? attemptsHTML(task) : state.taskTab === 'evidence' ? evidenceHTML(task) : reviewsHTML(task)) +
      '</div>' +
    '</div></div>' +
  '</aside>';
}

function tabButton(key, label, count, active, dot) {
  return '<button class="tab ' + (active ? 'active' : '') + '" role="tab" aria-selected="' + (active ? 'true' : 'false') + '" data-act="task-tab" data-tab="' + key + '">' +
    label + '<span class="n">' + count + '</span>' + (dot ? '<span class="tab-dot"></span>' : '') + '</button>';
}

function attemptsHTML(task) {
  if (!task.attempts.length) {
    return '<div class="tab-empty">尚未派发。派发后会在这里记录每次运行尝试、阶段与失败原因。</div>';
  }
  return '<div class="attempt-list">' + task.attempts.map((attempt) => {
    const cls = attempt.status === '失败' ? 'fail' : attempt.status === '运行中' ? 'run' : attempt.status === '结束' ? 'done' : '';
    return '<div class="attempt ' + cls + '">' +
      '<div class="attempt-head"><b>#' + attempt.n + '</b>' + statusHTML(attempt.status) +
        '<span class="stage">' + esc(attempt.stage || '—') + '</span>' +
        '<span class="session" title="' + esc(attempt.session) + '">' + esc(attempt.session) + '</span></div>' +
      '<p class="attempt-report">' + esc(attempt.report) + '</p>' +
      (attempt.error ? '<div class="errbox">' + esc(attempt.error) + '</div>' : '') +
      '<div class="attempt-foot"><span>开始 ' + esc(attempt.started) + '</span><span>·</span><span>用时 ' + esc(attempt.duration) + '</span></div>' +
    '</div>';
  }).join('') + '</div>';
}

function evidenceHTML(task) {
  if (!task.evidence.length) {
    return '<div class="tab-empty">暂无证据。执行器可以通过产物或手工记录补充日志、命令和代码片段。</div>';
  }
  return task.evidence.map((item) => '<div class="evidence">' +
    '<div class="evidence-head"><span class="tag accent">' + esc(item.type) + '</span><span class="evidence-title" title="' + esc(item.title) + '">' + esc(item.title) + '</span><span class="evidence-meta">' + esc(item.meta) + '</span></div>' +
    '<pre>' + esc(item.content) + '</pre>' +
  '</div>').join('');
}

function reviewsHTML(task) {
  const composer = task.status === '评审'
    ? '<form class="review-composer" id="review-form">' +
        '<div class="composer-head"><span class="composer-title">' + svg('reviews', 12) + '提交评审</span><span class="composer-help">针对尝试 #' + (task.attempts[0] ? task.attempts[0].n : 1) + '</span></div>' +
        '<div class="radio-row">' +
          '<label class="radio-pill"><input type="radio" name="decision" value="通过" checked><span>' + svg('check', 10) + '通过</span></label>' +
          '<label class="radio-pill"><input type="radio" name="decision" value="退回"><span>' + svg('retry', 10) + '退回</span></label>' +
        '</div>' +
        '<textarea name="comments" id="review-comment" placeholder="通过或退回的理由（可选）"></textarea>' +
        '<div class="foot"><span class="hint">评审人 王工</span><button type="submit" class="btn btn-primary btn-sm">提交评审</button></div>' +
      '</form>'
    : '';
  const list = task.reviews.length
    ? task.reviews.map((review) => '<div class="review-card">' +
        '<div class="review-head">' + decisionHTML(review.decision) + '<span style="font-size:10px;color:var(--ink-2)">' + esc(review.reviewer || '未署名') + '</span>' +
          '<span style="margin-left:auto;font-size:8.5px;color:var(--ink-4)">' + esc(review.createdAt) + '</span></div>' +
        (review.comments ? '<p class="review-text">' + esc(review.comments) + '</p>' : '') +
        '<div class="review-meta">针对尝试 ' + esc(review.attempt) + '</div>' +
      '</div>').join('')
    : (task.status === '评审' ? '' : '<div class="tab-empty">暂无评审记录。</div>');
  return composer + list;
}

/* ============================================================
   Overview / Projects / Inbox / Memory / Reviews
   ============================================================ */
function visibleMemories() {
  const q = state.memoryQ.trim().toLowerCase();
  return projectMemories()
    .filter((item) => state.memoryType === 'all' || item.type === state.memoryType)
    .filter((item) => !q || (item.title + ' ' + item.content + ' ' + item.tags.join(' ')).toLowerCase().includes(q));
}

function renderOverviewPage() {
  const reqs = projectReqs();
  const listTasks = projectTasks();
  const mem = projectMemories();
  const pendingReqs = reqs.filter((item) => item.status === '待确认').sort((a, b) => b.seq - a.seq);
  const blockedTasks = listTasks.filter((item) => item.status === '阻塞');

        statCard('blocked', 'alert', '阻塞任务', blockedTasks.length, blockedTasks.length ? '需要人工介入' : '暂无阻塞', blockedTasks.length > 0) +
        statCard('acceptance', 'checkCircle', '待验收', acceptance.length, acceptance.length ? '验收后自动关闭' : '暂无待验收', false) +
        statCard('memory', 'memory', '待处理记忆', pendingMem.length, '草稿与待复核都需确认', pendingMem.length > 0) +

            const sideAttr = item.actName === 'nav' ? ' data-page="' + item.openId + '"' : ' data-kind="' + item.actKind + '" data-id="' + item.openId + '"';

/* ============================================================
   Overlays: command palette, create, delete, shortcuts
   ============================================================ */
function paletteGroups() {
  const query = state.paletteQuery.trim().toLowerCase();
  const matches = (text) => !query || String(text).toLowerCase().includes(query);
  const actionItems = [
    { label: '新建需求', icon: 'plus', hint: 'C', keywords: 'create new requirement 创建', run: () => openCreate() },
    { label: '显示键盘快捷键', icon: 'help', hint: '?', keywords: 'keyboard shortcut 快捷键', run: () => { state.helpOpen = true; } }
  ];
  PROJECT_ORDER.filter((id) => id !== state.project).forEach((id) => {
    const p = PROJECTS[id];
    actionItems.push({ label: '切换项目：' + p.short, icon: 'projects', hint: p.code, keywords: 'switch project ' + p.name, run: () => switchProject(id) });
  });
  const navItems = NAV_ITEMS.map((item) => ({
    label: item.label, icon: item.icon, hint: '跳转', keywords: 'go ' + item.label, run: () => goPage(item.id)
  }));
  const reqs = [...projectReqs()].sort((a, b) => b.seq - a.seq)
    .filter((req) => matches(req.title + ' #' + req.seq + ' ' + req.status + ' ' + (req.sourceNote || '')))
    .slice(0, query ? 6 : 4)
    .map((req) => ({
      label: '#' + req.seq + ' ' + req.title, icon: 'requirements', hint: req.status, keywords: req.status,
      run: () => openReq(req.id)
    }));
  const taskItems = projectTasks()
    .filter((task) => task.status !== '取消')
    .filter((task) => matches(task.title + ' T-' + task.seq + ' ' + task.status + ' ' + task.type))
    .slice(0, query ? 5 : 3)
    .map((task) => ({
      label: 'T-' + task.seq + ' ' + task.title, icon: 'tasks', hint: task.status,
      run: () => openTask(task.id)
    }));
  return [
    { label: '操作', items: actionItems.filter((item) => matches(item.label + ' ' + (item.keywords || ''))) },
    { label: '跳转', items: navItems.filter((item) => matches(item.label + ' ' + (item.keywords || ''))) },
    { label: '需求', items: reqs },
    { label: '任务', items: taskItems }
  ].filter((group) => group.items.length);
}
function flatPalette() {
  return paletteGroups().flatMap((group) => group.items);
}
function executePalette(index) {
  const item = flatPalette()[index];
  if (!item) return;
  state.paletteOpen = false;
  state.paletteQuery = '';
  state.paletteIndex = 0;
  item.run();
  render();
}

function renderPalette() {
  const groups = paletteGroups();
  let index = 0;
  const results = groups.length
    ? groups.map((group) => '<div class="palette-group"><div class="palette-group-label">' + group.label + '</div>' + group.items.map((item) => {
        const current = index++;
        return '<button class="palette-item ' + (current === state.paletteIndex ? 'active' : '') + '" data-act="palette-item" data-index="' + current + '">' +

        kbd('Esc') +

    '</div>' +
  '</div>';
}
